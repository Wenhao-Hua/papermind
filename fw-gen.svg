<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 638" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" width="960" height="638"><rect x="0" y="0" width="960" height="638" fill="#ffffff"/><text x="480.0" y="44" text-anchor="middle" font-size="25" font-weight="700" fill="#1e293b">Denoising Diffusion Probabilistic Models</text><line x1="80" y1="62" x2="880" y2="62" stroke="#e2e8f0" stroke-width="1.5"/><line x1="480.0" y1="151.2" x2="480.0" y2="184.2" stroke="#475569" stroke-width="2.0"/><polygon points="480.0,195.2 486.0,184.2 474.0,184.2" fill="#475569"/><line x1="480.0" y1="279.2" x2="480.0" y2="312.2" stroke="#475569" stroke-width="2.0"/><polygon points="480.0,323.2 486.0,312.2 474.0,312.2" fill="#475569"/><line x1="480.0" y1="407.2" x2="480.0" y2="440.2" stroke="#475569" stroke-width="2.0"/><polygon points="480.0,451.2 486.0,440.2 474.0,440.2" fill="#475569"/><line x1="700.0" y1="293.3" x2="618.9" y2="319.8" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="6,5"/><polygon points="608.5,323.2 620.8,325.5 617.1,314.1" fill="#94a3b8"/><text x="654.2" y="304.3" text-anchor="middle" font-size="11" fill="#334155">训练</text><line x1="700.0" y1="384.9" x2="671.0" y2="382.3" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="6,5"/><polygon points="660.0,381.3 670.4,388.3 671.5,376.3" fill="#94a3b8"/><text x="680.0" y="379.1" text-anchor="middle" font-size="11" fill="#334155">联系</text><rect x="340.0" y="86.0" width="280.0" height="65.2" rx="11" fill="#f1f5f9" stroke="#475569" stroke-width="1.8"/><text x="480.0" y="113.0" text-anchor="middle" font-size="15.0" font-weight="700" fill="#1e293b">Data x₀</text><text x="480.0" y="135.5" text-anchor="middle" font-size="12.5" fill="#334155">原始数据分布 q(x₀)</text><rect x="300.0" y="195.2" width="360.0" height="84.0" rx="11" fill="#eef2ff" stroke="#6366f1" stroke-width="1.8"/><text x="480.0" y="222.2" text-anchor="middle" font-size="15.0" font-weight="700" fill="#1e293b">Forward Process</text><text x="480.0" y="244.8" text-anchor="middle" font-size="12.5" fill="#334155">q(xₜ|xₜ₋₁)=N(√(1-βₜ)xₜ₋₁, βₜI)</text><text x="480.0" y="263.5" text-anchor="middle" font-size="12.5" fill="#334155">固定方差 β₁...β_T</text><rect x="300.0" y="323.2" width="360.0" height="84.0" rx="11" fill="#eef2ff" stroke="#6366f1" stroke-width="1.8"/><text x="480.0" y="350.2" text-anchor="middle" font-size="15.0" font-weight="700" fill="#1e293b">Reverse Process</text><text x="480.0" y="372.8" text-anchor="middle" font-size="12.5" fill="#334155">p_θ(xₜ₋₁|xₜ)=N(μ_θ, Σ_θ)</text><text x="480.0" y="391.5" text-anchor="middle" font-size="12.5" fill="#334155">μ_θ = 1/√αₜ (xₜ - βₜ/√(1-ᾱₜ) ε_θ)</text><rect x="340.0" y="451.2" width="280.0" height="65.2" rx="11" fill="#f1f5f9" stroke="#475569" stroke-width="1.8"/><text x="480.0" y="478.2" text-anchor="middle" font-size="15.0" font-weight="700" fill="#1e293b">Generated x₀</text><text x="480.0" y="500.8" text-anchor="middle" font-size="12.5" fill="#334155">采样: x_T~N(0,I) → ... → x₀</text><rect x="700.0" y="206.0" width="220.0" height="102.8" rx="11" fill="#fbfcfe" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="7,5"/><text x="810.0" y="233.0" text-anchor="middle" font-size="15.0" font-weight="700" fill="#1e293b">Training Objective</text><text x="810.0" y="255.5" text-anchor="middle" font-size="12.5" fill="#334155">L_simple = E[‖ε -</text><text x="810.0" y="274.2" text-anchor="middle" font-size="12.5" fill="#334155">ε_θ(xₜ,t)‖²]</text><text x="810.0" y="293.0" text-anchor="middle" font-size="12.5" fill="#334155">变分下界简化版</text><rect x="700.0" y="352.8" width="220.0" height="84.0" rx="11" fill="#fbfcfe" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="7,5"/><text x="810.0" y="379.8" text-anchor="middle" font-size="15.0" font-weight="700" fill="#1e293b">Score Matching</text><text x="810.0" y="402.2" text-anchor="middle" font-size="12.5" fill="#334155">ε_θ ≈ -√(1-ᾱₜ) ∇ log q(xₜ)</text><text x="810.0" y="421.0" text-anchor="middle" font-size="12.5" fill="#334155">等价于去噪分数匹配</text><line x1="60" y1="556" x2="94" y2="556" stroke="#475569" stroke-width="2.0"/><text x="102" y="560" font-size="12" fill="#334155">数据流</text><line x1="168" y1="556" x2="202" y2="556" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="6,5"/><text x="210" y="560" font-size="12" fill="#334155">隐含/参照</text><text x="60" y="598" font-size="12" fill="#334155">Σ_θ设为常数βₜ或β̃ₜ；前向过程方差固定</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="100%" height="100%" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="960" height="640" fill="#ffffff"/>
  
  <!-- 标题 -->
  <text x="480" y="36" font-size="22" font-weight="bold" fill="#1e293b" text-anchor="middle">PPO Combined Loss Function</text>
  <text x="480" y="58" font-size="14" fill="#64748b" text-anchor="middle">L<tspan baseline-shift="super" font-size="75%">CLIP+VF+S</tspan><tspan baseline-shift="sub" font-size="75%">t</tspan>(θ) = Ê<tspan baseline-shift="sub" font-size="75%">t</tspan>[ L<tspan baseline-shift="super" font-size="75%">CLIP</tspan><tspan baseline-shift="sub" font-size="75%">t</tspan>(θ) − c₁ L<tspan baseline-shift="super" font-size="75%">VF</tspan><tspan baseline-shift="sub" font-size="75%">t</tspan>(θ) + c₂ S[π<tspan baseline-shift="sub" font-size="75%">θ</tspan>](s<tspan baseline-shift="sub" font-size="75%">t</tspan>) ]</text>
  
  <!-- 主面板：核心公式 + 三项分解 -->
  <rect x="40" y="80" width="620" height="520" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" rx="4"/>
  <text x="350" y="108" font-size="16" font-weight="bold" fill="#1e293b" text-anchor="middle">Core Objective: L<tspan baseline-shift="super" font-size="75%">CLIP+VF+S</tspan><tspan baseline-shift="sub" font-size="75%">t</tspan>(θ)</text>
  
  <!-- 第一项：CLIP -->
  <rect x="60" y="130" width="580" height="130" fill="#eef2ff" stroke="#6366f1" stroke-width="2" rx="4"/>
  <text x="350" y="156" font-size="15" font-weight="bold" fill="#3730a3" text-anchor="middle">Term 1: Clipped Surrogate Objective L<tspan baseline-shift="super" font-size="75%">CLIP</tspan><tspan baseline-shift="sub" font-size="75%">t</tspan>(θ)</text>
  <text x="350" y="182" font-size="13" fill="#334155" text-anchor="middle">L<tspan baseline-shift="super" font-size="75%">CLIP</tspan><tspan baseline-shift="sub" font-size="75%">t</tspan>(θ) = Ê<tspan baseline-shift="sub" font-size="75%">t</tspan>[ min( r<tspan baseline-shift="sub" font-size="75%">t</tspan>(θ) Â<tspan baseline-shift="sub" font-size="75%">t</tspan> , clip(r<tspan baseline-shift="sub" font-size="75%">t</tspan>(θ), 1−ε, 1+ε) Â<tspan baseline-shift="sub" font-size="75%">t</tspan> ) ]</text>
  <text x="350" y="208" font-size="12" fill="#64748b" text-anchor="middle">r<tspan baseline-shift="sub" font-size="75%">t</tspan>(θ) = π<tspan baseline-shift="sub" font-size="75%">θ</tspan>(a<tspan baseline-shift="sub" font-size="75%">t</tspan>|s<tspan baseline-shift="sub" font-size="75%">t</tspan>) / π<tspan baseline-shift="sub" font-size="75%">θ_old</tspan>(a<tspan baseline-shift="sub" font-size="75%">t</tspan>|s<tspan baseline-shift="sub" font-size="75%">t</tspan>)</text>
  <text x="350" y="234" font-size="11" fill="#94a3b8" text-anchor="middle">Clips probability ratio to [1−ε, 1+ε] for stable updates</text>
  
  <!-- 第二项：VF -->
  <rect x="60" y="280" width="580" height="110" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" rx="4"/>
  <text x="350" y="306" font-size="15" font-weight="bold" fill="#334155" text-anchor="middle">Term 2: Value Function Loss L<tspan baseline-shift="super" font-size="75%">VF</tspan><tspan baseline-shift="sub" font-size="75%">t</tspan>(θ)</text>
  <text x="350" y="332" font-size="13" fill="#334155" text-anchor="middle">L<tspan baseline-shift="super" font-size="75%">VF</tspan><tspan baseline-shift="sub" font-size="75%">t</tspan>(θ) = ( V<tspan baseline-shift="sub" font-size="75%">θ</tspan>(s<tspan baseline-shift="sub" font-size="75%">t</tspan>) − V<tspan baseline-shift="super" font-size="75%">targ</tspan><tspan baseline-shift="sub" font-size="75%">t</tspan> )²</text>
  <text x="350" y="358" font-size="11" fill="#94a3b8" text-anchor="middle">Mean squared error between predicted value and target value</text>
  
  <!-- 第三项：Entropy -->
  <rect x="60" y="410" width="580" height="110" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" rx="4"/>
  <text x="350" y="436" font-size="15" font-weight="bold" fill="#334155" text-anchor="middle">Term 3: Entropy Bonus S[π<tspan baseline-shift="sub" font-size="75%">θ</tspan>](s<tspan baseline-shift="sub" font-size="75%">t</tspan>)</text>
  <text x="350" y="462" font-size="13" fill="#334155" text-anchor="middle">S[π<tspan baseline-shift="sub" font-size="75%">θ</tspan>](s<tspan baseline-shift="sub" font-size="75%">t</tspan>) = −∑<tspan baseline-shift="sub" font-size="75%">a</tspan> π<tspan baseline-shift="sub" font-size="75%">θ</tspan>(a|s<tspan baseline-shift="sub" font-size="75%">t</tspan>) log π<tspan baseline-shift="sub" font-size="75%">θ</tspan>(a|s<tspan baseline-shift="sub" font-size="75%">t</tspan>)</text>
  <text x="350" y="488" font-size="11" fill="#94a3b8" text-anchor="middle">Encourages exploration by penalizing deterministic policies</text>
  
  <!-- 右侧面板：图例与说明 -->
  <rect x="690" y="80" width="240" height="520" fill="#fbfcfe" stroke="#cbd5e1" stroke-width="1.5" rx="4"/>
  <text x="810" y="108" font-size="15" font-weight="bold" fill="#1e293b" text-anchor="middle">Legend &amp; Notes</text>
  
  <!-- 图例：箭头 -->
  <text x="710" y="140" font-size="12" fill="#334155" text-anchor="start">Arrow Types:</text>
  <line x1="710" y1="160" x2="770" y2="160" stroke="#475569" stroke-width="2"/>
  <polygon points="770,155 780,160 770,165" fill="#475569"/>
  <text x="790" y="164" font-size="11" fill="#64748b" text-anchor="start">Data flow</text>
  
  <line x1="710" y1="185" x2="770" y2="185" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,4"/>
  <polygon points="770,180 780,185 770,190" fill="#94a3b8"/>
  <text x="790" y="189" font-size="11" fill="#64748b" text-anchor="start">Reference / target</text>
  
  <line x1="710" y1="210" x2="770" y2="210" stroke="#6366f1" stroke-width="2.5"/>
  <polygon points="770,205 780,210 770,215" fill="#6366f1"/>
  <text x="790" y="214" font-size="11" fill="#64748b" text-anchor="start">Selected / emphasized</text>
  
  <!-- 系数说明 -->
  <text x="710" y="250" font-size="12" font-weight="bold" fill="#334155" text-anchor="start">Coefficients:</text>
  <text x="710" y="272" font-size="11" fill="#64748b" text-anchor="start">c₁ = 0.5 (value loss weight)</text>
  <text x="710" y="292" font-size="11" fill="#64748b" text-anchor="start">c₂ = 0.01 (entropy bonus weight)</text>
  
  <!-- 关键记号 -->
  <text x="710" y="330" font-size="12" font-weight="bold" fill="#334155" text-anchor="start">Key Notation:</text>
  <text x="710" y="352" font-size="11" fill="#64748b" text-anchor="start">θ: policy parameters</text>
  <text x="710" y="372" font-size="11" fill="#64748b" text-anchor="start">π<tspan baseline-shift="sub" font-size="75%">θ</tspan>: stochastic policy</text>
  <text x="710" y="392" font-size="11" fill="#64748b" text-anchor="start">Â<tspan baseline-shift="sub" font-size="75%">t</tspan>: advantage estimate</text>
  <text x="710" y="412" font-size="11" fill="#64748b" text-anchor="start">V<tspan baseline-shift="sub" font-size="75%">θ</tspan>: value function</text>
  <text x="710" y="432" font-size="11" fill="#64748b" text-anchor="start">V<tspan baseline-shift="super" font-size="75%">targ</tspan>: target value</text>
  <text x="710" y="452" font-size="11" fill="#64748b" text-anchor="start">ε: clip range (default 0.2)</text>
  
  <!-- 底部说明 -->
  <text x="710" y="490" font-size="12" font-weight="bold" fill="#334155" text-anchor="start">Shared Parameters:</text>
  <text x="710" y="510" font-size="11" fill="#64748b" text-anchor="start">Policy &amp; value networks</text>
  <text x="710" y="528" font-size="11" fill="#64748b" text-anchor="start">share lower layers.</text>
  <text x="710" y="548" font-size="11" fill="#64748b" text-anchor="start">Combined loss enables</text>
  <text x="710" y="566" font-size="11" fill="#64748b" text-anchor="start">joint optimization.</text>
  
  <!-- 从三项到主公式的箭头 -->
  <line x1="350" y1="260" x2="350" y2="280" stroke="#475569" stroke-width="1.5"/>
  <polygon points="345,280 350,290 355,280" fill="#475569"/>
  
  <line x1="350" y1="390" x2="350" y2="410" stroke="#475569" stroke-width="1.5"/>
  <polygon points="345,410 350,420 355,410" fill="#475569"/>
  
  <!-- 右侧面板与主面板的连接 -->
  <line x1="660" y1="200" x2="690" y2="200" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="675" y="195" font-size="9" fill="#94a3b8" text-anchor="middle">see legend</text>
</svg>
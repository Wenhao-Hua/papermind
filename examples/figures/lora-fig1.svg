<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" width="960" height="680">
  <rect x="0" y="0" width="960" height="680" fill="#ffffff"/>
  
  <!-- 标题 -->
  <text x="480" y="36" font-size="22" font-weight="bold" fill="#1e293b" text-anchor="middle">LoRA: Low-Rank Adaptation of Pre-trained Weights</text>
  <line x1="180" y1="46" x2="780" y2="46" stroke="#cbd5e1" stroke-width="1"/>

  <!-- 核心公式框（视觉焦点） -->
  <rect x="280" y="62" width="400" height="80" rx="4" ry="4" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="480" y="90" font-size="16" font-weight="bold" fill="#3730a3" text-anchor="middle">Forward Pass with LoRA</text>
  <text x="480" y="122" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">h = W&#8320; x + B A x</text>

  <!-- 左侧：预训练权重 W0 与更新 ΔW 的分解 -->
  <rect x="60" y="170" width="400" height="280" rx="4" ry="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="260" y="196" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">Low-Rank Decomposition of &#916;W</text>

  <!-- W0 矩阵 -->
  <rect x="100" y="214" width="120" height="120" rx="2" ry="2" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="160" y="280" font-size="13" fill="#334155" text-anchor="middle">W&#8320;</text>
  <text x="160" y="298" font-size="11" fill="#64748b" text-anchor="middle">d &#215; k</text>

  <!-- 加号 -->
  <text x="240" y="280" font-size="18" fill="#1e293b" text-anchor="middle">+</text>

  <!-- ΔW = B A 分解 -->
  <rect x="270" y="214" width="80" height="120" rx="2" ry="2" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="310" y="272" font-size="13" fill="#3730a3" text-anchor="middle">B</text>
  <text x="310" y="290" font-size="11" fill="#64748b" text-anchor="middle">d &#215; r</text>

  <text x="360" y="280" font-size="16" fill="#1e293b" text-anchor="middle">&#215;</text>

  <rect x="380" y="214" width="60" height="120" rx="2" ry="2" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="410" y="272" font-size="13" fill="#3730a3" text-anchor="middle">A</text>
  <text x="410" y="290" font-size="11" fill="#64748b" text-anchor="middle">r &#215; k</text>

  <!-- 等号 -->
  <text x="455" y="280" font-size="18" fill="#1e293b" text-anchor="middle">=</text>

  <!-- ΔW 结果 -->
  <rect x="480" y="214" width="120" height="120" rx="2" ry="2" fill="#f1f5f9" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="540" y="280" font-size="13" fill="#3730a3" text-anchor="middle">&#916;W</text>
  <text x="540" y="298" font-size="11" fill="#64748b" text-anchor="middle">d &#215; k</text>

  <!-- 标注：r << min(d,k) -->
  <text x="260" y="360" font-size="12" fill="#64748b" text-anchor="middle">r &#8810; min(d, k)</text>

  <!-- 冻结与训练说明 -->
  <rect x="100" y="380" width="320" height="50" rx="4" ry="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="260" y="400" font-size="12" fill="#334155" text-anchor="middle">W&#8320; frozen during training</text>
  <text x="260" y="418" font-size="12" fill="#334155" text-anchor="middle">Only A and B are optimized</text>

  <!-- 右侧：参数数量对比 -->
  <rect x="500" y="170" width="400" height="280" rx="4" ry="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="700" y="196" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">Trainable Parameters Comparison</text>

  <!-- 表格 -->
  <line x1="530" y1="214" x2="870" y2="214" stroke="#cbd5e1" stroke-width="1"/>
  <text x="560" y="232" font-size="12" font-weight="bold" fill="#1e293b" text-anchor="middle">Method</text>
  <text x="700" y="232" font-size="12" font-weight="bold" fill="#1e293b" text-anchor="middle">Trainable Params</text>
  <text x="840" y="232" font-size="12" font-weight="bold" fill="#1e293b" text-anchor="middle">Memory</text>
  <line x1="530" y1="240" x2="870" y2="240" stroke="#cbd5e1" stroke-width="1"/>

  <text x="560" y="262" font-size="12" fill="#334155" text-anchor="middle">Full Fine-Tuning</text>
  <text x="700" y="262" font-size="12" fill="#334155" text-anchor="middle">175B</text>
  <text x="840" y="262" font-size="12" fill="#334155" text-anchor="middle">~350 GB</text>
  <line x1="530" y1="270" x2="870" y2="270" stroke="#e2e8f0" stroke-width="1"/>

  <text x="560" y="292" font-size="12" fill="#3730a3" text-anchor="middle">LoRA (r=8)</text>
  <text x="700" y="292" font-size="12" fill="#3730a3" text-anchor="middle">~17.5M</text>
  <text x="840" y="292" font-size="12" fill="#3730a3" text-anchor="middle">~35 MB</text>
  <line x1="530" y1="300" x2="870" y2="300" stroke="#e2e8f0" stroke-width="1"/>

  <text x="560" y="322" font-size="12" fill="#334155" text-anchor="middle">Reduction Factor</text>
  <text x="700" y="322" font-size="12" fill="#334155" text-anchor="middle">&#8776; 10,000&#215;</text>
  <text x="840" y="322" font-size="12" fill="#334155" text-anchor="middle">&#8776; 3&#215;</text>
  <line x1="530" y1="330" x2="870" y2="330" stroke="#cbd5e1" stroke-width="1"/>

  <!-- 注脚 -->
  <text x="700" y="360" font-size="11" fill="#64748b" text-anchor="middle">Based on GPT-3 175B with Adam optimizer</text>

  <!-- 底部：Transformer 层中的 LoRA 应用 -->
  <rect x="60" y="480" width="840" height="180" rx="4" ry="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="480" y="506" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">Applying LoRA to Transformer Layers</text>

  <!-- 左侧：标准 Transformer 层 -->
  <rect x="100" y="524" width="220" height="120" rx="4" ry="4" fill="#f1f5f9" stroke="#475569" stroke-width="1"/>
  <text x="210" y="548" font-size="12" font-weight="bold" fill="#1e293b" text-anchor="middle">Standard Transformer Layer</text>
  <text x="210" y="572" font-size="11" fill="#334155" text-anchor="middle">Pre-trained Weights W&#8320;</text>
  <text x="210" y="592" font-size="11" fill="#334155" text-anchor="middle">(frozen)</text>
  <text x="210" y="616" font-size="11" fill="#64748b" text-anchor="middle">e.g., W&#8320; &#8712; &#8477;&#8304;&#8304;&#8304;&#8304;&#8304;&#8304;</text>

  <!-- 箭头 -->
  <line x1="320" y1="584" x2="370" y2="584" stroke="#6366f1" stroke-width="2"/>
  <polygon points="370,578 382,584 370,590" fill="#6366f1"/>

  <!-- 右侧：LoRA 增强层 -->
  <rect x="390" y="524" width="280" height="120" rx="4" ry="4" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="530" y="548" font-size="12" font-weight="bold" fill="#3730a3" text-anchor="middle">LoRA-Enhanced Layer</text>
  <text x="530" y="572" font-size="11" fill="#334155" text-anchor="middle">W&#8320; frozen + B A injected</text>
  <text x="530" y="592" font-size="11" fill="#3730a3" text-anchor="middle">B &#8712; &#8477;&#8315;&#8315;&#8315;&#8315;&#8315;&#8315;, A &#8712; &#8477;&#8315;&#8315;&#8315;&#8315;&#8315;&#8315;</text>
  <text x="530" y="616" font-size="11" fill="#64748b" text-anchor="middle">Applied to W&#8320; in attention (W&#8344;, W&#8345;, W&#8346;, W&#8347;)</text>

  <!-- 右侧：图例 -->
  <rect x="720" y="524" width="150" height="120" rx="4" ry="4" fill="#fbfcfe" stroke="#e2e8f0" stroke-width="1"/>
  <text x="795" y="546" font-size="11" font-weight="bold" fill="#1e293b" text-anchor="middle">Legend</text>
  <line x1="735" y1="566" x2="765" y2="566" stroke="#6366f1" stroke-width="2"/>
  <polygon points="765,560 773,566 765,572" fill="#6366f1"/>
  <text x="780" y="570" font-size="10" fill="#334155">Data flow</text>
  <line x1="735" y1="590" x2="765" y2="590" stroke="#475569" stroke-width="1.5"/>
  <text x="780" y="594" font-size="10" fill="#334155">Pre-trained weight</text>
  <rect x="735" y="608" width="20" height="10" rx="1" ry="1" fill="#eef2ff" stroke="#6366f1" stroke-width="1"/>
  <text x="780" y="618" font-size="10" fill="#334155">LoRA matrices</text>
</svg>
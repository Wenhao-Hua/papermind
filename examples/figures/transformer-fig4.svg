<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" width="960" height="680">
  <rect x="0" y="0" width="960" height="680" fill="#ffffff"/>

  <!-- 主标题 -->
  <text x="480" y="36" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">Label Smoothing in Transformer Training</text>
  <line x1="200" y1="48" x2="760" y2="48" stroke="#cbd5e1" stroke-width="1"/>

  <!-- ===== 左侧主面板：核心定义 ===== -->
  <rect x="40" y="68" width="560" height="200" fill="#f8fafc" stroke="#6366f1" stroke-width="2" rx="4"/>
  <text x="320" y="96" font-size="16" font-weight="bold" fill="#3730a3" text-anchor="middle">Core Definition: Label Smoothing</text>

  <!-- 公式：L_smooth = (1-ε) * L_CE + ε * L_uniform -->
  <text x="320" y="140" font-size="18" font-weight="bold" fill="#1e293b" text-anchor="middle">L<tspan baseline-shift="sub" font-size="75%">smooth</tspan> = (1 − ε<tspan baseline-shift="sub" font-size="75%">ls</tspan>) · L<tspan baseline-shift="sub" font-size="75%">CE</tspan> + ε<tspan baseline-shift="sub" font-size="75%">ls</tspan> · L<tspan baseline-shift="sub" font-size="75%">uniform</tspan></text>

  <!-- 参数说明 -->
  <text x="320" y="178" font-size="14" fill="#334155" text-anchor="middle">ε<tspan baseline-shift="sub" font-size="75%">ls</tspan> = 0.1 (paper default)</text>
  <text x="320" y="202" font-size="13" fill="#64748b" text-anchor="middle">L<tspan baseline-shift="sub" font-size="75%">CE</tspan> = standard cross-entropy with one-hot targets</text>
  <text x="320" y="226" font-size="13" fill="#64748b" text-anchor="middle">L<tspan baseline-shift="sub" font-size="75%">uniform</tspan> = cross-entropy with uniform distribution over K classes</text>

  <!-- 效果说明 -->
  <rect x="40" y="244" width="560" height="24" fill="#eef2ff" rx="2"/>
  <text x="320" y="260" font-size="13" fill="#3730a3" text-anchor="middle">Effect: Reduces model confidence → hurts perplexity but improves accuracy &amp; BLEU</text>

  <!-- ===== 右侧面板：图例 ===== -->
  <rect x="630" y="68" width="290" height="200" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" rx="4"/>
  <text x="775" y="96" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">Legend</text>

  <!-- 图例项 -->
  <line x1="660" y1="120" x2="700" y2="120" stroke="#6366f1" stroke-width="2"/>
  <text x="710" y="125" font-size="12" fill="#334155">Core definition / emphasis</text>

  <line x1="660" y1="148" x2="700" y2="148" stroke="#475569" stroke-width="1.5"/>
  <text x="710" y="153" font-size="12" fill="#334155">Standard loss component</text>

  <line x1="660" y1="176" x2="700" y2="176" stroke="#94a3b8" stroke-width="1" stroke-dasharray="5,4"/>
  <text x="710" y="181" font-size="12" fill="#334155">Uniform distribution reference</text>

  <rect x="658" y="196" width="44" height="16" fill="#eef2ff" stroke="#6366f1" stroke-width="1" rx="2"/>
  <text x="710" y="209" font-size="12" fill="#334155">Highlighted effect box</text>

  <!-- ===== 下方：机制拆解 ===== -->
  <!-- 左侧：标准 one-hot 目标 -->
  <rect x="40" y="290" width="260" height="180" fill="#fbfcfe" stroke="#cbd5e1" stroke-width="1" rx="4"/>
  <text x="170" y="316" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">Standard One-Hot Target</text>

  <!-- 小矩阵：one-hot -->
  <rect x="80" y="332" width="180" height="120" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="170" y="356" font-size="13" fill="#334155" text-anchor="middle">Target distribution q(k|x)</text>
  <line x1="80" y1="368" x2="260" y2="368" stroke="#cbd5e1" stroke-width="1"/>
  <text x="170" y="390" font-size="13" fill="#1e293b" text-anchor="middle">q(correct) = 1.0</text>
  <text x="170" y="414" font-size="13" fill="#1e293b" text-anchor="middle">q(others) = 0.0</text>
  <text x="170" y="440" font-size="12" fill="#64748b" text-anchor="middle">(hard target)</text>

  <!-- 箭头：one-hot → 平滑 -->
  <line x1="300" y1="380" x2="340" y2="380" stroke="#6366f1" stroke-width="2"/>
  <polygon points="340,374 352,380 340,386" fill="#6366f1"/>

  <!-- 右侧：平滑后目标 -->
  <rect x="360" y="290" width="260" height="180" fill="#fbfcfe" stroke="#cbd5e1" stroke-width="1" rx="4"/>
  <text x="490" y="316" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">Smoothed Target</text>

  <rect x="400" y="332" width="180" height="120" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="490" y="356" font-size="13" fill="#334155" text-anchor="middle">Target distribution q'(k|x)</text>
  <line x1="400" y1="368" x2="580" y2="368" stroke="#cbd5e1" stroke-width="1"/>
  <text x="490" y="390" font-size="13" fill="#1e293b" text-anchor="middle">q'(correct) = 1 − ε + ε/K</text>
  <text x="490" y="414" font-size="13" fill="#1e293b" text-anchor="middle">q'(others) = ε/K</text>
  <text x="490" y="440" font-size="12" fill="#64748b" text-anchor="middle">(soft target, K = #classes)</text>

  <!-- ===== 底部：效果对比 ===== -->
  <rect x="40" y="490" width="880" height="170" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" rx="4"/>
  <text x="480" y="518" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">Effect on Training Dynamics</text>

  <!-- 两列对比 -->
  <text x="200" y="550" font-size="13" font-weight="bold" fill="#334155" text-anchor="middle">Without Label Smoothing</text>
  <text x="720" y="550" font-size="13" font-weight="bold" fill="#334155" text-anchor="middle">With Label Smoothing (ε=0.1)</text>

  <line x1="480" y1="558" x2="480" y2="648" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- 左列 -->
  <text x="200" y="580" font-size="12" fill="#64748b" text-anchor="middle">• Model becomes overconfident</text>
  <text x="200" y="604" font-size="12" fill="#64748b" text-anchor="middle">• Penalizes all incorrect classes equally</text>
  <text x="200" y="628" font-size="12" fill="#64748b" text-anchor="middle">• Lower perplexity (misleading)</text>
  <text x="200" y="652" font-size="12" fill="#64748b" text-anchor="middle">• Lower BLEU / accuracy</text>

  <!-- 右列 -->
  <text x="720" y="580" font-size="12" fill="#334155" text-anchor="middle">• Model is less confident, more robust</text>
  <text x="720" y="604" font-size="12" fill="#334155" text-anchor="middle">• Penalizes incorrect classes less harshly</text>
  <text x="720" y="628" font-size="12" fill="#334155" text-anchor="middle">• Higher perplexity (by design)</text>
  <text x="720" y="652" font-size="12" fill="#334155" text-anchor="middle">• Higher BLEU / accuracy</text>

  <!-- 强调箭头 -->
  <line x1="480" y1="660" x2="480" y2="670" stroke="#6366f1" stroke-width="2"/>
  <polygon points="474,670 480,678 486,670" fill="#6366f1"/>
</svg>
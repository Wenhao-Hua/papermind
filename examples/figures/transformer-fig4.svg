<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" width="960" height="520">
  <rect x="0" y="0" width="960" height="520" fill="#ffffff"/>

  <!-- 主标题 -->
  <text x="480" y="36" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">Label Smoothing in Transformer Training</text>

  <!-- 核心定义框（强调色） -->
  <rect x="60" y="60" width="840" height="100" rx="6" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="480" y="88" font-size="16" font-weight="bold" fill="#3730a3" text-anchor="middle">Definition: Label Smoothing Regularization</text>
  <text x="480" y="118" font-size="15" fill="#1e293b" text-anchor="middle">During training, the target distribution is smoothed with</text>
  <text x="480" y="148" font-size="15" fill="#1e293b" text-anchor="middle">
    &#949;<tspan baseline-shift="sub" font-size="75%">ls</tspan> = 0.1, distributing probability mass to incorrect classes
  </text>

  <!-- 左侧：公式与效果面板 -->
  <rect x="60" y="180" width="400" height="200" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="260" y="208" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">Effect on Output Distribution</text>

  <!-- 原始分布 -->
  <text x="80" y="238" font-size="13" fill="#334155">Original one-hot target:</text>
  <text x="80" y="260" font-size="13" fill="#1e293b">y = [0, 0, 1, 0, 0]</text>

  <!-- 箭头 -->
  <line x1="260" y1="270" x2="260" y2="290" stroke="#6366f1" stroke-width="1.5"/>
  <polygon points="255,288 260,296 265,288" fill="#6366f1"/>

  <!-- 平滑后 -->
  <text x="80" y="316" font-size="13" fill="#334155">Smoothed target (&#949;<tspan baseline-shift="sub" font-size="75%">ls</tspan>=0.1):</text>
  <text x="80" y="340" font-size="13" fill="#1e293b">y&#8242; = [0.02, 0.02, 0.90, 0.02, 0.02]</text>

  <!-- 公式 -->
  <text x="80" y="370" font-size="13" fill="#475569">y&#8242;<tspan baseline-shift="sub" font-size="75%">i</tspan> = (1 &#8722; &#949;<tspan baseline-shift="sub" font-size="75%">ls</tspan>) &#183; y<tspan baseline-shift="sub" font-size="75%">i</tspan> + &#949;<tspan baseline-shift="sub" font-size="75%">ls</tspan> / K</text>

  <!-- 右侧：效果面板 -->
  <rect x="500" y="180" width="400" height="200" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="700" y="208" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">Training Impact</text>

  <!-- 表格 -->
  <line x1="520" y1="222" x2="880" y2="222" stroke="#cbd5e1" stroke-width="1"/>
  <text x="540" y="240" font-size="12" font-weight="bold" fill="#334155">Metric</text>
  <text x="700" y="240" font-size="12" font-weight="bold" fill="#334155" text-anchor="middle">Effect</text>
  <text x="840" y="240" font-size="12" font-weight="bold" fill="#334155" text-anchor="end">Direction</text>

  <line x1="520" y1="250" x2="880" y2="250" stroke="#e2e8f0" stroke-width="1"/>

  <text x="540" y="272" font-size="12" fill="#1e293b">Perplexity</text>
  <text x="700" y="272" font-size="12" fill="#64748b" text-anchor="middle">Increases (worse)</text>
  <text x="840" y="272" font-size="12" fill="#dc2626" text-anchor="end">&#8593;</text>

  <line x1="520" y1="282" x2="880" y2="282" stroke="#e2e8f0" stroke-width="1"/>

  <text x="540" y="304" font-size="12" fill="#1e293b">Accuracy</text>
  <text x="700" y="304" font-size="12" fill="#64748b" text-anchor="middle">Improves</text>
  <text x="840" y="304" font-size="12" fill="#16a34a" text-anchor="end">&#8595;</text>

  <line x1="520" y1="314" x2="880" y2="314" stroke="#e2e8f0" stroke-width="1"/>

  <text x="540" y="336" font-size="12" fill="#1e293b">BLEU Score</text>
  <text x="700" y="336" font-size="12" fill="#64748b" text-anchor="middle">Improves</text>
  <text x="840" y="336" font-size="12" fill="#16a34a" text-anchor="end">&#8595;</text>

  <line x1="520" y1="346" x2="880" y2="346" stroke="#e2e8f0" stroke-width="1"/>

  <!-- 底部说明 -->
  <rect x="60" y="400" width="840" height="50" rx="4" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="480" y="424" font-size="13" fill="#475569" text-anchor="middle">Label smoothing reduces model confidence by distributing probability mass to non-target classes,</text>
  <text x="480" y="442" font-size="13" fill="#475569" text-anchor="middle">which hurts perplexity but improves generalization and final BLEU score.</text>

  <!-- 图例 -->
  <rect x="60" y="470" width="840" height="36" rx="4" fill="#fbfcfe" stroke="#e2e8f0" stroke-width="1"/>
  <text x="80" y="492" font-size="11" fill="#64748b">&#9656; &#949;<tspan baseline-shift="sub" font-size="75%">ls</tspan> = label smoothing coefficient (0.1 in paper)</text>
  <text x="380" y="492" font-size="11" fill="#64748b">&#9656; K = number of target classes</text>
  <text x="680" y="492" font-size="11" fill="#64748b">&#9656; y&#8242; = smoothed target distribution</text>
</svg>
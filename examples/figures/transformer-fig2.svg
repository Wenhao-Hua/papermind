<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" width="960" height="680">
  <rect x="0" y="0" width="960" height="680" fill="#ffffff"/>

  <!-- 标题 -->
  <text x="480" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">Masked Self-Attention in Decoder</text>
  <text x="480" y="58" text-anchor="middle" font-size="13" fill="#64748b">Preserving the auto-regressive property by masking future positions</text>

  <!-- 左侧主面板：核心定义 -->
  <rect x="40" y="80" width="520" height="240" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="300" y="108" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">Core Definition</text>

  <!-- 公式框 -->
  <rect x="60" y="124" width="480" height="56" rx="4" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="300" y="152" text-anchor="middle" font-size="16" fill="#3730a3" font-weight="bold">
    Attention(Q,K,V) = softmax
    <tspan font-size="16">(</tspan>
    <tspan font-size="16">QK</tspan>
    <tspan baseline-shift="super" font-size="12">&#8868;</tspan>
    <tspan font-size="16"> / </tspan>
    <tspan font-size="16">&#8730;</tspan>
    <tspan font-size="16">d</tspan>
    <tspan baseline-shift="sub" font-size="12">k</tspan>
    <tspan font-size="16">)</tspan>
    <tspan font-size="16"> V</tspan>
  </text>

  <!-- 掩码说明 -->
  <text x="300" y="200" text-anchor="middle" font-size="13" fill="#334155">In decoder self-attention, future positions are masked:</text>
  <text x="300" y="222" text-anchor="middle" font-size="13" fill="#334155">set attention logits to </text>
  <text x="300" y="244" text-anchor="middle" font-size="13" fill="#334155">
    <tspan font-weight="bold" fill="#dc2626">&#8722;&#8734;</tspan>
    <tspan> before softmax for positions j &gt; i</tspan>
  </text>

  <!-- 右侧说明面板 -->
  <rect x="580" y="80" width="340" height="240" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="750" y="108" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">Auto-Regressive Property</text>

  <text x="600" y="140" font-size="12" fill="#334155">Prediction at position i depends only on</text>
  <text x="600" y="160" font-size="12" fill="#334155">outputs at positions less than i.</text>

  <line x1="600" y1="176" x2="900" y2="176" stroke="#e2e8f0" stroke-width="1"/>

  <text x="600" y="196" font-size="12" fill="#334155">Masking ensures no information flows</text>
  <text x="600" y="216" font-size="12" fill="#334155">from future to past during training.</text>

  <text x="600" y="244" font-size="12" fill="#64748b">Formally: for each position i,</text>
  <text x="600" y="264" font-size="12" fill="#64748b">only positions j &#8804; i are attended to.</text>

  <!-- 图例 -->
  <rect x="580" y="290" width="340" height="30" rx="4" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="600" y="310" font-size="11" fill="#64748b">&#9656; Arrow: attention flow (allowed)</text>
  <text x="780" y="310" font-size="11" fill="#94a3b8">&#9656; Dashed: masked (disallowed)</text>

  <!-- 二部图：位置 i 与位置 j 的注意力 -->
  <rect x="40" y="340" width="520" height="320" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="300" y="368" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">Attention Masking Matrix (Decoder)</text>

  <!-- 左侧节点列：位置 i（查询） -->
  <text x="100" y="400" text-anchor="middle" font-size="12" fill="#64748b">Query positions</text>
  <circle cx="100" cy="430" r="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="100" y="434" text-anchor="middle" font-size="10" fill="#3730a3">1</text>
  <circle cx="100" cy="470" r="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="100" y="474" text-anchor="middle" font-size="10" fill="#3730a3">2</text>
  <circle cx="100" cy="510" r="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="100" y="514" text-anchor="middle" font-size="10" fill="#3730a3">3</text>
  <circle cx="100" cy="550" r="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="100" y="554" text-anchor="middle" font-size="10" fill="#3730a3">4</text>

  <!-- 右侧节点列：位置 j（键） -->
  <text x="500" y="400" text-anchor="middle" font-size="12" fill="#64748b">Key positions</text>
  <circle cx="500" cy="430" r="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="500" y="434" text-anchor="middle" font-size="10" fill="#3730a3">1</text>
  <circle cx="500" cy="470" r="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="500" y="474" text-anchor="middle" font-size="10" fill="#3730a3">2</text>
  <circle cx="500" cy="510" r="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="500" y="514" text-anchor="middle" font-size="10" fill="#3730a3">3</text>
  <circle cx="500" cy="550" r="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="500" y="554" text-anchor="middle" font-size="10" fill="#3730a3">4</text>

  <!-- 允许的注意力连线（实线） -->
  <line x1="108" y1="430" x2="492" y2="430" stroke="#6366f1" stroke-width="1.5"/>
  <line x1="108" y1="470" x2="492" y2="430" stroke="#6366f1" stroke-width="1.5"/>
  <line x1="108" y1="470" x2="492" y2="470" stroke="#6366f1" stroke-width="1.5"/>
  <line x1="108" y1="510" x2="492" y2="430" stroke="#6366f1" stroke-width="1.5"/>
  <line x1="108" y1="510" x2="492" y2="470" stroke="#6366f1" stroke-width="1.5"/>
  <line x1="108" y1="510" x2="492" y2="510" stroke="#6366f1" stroke-width="1.5"/>
  <line x1="108" y1="550" x2="492" y2="430" stroke="#6366f1" stroke-width="1.5"/>
  <line x1="108" y1="550" x2="492" y2="470" stroke="#6366f1" stroke-width="1.5"/>
  <line x1="108" y1="550" x2="492" y2="510" stroke="#6366f1" stroke-width="1.5"/>
  <line x1="108" y1="550" x2="492" y2="550" stroke="#6366f1" stroke-width="1.5"/>

  <!-- 被掩码的连线（虚线，灰色） -->
  <line x1="108" y1="430" x2="492" y2="470" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="108" y1="430" x2="492" y2="510" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="108" y1="430" x2="492" y2="550" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="108" y1="470" x2="492" y2="510" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="108" y1="470" x2="492" y2="550" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="108" y1="510" x2="492" y2="550" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- 掩码矩阵可视化 -->
  <rect x="580" y="340" width="340" height="320" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="750" y="368" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">Masking Matrix (Lower Triangular)</text>

  <!-- 4x4 网格 -->
  <g transform="translate(640, 400)">
    <!-- 行标签 -->
    <text x="-20" y="20" text-anchor="end" font-size="11" fill="#64748b">1</text>
    <text x="-20" y="60" text-anchor="end" font-size="11" fill="#64748b">2</text>
    <text x="-20" y="100" text-anchor="end" font-size="11" fill="#64748b">3</text>
    <text x="-20" y="140" text-anchor="end" font-size="11" fill="#64748b">4</text>
    <!-- 列标签 -->
    <text x="20" y="-10" text-anchor="middle" font-size="11" fill="#64748b">1</text>
    <text x="60" y="-10" text-anchor="middle" font-size="11" fill="#64748b">2</text>
    <text x="100" y="-10" text-anchor="middle" font-size="11" fill="#64748b">3</text>
    <text x="140" y="-10" text-anchor="middle" font-size="11" fill="#64748b">4</text>

    <!-- 单元格：允许=蓝色，掩码=灰色 -->
    <rect x="0" y="0" width="40" height="40" fill="#eef2ff" stroke="#6366f1" stroke-width="1"/>
    <rect x="40" y="0" width="40" height="40" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="80" y="0" width="40" height="40" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="120" y="0" width="40" height="40" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>

    <rect x="0" y="40" width="40" height="40" fill="#eef2ff" stroke="#6366f1" stroke-width="1"/>
    <rect x="40" y="40" width="40" height="40" fill="#eef2ff" stroke="#6366f1" stroke-width="1"/>
    <rect x="80" y="40" width="40" height="40" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="120" y="40" width="40" height="40" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>

    <rect x="0" y="80" width="40" height="40" fill="#eef2ff" stroke="#6366f1" stroke-width="1"/>
    <rect x="40" y="80" width="40" height="40" fill="#eef2ff" stroke="#6366f1" stroke-width="1"/>
    <rect x="80" y="80" width="40" height="40" fill="#eef2ff" stroke="#6366f1" stroke-width="1"/>
    <rect x="120" y="80" width="40" height="40" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>

    <rect x="0" y="120" width="40" height="40" fill="#eef2ff" stroke="#6366f1" stroke-width="1"/>
    <rect x="40" y="120" width="40" height="40" fill="#eef2ff" stroke="#6366f1" stroke-width="1"/>
    <rect x="80" y="120" width="40" height="40" fill="#eef2ff" stroke="#6366f1" stroke-width="1"/>
    <rect x="120" y="120" width="40" height="40" fill="#eef2ff" stroke="#6366f1" stroke-width="1"/>

    <!-- 对角线标记 -->
    <text x="20" y="24" text-anchor="middle" font-size="12" fill="#3730a3">&#10003;</text>
    <text x="60" y="64" text-anchor="middle" font-size="12" fill="#3730a3">&#10003;</text>
    <text x="100" y="104" text-anchor="middle" font-size="12" fill="#3730a3">&#10003;</text>
    <text x="140" y="144" text-anchor="middle" font-size="12" fill="#3730a3">&#10003;</text>
  </g>

  <text x="750" y="600" text-anchor="middle" font-size="11" fill="#64748b">Blue = allowed (j &#8804; i)</text>
  <text x="750" y="618" text-anchor="middle" font-size="11" fill="#64748b">Gray = masked (j &gt; i)</text>

  <!-- 底部说明 -->
  <rect x="40" y="630" width="880" height="36" rx="4" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="480" y="654" text-anchor="middle" font-size="12" fill="#64748b">Masking ensures that the decoder is auto-regressive: each position can only attend to itself and earlier positions.</text>
</svg>
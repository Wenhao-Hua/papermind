<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" width="960" height="680">
  <rect x="0" y="0" width="960" height="680" fill="#ffffff"/>

  <!-- 标题 -->
  <text x="480" y="36" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">Self-Attention: Shortest Path Length</text>
  <text x="480" y="58" font-size="13" fill="#64748b" text-anchor="middle">任意两位置间信息传播仅需常数步，远优于 RNN 与 CNN</text>

  <!-- 核心指标定义框（唯一强调色） -->
  <rect x="60" y="80" width="840" height="80" rx="6" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="480" y="108" font-size="18" font-weight="bold" fill="#3730a3" text-anchor="middle">核心指标：路径长度（Path Length）</text>
  <text x="480" y="134" font-size="15" fill="#334155" text-anchor="middle">自注意力：O(1) 步 | RNN：O(n) 步 | CNN：O(logₖ n) 步</text>
  <text x="480" y="152" font-size="12" fill="#64748b" text-anchor="middle">较短的信号路径使梯度反向传播衰减更小，更易学习长距离依赖</text>

  <!-- 左侧主图：三种架构对比 -->
  <!-- 自注意力 -->
  <rect x="60" y="180" width="260" height="340" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="190" y="206" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">Self-Attention</text>
  <text x="190" y="224" font-size="11" fill="#64748b" text-anchor="middle">O(1) 步连接任意位置</text>

  <!-- 自注意力二部图 -->
  <text x="100" y="252" font-size="11" fill="#334155" text-anchor="middle">输入序列</text>
  <text x="280" y="252" font-size="11" fill="#334155" text-anchor="middle">输出序列</text>

  <!-- 左侧节点 -->
  <circle cx="120" cy="280" r="8" fill="#6366f1" stroke="#6366f1" stroke-width="1.5"/>
  <circle cx="120" cy="320" r="8" fill="#6366f1" stroke="#6366f1" stroke-width="1.5"/>
  <circle cx="120" cy="360" r="8" fill="#6366f1" stroke="#6366f1" stroke-width="1.5"/>
  <circle cx="120" cy="400" r="8" fill="#6366f1" stroke="#6366f1" stroke-width="1.5"/>
  <circle cx="120" cy="440" r="8" fill="#6366f1" stroke="#6366f1" stroke-width="1.5"/>

  <!-- 右侧节点 -->
  <circle cx="260" cy="280" r="8" fill="#6366f1" stroke="#6366f1" stroke-width="1.5"/>
  <circle cx="260" cy="320" r="8" fill="#6366f1" stroke="#6366f1" stroke-width="1.5"/>
  <circle cx="260" cy="360" r="8" fill="#6366f1" stroke="#6366f1" stroke-width="1.5"/>
  <circle cx="260" cy="400" r="8" fill="#6366f1" stroke="#6366f1" stroke-width="1.5"/>
  <circle cx="260" cy="440" r="8" fill="#6366f1" stroke="#6366f1" stroke-width="1.5"/>

  <!-- 自注意力连边：每个左侧节点连到所有右侧节点 -->
  <line x1="128" y1="280" x2="252" y2="280" stroke="#6366f1" stroke-width="1" opacity="0.3"/>
  <line x1="128" y1="280" x2="252" y2="320" stroke="#6366f1" stroke-width="1" opacity="0.3"/>
  <line x1="128" y1="280" x2="252" y2="360" stroke="#6366f1" stroke-width="1" opacity="0.3"/>
  <line x1="128" y1="280" x2="252" y2="400" stroke="#6366f1" stroke-width="1" opacity="0.3"/>
  <line x1="128" y1="280" x2="252" y2="440" stroke="#6366f1" stroke-width="1" opacity="0.3"/>

  <line x1="128" y1="320" x2="252" y2="280" stroke="#6366f1" stroke-width="1" opacity="0.3"/>
  <line x1="128" y1="320" x2="252" y2="320" stroke="#6366f1" stroke-width="1" opacity="0.3"/>
  <line x1="128" y1="320" x2="252" y2="360" stroke="#6366f1" stroke-width="1" opacity="0.3"/>
  <line x1="128" y1="320" x2="252" y2="400" stroke="#6366f1" stroke-width="1" opacity="0.3"/>
  <line x1="128" y1="320" x2="252" y2="440" stroke="#6366f1" stroke-width="1" opacity="0.3"/>

  <line x1="128" y1="360" x2="252" y2="280" stroke="#6366f1" stroke-width="1" opacity="0.3"/>
  <line x1="128" y1="360" x2="252" y2="320" stroke="#6366f1" stroke-width="1" opacity="0.3"/>
  <line x1="128" y1="360" x2="252" y2="360" stroke="#6366f1" stroke-width="1" opacity="0.3"/>
  <line x1="128" y1="360" x2="252" y2="400" stroke="#6366f1" stroke-width="1" opacity="0.3"/>
  <line x1="128" y1="360" x2="252" y2="440" stroke="#6366f1" stroke-width="1" opacity="0.3"/>

  <line x1="128" y1="400" x2="252" y2="280" stroke="#6366f1" stroke-width="1" opacity="0.3"/>
  <line x1="128" y1="400" x2="252" y2="320" stroke="#6366f1" stroke-width="1" opacity="0.3"/>
  <line x1="128" y1="400" x2="252" y2="360" stroke="#6366f1" stroke-width="1" opacity="0.3"/>
  <line x1="128" y1="400" x2="252" y2="400" stroke="#6366f1" stroke-width="1" opacity="0.3"/>
  <line x1="128" y1="400" x2="252" y2="440" stroke="#6366f1" stroke-width="1" opacity="0.3"/>

  <line x1="128" y1="440" x2="252" y2="280" stroke="#6366f1" stroke-width="1" opacity="0.3"/>
  <line x1="128" y1="440" x2="252" y2="320" stroke="#6366f1" stroke-width="1" opacity="0.3"/>
  <line x1="128" y1="440" x2="252" y2="360" stroke="#6366f1" stroke-width="1" opacity="0.3"/>
  <line x1="128" y1="440" x2="252" y2="400" stroke="#6366f1" stroke-width="1" opacity="0.3"/>
  <line x1="128" y1="440" x2="252" y2="440" stroke="#6366f1" stroke-width="1" opacity="0.3"/>

  <!-- 强调一条路径：位置1到位置5 -->
  <line x1="128" y1="280" x2="252" y2="440" stroke="#6366f1" stroke-width="2.5" opacity="0.9"/>
  <polygon points="252,440 244,432 244,448" fill="#6366f1"/>

  <text x="190" y="478" font-size="11" fill="#334155" text-anchor="middle">任意两位置直接连接</text>
  <text x="190" y="496" font-size="11" fill="#334155" text-anchor="middle">路径长度 = 1 步</text>

  <!-- RNN -->
  <rect x="350" y="180" width="260" height="340" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="480" y="206" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">RNN</text>
  <text x="480" y="224" font-size="11" fill="#64748b" text-anchor="middle">O(n) 步顺序传播</text>

  <!-- RNN 链式结构 -->
  <circle cx="400" cy="280" r="10" fill="#94a3b8" stroke="#64748b" stroke-width="1.5"/>
  <text x="400" y="284" font-size="10" fill="#1e293b" text-anchor="middle">1</text>
  <circle cx="440" cy="320" r="10" fill="#94a3b8" stroke="#64748b" stroke-width="1.5"/>
  <text x="440" y="324" font-size="10" fill="#1e293b" text-anchor="middle">2</text>
  <circle cx="480" cy="360" r="10" fill="#94a3b8" stroke="#64748b" stroke-width="1.5"/>
  <text x="480" y="364" font-size="10" fill="#1e293b" text-anchor="middle">3</text>
  <circle cx="520" cy="400" r="10" fill="#94a3b8" stroke="#64748b" stroke-width="1.5"/>
  <text x="520" y="404" font-size="10" fill="#1e293b" text-anchor="middle">4</text>
  <circle cx="560" cy="440" r="10" fill="#94a3b8" stroke="#64748b" stroke-width="1.5"/>
  <text x="560" y="444" font-size="10" fill="#1e293b" text-anchor="middle">5</text>

  <!-- RNN 箭头 -->
  <line x1="410" y1="280" x2="432" y2="316" stroke="#64748b" stroke-width="1.5"/>
  <polygon points="432,316 426,310 430,322" fill="#64748b"/>
  <line x1="450" y1="320" x2="472" y2="356" stroke="#64748b" stroke-width="1.5"/>
  <polygon points="472,356 466,350 470,362" fill="#64748b"/>
  <line x1="490" y1="360" x2="512" y2="396" stroke="#64748b" stroke-width="1.5"/>
  <polygon points="512,396 506,390 510,402" fill="#64748b"/>
  <line x1="530" y1="400" x2="552" y2="436" stroke="#64748b" stroke-width="1.5"/>
  <polygon points="552,436 546,430 550,442" fill="#64748b"/>

  <!-- 强调路径：1→5 -->
  <path d="M400,280 C440,300 500,380 560,440" stroke="#6366f1" stroke-width="2.5" fill="none" stroke-dasharray="6,4"/>
  <polygon points="560,440 550,434 554,448" fill="#6366f1"/>
  <text x="480" y="478" font-size="11" fill="#334155" text-anchor="middle">需经过 4 个中间步</text>
  <text x="480" y="496" font-size="11" fill="#334155" text-anchor="middle">路径长度 = 4 步</text>

  <!-- CNN -->
  <rect x="640" y="180" width="260" height="340" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="770" y="206" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">CNN</text>
  <text x="770" y="224" font-size="11" fill="#64748b" text-anchor="middle">O(logₖ n) 步层级传播</text>

  <!-- CNN 层级结构 -->
  <!-- 输入层 -->
  <circle cx="690" cy="280" r="8" fill="#94a3b8" stroke="#64748b" stroke-width="1"/>
  <circle cx="730" cy="280" r="8" fill="#94a3b8" stroke="#64748b" stroke-width="1"/>
  <circle cx="770" cy="280" r="8" fill="#94a3b8" stroke="#64748b" stroke-width="1"/>
  <circle cx="810" cy="280" r="8" fill="#94a3b8" stroke="#64748b" stroke-width="1"/>
  <circle cx="850" cy="280" r="8" fill="#94a3b8" stroke="#64748b" stroke-width="1"/>

  <!-- 中间层 -->
  <circle cx="710" cy="340" r="8" fill="#94a3b8" stroke="#64748b" stroke-width="1"/>
  <circle cx="770" cy="340" r="8" fill="#94a3b8" stroke="#64748b" stroke-width="1"/>
  <circle cx="830" cy="340" r="8" fill="#94a3b8" stroke="#64748b" stroke-width="1"/>

  <!-- 顶层 -->
  <circle cx="770" cy="400" r="8" fill="#94a3b8" stroke="#64748b" stroke-width="1"/>

  <!-- CNN 连接 -->
  <line x1="690" y1="288" x2="706" y2="332" stroke="#64748b" stroke-width="1"/>
  <line x1="730" y1="288" x2="706" y2="332" stroke="#64748b" stroke-width="1"/>
  <line x1="730" y1="288" x2="766" y2="332" stroke="#64748b" stroke-width="1"/>
  <line x1="770" y1="288" x2="766" y2="332" stroke="#64748b" stroke-width="1"/>
  <line x1="770" y1="288" x2="826" y2="332" stroke="#64748b" stroke-width="1"/>
  <line x1="810" y1="288" x2="826" y2="332" stroke="#64748b" stroke-width="1"/>
  <line x1="810" y1="288" x2="846" y2="332" stroke="#64748b" stroke-width="1"/>
  <line x1="850" y1="288" x2="846" y2="332" stroke="#64748b" stroke-width="1"/>

  <line x1="710" y1="348" x2="766" y2="392" stroke="#64748b" stroke-width="1"/>
  <line x1="770" y1="348" x2="766" y2="392" stroke="#64748b" stroke-width="1"/>
  <line x1="770" y1="348" x2="826" y2="392" stroke="#64748b" stroke-width="1"/>
  <line x1="830" y1="348" x2="826" y2="392" stroke="#64748b" stroke-width="1"/>

  <!-- 强调路径：1→5 -->
  <path d="M690,280 C710,310 750,370 770,400" stroke="#6366f1" stroke-width="2.5" fill="none" stroke-dasharray="6,4"/>
  <polygon points="770,400 762,394 766,408" fill="#6366f1"/>
  <text x="770" y="478" font-size="11" fill="#334155" text-anchor="middle">需经过 2 个卷积层</text>
  <text x="770" y="496" font-size="11" fill="#334155" text-anchor="middle">路径长度 = 2 步</text>

  <!-- 底部总结框 -->
  <rect x="60" y="540" width="840" height="60" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="480" y="564" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="middle">总结：路径长度对比（n = 5）</text>
  <text x="480" y="586" font-size="12" fill="#334155" text-anchor="middle">Self-Attention: 1 步 | RNN: 4 步 | CNN: 2 步</text>

  <!-- 右侧图例面板 -->
  <rect x="60" y="620" width="840" height="48" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="100" y="642" font-size="11" fill="#64748b" text-anchor="start">图例：</text>
  <line x1="140" y1="638" x2="180" y2="638" stroke="#6366f1" stroke-width="2"/>
  <polygon points="180,638 174,632 174,644" fill="#6366f1"/>
  <text x="188" y="642" font-size="11" fill="#334155" text-anchor="start">直接连接（自注意力）</text>
  <line x1="340" y1="638" x2="380" y2="638" stroke="#64748b" stroke-width="1.5"/>
  <polygon points="380,638 374,632 374,644" fill="#64748b"/>
  <text x="388" y="642" font-size="11" fill="#334155" text-anchor="start">顺序连接（RNN）</text>
  <line x1="540" y1="638" x2="580" y2="638" stroke="#64748b" stroke-width="1.5"/>
  <polygon points="580,638 574,632 574,644" fill="#64748b"/>
  <text x="588" y="642" font-size="11" fill="#334155" text-anchor="start">层级连接（CNN）</text>
  <line x1="740" y1="638" x2="780" y2="638" stroke="#6366f1" stroke-width="2.5" stroke-dasharray="6,4"/>
  <polygon points="780,638 772,632 772,644" fill="#6366f1"/>
  <text x="788" y="642" font-size="11" fill="#334155" text-anchor="start">强调路径</text>
</svg>
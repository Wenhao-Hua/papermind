<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" width="960" height="680">
  <rect x="0" y="0" width="960" height="680" fill="#ffffff"/>

  <!-- 标题 -->
  <text x="480" y="36" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">Vision Transformer (ViT) — [class] Token Mechanism</text>

  <!-- 主面板：核心公式与结构 -->
  <rect x="40" y="56" width="600" height="580" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" rx="4"/>
  <text x="340" y="80" font-size="14" font-weight="bold" fill="#334155" text-anchor="middle">Core Definition: Learnable Classification Token</text>

  <!-- 公式框（强调色） -->
  <rect x="60" y="96" width="560" height="72" fill="#eef2ff" stroke="#6366f1" stroke-width="2" rx="4"/>
  <text x="340" y="120" font-size="15" fill="#3730a3" text-anchor="middle" font-weight="bold">z₀ = [x_class ; x_p¹E ; … ; x_pᴺE] + E_pos</text>
  <text x="340" y="148" font-size="15" fill="#3730a3" text-anchor="middle" font-weight="bold">y = LN(z_L⁰)</text>

  <!-- 图例：符号说明 -->
  <text x="80" y="192" font-size="12" fill="#475569">Symbols:</text>
  <text x="80" y="212" font-size="11" fill="#64748b">x_class — learnable [class] embedding (dims D)</text>
  <text x="80" y="230" font-size="11" fill="#64748b">x_pⁱE — linear projection of i-th image patch (dim D)</text>
  <text x="80" y="248" font-size="11" fill="#64748b">E_pos — positional embedding (learnable, dim D)</text>
  <text x="80" y="266" font-size="11" fill="#64748b">z_L⁰ — output of [class] token after L Transformer blocks</text>
  <text x="80" y="284" font-size="11" fill="#64748b">LN — Layer Norm;  y — final class prediction</text>

  <!-- 结构图：输入序列 -->
  <text x="340" y="316" font-size="13" font-weight="bold" fill="#334155" text-anchor="middle">Input Sequence Construction</text>

  <!-- 序列框 -->
  <rect x="80" y="330" width="520" height="44" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" rx="3"/>
  <text x="120" y="356" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="bold">[class]</text>
  <line x1="150" y1="338" x2="150" y2="364" stroke="#cbd5e1" stroke-width="1"/>
  <text x="190" y="356" font-size="11" fill="#475569" text-anchor="middle">patch₁</text>
  <line x1="220" y1="338" x2="220" y2="364" stroke="#cbd5e1" stroke-width="1"/>
  <text x="260" y="356" font-size="11" fill="#475569" text-anchor="middle">patch₂</text>
  <line x1="290" y1="338" x2="290" y2="364" stroke="#cbd5e1" stroke-width="1"/>
  <text x="330" y="356" font-size="11" fill="#475569" text-anchor="middle">…</text>
  <line x1="360" y1="338" x2="360" y2="364" stroke="#cbd5e1" stroke-width="1"/>
  <text x="400" y="356" font-size="11" fill="#475569" text-anchor="middle">patchₙ</text>
  <line x1="430" y1="338" x2="430" y2="364" stroke="#cbd5e1" stroke-width="1"/>
  <text x="470" y="356" font-size="11" fill="#475569" text-anchor="middle">+ E_pos</text>

  <!-- 箭头：序列 → Transformer -->
  <polygon points="340,378 334,388 346,388" fill="#6366f1"/>
  <line x1="340" y1="374" x2="340" y2="388" stroke="#6366f1" stroke-width="2"/>

  <!-- Transformer 块示意 -->
  <rect x="140" y="396" width="400" height="80" fill="#ffffff" stroke="#6366f1" stroke-width="1.5" rx="4"/>
  <text x="340" y="420" font-size="12" font-weight="bold" fill="#3730a3" text-anchor="middle">Transformer Encoder (L blocks)</text>
  <text x="340" y="440" font-size="11" fill="#475569" text-anchor="middle">Multi-Head Self-Attention + MLP + Residual + Layer Norm</text>
  <text x="340" y="460" font-size="11" fill="#64748b" text-anchor="middle">Each block: z&#8320; = MSA(LN(z&#8320;₋₁)) + z&#8320;₋₁ ;  z&#8320; = MLP(LN(z&#8320;)) + z&#8320;</text>

  <!-- 箭头：Transformer → 输出 -->
  <polygon points="340,480 334,490 346,490" fill="#6366f1"/>
  <line x1="340" y1="476" x2="340" y2="490" stroke="#6366f1" stroke-width="2"/>

  <!-- 输出：分类头 -->
  <rect x="200" y="498" width="280" height="44" fill="#eef2ff" stroke="#6366f1" stroke-width="2" rx="4"/>
  <text x="340" y="518" font-size="13" font-weight="bold" fill="#3730a3" text-anchor="middle">Classification Head</text>
  <text x="340" y="534" font-size="11" fill="#475569" text-anchor="middle">y = LN(z_L⁰)  →  linear projection → class logits</text>

  <!-- 强调：只有 [class] token 被使用 -->
  <rect x="80" y="556" width="520" height="28" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" rx="3"/>
  <text x="340" y="574" font-size="11" fill="#334155" text-anchor="middle">Only the output of [class] token (z_L⁰) is used for prediction; patch outputs are discarded.</text>

  <!-- 右侧面板：图例与机制拆解 -->
  <rect x="660" y="56" width="270" height="580" fill="#fbfcfe" stroke="#cbd5e1" stroke-width="1.5" rx="4"/>
  <text x="795" y="80" font-size="14" font-weight="bold" fill="#334155" text-anchor="middle">Legend &amp; Mechanism</text>

  <!-- 图例：箭头 -->
  <text x="680" y="110" font-size="12" font-weight="bold" fill="#475569">Arrow Types</text>
  <line x1="680" y1="130" x2="720" y2="130" stroke="#6366f1" stroke-width="2"/>
  <polygon points="720,130 714,126 714,134" fill="#6366f1"/>
  <text x="730" y="134" font-size="11" fill="#475569">Data flow / forward pass</text>

  <line x1="680" y1="158" x2="720" y2="158" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,4"/>
  <polygon points="720,158 714,154 714,162" fill="#94a3b8"/>
  <text x="730" y="162" font-size="11" fill="#475569">Reference / skip connection</text>

  <!-- 机制拆解 -->
  <text x="680" y="200" font-size="12" font-weight="bold" fill="#475569">Key Design Points</text>

  <rect x="680" y="212" width="230" height="24" fill="#eef2ff" stroke="#6366f1" stroke-width="1" rx="2"/>
  <text x="795" y="228" font-size="11" fill="#3730a3" text-anchor="middle" font-weight="bold">Inspired by BERT [CLS] token</text>

  <text x="680" y="260" font-size="11" fill="#334155">1. [class] token is a learnable vector</text>
  <text x="680" y="278" font-size="11" fill="#334155">   (initialized randomly, optimized via SGD)</text>

  <text x="680" y="302" font-size="11" fill="#334155">2. Positioned at index 0 of input sequence</text>

  <text x="680" y="326" font-size="11" fill="#334155">3. Interacts with all patch tokens via</text>
  <text x="680" y="344" font-size="11" fill="#334155">   self-attention in each Transformer block</text>

  <text x="680" y="368" font-size="11" fill="#334155">4. After L blocks, its representation</text>
  <text x="680" y="386" font-size="11" fill="#334155">   aggregates global image information</text>

  <text x="680" y="410" font-size="11" fill="#334155">5. Only z_L⁰ is passed to classification</text>
  <text x="680" y="428" font-size="11" fill="#334155">   head; patch outputs are not used</text>

  <!-- 对比：与 CNN 归纳偏置 -->
  <text x="680" y="466" font-size="12" font-weight="bold" fill="#475569">Inductive Bias Comparison</text>
  <rect x="680" y="478" width="230" height="60" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" rx="3"/>
  <text x="690" y="496" font-size="11" fill="#334155">CNN: translation equivariance, locality</text>
  <text x="690" y="514" font-size="11" fill="#334155">ViT: minimal inductive bias;</text>
  <text x="690" y="532" font-size="11" fill="#334155">relies on large-scale pre-training</text>

  <!-- 底部引用 -->
  <text x="795" y="618" font-size="10" fill="#94a3b8" text-anchor="middle">Dosovitskiy et al. ICLR 2021</text>
</svg>
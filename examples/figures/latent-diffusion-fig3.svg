<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" width="960" height="680">
  <rect x="0" y="0" width="960" height="680" fill="#ffffff"/>

  <!-- 标题 -->
  <text x="480" y="36" font-size="20" font-weight="700" fill="#1e293b" text-anchor="middle">Latent Diffusion Models: Regularization of Latent Space</text>

  <!-- 左侧主区：两种正则化对比 -->
  <!-- 面板1: KL-Regularization -->
  <rect x="40" y="60" width="420" height="280" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="250" y="86" font-size="15" font-weight="700" fill="#1e293b" text-anchor="middle">KL‑Regularization (VAE‑style)</text>
  <text x="250" y="106" font-size="12" fill="#64748b" text-anchor="middle">Encoder output penalized toward N(0, I)</text>

  <!-- 编码器框 -->
  <rect x="60" y="124" width="120" height="44" rx="4" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="120" y="150" font-size="13" font-weight="600" fill="#3730a3" text-anchor="middle">Encoder E</text>

  <!-- 箭头 E -> z -->
  <line x1="180" y1="146" x2="220" y2="146" stroke="#475569" stroke-width="1.5"/>
  <polygon points="220,141 232,146 220,151" fill="#475569"/>

  <!-- z 框 -->
  <rect x="232" y="120" width="100" height="52" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="282" y="142" font-size="13" font-weight="600" fill="#1e293b" text-anchor="middle">z = E(x)</text>
  <text x="282" y="160" font-size="11" fill="#64748b" text-anchor="middle">z ∈ ℝ^{h×w×c}</text>

  <!-- KL 惩罚标注 -->
  <rect x="232" y="180" width="100" height="28" rx="3" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
  <text x="282" y="198" font-size="11" fill="#991b1b" text-anchor="middle">+ KL(z ‖ N(0,I))</text>

  <!-- 箭头 z -> D -->
  <line x1="332" y1="146" x2="372" y2="146" stroke="#475569" stroke-width="1.5"/>
  <polygon points="372,141 384,146 372,151" fill="#475569"/>

  <!-- 解码器框 -->
  <rect x="384" y="124" width="60" height="44" rx="4" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="414" y="150" font-size="13" font-weight="600" fill="#3730a3" text-anchor="middle">D</text>

  <!-- 输出 -->
  <text x="414" y="200" font-size="11" fill="#64748b" text-anchor="middle">x̃ = D(z)</text>

  <!-- 损失 -->
  <text x="250" y="240" font-size="11" fill="#334155" text-anchor="middle">Loss = ‖x − x̃‖² + λ·KL</text>

  <!-- 面板2: VQ-Regularization -->
  <rect x="40" y="360" width="420" height="280" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="250" y="386" font-size="15" font-weight="700" fill="#1e293b" text-anchor="middle">VQ‑Regularization (VQ‑VAE style)</text>
  <text x="250" y="406" font-size="12" fill="#64748b" text-anchor="middle">Continuous z mapped to discrete codebook</text>

  <!-- 编码器框 -->
  <rect x="60" y="424" width="120" height="44" rx="4" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="120" y="450" font-size="13" font-weight="600" fill="#3730a3" text-anchor="middle">Encoder E</text>

  <!-- 箭头 E -> z -->
  <line x1="180" y1="446" x2="220" y2="446" stroke="#475569" stroke-width="1.5"/>
  <polygon points="220,441 232,446 220,451" fill="#475569"/>

  <!-- z 框 -->
  <rect x="232" y="420" width="100" height="52" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="282" y="442" font-size="13" font-weight="600" fill="#1e293b" text-anchor="middle">z = E(x)</text>
  <text x="282" y="460" font-size="11" fill="#64748b" text-anchor="middle">z ∈ ℝ^{h×w×c}</text>

  <!-- 向量量化层 -->
  <rect x="232" y="480" width="100" height="28" rx="3" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
  <text x="282" y="498" font-size="11" fill="#166534" text-anchor="middle">VQ: z → z_q</text>

  <!-- 码本 -->
  <rect x="200" y="520" width="164" height="44" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="282" y="540" font-size="11" fill="#334155" text-anchor="middle">Codebook: {c₁, c₂, …, c_K}</text>
  <text x="282" y="556" font-size="10" fill="#64748b" text-anchor="middle">z_q = argmin‖z − c_k‖</text>

  <!-- 箭头 z_q -> D -->
  <line x1="364" y1="446" x2="384" y2="446" stroke="#475569" stroke-width="1.5"/>
  <polygon points="384,441 396,446 384,451" fill="#475569"/>

  <!-- 解码器框 -->
  <rect x="396" y="424" width="48" height="44" rx="4" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="420" y="450" font-size="13" font-weight="600" fill="#3730a3" text-anchor="middle">D</text>

  <!-- 输出 -->
  <text x="420" y="500" font-size="11" fill="#64748b" text-anchor="middle">x̃ = D(z_q)</text>

  <!-- 损失 -->
  <text x="250" y="590" font-size="11" fill="#334155" text-anchor="middle">Loss = ‖x − x̃‖² + ‖sg[E(x)] − z_q‖²</text>

  <!-- 右侧图例/说明面板 -->
  <rect x="500" y="60" width="420" height="580" rx="4" fill="#fbfcfe" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="710" y="86" font-size="15" font-weight="700" fill="#1e293b" text-anchor="middle">Key Comparison</text>

  <!-- 图例：箭头 -->
  <text x="520" y="116" font-size="12" font-weight="600" fill="#334155">Arrow Legend</text>
  <line x1="520" y1="134" x2="560" y2="134" stroke="#475569" stroke-width="1.5"/>
  <polygon points="560,129 572,134 560,139" fill="#475569"/>
  <text x="580" y="138" font-size="11" fill="#64748b">Data flow (forward pass)</text>

  <line x1="520" y1="158" x2="560" y2="158" stroke="#fca5a5" stroke-width="1.5" stroke-dasharray="5,3"/>
  <polygon points="560,153 572,158 560,163" fill="#fca5a5"/>
  <text x="580" y="162" font-size="11" fill="#64748b">KL divergence penalty</text>

  <line x1="520" y1="182" x2="560" y2="182" stroke="#86efac" stroke-width="1.5"/>
  <polygon points="560,177 572,182 560,187" fill="#86efac"/>
  <text x="580" y="186" font-size="11" fill="#64748b">Vector quantization step</text>

  <!-- 机制拆解 -->
  <text x="520" y="220" font-size="12" font-weight="600" fill="#334155">Mechanism</text>

  <rect x="520" y="232" width="380" height="28" rx="3" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="710" y="250" font-size="11" fill="#334155" text-anchor="middle">KL: Regularizes latent distribution toward Gaussian</text>

  <rect x="520" y="268" width="380" height="28" rx="3" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="710" y="286" font-size="11" fill="#334155" text-anchor="middle">VQ: Discretizes latent via nearest codebook lookup</text>

  <!-- 关键公式 -->
  <text x="520" y="328" font-size="12" font-weight="600" fill="#334155">Formulation</text>

  <rect x="520" y="340" width="380" height="60" rx="3" fill="#fefce8" stroke="#fde047" stroke-width="1"/>
  <text x="710" y="360" font-size="12" font-weight="600" fill="#854d0e" text-anchor="middle">KL‑Regularized LDM</text>
  <text x="710" y="380" font-size="11" fill="#713f12" text-anchor="middle">min 𝔼_{x,ε,t}[‖ε − ε_θ(z_t, t)‖²] + λ·KL(z ‖ N(0,I))</text>

  <rect x="520" y="412" width="380" height="60" rx="3" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
  <text x="710" y="432" font-size="12" font-weight="600" fill="#166534" text-anchor="middle">VQ‑Regularized LDM</text>
  <text x="710" y="452" font-size="11" fill="#14532d" text-anchor="middle">min 𝔼_{x,ε,t}[‖ε − ε_θ(z_q, t)‖²] + ‖sg[E(x)] − z_q‖²</text>

  <!-- 核心指标 -->
  <text x="520" y="500" font-size="12" font-weight="600" fill="#334155">Key Property</text>

  <rect x="520" y="512" width="380" height="44" rx="4" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="710" y="532" font-size="13" font-weight="700" fill="#3730a3" text-anchor="middle">VQ‑reg preserves more image details</text>
  <text x="710" y="548" font-size="11" fill="#64748b" text-anchor="middle">No delicate weighting of reconstruction vs. generation</text>

  <!-- 表8 引用 -->
  <text x="520" y="584" font-size="11" fill="#64748b">See Table 8 in paper for quantitative comparison</text>

  <!-- 底部说明 -->
  <text x="480" y="660" font-size="11" fill="#94a3b8" text-anchor="middle">Figure: Comparison of KL‑regularization (top) and VQ‑regularization (bottom) in latent diffusion models.</text>
</svg>
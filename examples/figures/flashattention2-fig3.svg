<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" width="960" height="620">
  <rect x="0" y="0" width="960" height="620" fill="#ffffff"/>

  <!-- 标题 -->
  <text x="480" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">Block Size Tuning in FlashAttention-2</text>
  <text x="480" y="58" text-anchor="middle" font-size="13" fill="#64748b">Manual selection of tile sizes B<tspan baseline-shift="sub" font-size="75%">r</tspan> and B<tspan baseline-shift="sub" font-size="75%">c</tspan> to balance shared memory traffic, register pressure, and occupancy</text>

  <!-- 核心定义框（强调色） -->
  <rect x="60" y="80" width="840" height="100" rx="6" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="480" y="108" text-anchor="middle" font-size="16" font-weight="bold" fill="#3730a3">Core Definition: Block Size Selection</text>
  <text x="480" y="134" text-anchor="middle" font-size="14" fill="#1e293b">B<tspan baseline-shift="sub" font-size="75%">r</tspan> &#8712; {64, 128},  B<tspan baseline-shift="sub" font-size="75%">c</tspan> &#8712; {64, 128}</text>
  <text x="480" y="158" text-anchor="middle" font-size="13" fill="#334155">Chosen based on head dimension d and GPU shared memory size (typically 48–164 KB per SM)</text>

  <!-- 左侧：权衡因素 -->
  <rect x="60" y="200" width="400" height="200" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="260" y="226" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">Trade-offs</text>

  <!-- 增加块大小 -->
  <rect x="80" y="244" width="360" height="60" rx="3" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="260" y="266" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">Increase Block Size (e.g., 128 &#215; 128)</text>
  <text x="260" y="286" text-anchor="middle" font-size="12" fill="#334155">&#8593; Fewer shared memory reads/writes (higher throughput)</text>

  <!-- 减少块大小 -->
  <rect x="80" y="316" width="360" height="60" rx="3" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="260" y="338" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">Decrease Block Size (e.g., 64 &#215; 64)</text>
  <text x="260" y="358" text-anchor="middle" font-size="12" fill="#334155">&#8593; Lower register pressure &amp; shared memory usage (higher occupancy)</text>

  <!-- 右侧：映射表 -->
  <rect x="500" y="200" width="400" height="200" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="700" y="226" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">Mapping: (d, SM size) &#8594; (B<tspan baseline-shift="sub" font-size="75%">r</tspan>, B<tspan baseline-shift="sub" font-size="75%">c</tspan>)</text>

  <!-- 表头 -->
  <rect x="520" y="240" width="120" height="28" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <text x="580" y="259" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e293b">Head dim d</text>
  <rect x="640" y="240" width="120" height="28" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <text x="700" y="259" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e293b">SM size</text>
  <rect x="760" y="240" width="120" height="28" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <text x="820" y="259" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e293b">(B<tspan baseline-shift="sub" font-size="75%">r</tspan>, B<tspan baseline-shift="sub" font-size="75%">c</tspan>)</text>

  <!-- 行1 -->
  <rect x="520" y="268" width="120" height="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="580" y="287" text-anchor="middle" font-size="12" fill="#1e293b">64</text>
  <rect x="640" y="268" width="120" height="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="700" y="287" text-anchor="middle" font-size="12" fill="#1e293b">48 KB</text>
  <rect x="760" y="268" width="120" height="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="820" y="287" text-anchor="middle" font-size="12" fill="#1e293b">(64, 64)</text>

  <!-- 行2 -->
  <rect x="520" y="296" width="120" height="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="580" y="315" text-anchor="middle" font-size="12" fill="#1e293b">128</text>
  <rect x="640" y="296" width="120" height="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="700" y="315" text-anchor="middle" font-size="12" fill="#1e293b">108 KB</text>
  <rect x="760" y="296" width="120" height="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="820" y="315" text-anchor="middle" font-size="12" fill="#1e293b">(128, 64)</text>

  <!-- 行3 -->
  <rect x="520" y="324" width="120" height="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="580" y="343" text-anchor="middle" font-size="12" fill="#1e293b">128</text>
  <rect x="640" y="324" width="120" height="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="700" y="343" text-anchor="middle" font-size="12" fill="#1e293b">164 KB</text>
  <rect x="760" y="324" width="120" height="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="820" y="343" text-anchor="middle" font-size="12" fill="#1e293b">(128, 128)</text>

  <!-- 行4 -->
  <rect x="520" y="352" width="120" height="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="580" y="371" text-anchor="middle" font-size="12" fill="#1e293b">64</text>
  <rect x="640" y="352" width="120" height="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="700" y="371" text-anchor="middle" font-size="12" fill="#1e293b">108 KB</text>
  <rect x="760" y="352" width="120" height="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="820" y="371" text-anchor="middle" font-size="12" fill="#1e293b">(64, 128)</text>

  <!-- 底部说明面板 -->
  <rect x="60" y="420" width="840" height="120" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="480" y="448" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">Mechanism: Tiling in FlashAttention-2 Forward Pass</text>

  <!-- 二部图：Q块 vs K/V块 -->
  <text x="200" y="476" text-anchor="middle" font-size="12" fill="#334155">Q tiles (B<tspan baseline-shift="sub" font-size="75%">r</tspan> &#215; d)</text>
  <text x="760" y="476" text-anchor="middle" font-size="12" fill="#334155">K/V tiles (B<tspan baseline-shift="sub" font-size="75%">c</tspan> &#215; d)</text>

  <!-- 左侧节点 -->
  <circle cx="200" cy="500" r="10" fill="#6366f1" stroke="#3730a3" stroke-width="1.5"/>
  <text x="200" y="522" text-anchor="middle" font-size="10" fill="#1e293b">Q<tspan baseline-shift="sub" font-size="75%">0</tspan></text>
  <circle cx="200" cy="540" r="10" fill="#6366f1" stroke="#3730a3" stroke-width="1.5"/>
  <text x="200" y="562" text-anchor="middle" font-size="10" fill="#1e293b">Q<tspan baseline-shift="sub" font-size="75%">1</tspan></text>

  <!-- 右侧节点 -->
  <circle cx="760" cy="500" r="10" fill="#94a3b8" stroke="#64748b" stroke-width="1.5"/>
  <text x="760" y="522" text-anchor="middle" font-size="10" fill="#1e293b">K<tspan baseline-shift="sub" font-size="75%">0</tspan>,V<tspan baseline-shift="sub" font-size="75%">0</tspan></text>
  <circle cx="760" cy="540" r="10" fill="#94a3b8" stroke="#64748b" stroke-width="1.5"/>
  <text x="760" y="562" text-anchor="middle" font-size="10" fill="#1e293b">K<tspan baseline-shift="sub" font-size="75%">1</tspan>,V<tspan baseline-shift="sub" font-size="75%">1</tspan></text>

  <!-- 连线：Q0连K0V0（实线） -->
  <line x1="210" y1="500" x2="750" y2="500" stroke="#6366f1" stroke-width="2"/>
  <polygon points="750,495 760,500 750,505" fill="#6366f1"/>

  <!-- 连线：Q0连K1V1（虚线） -->
  <line x1="210" y1="500" x2="750" y2="540" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,4"/>
  <polygon points="750,535 760,540 750,545" fill="#94a3b8"/>

  <!-- 连线：Q1连K0V0（虚线） -->
  <line x1="210" y1="540" x2="750" y2="500" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,4"/>
  <polygon points="750,495 760,500 750,505" fill="#94a3b8"/>

  <!-- 连线：Q1连K1V1（实线） -->
  <line x1="210" y1="540" x2="750" y2="540" stroke="#6366f1" stroke-width="2"/>
  <polygon points="750,535 760,540 750,545" fill="#6366f1"/>

  <!-- 图例 -->
  <rect x="60" y="570" width="840" height="30" rx="3" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="160" y="590" text-anchor="middle" font-size="11" fill="#334155">&#8212;  Solid: matched tile (inner loop)</text>
  <text x="420" y="590" text-anchor="middle" font-size="11" fill="#334155">- - -  Dashed: cross tile (outer loop)</text>
  <text x="680" y="590" text-anchor="middle" font-size="11" fill="#334155">&#9679;  Blue: Q tile;  Gray: K/V tile</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#1e293b" width="960" height="680">
  <rect x="0" y="0" width="960" height="680" fill="#ffffff"/>

  <!-- 标题 -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e293b">Figure: Understanding Low-Rank Updates — ΔW vs. W</text>

  <!-- ========== 左侧主面板：核心指标 ========== -->
  <rect x="32" y="56" width="580" height="600" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" rx="4"/>
  <text x="322" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">Core Metric: Projection of ΔW onto W's Subspace</text>

  <!-- 公式框（强调色） -->
  <rect x="72" y="96" width="500" height="52" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5" rx="4"/>
  <text x="322" y="118" text-anchor="middle" font-size="16" font-weight="bold" fill="#3730a3">‖U⊤ ΔWq V⊤‖F</text>
  <text x="322" y="138" text-anchor="middle" font-size="12" fill="#64748b">Frobenius norm of ΔW projected onto W's left/right singular subspaces</text>

  <!-- 符号说明 -->
  <text x="72" y="172" font-size="13" font-weight="bold" fill="#334155">Notation</text>
  <text x="72" y="194" font-size="12" fill="#475569">Wq ∈ ℝ&lt;tspan baseline-shift=&quot;super&quot; font-size=&quot;75%&quot;&gt;d×d&lt;/tspan&gt; : pre-trained query weight matrix</text>
  <text x="72" y="214" font-size="12" fill="#475569">ΔWq = BA : low-rank update (rank r, B∈ℝ&lt;tspan baseline-shift=&quot;super&quot; font-size=&quot;75%&quot;&gt;d×r&lt;/tspan&gt;, A∈ℝ&lt;tspan baseline-shift=&quot;super&quot; font-size=&quot;75%&quot;&gt;r×d&lt;/tspan&gt;)</text>
  <text x="72" y="234" font-size="12" fill="#475569">U, V : left/right singular vectors of Wq (from SVD)</text>

  <!-- 关键发现：二部图 + 数值 -->
  <text x="72" y="268" font-size="13" font-weight="bold" fill="#334155">Key Finding: ΔW amplifies directions already present in W, but not the dominant ones</text>

  <!-- 二部图：W 的奇异方向（左列） vs ΔW 的放大（右列） -->
  <text x="160" y="296" text-anchor="middle" font-size="11" fill="#64748b">W's singular directions</text>
  <text x="420" y="296" text-anchor="middle" font-size="11" fill="#64748b">ΔW's amplification factor</text>

  <!-- 左列节点 -->
  <circle cx="160" cy="320" r="6" fill="#6366f1"/>
  <text x="180" y="324" font-size="11" fill="#1e293b">u₁ (dominant)</text>
  <circle cx="160" cy="360" r="6" fill="#6366f1"/>
  <text x="180" y="364" font-size="11" fill="#1e293b">u₂</text>
  <circle cx="160" cy="400" r="6" fill="#6366f1"/>
  <text x="180" y="404" font-size="11" fill="#1e293b">u₃</text>
  <circle cx="160" cy="440" r="6" fill="#6366f1"/>
  <text x="180" y="444" font-size="11" fill="#1e293b">u₄</text>
  <circle cx="160" cy="480" r="6" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1"/>
  <text x="180" y="484" font-size="11" fill="#64748b">u₅ … u_d</text>

  <!-- 右列节点 -->
  <circle cx="420" cy="320" r="6" fill="#94a3b8"/>
  <text x="440" y="324" font-size="11" fill="#64748b">~1.0 (no amplification)</text>
  <circle cx="420" cy="360" r="6" fill="#6366f1"/>
  <text x="440" y="364" font-size="11" fill="#1e293b">~21.5 (r=4)</text>
  <circle cx="420" cy="400" r="6" fill="#6366f1"/>
  <text x="440" y="404" font-size="11" fill="#1e293b">~21.5 (r=4)</text>
  <circle cx="420" cy="440" r="6" fill="#6366f1"/>
  <text x="440" y="444" font-size="11" fill="#1e293b">~21.5 (r=4)</text>
  <circle cx="420" cy="480" r="6" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1"/>
  <text x="440" y="484" font-size="11" fill="#64748b">—</text>

  <!-- 连边：实线（强相关） + 虚线（弱） -->
  <line x1="166" y1="320" x2="414" y2="320" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="166" y1="360" x2="414" y2="360" stroke="#6366f1" stroke-width="2"/>
  <line x1="166" y1="400" x2="414" y2="400" stroke="#6366f1" stroke-width="2"/>
  <line x1="166" y1="440" x2="414" y2="440" stroke="#6366f1" stroke-width="2"/>
  <line x1="166" y1="480" x2="414" y2="480" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- 说明文字 -->
  <text x="322" y="520" text-anchor="middle" font-size="11" fill="#475569">ΔW does not repeat W's top singular directions;</text>
  <text x="322" y="536" text-anchor="middle" font-size="11" fill="#475569">it amplifies weaker directions by a large factor (~21.5 for r=4).</text>

  <!-- 小矩阵示意：W 与 ΔW 的 SVD 对比 -->
  <text x="72" y="568" font-size="13" font-weight="bold" fill="#334155">SVD Comparison (schematic)</text>

  <!-- W 的奇异值 -->
  <text x="120" y="592" text-anchor="middle" font-size="11" fill="#64748b">W = U Σ V⊤</text>
  <text x="120" y="610" text-anchor="middle" font-size="10" fill="#94a3b8">σ₁ ≥ σ₂ ≥ … ≥ σ_d</text>

  <!-- ΔW 的奇异值 -->
  <text x="320" y="592" text-anchor="middle" font-size="11" fill="#64748b">ΔW = U' Σ' V'⊤</text>
  <text x="320" y="610" text-anchor="middle" font-size="10" fill="#94a3b8">σ'₁ … σ'_r (only r non-zero)</text>

  <!-- 箭头：ΔW 与 W 的相关性 -->
  <text x="520" y="592" text-anchor="middle" font-size="11" fill="#64748b">Correlation: ‖U⊤ ΔW V⊤‖F</text>
  <text x="520" y="610" text-anchor="middle" font-size="10" fill="#6366f1">higher than random baseline</text>

  <!-- ========== 右侧面板：图例与机制拆解 ========== -->
  <rect x="636" y="56" width="290" height="600" fill="#fbfcfe" stroke="#e2e8f0" stroke-width="1" rx="4"/>
  <text x="781" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">Legend &amp; Mechanism</text>

  <!-- 图例 -->
  <text x="656" y="108" font-size="12" font-weight="bold" fill="#334155">Arrow Types</text>
  <line x1="656" y1="128" x2="700" y2="128" stroke="#6366f1" stroke-width="2"/>
  <polygon points="700,122 710,128 700,134" fill="#6366f1"/>
  <text x="720" y="132" font-size="11" fill="#475569">Strong amplification (ΔW direction)</text>

  <line x1="656" y1="156" x2="700" y2="156" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3"/>
  <polygon points="700,150 710,156 700,162" fill="#94a3b8"/>
  <text x="720" y="160" font-size="11" fill="#475569">Weak / no amplification</text>

  <!-- 机制拆解 -->
  <text x="656" y="196" font-size="12" font-weight="bold" fill="#334155">How LoRA Works</text>

  <rect x="656" y="210" width="250" height="80" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" rx="3"/>
  <text x="781" y="232" text-anchor="middle" font-size="11" font-weight="bold" fill="#334155">Forward Pass</text>
  <text x="666" y="252" font-size="10" fill="#475569">h = W₀ x + ΔW x</text>
  <text x="666" y="268" font-size="10" fill="#475569">ΔW = B A (rank r)</text>
  <text x="666" y="284" font-size="10" fill="#475569">B: zero init; A: random Gaussian</text>

  <rect x="656" y="306" width="250" height="70" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" rx="3"/>
  <text x="781" y="328" text-anchor="middle" font-size="11" font-weight="bold" fill="#334155">Training</text>
  <text x="666" y="348" font-size="10" fill="#475569">Only A, B updated; W₀ frozen</text>
  <text x="666" y="364" font-size="10" fill="#475569">Scale ΔW by α/r (α = first r tried)</text>

  <rect x="656" y="392" width="250" height="70" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" rx="3"/>
  <text x="781" y="414" text-anchor="middle" font-size="11" font-weight="bold" fill="#334155">Inference</text>
  <text x="666" y="434" font-size="10" fill="#475569">Merge ΔW into W₀: W' = W₀ + BA</text>
  <text x="666" y="450" font-size="10" fill="#475569">No extra latency vs. full fine-tune</text>

  <!-- 关键数值 -->
  <text x="656" y="486" font-size="12" font-weight="bold" fill="#334155">Key Numbers (GPT-3 175B)</text>
  <text x="666" y="506" font-size="11" fill="#475569">Trainable params: 10,000× reduction</text>
  <text x="666" y="524" font-size="11" fill="#475569">GPU memory: 1.2TB → 350GB</text>
  <text x="666" y="542" font-size="11" fill="#475569">Checkpoint: 350GB → 35MB (r=4, Wq+Wv)</text>
  <text x="666" y="560" font-size="11" fill="#475569">Training speedup: ~25%</text>

  <!-- 底部引用 -->
  <text x="781" y="600" text-anchor="middle" font-size="10" fill="#94a3b8">See Section 7.3 of the paper</text>
  <text x="781" y="616" text-anchor="middle" font-size="10" fill="#94a3b8">Hu et al. (2021)</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" width="960" height="680">
  <rect x="0" y="0" width="960" height="680" fill="#ffffff"/>
  
  <!-- 标题 -->
  <text x="480" y="36" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">LoRA Scaling Factor: &#945;/r</text>
  <line x1="200" y1="46" x2="760" y2="46" stroke="#cbd5e1" stroke-width="1"/>
  
  <!-- 核心公式面板（主视觉焦点） -->
  <rect x="60" y="70" width="840" height="120" rx="6" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="480" y="100" font-size="16" font-weight="bold" fill="#3730a3" text-anchor="middle">Core Definition: Scaled LoRA Output</text>
  <text x="480" y="140" font-size="28" font-weight="bold" fill="#1e293b" text-anchor="middle">h = W&#8320; x + (&#945; / r) &#215; &#916;W x</text>
  <text x="480" y="172" font-size="14" fill="#334155" text-anchor="middle">where &#916;W = B A, with A &#8712; &#8477;^(r&#215;d), B &#8712; &#8477;^(d&#215;r), rank r &#8810; d</text>
  
  <!-- 左侧：缩放因子机制拆解 -->
  <rect x="60" y="210" width="400" height="210" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="260" y="238" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">Scaling Mechanism</text>
  
  <!-- 公式推导 -->
  <text x="260" y="270" font-size="13" fill="#334155" text-anchor="middle">&#916;W x = B (A x)</text>
  <text x="260" y="296" font-size="13" fill="#334155" text-anchor="middle">scaled = (&#945; / r) &#215; &#916;W x</text>
  <text x="260" y="322" font-size="13" fill="#334155" text-anchor="middle">= (&#945; / r) &#215; B A x</text>
  
  <!-- 箭头：从公式到输出 -->
  <line x1="260" y1="330" x2="260" y2="350" stroke="#6366f1" stroke-width="1.5"/>
  <polygon points="254,348 260,358 266,348" fill="#6366f1"/>
  
  <text x="260" y="376" font-size="13" fill="#334155" text-anchor="middle">Final output: h = W&#8320; x + scaled</text>
  
  <!-- 右侧：α 与 r 的关系 -->
  <rect x="500" y="210" width="400" height="210" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="700" y="238" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">&#945; and r Relationship</text>
  
  <!-- 关键说明 -->
  <text x="700" y="270" font-size="13" fill="#334155" text-anchor="middle">&#945; is a constant (not learned)</text>
  <text x="700" y="296" font-size="13" fill="#334155" text-anchor="middle">With Adam, adjusting &#945; &#8776; adjusting learning rate</text>
  <text x="700" y="322" font-size="13" fill="#334155" text-anchor="middle">Paper sets &#945; = first-tried r (no extra tuning)</text>
  <text x="700" y="348" font-size="13" fill="#334155" text-anchor="middle">This avoids re-tuning for different r</text>
  
  <!-- 底部：不同 r 下的缩放示例（小表格） -->
  <rect x="60" y="440" width="840" height="220" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="480" y="468" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">Example: Effect of r on Scaling Factor (&#945; fixed = 8)</text>
  
  <!-- 表格头 -->
  <line x1="120" y1="482" x2="840" y2="482" stroke="#94a3b8" stroke-width="1"/>
  <text x="240" y="500" font-size="13" font-weight="bold" fill="#334155" text-anchor="middle">Rank r</text>
  <text x="480" y="500" font-size="13" font-weight="bold" fill="#334155" text-anchor="middle">Scaling Factor &#945;/r</text>
  <text x="720" y="500" font-size="13" font-weight="bold" fill="#334155" text-anchor="middle">Effective Update Magnitude</text>
  
  <line x1="120" y1="510" x2="840" y2="510" stroke="#cbd5e1" stroke-width="1"/>
  
  <!-- 行 1 -->
  <text x="240" y="536" font-size="13" fill="#1e293b" text-anchor="middle">r = 1</text>
  <text x="480" y="536" font-size="13" fill="#1e293b" text-anchor="middle">8 / 1 = 8.0</text>
  <text x="720" y="536" font-size="13" fill="#1e293b" text-anchor="middle">Large (strong adaptation)</text>
  
  <line x1="120" y1="546" x2="840" y2="546" stroke="#e2e8f0" stroke-width="1"/>
  
  <!-- 行 2 -->
  <text x="240" y="572" font-size="13" fill="#1e293b" text-anchor="middle">r = 4</text>
  <text x="480" y="572" font-size="13" fill="#1e293b" text-anchor="middle">8 / 4 = 2.0</text>
  <text x="720" y="572" font-size="13" fill="#1e293b" text-anchor="middle">Moderate</text>
  
  <line x1="120" y1="582" x2="840" y2="582" stroke="#e2e8f0" stroke-width="1"/>
  
  <!-- 行 3 -->
  <text x="240" y="608" font-size="13" fill="#1e293b" text-anchor="middle">r = 8</text>
  <text x="480" y="608" font-size="13" fill="#1e293b" text-anchor="middle">8 / 8 = 1.0</text>
  <text x="720" y="608" font-size="13" fill="#1e293b" text-anchor="middle">Neutral (&#945; = r)</text>
  
  <line x1="120" y1="618" x2="840" y2="618" stroke="#e2e8f0" stroke-width="1"/>
  
  <!-- 行 4 -->
  <text x="240" y="644" font-size="13" fill="#1e293b" text-anchor="middle">r = 16</text>
  <text x="480" y="644" font-size="13" fill="#1e293b" text-anchor="middle">8 / 16 = 0.5</text>
  <text x="720" y="644" font-size="13" fill="#1e293b" text-anchor="middle">Small (weaker adaptation)</text>
  
  <!-- 图例 -->
  <rect x="60" y="210" width="12" height="12" fill="#eef2ff" stroke="#6366f1" stroke-width="1"/>
  <text x="78" y="221" font-size="11" fill="#64748b">Core formula</text>
  
  <rect x="60" y="230" width="12" height="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="78" y="241" font-size="11" fill="#64748b">Mechanism panels</text>
  
  <rect x="60" y="250" width="12" height="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="78" y="261" font-size="11" fill="#64748b">Example table</text>
</svg>
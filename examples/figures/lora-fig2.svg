<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" width="960" height="680">
  <rect x="0" y="0" width="960" height="680" fill="#ffffff"/>

  <!-- 标题 -->
  <text x="480" y="36" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">LoRA: Low-Rank Adaptation — Understanding the Low-Rank Updates</text>
  <text x="480" y="58" font-size="13" fill="#64748b" text-anchor="middle">Comparing the adaptation matrix ΔW with the original weight matrix W</text>

  <!-- 左侧主面板：核心指标 -->
  <rect x="40" y="80" width="580" height="560" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="330" y="108" font-size="15" font-weight="bold" fill="#1e293b" text-anchor="middle">Core Metric: Projected Frobenius Norm</text>

  <!-- 公式框（强调色） -->
  <rect x="80" y="126" width="500" height="52" rx="4" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="330" y="150" font-size="18" font-weight="bold" fill="#3730a3" text-anchor="middle">&#8216;U<tspan baseline-shift="super" font-size="75%">&#8868;</tspan> W<tspan baseline-shift="sub" font-size="75%">q</tspan> V<tspan baseline-shift="super" font-size="75%">&#8868;</tspan>&#8217;<tspan baseline-shift="sub" font-size="75%">F</tspan></text>
  <text x="330" y="170" font-size="12" fill="#475569" text-anchor="middle">Projection of W<tspan baseline-shift="sub" font-size="75%">q</tspan> onto the subspace spanned by &#916;W<tspan baseline-shift="sub" font-size="75%">q</tspan></text>

  <!-- 说明行 -->
  <text x="330" y="210" font-size="13" fill="#334155" text-anchor="middle">Key finding: &#916;W amplifies directions already present in W, but not the top singular directions.</text>

  <!-- 二部图：W 与 ΔW 的奇异方向映射 -->
  <text x="330" y="248" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">Singular Direction Mapping (r = 4)</text>

  <!-- 左列：W 的奇异方向 -->
  <text x="160" y="278" font-size="12" fill="#475569" text-anchor="middle">W (pre-trained)</text>
  <rect x="100" y="290" width="120" height="28" rx="3" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="160" y="308" font-size="11" fill="#334155" text-anchor="middle">v<tspan baseline-shift="sub" font-size="75%">1</tspan> (top, large)</text>
  <rect x="100" y="324" width="120" height="28" rx="3" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="160" y="342" font-size="11" fill="#334155" text-anchor="middle">v<tspan baseline-shift="sub" font-size="75%">2</tspan> (large)</text>
  <rect x="100" y="358" width="120" height="28" rx="3" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="160" y="376" font-size="11" fill="#334155" text-anchor="middle">v<tspan baseline-shift="sub" font-size="75%">3</tspan> (medium)</text>
  <rect x="100" y="392" width="120" height="28" rx="3" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="160" y="410" font-size="11" fill="#334155" text-anchor="middle">v<tspan baseline-shift="sub" font-size="75%">4</tspan> (medium)</text>
  <rect x="100" y="426" width="120" height="28" rx="3" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="160" y="444" font-size="11" fill="#334155" text-anchor="middle">v<tspan baseline-shift="sub" font-size="75%">5</tspan> (small)</text>
  <rect x="100" y="460" width="120" height="28" rx="3" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="160" y="478" font-size="11" fill="#334155" text-anchor="middle">v<tspan baseline-shift="sub" font-size="75%">6</tspan> (small)</text>

  <!-- 右列：ΔW 的奇异方向 -->
  <text x="500" y="278" font-size="12" fill="#475569" text-anchor="middle">&#916;W (LoRA, r=4)</text>
  <rect x="440" y="290" width="120" height="28" rx="3" fill="#eef2ff" stroke="#6366f1" stroke-width="1.2"/>
  <text x="500" y="308" font-size="11" fill="#3730a3" text-anchor="middle">u<tspan baseline-shift="sub" font-size="75%">1</tspan> (amplified)</text>
  <rect x="440" y="324" width="120" height="28" rx="3" fill="#eef2ff" stroke="#6366f1" stroke-width="1.2"/>
  <text x="500" y="342" font-size="11" fill="#3730a3" text-anchor="middle">u<tspan baseline-shift="sub" font-size="75%">2</tspan> (amplified)</text>
  <rect x="440" y="358" width="120" height="28" rx="3" fill="#eef2ff" stroke="#6366f1" stroke-width="1.2"/>
  <text x="500" y="376" font-size="11" fill="#3730a3" text-anchor="middle">u<tspan baseline-shift="sub" font-size="75%">3</tspan> (amplified)</text>
  <rect x="440" y="392" width="120" height="28" rx="3" fill="#eef2ff" stroke="#6366f1" stroke-width="1.2"/>
  <text x="500" y="410" font-size="11" fill="#3730a3" text-anchor="middle">u<tspan baseline-shift="sub" font-size="75%">4</tspan> (amplified)</text>

  <!-- 连边：从 W 的 v3-v6 到 ΔW 的 u1-u4 -->
  <!-- 实线：被放大的方向 -->
  <line x1="220" y1="372" x2="440" y2="304" stroke="#6366f1" stroke-width="1.8"/>
  <polygon points="440,304 432,298 434,310" fill="#6366f1"/>
  <line x1="220" y1="386" x2="440" y2="338" stroke="#6366f1" stroke-width="1.8"/>
  <polygon points="440,338 432,332 434,344" fill="#6366f1"/>
  <line x1="220" y1="440" x2="440" y2="372" stroke="#6366f1" stroke-width="1.8"/>
  <polygon points="440,372 432,366 434,378" fill="#6366f1"/>
  <line x1="220" y1="474" x2="440" y2="406" stroke="#6366f1" stroke-width="1.8"/>
  <polygon points="440,406 432,400 434,412" fill="#6366f1"/>

  <!-- 虚线：未被放大的方向 -->
  <line x1="220" y1="304" x2="440" y2="304" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5,4"/>
  <line x1="220" y1="338" x2="440" y2="338" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5,4"/>

  <!-- 放大因子标注 -->
  <text x="330" y="520" font-size="12" fill="#334155" text-anchor="middle">Amplification factor: ~21.5&#215; (for r=4)</text>
  <text x="330" y="540" font-size="11" fill="#64748b" text-anchor="middle">&#916;W does not repeat top singular directions of W, but strengthens weaker ones.</text>

  <!-- 右侧面板：图例与说明 -->
  <rect x="640" y="80" width="280" height="560" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="780" y="108" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">Legend &amp; Details</text>

  <!-- 图例 -->
  <text x="780" y="140" font-size="12" font-weight="bold" fill="#334155" text-anchor="middle">Arrow Types</text>
  <line x1="680" y1="162" x2="740" y2="162" stroke="#6366f1" stroke-width="1.8"/>
  <polygon points="740,162 732,156 734,168" fill="#6366f1"/>
  <text x="755" y="166" font-size="11" fill="#475569">Amplified mapping</text>
  <line x1="680" y1="188" x2="740" y2="188" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5,4"/>
  <text x="755" y="192" font-size="11" fill="#475569">Not amplified</text>

  <!-- 关键数值 -->
  <text x="780" y="230" font-size="12" font-weight="bold" fill="#334155" text-anchor="middle">Key Numbers</text>
  <rect x="670" y="244" width="220" height="24" rx="3" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="780" y="260" font-size="11" fill="#334155" text-anchor="middle">&#916;W rank r = 4 (in this example)</text>
  <rect x="670" y="274" width="220" height="24" rx="3" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="780" y="290" font-size="11" fill="#334155" text-anchor="middle">Amplification factor: ~21.5&#215;</text>
  <rect x="670" y="304" width="220" height="24" rx="3" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="780" y="320" font-size="11" fill="#334155" text-anchor="middle">&#916;W correlates with W more than random</text>

  <!-- 公式说明 -->
  <text x="780" y="360" font-size="12" font-weight="bold" fill="#334155" text-anchor="middle">Metric Definition</text>
  <rect x="670" y="374" width="220" height="60" rx="3" fill="#eef2ff" stroke="#6366f1" stroke-width="1"/>
  <text x="780" y="394" font-size="12" fill="#3730a3" text-anchor="middle">&#8216;U<tspan baseline-shift="super" font-size="75%">&#8868;</tspan> W<tspan baseline-shift="sub" font-size="75%">q</tspan> V<tspan baseline-shift="super" font-size="75%">&#8868;</tspan>&#8217;<tspan baseline-shift="sub" font-size="75%">F</tspan></text>
  <text x="780" y="414" font-size="10" fill="#475569" text-anchor="middle">U, V: left/right singular vectors of &#916;W<tspan baseline-shift="sub" font-size="75%">q</tspan></text>
  <text x="780" y="428" font-size="10" fill="#475569" text-anchor="middle">Measures projection of W onto &#916;W subspace</text>

  <!-- 结论 -->
  <text x="780" y="470" font-size="12" font-weight="bold" fill="#334155" text-anchor="middle">Interpretation</text>
  <text x="780" y="494" font-size="11" fill="#334155" text-anchor="middle">&#916;W amplifies features already present</text>
  <text x="780" y="512" font-size="11" fill="#334155" text-anchor="middle">in W, but not the dominant ones.</text>
  <text x="780" y="536" font-size="11" fill="#334155" text-anchor="middle">It strengthens weaker directions</text>
  <text x="780" y="554" font-size="11" fill="#334155" text-anchor="middle">with a large amplification factor.</text>
  <text x="780" y="578" font-size="11" fill="#64748b" text-anchor="middle">This explains why low-rank adaptation</text>
  <text x="780" y="596" font-size="11" fill="#64748b" text-anchor="middle">can be effective even with small r.</text>

  <!-- 底部引用 -->
  <text x="480" y="660" font-size="10" fill="#94a3b8" text-anchor="middle">Based on Section 7.3 of LoRA paper (Hu et al., 2021)</text>
</svg>
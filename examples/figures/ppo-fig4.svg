<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" width="960" height="680">
  <rect x="0" y="0" width="960" height="680" fill="#ffffff"/>

  <!-- 标题 -->
  <text x="480" y="36" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">Proximal Policy Optimization (PPO) — Actor-Critic with Multiple Epochs &amp; Minibatches</text>

  <!-- ===== 主流程：纵向三阶段 ===== -->
  <!-- 阶段1：数据收集 -->
  <rect x="60" y="60" width="840" height="130" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="80" y="84" font-size="13" font-weight="bold" fill="#334155">Stage 1: Data Collection</text>

  <!-- N个actor -->
  <text x="120" y="112" font-size="12" fill="#475569" text-anchor="middle">Actor 1</text>
  <rect x="90" y="118" width="60" height="24" rx="3" fill="#eef2ff" stroke="#6366f1" stroke-width="1.2"/>
  <text x="120" y="134" font-size="11" fill="#3730a3" text-anchor="middle">π_θ</text>

  <text x="220" y="112" font-size="12" fill="#475569" text-anchor="middle">Actor 2</text>
  <rect x="190" y="118" width="60" height="24" rx="3" fill="#eef2ff" stroke="#6366f1" stroke-width="1.2"/>
  <text x="220" y="134" font-size="11" fill="#3730a3" text-anchor="middle">π_θ</text>

  <text x="320" y="112" font-size="12" fill="#475569" text-anchor="middle">…</text>

  <text x="400" y="112" font-size="12" fill="#475569" text-anchor="middle">Actor N</text>
  <rect x="370" y="118" width="60" height="24" rx="3" fill="#eef2ff" stroke="#6366f1" stroke-width="1.2"/>
  <text x="400" y="134" font-size="11" fill="#3730a3" text-anchor="middle">π_θ</text>

  <!-- 每个actor收集T步 -->
  <text x="120" y="168" font-size="11" fill="#64748b" text-anchor="middle">T steps</text>
  <text x="220" y="168" font-size="11" fill="#64748b" text-anchor="middle">T steps</text>
  <text x="400" y="168" font-size="11" fill="#64748b" text-anchor="middle">T steps</text>

  <!-- 箭头：actor → 数据池 -->
  <line x1="120" y1="142" x2="120" y2="155" stroke="#6366f1" stroke-width="1.5"/>
  <polygon points="116,153 120,160 124,153" fill="#6366f1"/>
  <line x1="220" y1="142" x2="220" y2="155" stroke="#6366f1" stroke-width="1.5"/>
  <polygon points="216,153 220,160 224,153" fill="#6366f1"/>
  <line x1="400" y1="142" x2="400" y2="155" stroke="#6366f1" stroke-width="1.5"/>
  <polygon points="396,153 400,160 404,153" fill="#6366f1"/>

  <!-- 数据池 -->
  <rect x="520" y="80" width="160" height="90" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="600" y="104" font-size="13" font-weight="bold" fill="#334155" text-anchor="middle">Data Buffer</text>
  <text x="600" y="126" font-size="11" fill="#475569" text-anchor="middle">N × T transitions</text>
  <text x="600" y="146" font-size="11" fill="#475569" text-anchor="middle">(s_t, a_t, r_t, s_{t+1})</text>
  <text x="600" y="164" font-size="11" fill="#475569" text-anchor="middle">Advantage Â_t</text>

  <!-- 箭头：数据池 → 阶段2 -->
  <line x1="680" y1="125" x2="720" y2="125" stroke="#6366f1" stroke-width="1.5"/>
  <polygon points="718,121 726,125 718,129" fill="#6366f1"/>

  <!-- 阶段2：替代损失优化 -->
  <rect x="60" y="210" width="840" height="200" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="80" y="234" font-size="13" font-weight="bold" fill="#334155">Stage 2: Surrogate Objective Optimization (K Epochs, Minibatch SGD)</text>

  <!-- 核心公式框（视觉焦点） -->
  <rect x="80" y="250" width="400" height="140" rx="4" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="280" y="274" font-size="14" font-weight="bold" fill="#3730a3" text-anchor="middle">Clipped Surrogate Objective</text>
  <text x="280" y="302" font-size="16" fill="#1e293b" text-anchor="middle">L^{CLIP}(θ) = Ê_t [ min( r_t(θ) Â_t,</text>
  <text x="280" y="326" font-size="16" fill="#1e293b" text-anchor="middle">clip(r_t(θ), 1−ε, 1+ε) Â_t ) ]</text>
  <text x="280" y="352" font-size="13" fill="#475569" text-anchor="middle">where r_t(θ) = π_θ(a_t|s_t) / π_{θ_old}(a_t|s_t)</text>
  <text x="280" y="374" font-size="12" fill="#64748b" text-anchor="middle">ε = 0.2 (default clipping range)</text>

  <!-- 右侧：minibatch SGD 说明 -->
  <rect x="510" y="250" width="370" height="140" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="695" y="274" font-size="13" font-weight="bold" fill="#334155" text-anchor="middle">Minibatch SGD (Adam)</text>

  <text x="530" y="300" font-size="12" fill="#475569">For each epoch k = 1…K:</text>
  <text x="530" y="322" font-size="12" fill="#475569">• Shuffle N×T samples</text>
  <text x="530" y="344" font-size="12" fill="#475569">• Split into minibatches of size M</text>
  <text x="530" y="366" font-size="12" fill="#475569">• θ ← θ + α ∇_θ L^{CLIP}(θ)</text>

  <!-- 箭头：阶段2 → 阶段3 -->
  <line x1="480" y1="410" x2="480" y2="440" stroke="#6366f1" stroke-width="1.5"/>
  <polygon points="476,438 480,446 484,438" fill="#6366f1"/>

  <!-- 阶段3：更新策略 -->
  <rect x="60" y="450" width="840" height="100" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="80" y="474" font-size="13" font-weight="bold" fill="#334155">Stage 3: Policy Update &amp; Repeat</text>

  <rect x="100" y="490" width="200" height="40" rx="4" fill="#eef2ff" stroke="#6366f1" stroke-width="1.2"/>
  <text x="200" y="514" font-size="13" fill="#3730a3" text-anchor="middle">θ_old ← θ</text>

  <text x="340" y="514" font-size="13" fill="#475569" text-anchor="middle">→ 回到 Stage 1 继续迭代</text>

  <!-- ===== 右侧图例面板 ===== -->
  <rect x="740" y="60" width="180" height="180" rx="4" fill="#fbfcfe" stroke="#e2e8f0" stroke-width="1"/>
  <text x="830" y="82" font-size="12" font-weight="bold" fill="#334155" text-anchor="middle">Legend</text>

  <line x1="755" y1="100" x2="795" y2="100" stroke="#6366f1" stroke-width="1.5"/>
  <polygon points="793,96 800,100 793,104" fill="#6366f1"/>
  <text x="810" y="104" font-size="11" fill="#475569">Data flow</text>

  <line x1="755" y1="124" x2="795" y2="124" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5,4"/>
  <polygon points="793,120 800,124 793,128" fill="#94a3b8"/>
  <text x="810" y="128" font-size="11" fill="#475569">Reference / old policy</text>

  <rect x="755" y="142" width="40" height="16" rx="2" fill="#eef2ff" stroke="#6366f1" stroke-width="1.2"/>
  <text x="810" y="156" font-size="11" fill="#475569">Key component</text>

  <rect x="755" y="170" width="40" height="16" rx="2" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="810" y="184" font-size="11" fill="#475569">Supporting info</text>

  <!-- ===== 底部说明 ===== -->
  <rect x="60" y="570" width="840" height="90" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="80" y="594" font-size="12" font-weight="bold" fill="#334155">Key Design Choices</text>
  <text x="80" y="616" font-size="11" fill="#475569">• Multiple epochs (K) on same data: improves sample efficiency vs. vanilla policy gradient (one update per sample).</text>
  <text x="80" y="636" font-size="11" fill="#475569">• Clipping (ε=0.2): prevents destructively large policy updates; forms a pessimistic lower bound on performance.</text>
  <text x="80" y="656" font-size="11" fill="#475569">• Parallel actors (N) + fixed-length segments (T): balances exploration and computational efficiency.</text>
</svg>
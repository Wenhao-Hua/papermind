<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" width="960" height="640">
  <rect x="0" y="0" width="960" height="640" fill="#ffffff"/>

  <!-- 标题 -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1e293b" text-anchor="middle">Adaptive KL Penalty Coefficient (PPO)</text>

  <!-- 核心公式框（强调色） -->
  <rect x="60" y="56" width="840" height="80" rx="4" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="480" y="80" font-size="15" fill="#3730a3" text-anchor="middle" font-weight="bold">L<tspan baseline-shift="super" font-size="75%">KLPEN</tspan>(θ) = &#8477;<tspan baseline-shift="sub" font-size="75%">t</tspan>[ r<tspan baseline-shift="sub" font-size="75%">t</tspan>(θ) &#183; Â<tspan baseline-shift="sub" font-size="75%">t</tspan> − β · KL[π<tspan baseline-shift="sub" font-size="75%">θ<tspan baseline-shift="sub" font-size="75%">old</tspan></tspan>(·|s<tspan baseline-shift="sub" font-size="75%">t</tspan>), π<tspan baseline-shift="sub" font-size="75%">θ</tspan>(·|s<tspan baseline-shift="sub" font-size="75%">t</tspan>)] ]</text>
  <text x="480" y="108" font-size="13" fill="#64748b" text-anchor="middle">where r<tspan baseline-shift="sub" font-size="75%">t</tspan>(θ) = π<tspan baseline-shift="sub" font-size="75%">θ</tspan>(a<tspan baseline-shift="sub" font-size="75%">t</tspan>|s<tspan baseline-shift="sub" font-size="75%">t</tspan>) / π<tspan baseline-shift="sub" font-size="75%">θ<tspan baseline-shift="sub" font-size="75%">old</tspan></tspan>(a<tspan baseline-shift="sub" font-size="75%">t</tspan>|s<tspan baseline-shift="sub" font-size="75%">t</tspan>)</text>

  <!-- 左侧：自适应调节机制 -->
  <rect x="60" y="156" width="400" height="200" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="260" y="180" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">Adaptive β Adjustment</text>

  <!-- 调节规则 -->
  <text x="80" y="210" font-size="13" fill="#334155">After each update, compute actual KL divergence d:</text>
  <text x="80" y="232" font-size="13" fill="#334155">d = KL[π<tspan baseline-shift="sub" font-size="75%">θ<tspan baseline-shift="sub" font-size="75%">old</tspan></tspan>(·|s), π<tspan baseline-shift="sub" font-size="75%">θ</tspan>(·|s)]</text>

  <line x1="80" y1="248" x2="440" y2="248" stroke="#e2e8f0" stroke-width="1"/>

  <text x="80" y="270" font-size="13" fill="#334155">If d &lt; d<tspan baseline-shift="sub" font-size="75%">targ</tspan> / 1.5 : β ← β / 2</text>
  <text x="80" y="292" font-size="13" fill="#334155">If d &gt; d<tspan baseline-shift="sub" font-size="75%">targ</tspan> &#215; 1.5 : β ← β &#215; 2</text>
  <text x="80" y="314" font-size="13" fill="#334155">Otherwise : β unchanged</text>

  <text x="80" y="340" font-size="12" fill="#64748b">Goal: keep KL divergence around d<tspan baseline-shift="sub" font-size="75%">targ</tspan></text>

  <!-- 右侧：KL 散度与 β 的关系示意（二部图风格） -->
  <rect x="500" y="156" width="400" height="200" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="700" y="180" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">KL Divergence &amp; β Dynamics</text>

  <!-- 两列节点 -->
  <!-- 左列：KL 状态 -->
  <circle cx="560" cy="220" r="18" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="560" y="225" font-size="11" fill="#3730a3" text-anchor="middle">d &lt; d<tspan baseline-shift="sub" font-size="75%">targ</tspan></text>

  <circle cx="560" cy="280" r="18" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="560" y="285" font-size="11" fill="#3730a3" text-anchor="middle">d &gt; d<tspan baseline-shift="sub" font-size="75%">targ</tspan></text>

  <!-- 右列：β 动作 -->
  <circle cx="740" cy="220" r="18" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="740" y="225" font-size="11" fill="#1e293b" text-anchor="middle">β / 2</text>

  <circle cx="740" cy="280" r="18" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="740" y="285" font-size="11" fill="#1e293b" text-anchor="middle">β &#215; 2</text>

  <!-- 箭头 -->
  <polygon points="578,218 598,220 578,222" fill="#6366f1"/>
  <line x1="578" y1="220" x2="718" y2="220" stroke="#6366f1" stroke-width="1.5"/>
  <polygon points="718,218 738,220 718,222" fill="#6366f1"/>

  <polygon points="578,278 598,280 578,282" fill="#6366f1"/>
  <line x1="578" y1="280" x2="718" y2="280" stroke="#6366f1" stroke-width="1.5"/>
  <polygon points="718,278 738,280 718,282" fill="#6366f1"/>

  <!-- 底部：算法流程 -->
  <rect x="60" y="376" width="840" height="120" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="480" y="400" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">Algorithm Flow (per iteration)</text>

  <!-- 流程步骤 -->
  <rect x="80" y="416" width="160" height="40" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="160" y="441" font-size="12" fill="#334155" text-anchor="middle">Sample trajectories</text>

  <polygon points="240,434 254,436 240,438" fill="#94a3b8"/>
  <line x1="240" y1="436" x2="270" y2="436" stroke="#94a3b8" stroke-width="1.5"/>
  <polygon points="270,434 284,436 270,438" fill="#94a3b8"/>

  <rect x="284" y="416" width="160" height="40" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="364" y="441" font-size="12" fill="#334155" text-anchor="middle">Compute L<tspan baseline-shift="super" font-size="75%">KLPEN</tspan> &amp; d</text>

  <polygon points="444,434 458,436 444,438" fill="#94a3b8"/>
  <line x1="444" y1="436" x2="474" y2="436" stroke="#94a3b8" stroke-width="1.5"/>
  <polygon points="474,434 488,436 474,438" fill="#94a3b8"/>

  <rect x="488" y="416" width="160" height="40" rx="4" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="568" y="441" font-size="12" fill="#3730a3" text-anchor="middle">Adjust β adaptively</text>

  <polygon points="648,434 662,436 648,438" fill="#94a3b8"/>
  <line x1="648" y1="436" x2="678" y2="436" stroke="#94a3b8" stroke-width="1.5"/>
  <polygon points="678,434 692,436 678,438" fill="#94a3b8"/>

  <rect x="692" y="416" width="160" height="40" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="772" y="441" font-size="12" fill="#334155" text-anchor="middle">Update θ via SGD</text>

  <!-- 循环箭头 -->
  <path d="M772,456 L772,480 L160,480 L160,456" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,4"/>
  <polygon points="160,454 156,480 164,480" fill="#94a3b8"/>
  <text x="466" y="496" font-size="11" fill="#64748b" text-anchor="middle">Repeat for multiple epochs</text>

  <!-- 图例 -->
  <rect x="60" y="520" width="840" height="40" rx="4" fill="#fbfcfe" stroke="#e2e8f0" stroke-width="1"/>
  <text x="80" y="546" font-size="12" fill="#64748b">Legend:</text>
  <line x1="140" y1="542" x2="180" y2="542" stroke="#6366f1" stroke-width="1.5"/>
  <polygon points="180,540 190,542 180,544" fill="#6366f1"/>
  <text x="195" y="546" font-size="11" fill="#64748b">Forward / data flow</text>
  <line x1="340" y1="542" x2="380" y2="542" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,4"/>
  <polygon points="380,540 390,542 380,544" fill="#94a3b8"/>
  <text x="395" y="546" font-size="11" fill="#64748b">Loop / repeat</text>
  <rect x="530" y="534" width="14" height="14" rx="2" fill="#eef2ff" stroke="#6366f1" stroke-width="1"/>
  <text x="550" y="546" font-size="11" fill="#64748b">Core component</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" width="960" height="680">
  <rect x="0" y="0" width="960" height="680" fill="#ffffff"/>

  <!-- 标题 -->
  <text x="480" y="36" font-size="20" font-weight="700" fill="#1e293b" text-anchor="middle">Adaptive KL Penalty Coefficient (PPO with KL Penalty)</text>
  <line x1="160" y1="48" x2="800" y2="48" stroke="#cbd5e1" stroke-width="1"/>

  <!-- 核心公式框（视觉焦点） -->
  <rect x="80" y="68" width="800" height="100" rx="6" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="480" y="96" font-size="15" font-weight="600" fill="#3730a3" text-anchor="middle">Surrogate Objective with KL Penalty</text>
  <text x="480" y="130" font-size="18" font-weight="700" fill="#1e293b" text-anchor="middle">L&lt;tspan baseline-shift="super" font-size="75%">KLPEN&lt;/tspan&gt;(&amp;theta;) = &amp;#x1D0C;&lt;tspan baseline-shift="sub" font-size="75%">t&lt;/tspan&gt;[ r&lt;tspan baseline-shift="sub" font-size="75%">t&lt;/tspan&gt;(&amp;theta;) &amp;#x1D0C;&lt;tspan baseline-shift="sub" font-size="75%">t&lt;/tspan&gt; &amp;#x2212; &amp;beta; &amp;#x00B7; KL[ &amp;pi;&lt;tspan baseline-shift="sub" font-size="75%">&amp;theta;&lt;tspan baseline-shift="sub" font-size="75%">old&lt;/tspan&gt;&lt;/tspan&gt; , &amp;pi;&lt;tspan baseline-shift="sub" font-size="75%">&amp;theta;&lt;/tspan&gt; ] ]</text>
  <text x="480" y="158" font-size="13" fill="#64748b" text-anchor="middle">where r&lt;tspan baseline-shift="sub" font-size="75%">t&lt;/tspan&gt;(&amp;theta;) = &amp;pi;&lt;tspan baseline-shift="sub" font-size="75%">&amp;theta;&lt;/tspan&gt;(a&lt;tspan baseline-shift="sub" font-size="75%">t&lt;/tspan&gt;|s&lt;tspan baseline-shift="sub" font-size="75%">t&lt;/tspan&gt;) / &amp;pi;&lt;tspan baseline-shift="sub" font-size="75%">&amp;theta;&lt;tspan baseline-shift="sub" font-size="75%">old&lt;/tspan&gt;&lt;/tspan&gt;(a&lt;tspan baseline-shift="sub" font-size="75%">t&lt;/tspan&gt;|s&lt;tspan baseline-shift="sub" font-size="75%">t&lt;/tspan&gt;)</text>

  <!-- 自适应调节流程 -->
  <rect x="80" y="196" width="800" height="220" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="480" y="220" font-size="14" font-weight="600" fill="#334155" text-anchor="middle">Adaptive &amp;beta; Adjustment Rule</text>

  <!-- 三个步骤框 -->
  <rect x="120" y="240" width="200" height="60" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="220" y="266" font-size="13" font-weight="600" fill="#1e293b" text-anchor="middle">Compute KL divergence</text>
  <text x="220" y="286" font-size="12" fill="#475569" text-anchor="middle">d = KL[&amp;pi;&lt;tspan baseline-shift="sub" font-size="75%">&amp;theta;&lt;tspan baseline-shift="sub" font-size="75%">old&lt;/tspan&gt;&lt;/tspan&gt; , &amp;pi;&lt;tspan baseline-shift="sub" font-size="75%">&amp;theta;&lt;/tspan&gt;]</text>

  <rect x="380" y="240" width="200" height="60" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="480" y="266" font-size="13" font-weight="600" fill="#1e293b" text-anchor="middle">Compare with target d&lt;tspan baseline-shift="sub" font-size="75%">targ&lt;/tspan&gt;</text>
  <text x="480" y="286" font-size="12" fill="#475569" text-anchor="middle">d vs. d&lt;tspan baseline-shift="sub" font-size="75%">targ&lt;/tspan&gt;</text>

  <rect x="640" y="240" width="200" height="60" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="740" y="266" font-size="13" font-weight="600" fill="#1e293b" text-anchor="middle">Update &amp;beta;</text>
  <text x="740" y="286" font-size="12" fill="#475569" text-anchor="middle">&amp;beta; &amp;#x2190; &amp;beta; / 2  or  &amp;beta; &amp;#x2190; &amp;beta; &amp;#x00D7; 2</text>

  <!-- 箭头 -->
  <line x1="320" y1="270" x2="378" y2="270" stroke="#6366f1" stroke-width="1.5"/>
  <polygon points="378,266 388,270 378,274" fill="#6366f1"/>
  <line x1="580" y1="270" x2="638" y2="270" stroke="#6366f1" stroke-width="1.5"/>
  <polygon points="638,266 648,270 638,274" fill="#6366f1"/>

  <!-- 条件分支 -->
  <text x="480" y="330" font-size="12" fill="#64748b" text-anchor="middle">If d &lt; d&lt;tspan baseline-shift="sub" font-size="75%">targ&lt;/tspan&gt; / 1.5 : &amp;beta; &amp;#x2190; &amp;beta; / 2</text>
  <text x="480" y="350" font-size="12" fill="#64748b" text-anchor="middle">If d &gt; d&lt;tspan baseline-shift="sub" font-size="75%">targ&lt;/tspan&gt; &amp;#x00D7; 1.5 : &amp;beta; &amp;#x2190; &amp;beta; &amp;#x00D7; 2</text>
  <text x="480" y="370" font-size="12" fill="#64748b" text-anchor="middle">Otherwise : keep &amp;beta; unchanged</text>

  <!-- 右侧图例面板 -->
  <rect x="740" y="196" width="140" height="220" rx="4" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="810" y="218" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">Legend</text>
  <line x1="755" y1="240" x2="785" y2="240" stroke="#6366f1" stroke-width="1.5"/>
  <polygon points="785,237 792,240 785,243" fill="#6366f1"/>
  <text x="800" y="244" font-size="11" fill="#475569">Flow / update</text>
  <text x="810" y="270" font-size="11" fill="#475569" text-anchor="middle">d&lt;tspan baseline-shift="sub" font-size="75%">targ&lt;/tspan&gt; : target KL</text>
  <text x="810" y="290" font-size="11" fill="#475569" text-anchor="middle">&amp;beta; : penalty coeff.</text>
  <text x="810" y="310" font-size="11" fill="#475569" text-anchor="middle">KL : divergence</text>

  <!-- 底部说明 -->
  <rect x="80" y="440" width="800" height="100" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="480" y="466" font-size="13" font-weight="600" fill="#334155" text-anchor="middle">Key Idea: Keep KL divergence near target by adapting penalty coefficient</text>
  <text x="480" y="490" font-size="12" fill="#475569" text-anchor="middle">After each policy update, compute actual KL divergence d between old and new policy.</text>
  <text x="480" y="510" font-size="12" fill="#475569" text-anchor="middle">If d is too small (d &lt; d&lt;tspan baseline-shift="sub" font-size="75%">targ&lt;/tspan&gt;/1.5), reduce &amp;beta; to allow larger updates.</text>
  <text x="480" y="530" font-size="12" fill="#475569" text-anchor="middle">If d is too large (d &gt; d&lt;tspan baseline-shift="sub" font-size="75%">targ&lt;/tspan&gt;&amp;#x00D7;1.5), increase &amp;beta; to penalize divergence more.</text>

  <!-- 底部引用 -->
  <text x="480" y="660" font-size="11" fill="#94a3b8" text-anchor="middle">Schulman et al., 2017 — Proximal Policy Optimization Algorithms</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" width="960" height="680">
  <rect x="0" y="0" width="960" height="680" fill="#ffffff"/>

  <!-- 标题 -->
  <text x="480" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">LoRA: 低秩适配 — 无额外推理延迟的部署</text>
  <line x1="200" y1="48" x2="760" y2="48" stroke="#cbd5e1" stroke-width="1"/>

  <!-- 核心公式框（视觉焦点） -->
  <rect x="280" y="68" width="400" height="60" rx="6" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="480" y="96" text-anchor="middle" font-size="22" font-weight="bold" fill="#3730a3">W = W₀ + B A</text>
  <text x="480" y="118" text-anchor="middle" font-size="13" fill="#475569">预训练权重 W₀ 冻结，仅训练低秩矩阵 B ∈ ℝ^(d×r) 与 A ∈ ℝ^(r×d)</text>

  <!-- 左侧：训练时结构 -->
  <rect x="40" y="150" width="420" height="280" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="250" y="176" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">训练时：注入低秩矩阵</text>

  <!-- 预训练权重 W₀ 框 -->
  <rect x="80" y="200" width="160" height="60" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="160" y="226" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">W₀</text>
  <text x="160" y="246" text-anchor="middle" font-size="11" fill="#64748b">d × d（冻结）</text>

  <!-- 右侧：B 和 A 矩阵 -->
  <rect x="280" y="200" width="60" height="60" rx="4" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="310" y="226" text-anchor="middle" font-size="14" font-weight="bold" fill="#3730a3">B</text>
  <text x="310" y="246" text-anchor="middle" font-size="11" fill="#6366f1">d×r</text>

  <rect x="360" y="200" width="60" height="60" rx="4" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="390" y="226" text-anchor="middle" font-size="14" font-weight="bold" fill="#3730a3">A</text>
  <text x="390" y="246" text-anchor="middle" font-size="11" fill="#6366f1">r×d</text>

  <!-- 箭头：W₀ → 输出 -->
  <line x1="240" y1="230" x2="280" y2="230" stroke="#475569" stroke-width="1.5"/>
  <polygon points="278,225 288,230 278,235" fill="#475569"/>

  <!-- 箭头：B → 输出 -->
  <line x1="340" y1="230" x2="360" y2="230" stroke="#6366f1" stroke-width="1.5"/>
  <polygon points="358,225 368,230 358,235" fill="#6366f1"/>

  <!-- 输出框 -->
  <rect x="80" y="290" width="340" height="50" rx="4" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="250" y="316" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">h = W₀ x + B A x</text>
  <text x="250" y="332" text-anchor="middle" font-size="11" fill="#64748b">前向传播：预训练输出 + 低秩适配增量</text>

  <!-- 箭头：W₀ 到输出 -->
  <line x1="160" y1="260" x2="160" y2="290" stroke="#475569" stroke-width="1.5"/>
  <polygon points="155,288 160,298 165,288" fill="#475569"/>

  <!-- 箭头：B A 到输出 -->
  <line x1="390" y1="260" x2="390" y2="290" stroke="#6366f1" stroke-width="1.5"/>
  <polygon points="385,288 390,298 395,288" fill="#6366f1"/>

  <!-- 右侧：部署时结构 -->
  <rect x="500" y="150" width="420" height="280" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="710" y="176" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">部署时：合并为单一权重矩阵</text>

  <!-- 合并后的权重 -->
  <rect x="560" y="210" width="200" height="60" rx="4" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="660" y="236" text-anchor="middle" font-size="16" font-weight="bold" fill="#3730a3">W = W₀ + B A</text>
  <text x="660" y="256" text-anchor="middle" font-size="11" fill="#64748b">d × d（一次性合并）</text>

  <!-- 推理 -->
  <rect x="560" y="300" width="200" height="50" rx="4" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="660" y="326" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">推理：h = W x</text>
  <text x="660" y="342" text-anchor="middle" font-size="11" fill="#64748b">与标准模型完全相同，零额外延迟</text>

  <!-- 箭头：合并权重 → 推理 -->
  <line x1="660" y1="270" x2="660" y2="300" stroke="#475569" stroke-width="1.5"/>
  <polygon points="655,298 660,308 665,298" fill="#475569"/>

  <!-- 任务切换说明 -->
  <rect x="500" y="450" width="420" height="100" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="710" y="476" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">任务切换：零额外开销</text>
  <text x="710" y="500" text-anchor="middle" font-size="12" fill="#475569">切换下游任务时，仅需更新 B A 部分：</text>
  <text x="710" y="524" text-anchor="middle" font-size="13" fill="#3730a3">W ← W − B_old A_old + B_new A_new</text>
  <text x="710" y="542" text-anchor="middle" font-size="11" fill="#64748b">无需重新加载预训练权重，仅交换低秩矩阵</text>

  <!-- 左侧：低秩分解示意图 -->
  <rect x="40" y="450" width="420" height="100" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="250" y="476" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">低秩分解（r ≪ d）</text>

  <!-- 小矩阵可视化 -->
  <rect x="60" y="490" width="80" height="40" rx="2" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="100" y="514" text-anchor="middle" font-size="11" fill="#475569">ΔW (d×d)</text>

  <text x="150" y="514" text-anchor="middle" font-size="14" fill="#475569">≈</text>

  <rect x="170" y="490" width="40" height="40" rx="2" fill="#eef2ff" stroke="#6366f1" stroke-width="1"/>
  <text x="190" y="514" text-anchor="middle" font-size="10" fill="#3730a3">B</text>
  <text x="190" y="526" text-anchor="middle" font-size="9" fill="#6366f1">d×r</text>

  <text x="220" y="514" text-anchor="middle" font-size="14" fill="#475569">×</text>

  <rect x="240" y="490" width="40" height="40" rx="2" fill="#eef2ff" stroke="#6366f1" stroke-width="1"/>
  <text x="260" y="514" text-anchor="middle" font-size="10" fill="#3730a3">A</text>
  <text x="260" y="526" text-anchor="middle" font-size="9" fill="#6366f1">r×d</text>

  <text x="300" y="514" text-anchor="middle" font-size="11" fill="#64748b">参数量: 2rd ≪ d²</text>

  <!-- 图例 -->
  <rect x="40" y="570" width="880" height="90" rx="4" fill="#fbfcfe" stroke="#e2e8f0" stroke-width="1"/>
  <text x="480" y="596" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">图例</text>

  <!-- 图例项 -->
  <line x1="80" y1="620" x2="130" y2="620" stroke="#475569" stroke-width="1.5"/>
  <polygon points="128,615 138,620 128,625" fill="#475569"/>
  <text x="148" y="624" text-anchor="start" font-size="11" fill="#475569">前向数据流</text>

  <line x1="280" y1="620" x2="330" y2="620" stroke="#6366f1" stroke-width="1.5"/>
  <polygon points="328,615 338,620 328,625" fill="#6366f1"/>
  <text x="348" y="624" text-anchor="start" font-size="11" fill="#6366f1">低秩适配路径（可训练）</text>

  <rect x="560" y="610" width="20" height="20" rx="2" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="590" y="624" text-anchor="start" font-size="11" fill="#475569">低秩矩阵（B / A）</text>

  <rect x="740" y="610" width="20" height="20" rx="2" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="770" y="624" text-anchor="start" font-size="11" fill="#475569">冻结权重（W₀）</text>

  <text x="480" y="650" text-anchor="middle" font-size="10" fill="#94a3b8">LoRA 通过低秩分解将可训练参数量从 d² 降至 2rd，且部署时合并为单一矩阵，推理延迟为零</text>
</svg>
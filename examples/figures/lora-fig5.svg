<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" width="960" height="680">
  <rect x="0" y="0" width="960" height="680" fill="#ffffff"/>

  <!-- 标题 -->
  <text x="480" y="36" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">LoRA: Optimal Rank r Selection</text>

  <!-- 左侧主面板：核心定义 + 实验发现 -->
  <rect x="40" y="60" width="580" height="600" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" rx="4"/>
  <text x="330" y="88" font-size="15" font-weight="bold" fill="#1e293b" text-anchor="middle">Core Definition &amp; Empirical Findings</text>

  <!-- 核心公式框（强调色） -->
  <rect x="60" y="108" width="540" height="80" fill="#eef2ff" stroke="#6366f1" stroke-width="2" rx="4"/>
  <text x="330" y="134" font-size="16" font-weight="bold" fill="#3730a3" text-anchor="middle">Low-Rank Adaptation (LoRA)</text>
  <text x="330" y="162" font-size="14" fill="#334155" text-anchor="middle">h = W₀ x + ΔW x = W₀ x + BA x</text>
  <text x="330" y="180" font-size="12" fill="#64748b" text-anchor="middle">where W₀ ∈ ℝ<tspan baseline-shift="super" font-size="75%">d×d</tspan> (frozen), B ∈ ℝ<tspan baseline-shift="super" font-size="75%">d×r</tspan>, A ∈ ℝ<tspan baseline-shift="super" font-size="75%">r×d</tspan>, rank r ≪ d</text>

  <!-- 关键发现：最优秩 r -->
  <rect x="60" y="206" width="540" height="130" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" rx="4"/>
  <text x="330" y="230" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">Key Finding: Very Low Rank Suffices</text>
  <line x1="80" y1="242" x2="580" y2="242" stroke="#e2e8f0" stroke-width="1"/>
  <text x="330" y="262" font-size="13" fill="#334155" text-anchor="middle">Adapting both W<tspan baseline-shift="sub" font-size="75%">q</tspan> and W<tspan baseline-shift="sub" font-size="75%">v</tspan>: rank r = 1 achieves strong performance</text>
  <text x="330" y="286" font-size="13" fill="#334155" text-anchor="middle">Adapting only W<tspan baseline-shift="sub" font-size="75%">q</tspan>: requires larger r (e.g., r = 8)</text>
  <text x="330" y="310" font-size="13" fill="#334155" text-anchor="middle">ΔW has very low intrinsic rank; increasing r does not capture more meaningful subspace</text>

  <!-- 奇异向量子空间相似度分析 -->
  <rect x="60" y="354" width="540" height="140" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" rx="4"/>
  <text x="330" y="378" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">Singular Vector Subspace Similarity Analysis</text>
  <line x1="80" y1="390" x2="580" y2="390" stroke="#e2e8f0" stroke-width="1"/>
  <text x="330" y="412" font-size="13" fill="#334155" text-anchor="middle">Compare subspaces spanned by top singular vectors of ΔW for different r</text>
  <text x="330" y="436" font-size="13" fill="#334155" text-anchor="middle">Similarity metric: normalized subspace distance (Grassmann distance)</text>
  <text x="330" y="460" font-size="13" fill="#334155" text-anchor="middle">Result: subspaces for r = 1 and r = 8 are highly similar (&gt; 0.9)</text>
  <text x="330" y="484" font-size="13" fill="#64748b" text-anchor="middle">&#8594; Low rank already captures the essential adaptation direction</text>

  <!-- 右侧面板：图例与机制拆解 -->
  <rect x="640" y="60" width="280" height="600" fill="#fbfcfe" stroke="#cbd5e1" stroke-width="1.2" rx="4"/>
  <text x="780" y="88" font-size="15" font-weight="bold" fill="#1e293b" text-anchor="middle">Legend &amp; Mechanism</text>

  <!-- 图例 -->
  <rect x="660" y="108" width="240" height="120" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" rx="3"/>
  <text x="780" y="130" font-size="12" font-weight="bold" fill="#334155" text-anchor="middle">Arrow Legend</text>
  <line x1="680" y1="152" x2="730" y2="152" stroke="#475569" stroke-width="1.5"/>
  <polygon points="730,152 722,148 722,156" fill="#475569"/>
  <text x="740" y="156" font-size="11" fill="#64748b">Forward / data flow</text>
  <line x1="680" y1="176" x2="730" y2="176" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,4"/>
  <polygon points="730,176 722,172 722,180" fill="#94a3b8"/>
  <text x="740" y="180" font-size="11" fill="#64748b">Comparison / reference</text>
  <line x1="680" y1="200" x2="730" y2="200" stroke="#6366f1" stroke-width="2.5"/>
  <polygon points="730,200 722,196 722,204" fill="#6366f1"/>
  <text x="740" y="204" font-size="11" fill="#64748b">Selected / emphasized</text>

  <!-- 机制拆解：二部图 -->
  <rect x="660" y="246" width="240" height="200" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" rx="3"/>
  <text x="780" y="270" font-size="12" font-weight="bold" fill="#334155" text-anchor="middle">Adaptation Mapping (Bipartite View)</text>

  <!-- 左列节点 -->
  <circle cx="690" cy="310" r="6" fill="#cbd5e1" stroke="#475569" stroke-width="1"/>
  <text x="690" y="332" font-size="10" fill="#64748b" text-anchor="middle">input</text>
  <circle cx="690" cy="360" r="6" fill="#cbd5e1" stroke="#475569" stroke-width="1"/>
  <text x="690" y="382" font-size="10" fill="#64748b" text-anchor="middle">input</text>
  <circle cx="690" cy="410" r="6" fill="#cbd5e1" stroke="#475569" stroke-width="1"/>
  <text x="690" y="432" font-size="10" fill="#64748b" text-anchor="middle">input</text>

  <!-- 右列节点 -->
  <circle cx="870" cy="310" r="6" fill="#cbd5e1" stroke="#475569" stroke-width="1"/>
  <text x="870" y="332" font-size="10" fill="#64748b" text-anchor="middle">output</text>
  <circle cx="870" cy="360" r="6" fill="#cbd5e1" stroke="#475569" stroke-width="1"/>
  <text x="870" y="382" font-size="10" fill="#64748b" text-anchor="middle">output</text>
  <circle cx="870" cy="410" r="6" fill="#cbd5e1" stroke="#475569" stroke-width="1"/>
  <text x="870" y="432" font-size="10" fill="#64748b" text-anchor="middle">output</text>

  <!-- 连边：选中边用强调色 -->
  <line x1="696" y1="310" x2="864" y2="310" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="696" y1="310" x2="864" y2="360" stroke="#6366f1" stroke-width="2.5"/>
  <line x1="696" y1="310" x2="864" y2="410" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="696" y1="360" x2="864" y2="310" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="696" y1="360" x2="864" y2="360" stroke="#6366f1" stroke-width="2.5"/>
  <line x1="696" y1="360" x2="864" y2="410" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="696" y1="410" x2="864" y2="310" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="696" y1="410" x2="864" y2="360" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="696" y1="410" x2="864" y2="410" stroke="#6366f1" stroke-width="2.5"/>

  <text x="780" y="460" font-size="10" fill="#64748b" text-anchor="middle">Selected mappings (bold) = adaptation captured by low rank</text>

  <!-- 小矩阵示意 -->
  <rect x="660" y="464" width="240" height="180" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" rx="3"/>
  <text x="780" y="488" font-size="12" font-weight="bold" fill="#334155" text-anchor="middle">Matrix Decomposition</text>

  <!-- W₀ 矩阵 -->
  <rect x="680" y="504" width="60" height="60" fill="#f1f5f9" stroke="#475569" stroke-width="1"/>
  <text x="710" y="540" font-size="10" fill="#334155" text-anchor="middle">W₀</text>
  <text x="710" y="556" font-size="9" fill="#64748b" text-anchor="middle">d×d</text>

  <!-- + -->
  <text x="750" y="540" font-size="16" fill="#334155" text-anchor="middle">+</text>

  <!-- ΔW = BA -->
  <rect x="770" y="504" width="60" height="60" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="800" y="540" font-size="10" fill="#3730a3" text-anchor="middle">ΔW</text>
  <text x="800" y="556" font-size="9" fill="#64748b" text-anchor="middle">d×d</text>

  <!-- = -->
  <text x="840" y="540" font-size="16" fill="#334155" text-anchor="middle">=</text>

  <!-- B -->
  <rect x="860" y="504" width="30" height="60" fill="#eef2ff" stroke="#6366f1" stroke-width="1"/>
  <text x="875" y="540" font-size="10" fill="#3730a3" text-anchor="middle">B</text>
  <text x="875" y="556" font-size="9" fill="#64748b" text-anchor="middle">d×r</text>

  <!-- A -->
  <rect x="895" y="504" width="60" height="30" fill="#eef2ff" stroke="#6366f1" stroke-width="1"/>
  <text x="925" y="524" font-size="10" fill="#3730a3" text-anchor="middle">A</text>
  <text x="925" y="536" font-size="9" fill="#64748b" text-anchor="middle">r×d</text>

  <text x="780" y="600" font-size="10" fill="#64748b" text-anchor="middle">rank r ≪ d, e.g., r = 1 or 2 for GPT-3 175B</text>
  <text x="780" y="620" font-size="10" fill="#64748b" text-anchor="middle">Only A and B are trained; W₀ is frozen</text>
  <text x="780" y="640" font-size="10" fill="#64748b" text-anchor="middle">No additional inference latency</text>
</svg>
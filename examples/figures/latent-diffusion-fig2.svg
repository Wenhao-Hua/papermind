<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" width="960" height="680">
  <rect x="0" y="0" width="960" height="680" fill="#ffffff"/>

  <!-- 标题 -->
  <text x="480" y="36" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">Two-Stage Training Strategy of Latent Diffusion Models (LDMs)</text>

  <!-- ===== 左侧主面板：两阶段流程 ===== -->
  <!-- 阶段一框 -->
  <rect x="40" y="60" width="520" height="240" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="300" y="86" font-size="15" font-weight="bold" fill="#1e293b" text-anchor="middle">Stage 1: Perceptual Compression Autoencoder</text>
  <text x="300" y="106" font-size="12" fill="#64748b" text-anchor="middle">Learn a perceptually equivalent, lower-dimensional latent space</text>

  <!-- 输入图像 -->
  <rect x="80" y="126" width="100" height="80" rx="4" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="130" y="162" font-size="13" font-weight="bold" fill="#3730a3" text-anchor="middle">Image</text>
  <text x="130" y="180" font-size="11" fill="#3730a3" text-anchor="middle">x ∈ ℝᴴˣᵂˣ³</text>

  <!-- 编码器箭头 -->
  <line x1="180" y1="166" x2="230" y2="166" stroke="#475569" stroke-width="1.5"/>
  <polygon points="230,166 220,161 220,171" fill="#475569"/>

  <!-- 编码器 -->
  <rect x="232" y="126" width="100" height="80" rx="4" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="282" y="162" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="middle">Encoder</text>
  <text x="282" y="180" font-size="11" fill="#64748b" text-anchor="middle">ℰ</text>

  <!-- 编码器到潜在 -->
  <line x1="332" y1="166" x2="382" y2="166" stroke="#475569" stroke-width="1.5"/>
  <polygon points="382,166 372,161 372,171" fill="#475569"/>

  <!-- 潜在表示 -->
  <rect x="384" y="126" width="140" height="80" rx="4" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="454" y="158" font-size="14" font-weight="bold" fill="#3730a3" text-anchor="middle">Latent</text>
  <text x="454" y="178" font-size="12" fill="#3730a3" text-anchor="middle">z = ℰ(x)</text>
  <text x="454" y="196" font-size="11" fill="#64748b" text-anchor="middle">z ∈ ℝʰˣʷˣᶜ</text>

  <!-- 解码器箭头 -->
  <line x1="384" y1="206" x2="282" y2="240" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5,4"/>
  <polygon points="282,240 290,234 274,234" fill="#94a3b8"/>

  <!-- 解码器 -->
  <rect x="232" y="242" width="100" height="40" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5,4"/>
  <text x="282" y="266" font-size="12" fill="#64748b" text-anchor="middle">Decoder 𝒟</text>

  <!-- 重建 -->
  <rect x="80" y="242" width="100" height="40" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5,4"/>
  <text x="130" y="266" font-size="12" fill="#64748b" text-anchor="middle">Recon. x̂</text>

  <!-- 重建箭头 -->
  <line x1="232" y1="262" x2="180" y2="262" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5,4"/>
  <polygon points="180,262 190,257 190,267" fill="#94a3b8"/>

  <!-- 下采样因子标注 -->
  <text x="454" y="224" font-size="11" fill="#64748b" text-anchor="middle">downsampling factor f = H/h = W/w</text>

  <!-- 阶段间箭头 -->
  <line x1="300" y1="300" x2="300" y2="330" stroke="#475569" stroke-width="2"/>
  <polygon points="300,330 293,320 307,320" fill="#475569"/>

  <!-- 阶段二框 -->
  <rect x="40" y="336" width="520" height="240" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="300" y="362" font-size="15" font-weight="bold" fill="#1e293b" text-anchor="middle">Stage 2: Diffusion Model in Latent Space</text>
  <text x="300" y="382" font-size="12" fill="#64748b" text-anchor="middle">Train a diffusion model on the fixed latent representation z</text>

  <!-- 噪声 -->
  <rect x="80" y="400" width="80" height="60" rx="4" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="120" y="432" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="middle">Noise</text>
  <text x="120" y="450" font-size="11" fill="#64748b" text-anchor="middle">εₜ</text>

  <!-- 噪声箭头 -->
  <line x1="160" y1="430" x2="210" y2="430" stroke="#475569" stroke-width="1.5"/>
  <polygon points="210,430 200,425 200,435" fill="#475569"/>

  <!-- 去噪 U-Net -->
  <rect x="212" y="396" width="120" height="68" rx="4" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="272" y="424" font-size="13" font-weight="bold" fill="#3730a3" text-anchor="middle">Denoiser</text>
  <text x="272" y="442" font-size="11" fill="#3730a3" text-anchor="middle">εₜ(zₜ, t)</text>
  <text x="272" y="456" font-size="10" fill="#64748b" text-anchor="middle">U-Net</text>

  <!-- 去噪到潜在 -->
  <line x1="332" y1="430" x2="382" y2="430" stroke="#475569" stroke-width="1.5"/>
  <polygon points="382,430 372,425 372,435" fill="#475569"/>

  <!-- 潜在 -->
  <rect x="384" y="400" width="140" height="60" rx="4" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="454" y="428" font-size="14" font-weight="bold" fill="#3730a3" text-anchor="middle">Latent z₀</text>
  <text x="454" y="448" font-size="11" fill="#64748b" text-anchor="middle">denoised sample</text>

  <!-- 解码箭头 -->
  <line x1="384" y1="460" x2="282" y2="490" stroke="#475569" stroke-width="1.5"/>
  <polygon points="282,490 290,484 274,484" fill="#475569"/>

  <!-- 解码器 -->
  <rect x="232" y="492" width="100" height="36" rx="4" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="282" y="514" font-size="12" fill="#1e293b" text-anchor="middle">Decoder 𝒟</text>

  <!-- 生成图像 -->
  <rect x="80" y="492" width="100" height="36" rx="4" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="130" y="514" font-size="13" font-weight="bold" fill="#3730a3" text-anchor="middle">Output x̂</text>

  <!-- 生成箭头 -->
  <line x1="232" y1="510" x2="180" y2="510" stroke="#475569" stroke-width="1.5"/>
  <polygon points="180,510 190,505 190,515" fill="#475569"/>

  <!-- 训练目标 -->
  <text x="300" y="548" font-size="12" fill="#334155" text-anchor="middle">Training objective: L = 𝔼ₓ,ₜ,ε [ ‖ ε − εₜ(zₜ, t) ‖² ]</text>

  <!-- ===== 右侧面板：关键公式与图例 ===== -->
  <!-- 核心指标框 -->
  <rect x="590" y="60" width="340" height="180" rx="6" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="760" y="86" font-size="15" font-weight="bold" fill="#3730a3" text-anchor="middle">Core Definition: Latent Diffusion</text>

  <!-- 公式 -->
  <text x="760" y="120" font-size="14" fill="#1e293b" text-anchor="middle">z₀ = ℰ(x) ,   x̂ = 𝒟(z₀)</text>
  <text x="760" y="148" font-size="14" fill="#1e293b" text-anchor="middle">zₜ = √(ᾱₜ) z₀ + √(1−ᾱₜ) ε</text>
  <text x="760" y="176" font-size="14" fill="#1e293b" text-anchor="middle">L = 𝔼ₓ,ₜ,ε [ ‖ ε − εₜ(zₜ, t) ‖² ]</text>

  <!-- 图例框 -->
  <rect x="590" y="260" width="340" height="160" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="760" y="286" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">Legend</text>

  <!-- 图例项 -->
  <line x1="610" y1="312" x2="660" y2="312" stroke="#475569" stroke-width="1.5"/>
  <polygon points="660,312 650,307 650,317" fill="#475569"/>
  <text x="670" y="316" font-size="12" fill="#334155">Forward pass (data flow)</text>

  <line x1="610" y1="340" x2="660" y2="340" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5,4"/>
  <polygon points="660,340 650,335 650,345" fill="#94a3b8"/>
  <text x="670" y="344" font-size="12" fill="#334155">Reconstruction / backward path</text>

  <rect x="610" y="358" width="20" height="12" rx="2" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="640" y="370" font-size="12" fill="#334155">Key component / latent representation</text>

  <!-- 下采样说明 -->
  <rect x="590" y="440" width="340" height="100" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="760" y="466" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="middle">Downsampling Factor f</text>
  <text x="760" y="490" font-size="12" fill="#334155" text-anchor="middle">f = H/h = W/w  (e.g., f=4, 8, 16)</text>
  <text x="760" y="512" font-size="12" fill="#64748b" text-anchor="middle">Lower f → better reconstruction, more compute</text>
  <text x="760" y="530" font-size="12" fill="#64748b" text-anchor="middle">Higher f → more compression, less detail</text>

  <!-- 底部说明 -->
  <text x="480" y="610" font-size="12" fill="#64748b" text-anchor="middle">The two-stage decomposition separates perceptual compression (Stage 1) from semantic generation (Stage 2).</text>
  <text x="480" y="630" font-size="12" fill="#64748b" text-anchor="middle">The autoencoder is trained once and reused across tasks; the diffusion model focuses on learning data distribution.</text>

  <!-- 底部引用 -->
  <text x="480" y="660" font-size="11" fill="#94a3b8" text-anchor="middle">Based on Rombach et al. (2022) — High-Resolution Image Synthesis with Latent Diffusion Models</text>
</svg>
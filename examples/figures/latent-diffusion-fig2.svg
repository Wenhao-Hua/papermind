<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" width="960" height="640">
  <rect x="0" y="0" width="960" height="640" fill="#ffffff"/>

  <!-- 主标题 -->
  <text x="480" y="36" font-size="18" font-weight="bold" fill="#1e293b" text-anchor="middle">Latent Diffusion: Perceptual Compression Tradeoffs</text>

  <!-- 左侧主面板：两种正则化对比 -->
  <!-- 面板背景 -->
  <rect x="24" y="56" width="580" height="540" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" rx="4"/>

  <!-- 面板标题 -->
  <text x="314" y="82" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">Regularization Strategies in Latent Space</text>

  <!-- ====== KL-Regularization 框 ====== -->
  <rect x="44" y="100" width="540" height="200" fill="#ffffff" stroke="#94a3b8" stroke-width="1" rx="3"/>
  <text x="314" y="124" font-size="13" font-weight="bold" fill="#334155" text-anchor="middle">KL-Regularization (VAE-style)</text>

  <!-- 编码器 → 潜在空间 → 解码器 -->
  <text x="80" y="158" font-size="12" fill="#475569" text-anchor="middle">Encoder</text>
  <text x="80" y="172" font-size="11" fill="#64748b" text-anchor="middle">E</text>

  <rect x="50" y="140" width="60" height="36" fill="#eef2ff" stroke="#6366f1" stroke-width="1.2" rx="2"/>
  <text x="80" y="162" font-size="11" fill="#3730a3" text-anchor="middle">E(x)</text>

  <!-- 箭头 -->
  <line x1="110" y1="158" x2="170" y2="158" stroke="#475569" stroke-width="1.2"/>
  <polygon points="170,153 180,158 170,163" fill="#475569"/>

  <!-- 潜在空间 z -->
  <rect x="180" y="140" width="80" height="36" fill="#f1f5f9" stroke="#475569" stroke-width="1.2" rx="2"/>
  <text x="220" y="162" font-size="12" fill="#1e293b" text-anchor="middle">z = E(x)</text>

  <!-- 箭头 -->
  <line x1="260" y1="158" x2="320" y2="158" stroke="#475569" stroke-width="1.2"/>
  <polygon points="320,153 330,158 320,163" fill="#475569"/>

  <!-- 解码器 -->
  <rect x="330" y="140" width="60" height="36" fill="#eef2ff" stroke="#6366f1" stroke-width="1.2" rx="2"/>
  <text x="360" y="162" font-size="11" fill="#3730a3" text-anchor="middle">D(z)</text>

  <text x="360" y="178" font-size="11" fill="#64748b" text-anchor="middle">Decoder</text>

  <!-- KL 惩罚项 -->
  <rect x="420" y="136" width="150" height="44" fill="#fef2f2" stroke="#f87171" stroke-width="1" rx="2"/>
  <text x="495" y="156" font-size="11" fill="#991b1b" text-anchor="middle">KL penalty:</text>
  <text x="495" y="172" font-size="11" fill="#991b1b" text-anchor="middle">D<tspan baseline-shift="sub" font-size="75%">KL</tspan>(z &#8216; N(0,I))</text>

  <!-- 说明 -->
  <text x="314" y="210" font-size="11" fill="#64748b" text-anchor="middle">Encourages latent distribution toward standard normal</text>
  <text x="314" y="226" font-size="11" fill="#64748b" text-anchor="middle">&#8594; Smooth latent space, but may lose fine details</text>

  <!-- 示例：f=4 重建 -->
  <text x="120" y="260" font-size="11" fill="#334155" text-anchor="middle">Example (f=4):</text>
  <text x="220" y="260" font-size="11" fill="#475569" text-anchor="middle">PSNR: 27.4</text>
  <text x="320" y="260" font-size="11" fill="#475569" text-anchor="middle">R-FID: 0.58</text>

  <!-- ====== VQ-Regularization 框 ====== -->
  <rect x="44" y="280" width="540" height="200" fill="#ffffff" stroke="#6366f1" stroke-width="1.5" rx="3"/>
  <text x="314" y="304" font-size="13" font-weight="bold" fill="#3730a3" text-anchor="middle">VQ-Regularization (VQGAN-style) — Better Detail Preservation</text>

  <!-- 编码器 -->
  <rect x="50" y="320" width="60" height="36" fill="#eef2ff" stroke="#6366f1" stroke-width="1.2" rx="2"/>
  <text x="80" y="342" font-size="11" fill="#3730a3" text-anchor="middle">E(x)</text>

  <line x1="110" y1="338" x2="170" y2="338" stroke="#475569" stroke-width="1.2"/>
  <polygon points="170,333 180,338 170,343" fill="#475569"/>

  <!-- 量化器 -->
  <rect x="180" y="316" width="100" height="44" fill="#f1f5f9" stroke="#475569" stroke-width="1.2" rx="2"/>
  <text x="230" y="338" font-size="11" fill="#1e293b" text-anchor="middle">Quantize</text>
  <text x="230" y="352" font-size="10" fill="#64748b" text-anchor="middle">z<tspan baseline-shift="sub" font-size="75%">q</tspan> = argmin</text>

  <!-- 码本 -->
  <rect x="300" y="316" width="80" height="44" fill="#fefce8" stroke="#eab308" stroke-width="1" rx="2"/>
  <text x="340" y="336" font-size="11" fill="#854d0e" text-anchor="middle">Codebook</text>
  <text x="340" y="352" font-size="10" fill="#854d0e" text-anchor="middle">{c<tspan baseline-shift="sub" font-size="75%">1</tspan>,...,c<tspan baseline-shift="sub" font-size="75%">K</tspan>}</text>

  <!-- 箭头 -->
  <line x1="380" y1="338" x2="430" y2="338" stroke="#475569" stroke-width="1.2"/>
  <polygon points="430,333 440,338 430,343" fill="#475569"/>

  <!-- 解码器 -->
  <rect x="440" y="320" width="60" height="36" fill="#eef2ff" stroke="#6366f1" stroke-width="1.2" rx="2"/>
  <text x="470" y="342" font-size="11" fill="#3730a3" text-anchor="middle">D(z)</text>

  <!-- 说明 -->
  <text x="314" y="390" font-size="11" fill="#64748b" text-anchor="middle">Maps continuous latents to nearest discrete codebook entry</text>
  <text x="314" y="406" font-size="11" fill="#64748b" text-anchor="middle">&#8594; Preserves high-frequency details, avoids blurring</text>

  <!-- 示例：f=8 重建 -->
  <text x="120" y="440" font-size="11" fill="#334155" text-anchor="middle">Example (f=8):</text>
  <text x="220" y="440" font-size="11" fill="#475569" text-anchor="middle">PSNR: 22.8</text>
  <text x="320" y="440" font-size="11" fill="#475569" text-anchor="middle">R-FID: 32.01</text>

  <!-- 底部结论 -->
  <rect x="44" y="500" width="540" height="36" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" rx="2"/>
  <text x="314" y="522" font-size="12" font-weight="bold" fill="#1e293b" text-anchor="middle">VQ-reg achieves better reconstruction quality (higher PSNR, lower FID) at same downsampling factor</text>

  <!-- ====== 右侧图例/说明面板 ====== -->
  <rect x="624" y="56" width="312" height="540" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" rx="4"/>

  <text x="780" y="82" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">Legend &amp; Notation</text>

  <!-- 箭头图例 -->
  <text x="660" y="112" font-size="12" font-weight="bold" fill="#334155">Arrows</text>

  <line x1="660" y1="132" x2="720" y2="132" stroke="#475569" stroke-width="1.2"/>
  <polygon points="720,127 730,132 720,137" fill="#475569"/>
  <text x="740" y="136" font-size="11" fill="#475569">Data flow</text>

  <line x1="660" y1="158" x2="720" y2="158" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5,4"/>
  <polygon points="720,153 730,158 720,163" fill="#94a3b8"/>
  <text x="740" y="162" font-size="11" fill="#475569">Reference / comparison</text>

  <!-- 符号图例 -->
  <text x="660" y="196" font-size="12" font-weight="bold" fill="#334155">Symbols</text>

  <text x="660" y="218" font-size="11" fill="#475569">E : Encoder (downsampling)</text>
  <text x="660" y="238" font-size="11" fill="#475569">D : Decoder (upsampling)</text>
  <text x="660" y="258" font-size="11" fill="#475569">z : Latent representation</text>
  <text x="660" y="278" font-size="11" fill="#475569">f : Spatial downsampling factor</text>
  <text x="660" y="298" font-size="11" fill="#475569">D<tspan baseline-shift="sub" font-size="75%">KL</tspan> : Kullback-Leibler divergence</text>
  <text x="660" y="318" font-size="11" fill="#475569">z<tspan baseline-shift="sub" font-size="75%">q</tspan> : Quantized latent</text>
  <text x="660" y="338" font-size="11" fill="#475569">c<tspan baseline-shift="sub" font-size="75%">k</tspan> : Codebook entry (k=1..K)</text>

  <!-- 关键公式 -->
  <text x="660" y="376" font-size="12" font-weight="bold" fill="#334155">Key Formulation</text>

  <rect x="660" y="390" width="260" height="80" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" rx="2"/>
  <text x="790" y="412" font-size="11" fill="#1e293b" text-anchor="middle">Latent Diffusion Model (LDM)</text>
  <text x="790" y="432" font-size="11" fill="#475569" text-anchor="middle">&#8467;<tspan baseline-shift="sub" font-size="75%">LDM</tspan> = &#8467;<tspan baseline-shift="sub" font-size="75%">simple</tspan>(z) + &#955; &#8467;<tspan baseline-shift="sub" font-size="75%">reg</tspan></text>
  <text x="790" y="452" font-size="10" fill="#64748b" text-anchor="middle">where &#8467;<tspan baseline-shift="sub" font-size="75%">reg</tspan> = D<tspan baseline-shift="sub" font-size="75%">KL</tspan> (KL) or quantization (VQ)</text>

  <!-- 重建质量对比 -->
  <text x="660" y="496" font-size="12" font-weight="bold" fill="#334155">Reconstruction Quality (Table 8)</text>

  <rect x="660" y="508" width="260" height="72" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" rx="2"/>
  <text x="690" y="528" font-size="11" fill="#475569">f=4 (KL): PSNR 27.4</text>
  <text x="690" y="546" font-size="11" fill="#475569">f=8 (VQ): PSNR 22.8</text>
  <text x="690" y="564" font-size="11" fill="#475569">f=16 (VQ): PSNR 19.9</text>
  <text x="830" y="528" font-size="11" fill="#475569">R-FID 0.58</text>
  <text x="830" y="546" font-size="11" fill="#475569">R-FID 32.01</text>
  <text x="830" y="564" font-size="11" fill="#475569">R-FID 4.98</text>

</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" width="960" height="640">
  <rect x="0" y="0" width="960" height="640" fill="#ffffff"/>

  <!-- 标题 -->
  <text x="480" y="36" font-size="20" font-weight="700" fill="#1e293b" text-anchor="middle">Latent Diffusion Model Training Objective</text>
  <line x1="200" y1="46" x2="760" y2="46" stroke="#cbd5e1" stroke-width="1"/>

  <!-- 核心公式面板 -->
  <rect x="40" y="64" width="880" height="100" rx="6" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="480" y="92" font-size="15" font-weight="600" fill="#3730a3" text-anchor="middle">Core Training Objective</text>
  <text x="480" y="128" font-size="18" font-weight="700" fill="#1e293b" text-anchor="middle">L<tspan baseline-shift="sub" font-size="75%">LDM</tspan> := &#x1D53C;<tspan baseline-shift="sub" font-size="75%">E(x),&#x3B5;~&#x1D4A9;(0,1),t</tspan> [ &#x2016;&#x3B5; &#x2212; &#x3B5;<tspan baseline-shift="sub" font-size="75%">&#x3B8;</tspan>(z<tspan baseline-shift="sub" font-size="75%">t</tspan>, t) &#x2016;<tspan baseline-shift="super" font-size="75%">2</tspan><tspan baseline-shift="sub" font-size="75%">2</tspan> ]</text>
  <text x="480" y="152" font-size="12" fill="#64748b" text-anchor="middle">where z<tspan baseline-shift="sub" font-size="75%">t</tspan> = &#x221A;&#x3B1;<tspan baseline-shift="sub" font-size="75%">t</tspan> &#x00B7; E(x) + &#x221A;(1&#x2212;&#x3B1;<tspan baseline-shift="sub" font-size="75%">t</tspan>) &#x00B7; &#x3B5; , &#x3B5; ~ &#x1D4A9;(0,1)</text>

  <!-- 左侧：数据流图 -->
  <!-- 输入图像 -->
  <rect x="80" y="200" width="160" height="50" rx="4" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
  <text x="160" y="230" font-size="14" fill="#1e293b" text-anchor="middle">Image x &#x2208; &#x211D;<tspan baseline-shift="super" font-size="75%">H&#x00D7;W&#x00D7;3</tspan></text>

  <!-- 编码器 -->
  <rect x="80" y="280" width="160" height="50" rx="4" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="160" y="310" font-size="14" fill="#1e293b" text-anchor="middle">Encoder E</text>

  <!-- 潜在表示 -->
  <rect x="80" y="360" width="160" height="50" rx="4" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="160" y="390" font-size="14" fill="#3730a3" text-anchor="middle">z = E(x) &#x2208; &#x211D;<tspan baseline-shift="super" font-size="75%">h&#x00D7;w&#x00D7;c</tspan></text>

  <!-- 正向扩散过程 -->
  <rect x="80" y="440" width="160" height="50" rx="4" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="160" y="462" font-size="12" fill="#1e293b" text-anchor="middle">Forward Diffusion</text>
  <text x="160" y="480" font-size="12" fill="#64748b" text-anchor="middle">z<tspan baseline-shift="sub" font-size="75%">t</tspan> = &#x221A;&#x3B1;<tspan baseline-shift="sub" font-size="75%">t</tspan> z + &#x221A;(1&#x2212;&#x3B1;<tspan baseline-shift="sub" font-size="75%">t</tspan>)&#x3B5;</text>

  <!-- 噪声 -->
  <rect x="280" y="440" width="100" height="50" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="330" y="470" font-size="13" fill="#64748b" text-anchor="middle">&#x3B5; ~ &#x1D4A9;(0,1)</text>

  <!-- 去噪网络 -->
  <rect x="420" y="440" width="160" height="50" rx="4" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="500" y="462" font-size="13" fill="#1e293b" text-anchor="middle">Denoiser &#x3B5;<tspan baseline-shift="sub" font-size="75%">&#x3B8;</tspan></text>
  <text x="500" y="480" font-size="12" fill="#64748b" text-anchor="middle">predicts &#x3B5; from z<tspan baseline-shift="sub" font-size="75%">t</tspan>, t</text>

  <!-- 损失 -->
  <rect x="620" y="440" width="160" height="50" rx="4" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="700" y="470" font-size="14" fill="#3730a3" text-anchor="middle">L<tspan baseline-shift="sub" font-size="75%">LDM</tspan> = &#x2016;&#x3B5; &#x2212; &#x3B5;<tspan baseline-shift="sub" font-size="75%">&#x3B8;</tspan>&#x2016;<tspan baseline-shift="super" font-size="75%">2</tspan></text>

  <!-- 箭头：图像→编码器 -->
  <polygon points="160,250 155,250 160,275 165,250" fill="#475569"/>
  <line x1="160" y1="250" x2="160" y2="275" stroke="#475569" stroke-width="1.5"/>

  <!-- 箭头：编码器→潜在 -->
  <polygon points="160,330 155,330 160,355 165,330" fill="#475569"/>
  <line x1="160" y1="330" x2="160" y2="355" stroke="#475569" stroke-width="1.5"/>

  <!-- 箭头：潜在→正向扩散 -->
  <polygon points="160,410 155,410 160,435 165,410" fill="#475569"/>
  <line x1="160" y1="410" x2="160" y2="435" stroke="#475569" stroke-width="1.5"/>

  <!-- 箭头：噪声→正向扩散 -->
  <polygon points="280,465 255,465 280,470 280,460" fill="#94a3b8"/>
  <line x1="240" y1="465" x2="255" y2="465" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,3"/>

  <!-- 箭头：正向扩散→去噪 -->
  <polygon points="380,465 405,465 380,470 380,460" fill="#475569"/>
  <line x1="240" y1="465" x2="405" y2="465" stroke="#475569" stroke-width="1.5"/>

  <!-- 箭头：去噪→损失 -->
  <polygon points="580,465 605,465 580,470 580,460" fill="#6366f1"/>
  <line x1="580" y1="465" x2="605" y2="465" stroke="#6366f1" stroke-width="1.5"/>

  <!-- 时间步 t 输入 -->
  <rect x="420" y="380" width="100" height="36" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="470" y="403" font-size="13" fill="#64748b" text-anchor="middle">timestep t</text>
  <polygon points="470,416 465,416 470,435 475,416" fill="#94a3b8"/>
  <line x1="470" y1="416" x2="470" y2="435" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,3"/>

  <!-- 右侧：图例与说明 -->
  <rect x="740" y="200" width="180" height="200" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="830" y="222" font-size="13" font-weight="600" fill="#1e293b" text-anchor="middle">Legend</text>

  <!-- 图例项 -->
  <line x1="755" y1="244" x2="795" y2="244" stroke="#475569" stroke-width="1.5"/>
  <polygon points="795,244 790,240 790,248" fill="#475569"/>
  <text x="805" y="248" font-size="11" fill="#334155">Data flow</text>

  <line x1="755" y1="270" x2="795" y2="270" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,3"/>
  <polygon points="795,270 790,266 790,274" fill="#94a3b8"/>
  <text x="805" y="274" font-size="11" fill="#334155">Noise / conditioning</text>

  <line x1="755" y1="296" x2="795" y2="296" stroke="#6366f1" stroke-width="1.5"/>
  <polygon points="795,296 790,292 790,300" fill="#6366f1"/>
  <text x="805" y="300" font-size="11" fill="#334155">Loss computation</text>

  <rect x="755" y="316" width="40" height="16" rx="2" fill="#eef2ff" stroke="#6366f1" stroke-width="1"/>
  <text x="805" y="328" font-size="11" fill="#334155">Key component</text>

  <rect x="755" y="340" width="40" height="16" rx="2" fill="#f1f5f9" stroke="#475569" stroke-width="1"/>
  <text x="805" y="352" font-size="11" fill="#334155">Process / module</text>

  <!-- 底部说明 -->
  <rect x="40" y="530" width="880" height="90" rx="4" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="480" y="554" font-size="13" font-weight="600" fill="#1e293b" text-anchor="middle">Key Insight</text>
  <text x="480" y="576" font-size="12" fill="#334155" text-anchor="middle">Training diffusion models in latent space (z = E(x)) rather than pixel space (x) reduces</text>
  <text x="480" y="596" font-size="12" fill="#334155" text-anchor="middle">computational cost while preserving perceptual quality. The downsampling factor</text>
  <text x="480" y="616" font-size="12" fill="#334155" text-anchor="middle">f = H/h = W/w balances compression and detail preservation.</text>
</svg>
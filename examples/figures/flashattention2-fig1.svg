    <text x="-20" y="216" font-size="11" fill="#64748b" text-anchor="end">Q₅</text>
    <!-- 网格线 -->
    <line x1="0" y1="0" x2="240" y2="0" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="0" y1="40" x2="240" y2="40" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="0" y1="80" x2="240" y2="80" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="0" y1="120" x2="240" y2="120" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="0" y1="160" x2="240" y2="160" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="0" y1="200" x2="240" y2="200" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="0" y1="240" x2="240" y2="240" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="0" y1="0" x2="0" y2="240" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="40" y1="0" x2="40" y2="240" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="80" y1="0" x2="80" y2="240" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="120" y1="0" x2="120" y2="240" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="160" y1="0" x2="160" y2="240" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="200" y1="0" x2="200" y2="240" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="240" y1="0" x2="240" y2="240" stroke="#cbd5e1" stroke-width="1"/>
    <!-- 填充：下三角（可见） -->
    <rect x="0" y="0" width="40" height="40" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
    <rect x="40" y="0" width="40" height="40" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
    <rect x="80" y="0" width="40" height="40" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
    <rect x="120" y="0" width="40" height="40" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
    <rect x="160" y="0" width="40" height="40" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
    <rect x="200" y="0" width="40" height="40" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
    <rect x="0" y="40" width="40" height="40" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
    <rect x="40" y="40" width="40" height="40" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
    <rect x="80" y="40" width="40" height="40" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
    <rect x="120" y="40" width="40" height="40" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
    <rect x="160" y="40" width="40" height="40" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
    <rect x="200" y="40" width="40" height="40" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
    <rect x="0" y="80" width="40" height="40" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
    <rect x="40" y="80" width="40" height="40" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
    <rect x="80" y="80" width="40" height="40" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
    <rect x="120" y="80" width="40" height="40" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
    <rect x="160" y="80" width="40" height="40" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
    <rect x="200" y="80" width="40" height="40" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
    <rect x="0" y="120" width="40" height="40" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
    <rect x="40" y="120" width="40" height="40" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
    <rect x="80" y="120" width="40" height="40" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
    <rect x="120" y="120" width="40" height="40" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
    <rect x="160" y="120" width="40" height="40" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
    <rect x="200" y="120" width="40" height="40" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
    <rect x="0" y="160" width="40" height="40" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
    <rect x="40" y="160" width="40" height="40" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
    <rect x="80" y="160" width="40" height="40" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
    <rect x="120" y="160" width="40" height="40" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
    <rect x="160" y="160" width="40" height="40" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
    <rect x="200" y="160" width="40" height="40" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
    <rect x="0" y="200" width="40" height="40" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
    <rect x="40" y="200" width="40" height="40" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
    <rect x="80" y="200" width="40" height="40" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
    <rect x="120" y="200" width="40" height="40" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
    <rect x="160" y="200" width="40" height="40" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
    <rect x="200" y="200" width="40" height="40" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
    <!-- 上三角（遮蔽） -->
    <rect x="40" y="0" width="40" height="40" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,2"/>
    <rect x="80" y="0" width="40" height="40" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,2"/>
    <rect x="120" y="0" width="40" height="40" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,2"/>
    <rect x="160" y="0" width="40" height="40" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,2"/>
    <rect x="200" y="0" width="40" height="40" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,2"/>
    <rect x="80" y="40" width="40" height="40" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,2"/>
    <rect x="120" y="40" width="40" height="40" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,2"/>
    <rect x="160" y="40" width="40" height="40" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,2"/>
    <rect x="200" y="40" width="40" height="40" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,2"/>
    <rect x="120" y="80" width="40" height="40" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,2"/>
    <rect x="160" y="80" width="40" height="40" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,2"/>
    <rect x="200" y="80" width="40" height="40" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,2"/>
    <rect x="160" y="120" width="40" height="40" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,2"/>
    <rect x="200" y="120" width="40" height="40" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,2"/>
    <rect x="200" y="160" width="40" height="40" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,2"/>
    <!-- 对角线 -->
    <line x1="0" y1="40" x2="240" y2="40" stroke="#6366f1" stroke-width="2" stroke-dasharray="4,2"/>
    <text x="250" y="24" font-size="11" fill="#6366f1" font-weight="bold">diagonal</text>
  </g>

  <!-- 分块跳过说明 -->
  <g transform="translate(60, 380)">
    <text x="0" y="0" font-size="14" font-weight="bold" fill="#1e293b">Block Skipping Strategy</text>
    <text x="0" y="24" font-size="12" fill="#334155">For each block (e.g., 2&#215;2 tiles):</text>
    <text x="0" y="48" font-size="12" fill="#334155">&#8226; If all column indices &gt; row indices (fully masked):</text>
    <text x="20" y="68" font-size="12" fill="#6366f1" font-weight="bold">skip entire block &#8594; 0 FLOPs</text>
    <text x="0" y="92" font-size="12" fill="#334155">&#8226; Otherwise: compute normally, no explicit mask needed</text>
    <text x="0" y="116" font-size="12" fill="#334155">&#8226; Result: ~1.7&#215;–1.8&#215; speedup vs. standard causal attn</text>
  </g>

  <!-- 右侧面板：图例与机制 -->
  <rect x="590" y="70" width="340" height="580" fill="#fbfcfe" stroke="#e2e8f0" stroke-width="1" rx="4"/>
  <text x="760" y="100" font-size="16" font-weight="bold" fill="#1e293b" text-anchor="middle">Legend &amp; Mechanism</text>

  <!-- 图例 -->
  <g transform="translate(610, 120)">
    <text x="0" y="0" font-size="13" font-weight="bold" fill="#334155">Arrow Types</text>
    <line x1="0" y1="20" x2="40" y2="20" stroke="#475569" stroke-width="2"/>
    <polygon points="40,16 48,20 40,24" fill="#475569"/>
    <text x="56" y="24" font-size="12" fill="#334155">Data flow (forward)</text>
    <line x1="0" y1="48" x2="40" y2="48" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,3"/>
    <polygon points="40,44 48,48 40,52" fill="#94a3b8"/>
    <text x="56" y="52" font-size="12" fill="#334155">Masked / skipped</text>
    <line x1="0" y1="76" x2="40" y2="76" stroke="#6366f1" stroke-width="2.5"/>
    <polygon points="40,72 48,76 40,80" fill="#6366f1"/>
    <text x="56" y="80" font-size="12" fill="#334155">Selected / active path</text>
  </g>

  <!-- 机制拆解 -->
  <g transform="translate(610, 220)">
    <text x="0" y="0" font-size="13" font-weight="bold" fill="#334155">Why Block Skipping Works</text>
    <text x="0" y="24" font-size="11" fill="#475569">Causal attention: Qᵢ attends only to Kⱼ with j ≤ i.</text>
    <text x="0" y="44" font-size="11" fill="#475569">In tiled computation (block size B):</text>
    <text x="0" y="64" font-size="11" fill="#475569">&#8226; Block (r, c) covers rows rB..(r+1)B-1,</text>
    <text x="0" y="80" font-size="11" fill="#475569">  columns cB..(c+1)B-1.</text>
    <text x="0" y="100" font-size="11" fill="#475569">&#8226; If c &gt; r: all column indices &gt; row indices</text>
    <text x="0" y="116" font-size="11" fill="#475569">  &#8594; block is entirely masked &#8594; skip.</text>
    <text x="0" y="136" font-size="11" fill="#475569">&#8226; If c ≤ r: at least some entries are valid;</text>
    <text x="0" y="152" font-size="11" fill="#475569">  compute normally, no explicit mask needed.</text>
  </g>

  <!-- 公式框 -->
  <rect x="610" y="400" width="300" height="100" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5" rx="4"/>
  <text x="760" y="424" font-size="14" font-weight="bold" fill="#3730a3" text-anchor="middle">Key Formula</text>
  <text x="760" y="452" font-size="13" fill="#3730a3" text-anchor="middle">S = QK&#8868; ∈ ℝ^{N×N}</text>
  <text x="760" y="476" font-size="13" fill="#3730a3" text-anchor="middle">Mask: M_{i,j} = 0 if j ≤ i, else −∞</text>
  <text x="760" y="500" font-size="13" fill="#3730a3" text-anchor="middle">Skip block (r,c) if c &gt; r</text>

  <!-- 性能数据 -->
  <g transform="translate(610, 520)">
    <text x="0" y="0" font-size="13" font-weight="bold" fill="#334155">Performance Impact</text>
    <text x="0" y="24" font-size="12" fill="#475569">&#8226; ~1.7&#215;–1.8&#215; speedup vs. standard causal</text>
    <text x="0" y="44" font-size="12" fill="#475569">&#8226; ~50% fewer FLOPs on causal attention</text>
    <text x="0" y="64" font-size="12" fill="#475569">&#8226; No approximation: exact same output</text>
  </g>

  <!-- 箭头：从矩阵到跳过说明 -->
  <line x1="300" y1="360" x2="300" y2="380" stroke="#475569" stroke-width="1.5"/>
  <polygon points="296,376 300,384 304,376" fill="#475569"/>

  <!-- 箭头：从跳过说明到右侧面板 -->
  <line x1="560" y1="430" x2="590" y2="430" stroke="#6366f1" stroke-width="2"/>
  <polygon points="586,426 594,430 586,434" fill="#6366f1"/>

</svg>
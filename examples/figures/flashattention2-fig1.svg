<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" width="960" height="640">
  <rect x="0" y="0" width="960" height="640" fill="#ffffff"/>

  <!-- 标题 -->
  <text x="480" y="36" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">FlashAttention-2: Optimized Causal Masking</text>
  <text x="480" y="58" font-size="13" fill="#64748b" text-anchor="middle">Skip fully-masked blocks; avoid explicit mask for partially-masked blocks</text>

  <!-- 主面板：因果掩码分块示意图 -->
  <rect x="40" y="80" width="520" height="480" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" rx="4"/>
  <text x="300" y="106" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">Causal Mask &amp; Block Partitioning</text>

  <!-- 矩阵网格：6x6 块，每个块 40x40 -->
  <!-- 行标签 -->
  <text x="60" y="140" font-size="12" fill="#334155" text-anchor="end">Q</text>
  <text x="60" y="180" font-size="12" fill="#334155" text-anchor="end">row</text>
  <text x="60" y="220" font-size="12" fill="#334155" text-anchor="end">blocks</text>
  <!-- 列标签 -->
  <text x="140" y="130" font-size="12" fill="#334155" text-anchor="middle">K column blocks</text>

  <!-- 网格背景 -->
  <rect x="70" y="140" width="240" height="240" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>

  <!-- 分块线 -->
  <line x1="150" y1="140" x2="150" y2="380" stroke="#94a3b8" stroke-width="1"/>
  <line x1="230" y1="140" x2="230" y2="380" stroke="#94a3b8" stroke-width="1"/>
  <line x1="70" y1="220" x2="310" y2="220" stroke="#94a3b8" stroke-width="1"/>
  <line x1="70" y1="300" x2="310" y2="300" stroke="#94a3b8" stroke-width="1"/>

  <!-- 块填充：上三角（因果区域） -->
  <!-- 第1行：块0,0 部分可见（对角线） -->
  <rect x="70" y="140" width="80" height="80" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="110" y="185" font-size="11" fill="#3730a3" text-anchor="middle">compute</text>
  <text x="110" y="200" font-size="10" fill="#6366f1" text-anchor="middle">(partial)</text>

  <!-- 第1行：块0,1 完全遮蔽 -->
  <rect x="150" y="140" width="80" height="80" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="190" y="185" font-size="11" fill="#94a3b8" text-anchor="middle">skip</text>

  <!-- 第1行：块0,2 完全遮蔽 -->
  <rect x="230" y="140" width="80" height="80" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="270" y="185" font-size="11" fill="#94a3b8" text-anchor="middle">skip</text>

  <!-- 第2行：块1,0 完全可见 -->
  <rect x="70" y="220" width="80" height="80" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="110" y="265" font-size="11" fill="#3730a3" text-anchor="middle">compute</text>

  <!-- 第2行：块1,1 部分可见 -->
  <rect x="150" y="220" width="80" height="80" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="190" y="265" font-size="11" fill="#3730a3" text-anchor="middle">compute</text>
  <text x="190" y="280" font-size="10" fill="#6366f1" text-anchor="middle">(partial)</text>

  <!-- 第2行：块1,2 完全遮蔽 -->
  <rect x="230" y="220" width="80" height="80" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="270" y="265" font-size="11" fill="#94a3b8" text-anchor="middle">skip</text>

  <!-- 第3行：块2,0 完全可见 -->
  <rect x="70" y="300" width="80" height="80" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="110" y="345" font-size="11" fill="#3730a3" text-anchor="middle">compute</text>

  <!-- 第3行：块2,1 完全可见 -->
  <rect x="150" y="300" width="80" height="80" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="190" y="345" font-size="11" fill="#3730a3" text-anchor="middle">compute</text>

  <!-- 第3行：块2,2 部分可见 -->
  <rect x="230" y="300" width="80" height="80" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="270" y="345" font-size="11" fill="#3730a3" text-anchor="middle">compute</text>
  <text x="270" y="360" font-size="10" fill="#6366f1" text-anchor="middle">(partial)</text>

  <!-- 对角线指示 -->
  <line x1="70" y1="380" x2="310" y2="140" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="315" y="145" font-size="11" fill="#6366f1" text-anchor="start">diagonal</text>

  <!-- 图例：块类型 -->
  <rect x="70" y="400" width="16" height="16" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="92" y="413" font-size="11" fill="#334155">Compute block (at least partially visible)</text>

  <rect x="70" y="425" width="16" height="16" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="92" y="438" font-size="11" fill="#334155">Skip block (fully masked, all col &gt; row)</text>

  <line x1="70" y1="455" x2="86" y2="455" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="92" y="459" font-size="11" fill="#334155">Diagonal boundary (row = col)</text>

  <!-- 右侧面板：算法说明 -->
  <rect x="580" y="80" width="340" height="480" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" rx="4"/>
  <text x="750" y="106" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">Algorithm: Block-Level Causal Masking</text>

  <!-- 条件1 -->
  <rect x="600" y="125" width="300" height="70" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" rx="3"/>
  <text x="750" y="148" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="middle">Condition 1: Fully Masked Block</text>
  <text x="750" y="168" font-size="12" fill="#334155" text-anchor="middle">All column indices &gt; all row indices</text>
  <text x="750" y="185" font-size="12" fill="#6366f1" text-anchor="middle">&#8594; Skip entire block (no computation)</text>

  <!-- 条件2 -->
  <rect x="600" y="210" width="300" height="70" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" rx="3"/>
  <text x="750" y="233" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="middle">Condition 2: Partially Masked Block</text>
  <text x="750" y="253" font-size="12" fill="#334155" text-anchor="middle">Some column indices &gt; row indices</text>
  <text x="750" y="270" font-size="12" fill="#6366f1" text-anchor="middle">&#8594; Compute; no explicit mask needed</text>

  <!-- 条件3 -->
  <rect x="600" y="295" width="300" height="70" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" rx="3"/>
  <text x="750" y="318" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="middle">Condition 3: Fully Visible Block</text>
  <text x="750" y="338" font-size="12" fill="#334155" text-anchor="middle">All column indices &lt; row indices</text>
  <text x="750" y="355" font-size="12" fill="#6366f1" text-anchor="middle">&#8594; Compute normally</text>

  <!-- 性能数据 -->
  <rect x="600" y="385" width="300" height="80" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5" rx="3"/>
  <text x="750" y="410" font-size="13" font-weight="bold" fill="#3730a3" text-anchor="middle">Performance Impact</text>
  <text x="750" y="432" font-size="12" fill="#334155" text-anchor="middle">~50% of blocks skipped for long sequences</text>
  <text x="750" y="452" font-size="12" fill="#334155" text-anchor="middle">Overall speedup: ~1.7&#215; – 1.8&#215;</text>

  <!-- 底部说明 -->
  <rect x="600" y="480" width="300" height="60" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" rx="3"/>
  <text x="750" y="502" font-size="12" fill="#334155" text-anchor="middle">No explicit mask application for</text>
  <text x="750" y="520" font-size="12" fill="#334155" text-anchor="middle">partially-masked blocks (saves non-matmul FLOPs)</text>

  <!-- 箭头图例 -->
  <rect x="40" y="500" width="240" height="60" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="3"/>
  <text x="160" y="520" font-size="11" font-weight="bold" fill="#1e293b" text-anchor="middle">Arrow Legend</text>
  <line x1="55" y1="540" x2="95" y2="540" stroke="#6366f1" stroke-width="1.5"/>
  <polygon points="95,540 88,536 88,544" fill="#6366f1"/>
  <text x="105" y="544" font-size="10" fill="#334155">Block computation flow</text>
</svg>
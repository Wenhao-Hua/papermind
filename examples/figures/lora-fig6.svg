<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" width="960" height="620">
  <rect x="0" y="0" width="960" height="620" fill="#ffffff"/>

  <!-- 标题 -->
  <text x="480" y="36" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">LoRA: Low-Rank Adaptation — Inference-Time Zero Latency via Weight Merging</text>

  <!-- 核心公式面板（强调色框） -->
  <rect x="240" y="56" width="480" height="80" rx="6" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="480" y="82" font-size="14" fill="#3730a3" text-anchor="middle" font-weight="bold">Core Formula: Merged Weight after Training</text>
  <text x="480" y="118" font-size="22" fill="#1e293b" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
    W = W<tspan baseline-shift="sub" font-size="75%">0</tspan> + B A
  </text>

  <!-- 左侧：训练时结构（冻结 + 低秩适配） -->
  <rect x="40" y="160" width="420" height="200" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="250" y="186" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">Training Phase (frozen + low-rank adapters)</text>

  <!-- 预训练权重 W0 框 -->
  <rect x="80" y="200" width="160" height="60" rx="4" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="160" y="228" font-size="13" fill="#334155" text-anchor="middle">Pre-trained</text>
  <text x="160" y="246" font-size="13" fill="#334155" text-anchor="middle">W<tspan baseline-shift="sub" font-size="75%">0</tspan> (frozen)</text>

  <!-- 低秩矩阵 A 和 B -->
  <rect x="280" y="200" width="60" height="60" rx="4" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="310" y="228" font-size="13" fill="#3730a3" text-anchor="middle">A</text>
  <text x="310" y="246" font-size="11" fill="#64748b" text-anchor="middle">r&#215;d</text>

  <rect x="360" y="200" width="60" height="60" rx="4" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="390" y="228" font-size="13" fill="#3730a3" text-anchor="middle">B</text>
  <text x="390" y="246" font-size="11" fill="#64748b" text-anchor="middle">d&#215;r</text>

  <!-- 箭头：W0 → 输出 -->
  <line x1="240" y1="230" x2="280" y2="230" stroke="#475569" stroke-width="1.5"/>
  <polygon points="278,224 288,230 278,236" fill="#475569"/>

  <!-- 箭头：A → B -->
  <line x1="340" y1="230" x2="360" y2="230" stroke="#6366f1" stroke-width="1.5"/>
  <polygon points="358,224 368,230 358,236" fill="#6366f1"/>

  <!-- 输出 -->
  <rect x="80" y="280" width="340" height="40" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="250" y="306" font-size="13" fill="#334155" text-anchor="middle">Output = W<tspan baseline-shift="sub" font-size="75%">0</tspan> x + B A x</text>

  <!-- 右侧：推理时合并权重 -->
  <rect x="500" y="160" width="420" height="200" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="710" y="186" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">Inference Phase (merged weight, zero latency)</text>

  <!-- 合并权重框 -->
  <rect x="540" y="200" width="340" height="60" rx="4" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="710" y="228" font-size="14" fill="#3730a3" text-anchor="middle" font-weight="bold">W = W<tspan baseline-shift="sub" font-size="75%">0</tspan> + B A</text>
  <text x="710" y="248" font-size="12" fill="#64748b" text-anchor="middle">(merged into single matrix)</text>

  <!-- 输出 -->
  <rect x="540" y="280" width="340" height="40" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="710" y="306" font-size="13" fill="#334155" text-anchor="middle">Output = W x</text>

  <!-- 箭头：训练 → 推理 -->
  <line x1="460" y1="260" x2="500" y2="260" stroke="#475569" stroke-width="1.5" stroke-dasharray="6,3"/>
  <polygon points="498,254 508,260 498,266" fill="#475569"/>
  <text x="480" y="252" font-size="11" fill="#64748b" text-anchor="middle">after</text>
  <text x="480" y="266" font-size="11" fill="#64748b" text-anchor="middle">training</text>

  <!-- 底部：对比适配器（带延迟） -->
  <rect x="40" y="390" width="880" height="100" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="480" y="416" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">Why No Latency? — Comparison with Adapter Layers</text>

  <!-- 适配器（带延迟） -->
  <rect x="80" y="432" width="360" height="44" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="260" y="452" font-size="13" fill="#334155" text-anchor="middle">Adapter: sequential extra layers &#8594; latency added</text>
  <text x="260" y="468" font-size="11" fill="#64748b" text-anchor="middle">(must execute adapter after each Transformer block)</text>

  <!-- LoRA（零延迟） -->
  <rect x="520" y="432" width="360" height="44" rx="4" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="700" y="452" font-size="13" fill="#3730a3" text-anchor="middle">LoRA: weights merged &#8594; zero additional latency</text>
  <text x="700" y="468" font-size="11" fill="#64748b" text-anchor="middle">(same architecture as original model)</text>

  <!-- 图例 -->
  <rect x="40" y="510" width="880" height="60" rx="4" fill="#fbfcfe" stroke="#e2e8f0" stroke-width="1"/>
  <text x="60" y="534" font-size="12" font-weight="bold" fill="#1e293b">Legend:</text>

  <line x1="120" y1="530" x2="160" y2="530" stroke="#475569" stroke-width="1.5"/>
  <polygon points="158,524 168,530 158,536" fill="#475569"/>
  <text x="176" y="534" font-size="11" fill="#334155">Data flow</text>

  <line x1="260" y1="530" x2="300" y2="530" stroke="#475569" stroke-width="1.5" stroke-dasharray="6,3"/>
  <polygon points="298,524 308,530 298,536" fill="#475569"/>
  <text x="316" y="534" font-size="11" fill="#334155">Transition (after training)</text>

  <rect x="460" y="522" width="16" height="16" rx="2" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="484" y="534" font-size="11" fill="#334155">Trainable (A, B)</text>

  <rect x="580" y="522" width="16" height="16" rx="2" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="604" y="534" font-size="11" fill="#334155">Frozen (W<tspan baseline-shift="sub" font-size="75%">0</tspan>)</text>

  <rect x="700" y="522" width="16" height="16" rx="2" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="724" y="534" font-size="11" fill="#334155">Merged weight</text>
</svg>
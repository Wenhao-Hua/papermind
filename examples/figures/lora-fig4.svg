<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#1e293b" width="960" height="680">
  <rect x="0" y="0" width="960" height="680" fill="#ffffff"/>

  <!-- 标题 -->
  <text x="480" y="36" font-size="20" font-weight="700" fill="#1e293b" text-anchor="middle">LoRA 权重矩阵选择：应用于 Transformer 注意力模块</text>
  <line x1="200" y1="48" x2="760" y2="48" stroke="#cbd5e1" stroke-width="1"/>

  <!-- 核心公式面板（视觉焦点） -->
  <rect x="60" y="68" width="840" height="80" rx="6" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="480" y="98" font-size="16" font-weight="600" fill="#3730a3" text-anchor="middle">可训练参数量（核心指标）</text>
  <text x="480" y="132" font-size="22" font-weight="700" fill="#3730a3" text-anchor="middle">|Θ| = 2 × L̂<tspan baseline-shift="sub" font-size="75%">LoRA</tspan> × d<tspan baseline-shift="sub" font-size="75%">model</tspan> × r</text>

  <!-- 左侧：Transformer 层结构图 -->
  <rect x="60" y="170" width="420" height="340" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="270" y="196" font-size="14" font-weight="600" fill="#1e293b" text-anchor="middle">Transformer 层（冻结）</text>

  <!-- 外部框：Transformer 层 -->
  <rect x="90" y="210" width="360" height="280" rx="4" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="5,3"/>

  <!-- 注意力模块框 -->
  <rect x="110" y="225" width="320" height="170" rx="4" fill="#f1f5f9" stroke="#475569" stroke-width="1"/>
  <text x="270" y="248" font-size="13" font-weight="600" fill="#1e293b" text-anchor="middle">多头注意力（Multi-Head Attention）</text>

  <!-- 四个权重矩阵：Wq, Wk, Wv, Wo -->
  <!-- Wq（强调色） -->
  <rect x="130" y="262" width="130" height="40" rx="3" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="195" y="287" font-size="13" font-weight="600" fill="#3730a3" text-anchor="middle">W<tspan baseline-shift="sub" font-size="75%">q</tspan>（查询）</text>
  <!-- LoRA 旁路 -->
  <rect x="270" y="262" width="50" height="40" rx="3" fill="#6366f1" stroke="#6366f1" stroke-width="1"/>
  <text x="295" y="287" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">LoRA</text>
  <line x1="260" y1="282" x2="270" y2="282" stroke="#6366f1" stroke-width="2"/>

  <!-- Wk（灰色，冻结） -->
  <rect x="130" y="310" width="130" height="40" rx="3" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="195" y="335" font-size="13" fill="#64748b" text-anchor="middle">W<tspan baseline-shift="sub" font-size="75%">k</tspan>（键）</text>
  <text x="270" y="335" font-size="11" fill="#94a3b8" text-anchor="middle">冻结</text>

  <!-- Wv（强调色） -->
  <rect x="130" y="358" width="130" height="40" rx="3" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="195" y="383" font-size="13" font-weight="600" fill="#3730a3" text-anchor="middle">W<tspan baseline-shift="sub" font-size="75%">v</tspan>（值）</text>
  <rect x="270" y="358" width="50" height="40" rx="3" fill="#6366f1" stroke="#6366f1" stroke-width="1"/>
  <text x="295" y="383" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">LoRA</text>
  <line x1="260" y1="378" x2="270" y2="378" stroke="#6366f1" stroke-width="2"/>

  <!-- Wo（灰色，冻结） -->
  <rect x="130" y="406" width="130" height="40" rx="3" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="195" y="431" font-size="13" fill="#64748b" text-anchor="middle">W<tspan baseline-shift="sub" font-size="75%">o</tspan>（输出）</text>
  <text x="270" y="431" font-size="11" fill="#94a3b8" text-anchor="middle">冻结</text>

  <!-- MLP 模块（冻结） -->
  <rect x="110" y="410" width="320" height="60" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="270" y="435" font-size="13" fill="#64748b" text-anchor="middle">MLP 模块（冻结）</text>
  <text x="270" y="455" font-size="11" fill="#94a3b8" text-anchor="middle">不参与下游任务训练</text>

  <!-- 右侧面板：权重矩阵选择对比 -->
  <rect x="510" y="170" width="390" height="340" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="705" y="196" font-size="14" font-weight="600" fill="#1e293b" text-anchor="middle">权重矩阵选择对比（GPT-3 175B）</text>

  <!-- 表头 -->
  <rect x="530" y="210" width="170" height="30" rx="2" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
  <text x="615" y="230" font-size="12" font-weight="600" fill="#1e293b" text-anchor="middle">适应类型</text>
  <rect x="700" y="210" width="90" height="30" rx="2" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
  <text x="745" y="230" font-size="12" font-weight="600" fill="#1e293b" text-anchor="middle">效果</text>
  <rect x="790" y="210" width="90" height="30" rx="2" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
  <text x="835" y="230" font-size="12" font-weight="600" fill="#1e293b" text-anchor="middle">参数量</text>

  <!-- 行1：Wq + Wv（强调） -->
  <rect x="530" y="244" width="170" height="30" rx="2" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="615" y="264" font-size="12" font-weight="600" fill="#3730a3" text-anchor="middle">W<tspan baseline-shift="sub" font-size="75%">q</tspan> + W<tspan baseline-shift="sub" font-size="75%">v</tspan></text>
  <rect x="700" y="244" width="90" height="30" rx="2" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="745" y="264" font-size="12" font-weight="600" fill="#3730a3" text-anchor="middle">最佳</text>
  <rect x="790" y="244" width="90" height="30" rx="2" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="835" y="264" font-size="12" fill="#3730a3" text-anchor="middle">2×d×r</text>

  <!-- 行2：仅 Wq -->
  <rect x="530" y="280" width="170" height="30" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="615" y="300" font-size="12" fill="#64748b" text-anchor="middle">仅 W<tspan baseline-shift="sub" font-size="75%">q</tspan></text>
  <rect x="700" y="280" width="90" height="30" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="745" y="300" font-size="12" fill="#64748b" text-anchor="middle">次优</text>
  <rect x="790" y="280" width="90" height="30" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="835" y="300" font-size="12" fill="#64748b" text-anchor="middle">d×r</text>

  <!-- 行3：仅 Wv -->
  <rect x="530" y="316" width="170" height="30" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="615" y="336" font-size="12" fill="#64748b" text-anchor="middle">仅 W<tspan baseline-shift="sub" font-size="75%">v</tspan></text>
  <rect x="700" y="316" width="90" height="30" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="745" y="336" font-size="12" fill="#64748b" text-anchor="middle">次优</text>
  <rect x="790" y="316" width="90" height="30" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="835" y="336" font-size="12" fill="#64748b" text-anchor="middle">d×r</text>

  <!-- 行4：全部四种 -->
  <rect x="530" y="352" width="170" height="30" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="615" y="372" font-size="12" fill="#64748b" text-anchor="middle">全部四种</text>
  <rect x="700" y="352" width="90" height="30" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="745" y="372" font-size="12" fill="#64748b" text-anchor="middle">下降</text>
  <rect x="790" y="352" width="90" height="30" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="835" y="372" font-size="12" fill="#64748b" text-anchor="middle">4×d×r</text>

  <!-- 说明文字 -->
  <text x="705" y="410" font-size="12" fill="#64748b" text-anchor="middle">实验结论：同时适应 W<tspan baseline-shift="sub" font-size="75%">q</tspan> 和 W<tspan baseline-shift="sub" font-size="75%">v</tspan></text>
  <text x="705" y="430" font-size="12" fill="#64748b" text-anchor="middle">在相同参数量下效果最佳</text>
  <text x="705" y="450" font-size="12" fill="#64748b" text-anchor="middle">适应单一类型或全部类型</text>
  <text x="705" y="470" font-size="12" fill="#64748b" text-anchor="middle">反而可能降低性能</text>

  <!-- 底部：参数公式说明 -->
  <rect x="60" y="530" width="840" height="60" rx="4" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="480" y="554" font-size="13" font-weight="600" fill="#1e293b" text-anchor="middle">参数公式说明</text>
  <text x="480" y="576" font-size="12" fill="#334155" text-anchor="middle">|Θ| = 2 × L̂<tspan baseline-shift="sub" font-size="75%">LoRA</tspan> × d<tspan baseline-shift="sub" font-size="75%">model</tspan> × r</text>
  <text x="480" y="596" font-size="11" fill="#64748b" text-anchor="middle">其中 L̂<tspan baseline-shift="sub" font-size="75%">LoRA</tspan> 为应用 LoRA 的权重矩阵数量，d<tspan baseline-shift="sub" font-size="75%">model</tspan> 为模型隐藏维度，r 为秩</text>

  <!-- 底部：实验数据 -->
  <rect x="60" y="610" width="840" height="50" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="480" y="634" font-size="12" fill="#334155" text-anchor="middle">GPT-3 175B 实验：r=4，仅适应 W<tspan baseline-shift="sub" font-size="75%">q</tspan> 和 W<tspan baseline-shift="sub" font-size="75%">v</tspan>，检查点从 350GB 降至 35MB（缩小约 10,000×）</text>
  <text x="480" y="652" font-size="11" fill="#64748b" text-anchor="middle">训练 VRAM 从 1.2TB 降至 350GB，训练速度提升 25%</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" width="960" height="640">
  <rect x="0" y="0" width="960" height="640" fill="#ffffff"/>

  <!-- 标题 -->
  <text x="480" y="36" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">Truncated Generalized Advantage Estimation (GAE) in PPO</text>
  <line x1="160" y1="48" x2="800" y2="48" stroke="#cbd5e1" stroke-width="1"/>

  <!-- 核心定义框（强调色） -->
  <rect x="80" y="68" width="800" height="120" rx="4" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="480" y="96" font-size="16" font-weight="bold" fill="#3730a3" text-anchor="middle">Core Definition: Truncated Advantage Estimate</text>
  
  <!-- 公式：A_t = δ_t + (γλ)δ<tspan baseline-shift="sub" font-size="75%">t+1</tspan> + ... + (γλ)<tspan baseline-shift="super" font-size="75%">T-t+1</tspan>δ<tspan baseline-shift="sub" font-size="75%">T-1</tspan> -->
  <text x="480" y="132" font-size="18" fill="#1e293b" text-anchor="middle">
    <tspan font-style="italic">&#770;A</tspan>
    <tspan baseline-shift="sub" font-size="75%">t</tspan>
    <tspan> = &#948;</tspan>
    <tspan baseline-shift="sub" font-size="75%">t</tspan>
    <tspan> + (&#947;&#955;)&#948;</tspan>
    <tspan baseline-shift="sub" font-size="75%">t+1</tspan>
    <tspan> + &#8943; + (&#947;&#955;)</tspan>
    <tspan baseline-shift="super" font-size="75%">T&#8722;t+1</tspan>
    <tspan>&#948;</tspan>
    <tspan baseline-shift="sub" font-size="75%">T&#8722;1</tspan>
  </text>

  <!-- 辅助公式：δ_t = r_t + γV(s<tspan baseline-shift="sub" font-size="75%">t+1</tspan>) - V(s_t) -->
  <text x="480" y="162" font-size="15" fill="#334155" text-anchor="middle">
    <tspan>where &#948;</tspan>
    <tspan baseline-shift="sub" font-size="75%">t</tspan>
    <tspan> = r</tspan>
    <tspan baseline-shift="sub" font-size="75%">t</tspan>
    <tspan> + &#947;V(s</tspan>
    <tspan baseline-shift="sub" font-size="75%">t+1</tspan>
    <tspan>) &#8722; V(s</tspan>
    <tspan baseline-shift="sub" font-size="75%">t</tspan>
    <tspan>)</tspan>
  </text>

  <!-- 左侧：时间轴与片段结构 -->
  <rect x="80" y="210" width="420" height="200" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="290" y="236" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">Trajectory Segment (Length T)</text>

  <!-- 时间轴 -->
  <line x1="120" y1="270" x2="460" y2="270" stroke="#475569" stroke-width="2"/>
  
  <!-- 时间点标记 -->
  <circle cx="140" cy="270" r="4" fill="#6366f1"/>
  <text x="140" y="290" font-size="12" fill="#334155" text-anchor="middle">t</text>
  
  <circle cx="220" cy="270" r="4" fill="#6366f1"/>
  <text x="220" y="290" font-size="12" fill="#334155" text-anchor="middle">t+1</text>
  
  <circle cx="300" cy="270" r="4" fill="#6366f1"/>
  <text x="300" y="290" font-size="12" fill="#334155" text-anchor="middle">t+2</text>
  
  <circle cx="380" cy="270" r="4" fill="#94a3b8"/>
  <text x="380" y="290" font-size="12" fill="#64748b" text-anchor="middle">&#8943;</text>
  
  <circle cx="440" cy="270" r="4" fill="#6366f1"/>
  <text x="440" y="290" font-size="12" fill="#334155" text-anchor="middle">T&#8722;1</text>

  <!-- δ 标注 -->
  <text x="180" y="258" font-size="11" fill="#6366f1" text-anchor="middle">&#948;</text>
  <text x="260" y="258" font-size="11" fill="#6366f1" text-anchor="middle">&#948;</text>
  <text x="340" y="258" font-size="11" fill="#6366f1" text-anchor="middle">&#948;</text>
  <text x="420" y="258" font-size="11" fill="#6366f1" text-anchor="middle">&#948;</text>

  <!-- 截断说明 -->
  <rect x="120" y="310" width="340" height="36" rx="3" fill="#eef2ff" stroke="#6366f1" stroke-width="1"/>
  <text x="290" y="332" font-size="13" fill="#3730a3" text-anchor="middle">Truncation: no dependence on signals beyond T&#8722;1</text>

  <!-- 特殊情况 λ=1 -->
  <rect x="120" y="356" width="340" height="36" rx="3" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="290" y="378" font-size="13" fill="#334155" text-anchor="middle">When &#955;=1: reduces to Monte Carlo return difference</text>

  <!-- 右侧：GAE 展开结构 -->
  <rect x="520" y="210" width="360" height="200" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="700" y="236" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">GAE Expansion (&#947;&#955; weighting)</text>

  <!-- 展开项列表 -->
  <rect x="540" y="252" width="320" height="28" rx="2" fill="#eef2ff" stroke="#6366f1" stroke-width="1"/>
  <text x="700" y="270" font-size="13" fill="#3730a3" text-anchor="middle">&#948;<tspan baseline-shift="sub" font-size="75%">t</tspan> (weight 1)</text>

  <rect x="540" y="286" width="320" height="28" rx="2" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="700" y="304" font-size="13" fill="#334155" text-anchor="middle">(&#947;&#955;)&#948;<tspan baseline-shift="sub" font-size="75%">t+1</tspan></text>

  <rect x="540" y="320" width="320" height="28" rx="2" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="700" y="338" font-size="13" fill="#334155" text-anchor="middle">(&#947;&#955;)<tspan baseline-shift="super" font-size="75%">2</tspan>&#948;<tspan baseline-shift="sub" font-size="75%">t+2</tspan></text>

  <rect x="540" y="354" width="320" height="28" rx="2" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="700" y="372" font-size="13" fill="#334155" text-anchor="middle">&#8943; + (&#947;&#955;)<tspan baseline-shift="super" font-size="75%">T&#8722;t+1</tspan>&#948;<tspan baseline-shift="sub" font-size="75%">T&#8722;1</tspan></text>

  <!-- 底部：PPO 使用说明 -->
  <rect x="80" y="432" width="800" height="80" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="480" y="458" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">Usage in PPO</text>
  <text x="480" y="482" font-size="13" fill="#334155" text-anchor="middle">&#770;A<tspan baseline-shift="sub" font-size="75%">t</tspan> is used in the clipped surrogate objective:</text>
  <text x="480" y="504" font-size="14" fill="#3730a3" text-anchor="middle">
    L<tspan baseline-shift="super" font-size="75%">CLIP</tspan>(&#952;) = &#770;E<tspan baseline-shift="sub" font-size="75%">t</tspan>[min(r<tspan baseline-shift="sub" font-size="75%">t</tspan>(&#952;)&#770;A<tspan baseline-shift="sub" font-size="75%">t</tspan>, clip(r<tspan baseline-shift="sub" font-size="75%">t</tspan>(&#952;), 1&#8722;&#949;, 1+&#949;)&#770;A<tspan baseline-shift="sub" font-size="75%">t</tspan>)]
  </text>

  <!-- 图例 -->
  <rect x="80" y="530" width="800" height="50" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="140" y="558" font-size="12" font-weight="bold" fill="#1e293b" text-anchor="middle">Legend</text>
  
  <line x1="200" y1="554" x2="240" y2="554" stroke="#6366f1" stroke-width="2"/>
  <text x="250" y="558" font-size="12" fill="#334155">Core definition / emphasis</text>
  
  <line x1="420" y1="554" x2="460" y2="554" stroke="#94a3b8" stroke-width="1"/>
  <text x="470" y="558" font-size="12" fill="#334155">Secondary / expansion terms</text>
  
  <rect x="640" y="544" width="16" height="16" rx="2" fill="#eef2ff" stroke="#6366f1" stroke-width="1"/>
  <text x="664" y="558" font-size="12" fill="#334155">Truncation boundary</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" width="960" height="640">
  <rect x="0" y="0" width="960" height="640" fill="#ffffff"/>

  <!-- 标题 -->
  <text x="480" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e293b">Truncated Generalized Advantage Estimation (GAE)</text>

  <!-- 主公式框（核心焦点） -->
  <rect x="120" y="60" width="720" height="80" rx="4" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="480" y="88" text-anchor="middle" font-size="16" font-weight="bold" fill="#3730a3">核心定义：截断优势估计</text>
  <text x="480" y="118" text-anchor="middle" font-size="20" font-family="'Times New Roman','Segoe UI',serif" fill="#1e293b">
    &#x1D6C2;<tspan font-size="14" baseline-shift="sub">t</tspan> = &#x3B4;<tspan font-size="14" baseline-shift="sub">t</tspan> + (&#x3B3;&#x3BB;)&#x3B4;<tspan font-size="14" baseline-shift="sub">t+1</tspan> + (&#x3B3;&#x3BB;)<tspan font-size="14" baseline-shift="super">2</tspan>&#x3B4;<tspan font-size="14" baseline-shift="sub">t+2</tspan> + &#x2026; + (&#x3B3;&#x3BB;)<tspan font-size="14" baseline-shift="super">T&#x2212;t+1</tspan>&#x3B4;<tspan font-size="14" baseline-shift="sub">T&#x2212;1</tspan>
  </text>

  <!-- 时序展开图：时间轴 + 片段 -->
  <text x="480" y="180" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">时序展开：片段截断与优势累加</text>

  <!-- 时间轴 -->
  <line x1="120" y1="210" x2="840" y2="210" stroke="#475569" stroke-width="1.5"/>
  <!-- 时间刻度 -->
  <line x1="120" y1="205" x2="120" y2="215" stroke="#475569" stroke-width="1"/>
  <text x="120" y="230" text-anchor="middle" font-size="11" fill="#64748b">t=0</text>
  <line x1="360" y1="205" x2="360" y2="215" stroke="#475569" stroke-width="1"/>
  <text x="360" y="230" text-anchor="middle" font-size="11" fill="#64748b">t</text>
  <line x1="600" y1="205" x2="600" y2="215" stroke="#475569" stroke-width="1"/>
  <text x="600" y="230" text-anchor="middle" font-size="11" fill="#64748b">t+1</text>
  <line x1="840" y1="205" x2="840" y2="215" stroke="#475569" stroke-width="1"/>
  <text x="840" y="230" text-anchor="middle" font-size="11" fill="#64748b">T&#x2212;1</text>

  <!-- 片段框 -->
  <rect x="120" y="240" width="720" height="40" rx="3" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="480" y="266" text-anchor="middle" font-size="13" fill="#334155">完整轨迹片段 (t = 0, 1, …, T&#x2212;1)</text>

  <!-- 截断范围指示 -->
  <rect x="360" y="240" width="240" height="40" rx="3" fill="none" stroke="#6366f1" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="480" y="300" text-anchor="middle" font-size="12" fill="#6366f1" font-weight="bold">截断窗口：从 t 到 T&#x2212;1</text>

  <!-- 右侧图例面板 -->
  <rect x="780" y="320" width="160" height="140" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="860" y="340" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">图例</text>
  <line x1="795" y1="360" x2="830" y2="360" stroke="#475569" stroke-width="1.5"/>
  <text x="840" y="364" font-size="11" fill="#64748b">时间轴</text>
  <rect x="795" y="375" width="35" height="12" rx="2" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="840" y="386" font-size="11" fill="#64748b">轨迹片段</text>
  <rect x="795" y="395" width="35" height="12" rx="2" fill="none" stroke="#6366f1" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="840" y="406" font-size="11" fill="#64748b">截断窗口</text>
  <line x1="795" y1="425" x2="830" y2="425" stroke="#6366f1" stroke-width="2"/>
  <polygon points="830,425 822,420 822,430" fill="#6366f1"/>
  <text x="840" y="429" font-size="11" fill="#64748b">优势累加方向</text>

  <!-- δ_t 定义框 -->
  <rect x="120" y="330" width="640" height="60" rx="4" fill="#fbfcfe" stroke="#cbd5e1" stroke-width="1"/>
  <text x="140" y="355" font-size="13" font-weight="bold" fill="#334155">TD 残差定义</text>
  <text x="140" y="378" font-size="15" font-family="'Times New Roman','Segoe UI',serif" fill="#1e293b">
    &#x3B4;<tspan font-size="11" baseline-shift="sub">t</tspan> = r<tspan font-size="11" baseline-shift="sub">t</tspan> + &#x3B3; V(s<tspan font-size="11" baseline-shift="sub">t+1</tspan>) &#x2212; V(s<tspan font-size="11" baseline-shift="sub">t</tspan>)
  </text>

  <!-- 特例说明 -->
  <rect x="120" y="410" width="640" height="50" rx="4" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="140" y="435" font-size="12" font-weight="bold" fill="#334155">特例：&#x3BB; = 1 时退化为蒙特卡洛返回差</text>
  <text x="140" y="452" font-size="12" fill="#64748b">
    &#x1D6C2;<tspan font-size="10" baseline-shift="sub">t</tspan> = &#x2211;<tspan font-size="10" baseline-shift="sub">k=0</tspan><tspan font-size="10" baseline-shift="super">T&#x2212;t&#x2212;1</tspan> &#x3B3;<tspan font-size="10" baseline-shift="super">k</tspan> &#x3B4;<tspan font-size="10" baseline-shift="sub">t+k</tspan> = R<tspan font-size="10" baseline-shift="sub">t</tspan> &#x2212; V(s<tspan font-size="10" baseline-shift="sub">t</tspan>)
  </text>

  <!-- 底部说明 -->
  <text x="480" y="500" text-anchor="middle" font-size="12" fill="#64748b">不依赖未来超出片段的信号，仅使用片段内 TD 残差加权求和</text>

  <!-- 箭头：从 δ_t 到优势累加 -->
  <line x1="480" y1="390" x2="480" y2="410" stroke="#6366f1" stroke-width="2"/>
  <polygon points="480,410 474,402 486,402" fill="#6366f1"/>

  <!-- 箭头：从时间轴到片段 -->
  <line x1="480" y1="230" x2="480" y2="240" stroke="#94a3b8" stroke-width="1.5"/>
  <polygon points="480,240 476,234 484,234" fill="#94a3b8"/>

  <!-- 箭头：从片段到截断窗口 -->
  <line x1="480" y1="280" x2="480" y2="295" stroke="#6366f1" stroke-width="1.5"/>
  <polygon points="480,295 476,289 484,289" fill="#6366f1"/>

  <!-- 累加方向箭头（在时间轴上方） -->
  <line x1="360" y1="195" x2="840" y2="195" stroke="#6366f1" stroke-width="2"/>
  <polygon points="840,195 832,189 832,201" fill="#6366f1"/>
  <text x="600" y="190" text-anchor="middle" font-size="11" fill="#6366f1">累加方向 (k = 0 → T&#x2212;t&#x2212;1)</text>

  <!-- 参数标注 -->
  <text x="120" y="560" font-size="12" fill="#64748b">参数：&#x3B3; = 折扣因子, &#x3BB; = GAE 平滑参数, T = 片段长度</text>
</svg>
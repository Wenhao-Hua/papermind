<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" width="960" height="640">
  <rect x="0" y="0" width="960" height="640" fill="#ffffff"/>

  <!-- 主标题 -->
  <text x="480" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e293b">Llama 2-Chat RLHF: PPO with Piecewise Reward &amp; KL Penalty</text>

  <!-- ===== 左侧主面板：核心公式与流程 ===== -->
  <rect x="40" y="56" width="620" height="560" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" rx="4"/>

  <!-- 1) 核心公式（视觉焦点） -->
  <rect x="60" y="72" width="580" height="80" fill="#eef2ff" stroke="#6366f1" stroke-width="1.8" rx="4"/>
  <text x="350" y="96" text-anchor="middle" font-size="14" font-weight="bold" fill="#3730a3">Objective: Maximize Reward with KL Penalty</text>
  <text x="350" y="130" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">
    R(g | p) = 
    <tspan font-style="italic">R</tspan>
    <tspan baseline-shift="super" font-size="75%">c</tspan>
    <tspan font-style="italic">(g | p) &#8722; &#946; D</tspan>
    <tspan baseline-shift="sub" font-size="75%">KL</tspan>
    <tspan>(&#960;</tspan>
    <tspan baseline-shift="sub" font-size="75%">&#952;</tspan>
    <tspan>(g | p) &#8741; &#960;</tspan>
    <tspan baseline-shift="sub" font-size="75%">0</tspan>
    <tspan>(g | p))</tspan>
  </text>

  <!-- 2) 组合奖励 R_c 的定义 -->
  <rect x="60" y="168" width="580" height="100" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" rx="3"/>
  <text x="350" y="190" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">Piecewise Reward: R</text>
  <text x="350" y="190" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">
    <tspan>Piecewise Reward: R</tspan>
    <tspan baseline-shift="sub" font-size="75%">c</tspan>
    <tspan> = </tspan>
  </text>
  <text x="350" y="210" text-anchor="middle" font-size="12" fill="#475569">
    <tspan font-style="italic">R</tspan>
    <tspan baseline-shift="sub" font-size="75%">s</tspan>
    <tspan>(g | p)  if prompt is safety category OR safety score &lt; 0.15</tspan>
  </text>
  <text x="350" y="232" text-anchor="middle" font-size="12" fill="#475569">
    <tspan font-style="italic">R</tspan>
    <tspan baseline-shift="sub" font-size="75%">h</tspan>
    <tspan>(g | p)  otherwise</tspan>
  </text>
  <text x="350" y="256" text-anchor="middle" font-size="11" fill="#64748b">R</text>
  <text x="350" y="256" text-anchor="middle" font-size="11" fill="#64748b">
    <tspan>R</tspan>
    <tspan baseline-shift="sub" font-size="75%">s</tspan>
    <tspan> = safety reward model, R</tspan>
    <tspan baseline-shift="sub" font-size="75%">h</tspan>
    <tspan> = helpfulness reward model</tspan>
  </text>

  <!-- 3) 白化处理 -->
  <rect x="60" y="284" width="580" height="70" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" rx="3"/>
  <text x="350" y="306" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">Whitening of R</text>
  <text x="350" y="306" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">
    <tspan>Whitening of R</tspan>
    <tspan baseline-shift="sub" font-size="75%">c</tspan>
    <tspan> via logit inverse sigmoid</tspan>
  </text>
  <text x="350" y="330" text-anchor="middle" font-size="12" fill="#475569">
    <tspan>R</tspan>
    <tspan baseline-shift="super" font-size="75%">&#8764;</tspan>
    <tspan baseline-shift="sub" font-size="75%">c</tspan>
    <tspan> = sigmoid</tspan>
    <tspan baseline-shift="super" font-size="75%">&#8722;1</tspan>
    <tspan>(R</tspan>
    <tspan baseline-shift="sub" font-size="75%">c</tspan>
    <tspan>)  then  z-score normalization</tspan>
  </text>
  <text x="350" y="348" text-anchor="middle" font-size="11" fill="#64748b">Stabilizes training &amp; balances with KL penalty term</text>

  <!-- 4) PPO 优化流程 -->
  <rect x="60" y="370" width="580" height="230" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" rx="3"/>
  <text x="350" y="394" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">PPO Optimization Loop</text>

  <!-- 流程框：纵向 -->
  <rect x="120" y="412" width="160" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" rx="3"/>
  <text x="200" y="438" text-anchor="middle" font-size="12" fill="#1e293b">Policy &#960;</text>
  <text x="200" y="438" text-anchor="middle" font-size="12" fill="#1e293b">
    <tspan>Policy &#960;</tspan>
    <tspan baseline-shift="sub" font-size="75%">&#952;</tspan>
    <tspan> generates g</tspan>
  </text>

  <rect x="120" y="476" width="160" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" rx="3"/>
  <text x="200" y="502" text-anchor="middle" font-size="12" fill="#1e293b">Reward R</text>
  <text x="200" y="502" text-anchor="middle" font-size="12" fill="#1e293b">
    <tspan>Reward R</tspan>
    <tspan baseline-shift="super" font-size="75%">&#8764;</tspan>
    <tspan baseline-shift="sub" font-size="75%">c</tspan>
    <tspan> computed</tspan>
  </text>

  <rect x="120" y="540" width="160" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" rx="3"/>
  <text x="200" y="566" text-anchor="middle" font-size="12" fill="#1e293b">KL penalty applied</text>

  <!-- 箭头：纵向 -->
  <line x1="200" y1="456" x2="200" y2="476" stroke="#475569" stroke-width="1.5"/>
  <polygon points="196,472 200,480 204,472" fill="#475569"/>
  <line x1="200" y1="520" x2="200" y2="540" stroke="#475569" stroke-width="1.5"/>
  <polygon points="196,536 200,544 204,536" fill="#475569"/>

  <!-- 右侧：更新公式 -->
  <rect x="340" y="412" width="260" height="172" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="3"/>
  <text x="470" y="436" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">Policy Gradient Update</text>
  <text x="470" y="462" text-anchor="middle" font-size="11" fill="#475569">
    <tspan>&#8711;J(&#952;) = E[&#8711; log &#960;</tspan>
    <tspan baseline-shift="sub" font-size="75%">&#952;</tspan>
    <tspan>(g|p) &#183; A]</tspan>
  </text>
  <text x="470" y="488" text-anchor="middle" font-size="11" fill="#475569">
    <tspan>A = R</tspan>
    <tspan baseline-shift="super" font-size="75%">&#8764;</tspan>
    <tspan baseline-shift="sub" font-size="75%">c</tspan>
    <tspan> &#8722; &#946; D</tspan>
    <tspan baseline-shift="sub" font-size="75%">KL</tspan>
    <tspan>(&#960;</tspan>
    <tspan baseline-shift="sub" font-size="75%">&#952;</tspan>
    <tspan> &#8741; &#960;</tspan>
    <tspan baseline-shift="sub" font-size="75%">0</tspan>
    <tspan>)</tspan>
  </text>
  <text x="470" y="514" text-anchor="middle" font-size="11" fill="#475569">Clip ratio to [1&#8722;&#949;, 1+&#949;]</text>
  <text x="470" y="540" text-anchor="middle" font-size="11" fill="#475569">Update &#952; via AdamW</text>
  <text x="470" y="566" text-anchor="middle" font-size="11" fill="#64748b">Iterate until convergence</text>

  <!-- ===== 右侧面板：图例与说明 ===== -->
  <rect x="680" y="56" width="240" height="560" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" rx="4"/>

  <!-- 图例 -->
  <text x="800" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">Legend</text>

  <rect x="700" y="100" width="200" height="120" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" rx="3"/>
  <line x1="710" y1="120" x2="750" y2="120" stroke="#475569" stroke-width="1.5"/>
  <polygon points="746,116 754,120 746,124" fill="#475569"/>
  <text x="760" y="124" font-size="11" fill="#475569">Data flow</text>

  <line x1="710" y1="148" x2="750" y2="148" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,4"/>
  <polygon points="746,144 754,148 746,152" fill="#94a3b8"/>
  <text x="760" y="152" font-size="11" fill="#475569">Reference / baseline</text>

  <line x1="710" y1="176" x2="750" y2="176" stroke="#6366f1" stroke-width="2.5"/>
  <polygon points="746,172 754,176 746,180" fill="#6366f1"/>
  <text x="760" y="180" font-size="11" fill="#475569">Selected / emphasized</text>

  <!-- 符号说明 -->
  <text x="800" y="244" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">Notation</text>

  <rect x="700" y="260" width="200" height="160" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" rx="3"/>
  <text x="710" y="282" font-size="11" fill="#475569">p = prompt</text>
  <text x="710" y="302" font-size="11" fill="#475569">g = generated response</text>
  <text x="710" y="322" font-size="11" fill="#475569">&#960;</text>
  <text x="710" y="322" font-size="11" fill="#475569">
    <tspan>&#960;</tspan>
    <tspan baseline-shift="sub" font-size="75%">&#952;</tspan>
    <tspan> = current policy</tspan>
  </text>
  <text x="710" y="342" font-size="11" fill="#475569">
    <tspan>&#960;</tspan>
    <tspan baseline-shift="sub" font-size="75%">0</tspan>
    <tspan> = initial policy (SFT)</tspan>
  </text>
  <text x="710" y="362" font-size="11" fill="#475569">
    <tspan>R</tspan>
    <tspan baseline-shift="sub" font-size="75%">s</tspan>
    <tspan> = safety reward model</tspan>
  </text>
  <text x="710" y="382" font-size="11" fill="#475569">
    <tspan>R</tspan>
    <tspan baseline-shift="sub" font-size="75%">h</tspan>
    <tspan> = helpfulness reward model</tspan>
  </text>
  <text x="710" y="402" font-size="11" fill="#475569">
    <tspan>R</tspan>
    <tspan baseline-shift="super" font-size="75%">&#8764;</tspan>
    <tspan baseline-shift="sub" font-size="75%">c</tspan>
    <tspan> = whitened combined reward</tspan>
  </text>

  <!-- 关键参数 -->
  <text x="800" y="448" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">Key Parameters</text>

  <rect x="700" y="464" width="200" height="100" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" rx="3"/>
  <text x="710" y="486" font-size="11" fill="#475569">
    <tspan>&#946; = KL penalty coefficient</tspan>
  </text>
  <text x="710" y="506" font-size="11" fill="#475569">
    <tspan>&#949; = PPO clip range (e.g., 0.2)</tspan>
  </text>
  <text x="710" y="526" font-size="11" fill="#475569">
    <tspan>Safety threshold = 0.15</tspan>
  </text>
  <text x="710" y="546" font-size="11" fill="#475569">
    <tspan>Learning rate: AdamW</tspan>
  </text>

  <!-- 底部说明 -->
  <text x="800" y="596" text-anchor="middle" font-size="10" fill="#64748b">Based on Llama 2: Open Foundation and Fine-Tuned Chat Models</text>
</svg>
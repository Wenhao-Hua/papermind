<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" width="960" height="680">
  <rect x="0" y="0" width="960" height="680" fill="#ffffff"/>

  <!-- 标题 -->
  <text x="480" y="36" font-size="20" font-weight="700" fill="#1e293b" text-anchor="middle">PPO with Piecewise Reward &amp; KL Penalty (Llama 2-Chat RLHF)</text>

  <!-- ====== 主面板：核心公式 ====== -->
  <rect x="40" y="56" width="880" height="110" rx="6" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="480" y="82" font-size="16" font-weight="600" fill="#3730a3" text-anchor="middle">Final Reward Function (Optimization Objective)</text>
  <text x="480" y="118" font-size="22" font-weight="700" fill="#1e293b" text-anchor="middle">R(g | p) = R̃_c(g | p) − β · D_KL( π_θ(g | p) ∥ π_0(g | p) )</text>
  <text x="480" y="148" font-size="13" fill="#334155" text-anchor="middle">where R̃_c = whitened combination reward; β = KL penalty coefficient</text>

  <!-- ====== 左侧：奖励组合机制 ====== -->
  <rect x="40" y="182" width="440" height="240" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="260" y="206" font-size="14" font-weight="600" fill="#1e293b" text-anchor="middle">Piecewise Reward Composition</text>

  <!-- 条件判断框 -->
  <rect x="80" y="220" width="360" height="36" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="260" y="243" font-size="13" fill="#334155" text-anchor="middle">Is prompt p in safety category OR safety score &lt; 0.15?</text>

  <!-- 分支箭头 -->
  <line x1="260" y1="256" x2="140" y2="280" stroke="#475569" stroke-width="1.5"/>
  <polygon points="140,280 146,274 146,286" fill="#475569"/>
  <line x1="260" y1="256" x2="380" y2="280" stroke="#475569" stroke-width="1.5"/>
  <polygon points="380,280 374,274 374,286" fill="#475569"/>

  <text x="120" y="274" font-size="11" fill="#64748b" text-anchor="middle">Yes</text>
  <text x="400" y="274" font-size="11" fill="#64748b" text-anchor="middle">No</text>

  <!-- 左分支：安全奖励 -->
  <rect x="60" y="286" width="160" height="44" rx="4" fill="#eef2ff" stroke="#6366f1" stroke-width="1.2"/>
  <text x="140" y="306" font-size="13" font-weight="600" fill="#3730a3" text-anchor="middle">R_s(g | p)</text>
  <text x="140" y="322" font-size="11" fill="#64748b" text-anchor="middle">Safety Reward Model</text>

  <!-- 右分支：帮助性奖励 -->
  <rect x="300" y="286" width="160" height="44" rx="4" fill="#eef2ff" stroke="#6366f1" stroke-width="1.2"/>
  <text x="380" y="306" font-size="13" font-weight="600" fill="#3730a3" text-anchor="middle">R_h(g | p)</text>
  <text x="380" y="322" font-size="11" fill="#64748b" text-anchor="middle">Helpfulness Reward Model</text>

  <!-- 合并箭头 -->
  <line x1="140" y1="330" x2="140" y2="350" stroke="#475569" stroke-width="1.2"/>
  <line x1="140" y1="350" x2="380" y2="350" stroke="#475569" stroke-width="1.2"/>
  <line x1="380" y1="330" x2="380" y2="350" stroke="#475569" stroke-width="1.2"/>
  <line x1="140" y1="350" x2="260" y2="370" stroke="#475569" stroke-width="1.5"/>
  <polygon points="260,370 252,364 252,376" fill="#475569"/>

  <!-- 组合奖励 -->
  <rect x="180" y="370" width="160" height="36" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="260" y="393" font-size="13" font-weight="600" fill="#1e293b" text-anchor="middle">R_c(g | p)</text>

  <!-- 白化处理 -->
  <line x1="260" y1="406" x2="260" y2="420" stroke="#475569" stroke-width="1.5"/>
  <polygon points="260,420 254,414 266,414" fill="#475569"/>
  <rect x="180" y="420" width="160" height="36" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="260" y="443" font-size="13" font-weight="600" fill="#1e293b" text-anchor="middle">R̃_c = whiten(R_c)</text>

  <!-- ====== 右侧：KL 惩罚与策略更新 ====== -->
  <rect x="500" y="182" width="420" height="240" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="710" y="206" font-size="14" font-weight="600" fill="#1e293b" text-anchor="middle">KL Penalty &amp; Policy Update</text>

  <!-- 策略 π_θ -->
  <rect x="540" y="220" width="160" height="44" rx="4" fill="#eef2ff" stroke="#6366f1" stroke-width="1.2"/>
  <text x="620" y="240" font-size="14" font-weight="600" fill="#3730a3" text-anchor="middle">π_θ(g | p)</text>
  <text x="620" y="256" font-size="11" fill="#64748b" text-anchor="middle">Current Policy</text>

  <!-- 原始策略 π_0 -->
  <rect x="720" y="220" width="160" height="44" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="800" y="240" font-size="14" font-weight="600" fill="#334155" text-anchor="middle">π_0(g | p)</text>
  <text x="800" y="256" font-size="11" fill="#64748b" text-anchor="middle">Original Policy (frozen)</text>

  <!-- KL 散度 -->
  <line x1="700" y1="242" x2="720" y2="242" stroke="#475569" stroke-width="1.2"/>
  <text x="710" y="236" font-size="11" fill="#64748b" text-anchor="middle">KL</text>

  <rect x="540" y="280" width="340" height="36" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="710" y="303" font-size="13" font-weight="600" fill="#1e293b" text-anchor="middle">D_KL( π_θ ∥ π_0 ) = Σ π_θ log(π_θ / π_0)</text>

  <!-- 最终奖励 -->
  <line x1="710" y1="316" x2="710" y2="340" stroke="#475569" stroke-width="1.5"/>
  <polygon points="710,340 704,334 716,334" fill="#475569"/>
  <rect x="540" y="340" width="340" height="36" rx="4" fill="#eef2ff" stroke="#6366f1" stroke-width="1.2"/>
  <text x="710" y="363" font-size="14" font-weight="600" fill="#3730a3" text-anchor="middle">R = R̃_c − β · D_KL</text>

  <!-- PPO 更新 -->
  <line x1="710" y1="376" x2="710" y2="400" stroke="#475569" stroke-width="1.5"/>
  <polygon points="710,400 704,394 716,394" fill="#475569"/>
  <rect x="540" y="400" width="340" height="36" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="710" y="423" font-size="13" font-weight="600" fill="#1e293b" text-anchor="middle">θ ← argmax_θ E[ R ]  (PPO clipped surrogate)</text>

  <!-- ====== 底部：图例 ====== -->
  <rect x="40" y="440" width="880" height="80" rx="4" fill="#fbfcfe" stroke="#e2e8f0" stroke-width="1"/>
  <text x="60" y="462" font-size="12" font-weight="600" fill="#1e293b">Legend</text>

  <!-- 图例项 -->
  <line x1="60" y1="482" x2="100" y2="482" stroke="#6366f1" stroke-width="2"/>
  <polygon points="100,482 96,478 96,486" fill="#6366f1"/>
  <text x="108" y="486" font-size="11" fill="#334155">Forward flow / data dependency</text>

  <line x1="60" y1="502" x2="100" y2="502" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5,4"/>
  <text x="108" y="506" font-size="11" fill="#334155">Reference / frozen component</text>

  <rect x="300" y="472" width="14" height="14" rx="2" fill="#eef2ff" stroke="#6366f1" stroke-width="1.2"/>
  <text x="320" y="484" font-size="11" fill="#334155">Active / learned component</text>

  <rect x="300" y="492" width="14" height="14" rx="2" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="320" y="504" font-size="11" fill="#334155">Fixed / auxiliary component</text>

  <!-- ====== 底部说明 ====== -->
  <text x="480" y="548" font-size="12" fill="#64748b" text-anchor="middle">R_c = piecewise(R_s, R_h) based on safety category/score; whiten via inverse sigmoid + standardization</text>
  <text x="480" y="568" font-size="12" fill="#64748b" text-anchor="middle">β controls trade-off between reward maximization and staying close to π_0 (prevents reward hacking)</text>

  <!-- 小注脚 -->
  <text x="480" y="600" font-size="11" fill="#94a3b8" text-anchor="middle">Based on Llama 2: Open Foundation and Fine-Tuned Chat Models (Touvron et al., 2023, §3.2.3)</text>
</svg>
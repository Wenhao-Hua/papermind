<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#1e293b">
<rect x="0" y="0" width="960" height="680" fill="#ffffff"/>

<!-- 标题 -->
<text x="480" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">Safety-Helpfulness Reward Composition in RLHF (PPO Stage)</text>

<!-- 主公式框 -->
<rect x="60" y="60" width="840" height="120" rx="6" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="480" y="90" text-anchor="middle" font-size="16" font-weight="700" fill="#3730a3">Core Reward Function</text>
<text x="480" y="122" text-anchor="middle" font-size="15" fill="#1e293b">R<text y="122" x="496" font-size="11" baseline-shift="sub">c</text>(g | p) = {</text>
<text x="500" y="144" text-anchor="start" font-size="14" fill="#334155">R<text y="144" x="516" font-size="10" baseline-shift="sub">s</text>(g | p) &amp;nbsp; if is_safety(p) or R<text y="144" x="640" font-size="10" baseline-shift="sub">s</text>(g | p) &lt; 0.15</text>
<text x="500" y="166" text-anchor="start" font-size="14" fill="#334155">R<text y="166" x="516" font-size="10" baseline-shift="sub">h</text>(g | p) &amp;nbsp; otherwise</text>
<text x="480" y="166" text-anchor="end" font-size="14" fill="#334155">}</text>

<!-- 白化公式 -->
<rect x="60" y="200" width="840" height="60" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="480" y="228" text-anchor="middle" font-size="15" fill="#1e293b">Whiten: &amp;nbsp; R&#771;<text y="228" x="530" font-size="11" baseline-shift="sub">c</text>(g | p) = whiten( logit( R<text y="228" x="630" font-size="11" baseline-shift="sub">c</text>(g | p) ) )</text>
<text x="480" y="250" text-anchor="middle" font-size="13" fill="#64748b">Final reward = R&#771;<text y="250" x="530" font-size="10" baseline-shift="sub">c</text> &amp;minus; &amp;beta; &amp;middot; D<text y="250" x="590" font-size="10" baseline-shift="sub">KL</text></text>

<!-- 左侧：决策流程 -->
<rect x="60" y="290" width="400" height="360" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="260" y="318" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">Decision Flow</text>

<!-- 输入提示 -->
<rect x="140" y="340" width="240" height="40" rx="4" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
<text x="260" y="365" text-anchor="middle" font-size="14" fill="#1e293b">Prompt p</text>

<!-- 判断菱形 -->
<polygon points="260,410 340,450 260,490 180,450" fill="#ffffff" stroke="#6366f1" stroke-width="2"/>
<text x="260" y="448" text-anchor="middle" font-size="12" fill="#3730a3">is_safety(p)</text>
<text x="260" y="464" text-anchor="middle" font-size="12" fill="#3730a3">or R<text y="464" x="290" font-size="9" baseline-shift="sub">s</text>&lt;0.15?</text>

<!-- 是 -->
<text x="340" y="440" text-anchor="start" font-size="12" fill="#6366f1">Yes</text>
<line x1="340" y1="450" x2="420" y2="450" stroke="#6366f1" stroke-width="1.5"/>
<polygon points="420,445 430,450 420,455" fill="#6366f1"/>

<rect x="430" y="430" width="180" height="40" rx="4" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
<text x="520" y="455" text-anchor="middle" font-size="14" font-weight="600" fill="#3730a3">R<text y="455" x="536" font-size="10" baseline-shift="sub">s</text>(g|p) (Safety RM)</text>

<!-- 否 -->
<text x="340" y="480" text-anchor="start" font-size="12" fill="#64748b">No</text>
<line x1="260" y1="490" x2="260" y2="530" stroke="#64748b" stroke-width="1.5"/>
<polygon points="255,530 260,540 265,530" fill="#64748b"/>

<rect x="140" y="540" width="240" height="40" rx="4" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
<text x="260" y="565" text-anchor="middle" font-size="14" fill="#1e293b">R<text y="565" x="276" font-size="10" baseline-shift="sub">h</text>(g|p) (Helpfulness RM)</text>

<!-- 合并 -->
<line x1="520" y1="470" x2="520" y2="510" stroke="#6366f1" stroke-width="1.5"/>
<line x1="260" y1="580" x2="520" y2="580" stroke="#64748b" stroke-width="1.5"/>
<line x1="520" y1="510" x2="520" y2="580" stroke="#6366f1" stroke-width="1.5"/>
<line x1="520" y1="580" x2="520" y2="610" stroke="#1e293b" stroke-width="2"/>
<polygon points="515,610 520,620 525,610" fill="#1e293b"/>

<rect x="420" y="620" width="200" height="36" rx="4" fill="#ffffff" stroke="#1e293b" stroke-width="2"/>
<text x="520" y="643" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">R<text y="643" x="536" font-size="10" baseline-shift="sub">c</text>(g|p)</text>

<!-- 右侧：映射与图例 -->
<rect x="500" y="290" width="400" height="360" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="700" y="318" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">Mapping &amp; Legend</text>

<!-- 二部图：提示→奖励模型 -->
<text x="700" y="350" text-anchor="middle" font-size="13" fill="#334155">Prompt-to-RM Assignment</text>

<!-- 左列：提示 -->
<circle cx="580" cy="380" r="6" fill="#6366f1"/>
<text x="580" y="380" text-anchor="end" font-size="11" fill="#1e293b" dx="-12">p (unsafe)</text>
<circle cx="580" cy="420" r="6" fill="#64748b"/>
<text x="580" y="420" text-anchor="end" font-size="11" fill="#1e293b" dx="-12">p (safe)</text>
<circle cx="580" cy="460" r="6" fill="#64748b"/>
<text x="580" y="460" text-anchor="end" font-size="11" fill="#1e293b" dx="-12">p (neutral)</text>

<!-- 右列：RM -->
<rect x="760" y="370" width="100" height="24" rx="3" fill="#eef2ff" stroke="#6366f1" stroke-width="1"/>
<text x="810" y="387" text-anchor="middle" font-size="12" fill="#3730a3">R<text y="387" x="824" font-size="9" baseline-shift="sub">s</text></text>
<rect x="760" y="410" width="100" height="24" rx="3" fill="#f8fafc" stroke="#475569" stroke-width="1"/>
<text x="810" y="427" text-anchor="middle" font-size="12" fill="#1e293b">R<text y="427" x="824" font-size="9" baseline-shift="sub">h</text></text>
<rect x="760" y="450" width="100" height="24" rx="3" fill="#f8fafc" stroke="#475569" stroke-width="1"/>
<text x="810" y="467" text-anchor="middle" font-size="12" fill="#1e293b">R<text y="467" x="824" font-size="9" baseline-shift="sub">h</text></text>

<!-- 连边 -->
<line x1="586" y1="380" x2="760" y2="382" stroke="#6366f1" stroke-width="2"/>
<line x1="586" y1="420" x2="760" y2="422" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,4"/>
<line x1="586" y1="460" x2="760" y2="462" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,4"/>

<!-- 图例 -->
<text x="700" y="510" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">Legend</text>
<line x1="620" y1="530" x2="660" y2="530" stroke="#6366f1" stroke-width="2"/>
<text x="670" y="534" text-anchor="start" font-size="12" fill="#334155">Safety RM selected (unsafe prompt)</text>
<line x1="620" y1="555" x2="660" y2="555" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,4"/>
<text x="670" y="559" text-anchor="start" font-size="12" fill="#334155">Helpfulness RM selected (safe prompt)</text>
<line x1="620" y1="580" x2="660" y2="580" stroke="#1e293b" stroke-width="2"/>
<polygon points="660,575 670,580 660,585" fill="#1e293b"/>
<text x="670" y="584" text-anchor="start" font-size="12" fill="#334155">Final composed reward R<text y="584" x="790" font-size="9" baseline-shift="sub">c</text></text>

<!-- 白化说明 -->
<text x="700" y="620" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">Whiten Step</text>
<text x="700" y="642" text-anchor="middle" font-size="12" fill="#64748b">logit(R<text y="642" x="730" font-size="9" baseline-shift="sub">c</text>) → z-score → R&#771;<text y="642" x="790" font-size="9" baseline-shift="sub">c</text></text>
<text x="700" y="660" text-anchor="middle" font-size="12" fill="#64748b">Stabilizes reward distribution; balances KL penalty</text>

</svg>
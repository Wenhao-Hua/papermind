<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#1e293b" width="960" height="680">
  <rect x="0" y="0" width="960" height="680" fill="#ffffff"/>

  <!-- 标题 -->
  <text x="480" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">Scaled Dot-Product Attention</text>
  <text x="480" y="54" text-anchor="middle" font-size="13" fill="#64748b">Attention(Q, K, V) = softmax( Q K&#8868; / &#8730;d<tspan baseline-shift="sub" font-size="75%">k</tspan> ) V</text>

  <!-- 核心公式框（强调色） -->
  <rect x="240" y="72" width="480" height="60" rx="6" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="480" y="100" text-anchor="middle" font-size="16" font-weight="bold" fill="#3730a3">Attention(Q, K, V) = softmax</text>
  <text x="480" y="122" text-anchor="middle" font-size="15" fill="#3730a3">( Q K&#8868; / &#8730;d<tspan baseline-shift="sub" font-size="75%">k</tspan> ) V</text>

  <!-- 左侧：输入矩阵表示 -->
  <g transform="translate(60, 160)">
    <text x="0" y="0" font-size="13" font-weight="bold" fill="#334155">Inputs</text>

    <!-- Q 矩阵 -->
    <rect x="0" y="14" width="100" height="80" rx="3" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
    <text x="50" y="38" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e293b">Q</text>
    <text x="50" y="56" text-anchor="middle" font-size="11" fill="#64748b">(n &#215; d<tspan baseline-shift="sub" font-size="75%">k</tspan>)</text>
    <text x="50" y="76" text-anchor="middle" font-size="11" fill="#64748b">queries</text>

    <!-- K 矩阵 -->
    <rect x="120" y="14" width="100" height="80" rx="3" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
    <text x="170" y="38" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e293b">K</text>
    <text x="170" y="56" text-anchor="middle" font-size="11" fill="#64748b">(m &#215; d<tspan baseline-shift="sub" font-size="75%">k</tspan>)</text>
    <text x="170" y="76" text-anchor="middle" font-size="11" fill="#64748b">keys</text>

    <!-- V 矩阵 -->
    <rect x="240" y="14" width="100" height="80" rx="3" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
    <text x="290" y="38" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e293b">V</text>
    <text x="290" y="56" text-anchor="middle" font-size="11" fill="#64748b">(m &#215; d<tspan baseline-shift="sub" font-size="75%">v</tspan>)</text>
    <text x="290" y="76" text-anchor="middle" font-size="11" fill="#64748b">values</text>
  </g>

  <!-- 箭头：Q, K, V 进入计算 -->
  <!-- Q 到 MatMul -->
  <line x1="110" y1="240" x2="110" y2="290" stroke="#6366f1" stroke-width="1.5"/>
  <polygon points="110,295 106,286 114,286" fill="#6366f1"/>
  <!-- K 到 MatMul -->
  <line x1="230" y1="240" x2="230" y2="290" stroke="#6366f1" stroke-width="1.5"/>
  <polygon points="230,295 226,286 234,286" fill="#6366f1"/>
  <!-- V 到 MatMul -->
  <line x1="350" y1="240" x2="350" y2="290" stroke="#6366f1" stroke-width="1.5"/>
  <polygon points="350,295 346,286 354,286" fill="#6366f1"/>

  <!-- 计算步骤（纵向流程） -->
  <g transform="translate(60, 300)">
    <!-- Step 1: MatMul Q K^T -->
    <rect x="0" y="0" width="140" height="36" rx="4" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
    <text x="70" y="22" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e293b">MatMul</text>
    <text x="70" y="22" text-anchor="middle" font-size="10" fill="#64748b" dy="10">Q K&#8868;</text>

    <!-- 箭头向下 -->
    <line x1="70" y1="36" x2="70" y2="56" stroke="#475569" stroke-width="1.5"/>
    <polygon points="70,60 66,52 74,52" fill="#475569"/>

    <!-- Step 2: Scale -->
    <rect x="0" y="60" width="140" height="36" rx="4" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
    <text x="70" y="82" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e293b">Scale</text>
    <text x="70" y="82" text-anchor="middle" font-size="10" fill="#64748b" dy="10">&#247; &#8730;d<tspan baseline-shift="sub" font-size="75%">k</tspan></text>

    <!-- 箭头向下 -->
    <line x1="70" y1="96" x2="70" y2="116" stroke="#475569" stroke-width="1.5"/>
    <polygon points="70,120 66,112 74,112" fill="#475569"/>

    <!-- Step 3: Mask (opt.) -->
    <rect x="0" y="120" width="140" height="36" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,3"/>
    <text x="70" y="142" text-anchor="middle" font-size="12" fill="#64748b">Mask (opt.)</text>

    <!-- 箭头向下 -->
    <line x1="70" y1="156" x2="70" y2="176" stroke="#475569" stroke-width="1.5"/>
    <polygon points="70,180 66,172 74,172" fill="#475569"/>

    <!-- Step 4: Softmax -->
    <rect x="0" y="180" width="140" height="36" rx="4" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
    <text x="70" y="202" text-anchor="middle" font-size="12" font-weight="bold" fill="#3730a3">Softmax</text>

    <!-- 箭头向下 -->
    <line x1="70" y1="216" x2="70" y2="236" stroke="#475569" stroke-width="1.5"/>
    <polygon points="70,240 66,232 74,232" fill="#475569"/>

    <!-- Step 5: MatMul with V -->
    <rect x="0" y="240" width="140" height="36" rx="4" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
    <text x="70" y="262" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e293b">MatMul</text>
    <text x="70" y="262" text-anchor="middle" font-size="10" fill="#64748b" dy="10">&#215; V</text>
  </g>

  <!-- 输出 -->
  <g transform="translate(60, 580)">
    <rect x="0" y="0" width="140" height="36" rx="4" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
    <text x="70" y="22" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e293b">Output</text>
    <text x="70" y="22" text-anchor="middle" font-size="10" fill="#64748b" dy="10">(n &#215; d<tspan baseline-shift="sub" font-size="75%">v</tspan>)</text>
  </g>
  <line x1="130" y1="576" x2="130" y2="580" stroke="#475569" stroke-width="1.5"/>
  <polygon points="130,584 126,576 134,576" fill="#475569"/>

  <!-- 右侧：图例与说明面板 -->
  <g transform="translate(520, 160)">
    <rect x="0" y="0" width="380" height="460" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="190" y="24" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">Figure 1: Scaled Dot-Product Attention</text>

    <!-- 图例 -->
    <text x="16" y="52" font-size="11" font-weight="bold" fill="#475569">Legend</text>
    <line x1="16" y1="68" x2="56" y2="68" stroke="#6366f1" stroke-width="1.5"/>
    <polygon points="56,68 52,64 60,64" fill="#6366f1"/>
    <text x="64" y="72" font-size="11" fill="#475569">Data flow</text>

    <line x1="16" y1="88" x2="56" y2="88" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,3"/>
    <text x="64" y="92" font-size="11" fill="#475569">Optional mask</text>

    <rect x="16" y="104" width="40" height="16" rx="2" fill="#eef2ff" stroke="#6366f1" stroke-width="1"/>
    <text x="64" y="117" font-size="11" fill="#475569">Key operation (emphasis)</text>

    <!-- 机制说明 -->
    <text x="16" y="148" font-size="11" font-weight="bold" fill="#475569">Mechanism</text>
    <text x="16" y="168" font-size="11" fill="#334155">1. Compute attention scores: Q K&#8868;</text>
    <text x="16" y="186" font-size="11" fill="#334155">2. Scale by 1/&#8730;d<tspan baseline-shift="sub" font-size="75%">k</tspan> to prevent large dot products</text>
    <text x="16" y="204" font-size="11" fill="#334155">3. Apply softmax to obtain weights on values</text>
    <text x="16" y="222" font-size="11" fill="#334155">4. Weighted sum with V to produce output</text>

    <!-- 缩放原因 -->
    <text x="16" y="252" font-size="11" font-weight="bold" fill="#475569">Why scaling?</text>
    <text x="16" y="272" font-size="11" fill="#334155">For large d<tspan baseline-shift="sub" font-size="75%">k</tspan>, dot products grow large in</text>
    <text x="16" y="290" font-size="11" fill="#334155">magnitude, pushing softmax into regions</text>
    <text x="16" y="308" font-size="11" fill="#334155">with extremely small gradients.</text>
    <text x="16" y="326" font-size="11" fill="#334155">Scaling by &#8730;d<tspan baseline-shift="sub" font-size="75%">k</tspan> counteracts this effect.</text>

    <!-- 维度说明 -->
    <text x="16" y="356" font-size="11" font-weight="bold" fill="#475569">Dimensions</text>
    <text x="16" y="376" font-size="11" fill="#334155">n: number of queries</text>
    <text x="16" y="394" font-size="11" fill="#334155">m: number of key-value pairs</text>
    <text x="16" y="412" font-size="11" fill="#334155">d<tspan baseline-shift="sub" font-size="75%">k</tspan>: dimension of keys/queries</text>
    <text x="16" y="430" font-size="11" fill="#334155">d<tspan baseline-shift="sub" font-size="75%">v</tspan>: dimension of values</text>
  </g>

  <!-- 底部引用 -->
  <text x="480" y="660" text-anchor="middle" font-size="10" fill="#94a3b8">Vaswani et al. (2017) — Attention Is All You Need</text>
</svg>
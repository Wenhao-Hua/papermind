<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" width="960" height="680">
  <rect x="0" y="0" width="960" height="680" fill="#ffffff"/>

  <!-- 标题 -->
  <text x="480" y="36" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">Sinusoidal Positional Encoding</text>
  <text x="480" y="58" font-size="13" fill="#64748b" text-anchor="middle">Transformer (Vaswani et al., 2017) — Section 3.5</text>

  <!-- 核心公式框（视觉焦点） -->
  <rect x="180" y="80" width="600" height="130" rx="6" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="480" y="108" font-size="15" font-weight="bold" fill="#3730a3" text-anchor="middle">Definition: Sinusoidal Positional Encoding</text>
  <text x="480" y="138" font-size="14" fill="#1e293b" text-anchor="middle">PE(pos, 2i) = sin(pos / 10000^(2i / d_model))</text>
  <text x="480" y="162" font-size="14" fill="#1e293b" text-anchor="middle">PE(pos, 2i+1) = cos(pos / 10000^(2i / d_model))</text>
  <text x="480" y="190" font-size="12" fill="#475569" text-anchor="middle">pos: position in sequence (0,1,2,…) ; i: dimension index (0 ≤ i &lt; d_model/2) ; d_model: model dimension</text>

  <!-- 左侧：编码生成示意 -->
  <rect x="50" y="240" width="420" height="200" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="260" y="266" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">Encoding Generation for Each Position</text>

  <!-- 位置序列 -->
  <text x="80" y="300" font-size="12" fill="#334155" text-anchor="start">pos = 0</text>
  <text x="80" y="330" font-size="12" fill="#334155" text-anchor="start">pos = 1</text>
  <text x="80" y="360" font-size="12" fill="#334155" text-anchor="start">pos = 2</text>
  <text x="80" y="390" font-size="12" fill="#334155" text-anchor="start">pos = 3</text>
  <text x="80" y="420" font-size="12" fill="#334155" text-anchor="start">…</text>

  <!-- 箭头从位置到编码 -->
  <line x1="120" y1="300" x2="170" y2="300" stroke="#6366f1" stroke-width="1.5"/>
  <polygon points="170,295 180,300 170,305" fill="#6366f1"/>
  <line x1="120" y1="330" x2="170" y2="330" stroke="#6366f1" stroke-width="1.5"/>
  <polygon points="170,325 180,330 170,335" fill="#6366f1"/>
  <line x1="120" y1="360" x2="170" y2="360" stroke="#6366f1" stroke-width="1.5"/>
  <polygon points="170,355 180,360 170,365" fill="#6366f1"/>
  <line x1="120" y1="390" x2="170" y2="390" stroke="#6366f1" stroke-width="1.5"/>
  <polygon points="170,385 180,390 170,395" fill="#6366f1"/>

  <!-- 编码向量示意 -->
  <rect x="185" y="286" width="260" height="28" rx="3" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <text x="315" y="305" font-size="11" fill="#475569" text-anchor="middle">[sin(0), cos(0), sin(0/10000^(2/…)), …]</text>
  <rect x="185" y="316" width="260" height="28" rx="3" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <text x="315" y="335" font-size="11" fill="#475569" text-anchor="middle">[sin(1), cos(1), sin(1/10000^(2/…)), …]</text>
  <rect x="185" y="346" width="260" height="28" rx="3" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <text x="315" y="365" font-size="11" fill="#475569" text-anchor="middle">[sin(2), cos(2), sin(2/10000^(2/…)), …]</text>
  <rect x="185" y="376" width="260" height="28" rx="3" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <text x="315" y="395" font-size="11" fill="#475569" text-anchor="middle">[sin(3), cos(3), sin(3/10000^(2/…)), …]</text>

  <!-- 右侧：性质面板 -->
  <rect x="500" y="240" width="410" height="200" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="705" y="266" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">Key Properties</text>

  <!-- 性质1 -->
  <rect x="520" y="280" width="370" height="44" rx="3" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="705" y="300" font-size="12" font-weight="bold" fill="#1e293b" text-anchor="middle">Relative Position Representation</text>
  <text x="705" y="316" font-size="11" fill="#475569" text-anchor="middle">PE(pos+k) can be linearly expressed from PE(pos)</text>

  <!-- 性质2 -->
  <rect x="520" y="334" width="370" height="44" rx="3" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="705" y="354" font-size="12" font-weight="bold" fill="#1e293b" text-anchor="middle">Bounded &amp; Extrapolatable</text>
  <text x="705" y="370" font-size="11" fill="#475569" text-anchor="middle">Values in [−1, 1]; works for unseen longer sequences</text>

  <!-- 性质3 -->
  <rect x="520" y="388" width="370" height="44" rx="3" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="705" y="408" font-size="12" font-weight="bold" fill="#1e293b" text-anchor="middle">Unique per Position</text>
  <text x="705" y="424" font-size="11" fill="#475569" text-anchor="middle">Each pos gets a distinct encoding (different frequencies)</text>

  <!-- 底部：频率与维度关系 -->
  <rect x="50" y="470" width="860" height="190" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="480" y="496" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">Frequency Decay Across Dimensions (d_model = 512)</text>

  <!-- 小表格：维度 vs 频率 -->
  <rect x="80" y="514" width="800" height="130" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <!-- 表头 -->
  <rect x="80" y="514" width="160" height="30" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="160" y="534" font-size="12" font-weight="bold" fill="#1e293b" text-anchor="middle">Dimension i</text>
  <rect x="240" y="514" width="160" height="30" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="320" y="534" font-size="12" font-weight="bold" fill="#1e293b" text-anchor="middle">Frequency ω_i</text>
  <rect x="400" y="514" width="160" height="30" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="480" y="534" font-size="12" font-weight="bold" fill="#1e293b" text-anchor="middle">Period (2π/ω_i)</text>
  <rect x="560" y="514" width="160" height="30" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="640" y="534" font-size="12" font-weight="bold" fill="#1e293b" text-anchor="middle">Role</text>
  <rect x="720" y="514" width="160" height="30" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="800" y="534" font-size="12" font-weight="bold" fill="#1e293b" text-anchor="middle">Example pos</text>

  <!-- 行1 -->
  <rect x="80" y="544" width="160" height="25" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="160" y="561" font-size="11" fill="#334155" text-anchor="middle">0</text>
  <rect x="240" y="544" width="160" height="25" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="320" y="561" font-size="11" fill="#334155" text-anchor="middle">1 / 10000^(0/512) = 1</text>
  <rect x="400" y="544" width="160" height="25" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="480" y="561" font-size="11" fill="#334155" text-anchor="middle">2π</text>
  <rect x="560" y="544" width="160" height="25" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="640" y="561" font-size="11" fill="#334155" text-anchor="middle">Coarse position</text>
  <rect x="720" y="544" width="160" height="25" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="800" y="561" font-size="11" fill="#334155" text-anchor="middle">0, 1, 2, 3</text>

  <!-- 行2 -->
  <rect x="80" y="569" width="160" height="25" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="160" y="586" font-size="11" fill="#334155" text-anchor="middle">128</text>
  <rect x="240" y="569" width="160" height="25" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="320" y="586" font-size="11" fill="#334155" text-anchor="middle">1 / 10000^(128/512) ≈ 0.1</text>
  <rect x="400" y="569" width="160" height="25" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="480" y="586" font-size="11" fill="#334155" text-anchor="middle">~63</text>
  <rect x="560" y="569" width="160" height="25" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="640" y="586" font-size="11" fill="#334155" text-anchor="middle">Medium granularity</text>
  <rect x="720" y="569" width="160" height="25" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="800" y="586" font-size="11" fill="#334155" text-anchor="middle">0, 1, 2, 3</text>

  <!-- 行3 -->
  <rect x="80" y="594" width="160" height="25" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="160" y="611" font-size="11" fill="#334155" text-anchor="middle">255</text>
  <rect x="240" y="594" width="160" height="25" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="320" y="611" font-size="11" fill="#334155" text-anchor="middle">1 / 10000^(255/512) ≈ 0.01</text>
  <rect x="400" y="594" width="160" height="25" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="480" y="611" font-size="11" fill="#334155" text-anchor="middle">~628</text>
  <rect x="560" y="594" width="160" height="25" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="640" y="611" font-size="11" fill="#334155" text-anchor="middle">Fine-grained detail</text>
  <rect x="720" y="594" width="160" height="25" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="800" y="611" font-size="11" fill="#334155" text-anchor="middle">0, 1, 2, 3</text>

  <!-- 行4 -->
  <rect x="80" y="619" width="160" height="25" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="160" y="636" font-size="11" fill="#334155" text-anchor="middle">511</text>
  <rect x="240" y="619" width="160" height="25" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="320" y="636" font-size="11" fill="#334155" text-anchor="middle">1 / 10000^(511/512) ≈ 0.0001</text>
  <rect x="400" y="619" width="160" height="25" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="480" y="636" font-size="11" fill="#334155" text-anchor="middle">~62832</text>
  <rect x="560" y="619" width="160" height="25" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="640" y="636" font-size="11" fill="#334155" text-anchor="middle">Very fine detail</text>
  <rect x="720" y="619" width="160" height="25" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="800" y="636" font-size="11" fill="#334155" text-anchor="middle">0, 1, 2, 3</text>

  <!-- 图例 -->
  <rect x="50" y="240" width="12" height="12" rx="2" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="68" y="250" font-size="11" fill="#475569">Core definition (formula)</text>
  <rect x="50" y="258" width="12" height="12" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="68" y="268" font-size="11" fill="#475569">Supporting explanation</text>
</svg>
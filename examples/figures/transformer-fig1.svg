<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" width="960" height="620">
  <rect x="0" y="0" width="960" height="620" fill="#ffffff"/>

  <!-- 主标题 -->
  <text x="480" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">Scaled Dot-Product Attention</text>

  <!-- 核心公式框（视觉焦点，强调色） -->
  <rect x="240" y="56" width="480" height="52" rx="6" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="480" y="80" text-anchor="middle" font-size="18" font-weight="bold" fill="#3730a3">Attention(Q, K, V) = softmax</text>
  <text x="480" y="100" text-anchor="middle" font-size="18" font-weight="bold" fill="#3730a3">( QK&#8868; / &#8730;d&#8320; ) V</text>

  <!-- 左侧：矩阵运算图 -->
  <g transform="translate(60, 140)">
    <!-- 标题 -->
    <text x="180" y="0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">Matrix Computation</text>

    <!-- Q 矩阵 -->
    <rect x="60" y="20" width="120" height="80" rx="3" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
    <text x="120" y="55" text-anchor="middle" font-size="13" fill="#1e293b">Q</text>
    <text x="120" y="75" text-anchor="middle" font-size="11" fill="#64748b">(n &#215; d&#8320;)</text>

    <!-- K&#8868; 矩阵 -->
    <rect x="220" y="20" width="80" height="120" rx="3" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
    <text x="260" y="55" text-anchor="middle" font-size="13" fill="#1e293b">K&#8868;</text>
    <text x="260" y="75" text-anchor="middle" font-size="11" fill="#64748b">(d&#8320; &#215; n)</text>

    <!-- 乘号 -->
    <text x="195" y="70" text-anchor="middle" font-size="20" fill="#1e293b">&#215;</text>

    <!-- 结果矩阵 QK&#8868; -->
    <rect x="340" y="40" width="100" height="80" rx="3" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
    <text x="390" y="75" text-anchor="middle" font-size="13" fill="#1e293b">QK&#8868;</text>
    <text x="390" y="95" text-anchor="middle" font-size="11" fill="#64748b">(n &#215; n)</text>

    <!-- 箭头 Q → QK&#8868; -->
    <line x1="180" y1="60" x2="220" y2="60" stroke="#475569" stroke-width="1.5"/>
    <polygon points="218,55 228,60 218,65" fill="#475569"/>

    <!-- 箭头 K&#8868; → QK&#8868; -->
    <line x1="300" y1="60" x2="340" y2="60" stroke="#475569" stroke-width="1.5"/>
    <polygon points="338,55 348,60 338,65" fill="#475569"/>

    <!-- 缩放 / &#8730;d&#8320; -->
    <rect x="340" y="130" width="100" height="36" rx="3" fill="#f8fafc" stroke="#6366f1" stroke-width="1.5"/>
    <text x="390" y="153" text-anchor="middle" font-size="12" fill="#3730a3">&#247; &#8730;d&#8320;</text>

    <!-- 箭头 QK&#8868; → 缩放 -->
    <line x1="390" y1="120" x2="390" y2="130" stroke="#475569" stroke-width="1.5"/>
    <polygon points="385,128 390,138 395,128" fill="#475569"/>

    <!-- softmax -->
    <rect x="340" y="176" width="100" height="36" rx="3" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
    <text x="390" y="199" text-anchor="middle" font-size="12" fill="#1e293b">softmax</text>

    <!-- 箭头 缩放 → softmax -->
    <line x1="390" y1="166" x2="390" y2="176" stroke="#475569" stroke-width="1.5"/>
    <polygon points="385,174 390,184 395,174" fill="#475569"/>

    <!-- V 矩阵 -->
    <rect x="480" y="176" width="80" height="100" rx="3" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
    <text x="520" y="215" text-anchor="middle" font-size="13" fill="#1e293b">V</text>
    <text x="520" y="235" text-anchor="middle" font-size="11" fill="#64748b">(n &#215; d&#8320;)</text>

    <!-- 乘号 -->
    <text x="455" y="205" text-anchor="middle" font-size="20" fill="#1e293b">&#215;</text>

    <!-- 箭头 softmax → 乘 -->
    <line x1="440" y1="194" x2="460" y2="194" stroke="#475569" stroke-width="1.5"/>
    <polygon points="458,189 468,194 458,199" fill="#475569"/>

    <!-- 箭头 V → 乘 -->
    <line x1="480" y1="194" x2="460" y2="194" stroke="#475569" stroke-width="1.5"/>
    <polygon points="462,189 452,194 462,199" fill="#475569"/>

    <!-- 输出矩阵 -->
    <rect x="340" y="230" width="100" height="36" rx="3" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
    <text x="390" y="253" text-anchor="middle" font-size="13" font-weight="bold" fill="#3730a3">Output</text>

    <!-- 箭头 乘 → 输出 -->
    <line x1="390" y1="212" x2="390" y2="230" stroke="#475569" stroke-width="1.5"/>
    <polygon points="385,228 390,238 395,228" fill="#475569"/>
  </g>

  <!-- 右侧：图例与说明 -->
  <g transform="translate(620, 140)">
    <rect x="0" y="0" width="300" height="440" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="150" y="24" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">Legend &amp; Notation</text>

    <!-- 图例项 -->
    <line x1="20" y1="50" x2="60" y2="50" stroke="#475569" stroke-width="1.5"/>
    <polygon points="58,45 68,50 58,55" fill="#475569"/>
    <text x="80" y="54" font-size="11" fill="#334155">Data flow (forward)</text>

    <line x1="20" y1="76" x2="60" y2="76" stroke="#6366f1" stroke-width="1.5"/>
    <polygon points="58,71 68,76 58,81" fill="#6366f1"/>
    <text x="80" y="80" font-size="11" fill="#334155">Scaled / emphasized step</text>

    <line x1="20" y1="102" x2="60" y2="102" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,4"/>
    <polygon points="58,97 68,102 58,107" fill="#94a3b8"/>
    <text x="80" y="106" font-size="11" fill="#334155">Reference / skip</text>

    <!-- 分隔线 -->
    <line x1="20" y1="126" x2="280" y2="126" stroke="#e2e8f0" stroke-width="1"/>

    <!-- 记号说明 -->
    <text x="20" y="150" font-size="12" font-weight="bold" fill="#1e293b">Dimensions</text>
    <text x="20" y="172" font-size="11" fill="#334155">n = sequence length</text>
    <text x="20" y="192" font-size="11" fill="#334155">d&#8320; = key / query dimension</text>
    <text x="20" y="212" font-size="11" fill="#334155">d&#8321; = value dimension</text>

    <text x="20" y="240" font-size="12" font-weight="bold" fill="#1e293b">Key Formula</text>
    <text x="20" y="262" font-size="11" fill="#334155">Attention(Q,K,V) =</text>
    <text x="20" y="280" font-size="11" fill="#334155">softmax( QK&#8868; / &#8730;d&#8320; ) V</text>

    <text x="20" y="310" font-size="12" font-weight="bold" fill="#1e293b">Scaling Purpose</text>
    <text x="20" y="332" font-size="11" fill="#334155">Prevents dot products from</text>
    <text x="20" y="350" font-size="11" fill="#334155">growing large for large d&#8320;,</text>
    <text x="20" y="368" font-size="11" fill="#334155">avoiding softmax saturation.</text>

    <text x="20" y="398" font-size="12" font-weight="bold" fill="#1e293b">Paper Reference</text>
    <text x="20" y="418" font-size="11" fill="#64748b">Vaswani et al. (2017)</text>
    <text x="20" y="436" font-size="11" fill="#64748b">Section 3.2.1</text>
  </g>

  <!-- 底部：集合/映射显式表示 -->
  <g transform="translate(60, 420)">
    <text x="180" y="0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">Explicit Mapping: Q, K, V as Sets</text>

    <!-- Q 集合 -->
    <rect x="0" y="16" width="160" height="100" rx="3" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="80" y="36" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e293b">Q = {q&#8320;, q&#8321;, …, q&#8345;&#8322;}</text>
    <text x="80" y="56" text-anchor="middle" font-size="11" fill="#64748b">(n queries)</text>
    <text x="80" y="76" text-anchor="middle" font-size="11" fill="#64748b">each q&#7522; &#8712; &#8477;&#8310;&#8320;</text>
    <text x="80" y="96" text-anchor="middle" font-size="11" fill="#64748b">(d&#8320;-dim vector)</text>

    <!-- K 集合 -->
    <rect x="180" y="16" width="160" height="100" rx="3" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="260" y="36" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e293b">K = {k&#8320;, k&#8321;, …, k&#8345;&#8322;}</text>
    <text x="260" y="56" text-anchor="middle" font-size="11" fill="#64748b">(n keys)</text>
    <text x="260" y="76" text-anchor="middle" font-size="11" fill="#64748b">each k&#7522; &#8712; &#8477;&#8310;&#8320;</text>
    <text x="260" y="96" text-anchor="middle" font-size="11" fill="#64748b">(d&#8320;-dim vector)</text>

    <!-- V 集合 -->
    <rect x="360" y="16" width="160" height="100" rx="3" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="440" y="36" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e293b">V = {v&#8320;, v&#8321;, …, v&#8345;&#8322;}</text>
    <text x="440" y="56" text-anchor="middle" font-size="11" fill="#64748b">(n values)</text>
    <text x="440" y="76" text-anchor="middle" font-size="11" fill="#64748b">each v&#7522; &#8712; &#8477;&#8310;&#8321;</text>
    <text x="440" y="96" text-anchor="middle" font-size="11" fill="#64748b">(d&#8321;-dim vector)</text>

    <!-- 映射箭头：Q,K → dot product -->
    <text x="170" y="70" text-anchor="middle" font-size="14" fill="#6366f1">&#8594;</text>
    <text x="350" y="70" text-anchor="middle" font-size="14" fill="#6366f1">&#8594;</text>

    <!-- 底部：二部图示意（选中的匹配） -->
    <text x="540" y="36" font-size="12" font-weight="bold" fill="#1e293b">Attention Weights (n &#215; n)</text>
    <text x="540" y="56" font-size="11" fill="#334155">&#945;&#7522;&#7523; = softmax( q&#7522;·k&#7523; / &#8730;d&#8320; )</text>
    <text x="540" y="76" font-size="11" fill="#334155">Output = &#8721;&#7523; &#945;&#7522;&#7523; v&#7523;</text>
    <text x="540" y="96" font-size="11" fill="#64748b">(weighted sum over values)</text>
  </g>
</svg>
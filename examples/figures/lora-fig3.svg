<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" width="960" height="620">
  <rect x="0" y="0" width="960" height="620" fill="#ffffff"/>

  <!-- 标题 -->
  <text x="480" y="36" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">LoRA: Low-Rank Adaptation — 核心机制</text>

  <!-- 主公式框（视觉焦点） -->
  <rect x="200" y="56" width="560" height="72" rx="6" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="480" y="84" font-size="22" font-weight="bold" fill="#3730a3" text-anchor="middle">前向传播：h = W&#8320; x + B A x</text>
  <text x="480" y="112" font-size="15" fill="#334155" text-anchor="middle">冻结预训练权重 W&#8320; &#8712; &#8477;<tspan baseline-shift="super" font-size="75%">d&#215;k</tspan>，注入可训练低秩矩阵 B &#8712; &#8477;<tspan baseline-shift="super" font-size="75%">d&#215;r</tspan>，A &#8712; &#8477;<tspan baseline-shift="super" font-size="75%">r&#215;k</tspan>，r &#8810; min(d,k)</text>

  <!-- 左侧：矩阵结构示意 -->
  <rect x="60" y="156" width="380" height="240" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="250" y="180" font-size="15" font-weight="bold" fill="#1e293b" text-anchor="middle">参数分解结构</text>

  <!-- W0 矩阵 -->
  <rect x="100" y="196" width="120" height="80" rx="2" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="160" y="240" font-size="13" fill="#1e293b" text-anchor="middle">W&#8320;</text>
  <text x="160" y="258" font-size="11" fill="#64748b" text-anchor="middle">d &#215; k（冻结）</text>

  <!-- 加号 -->
  <text x="240" y="240" font-size="20" fill="#1e293b" text-anchor="middle">+</text>

  <!-- B 矩阵 -->
  <rect x="260" y="196" width="60" height="80" rx="2" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="290" y="240" font-size="13" fill="#3730a3" text-anchor="middle">B</text>
  <text x="290" y="258" font-size="11" fill="#64748b" text-anchor="middle">d&#215;r</text>

  <!-- A 矩阵 -->
  <rect x="330" y="196" width="80" height="80" rx="2" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="370" y="240" font-size="13" fill="#3730a3" text-anchor="middle">A</text>
  <text x="370" y="258" font-size="11" fill="#64748b" text-anchor="middle">r&#215;k</text>

  <!-- 连乘箭头 -->
  <line x1="320" y1="236" x2="330" y2="236" stroke="#6366f1" stroke-width="1.5"/>
  <polygon points="330,232 338,236 330,240" fill="#6366f1"/>

  <!-- 初始化说明 -->
  <text x="250" y="300" font-size="12" fill="#334155" text-anchor="middle">初始化：A ~ &#8474;(0, &#963;<tspan baseline-shift="super" font-size="75%">2</tspan>)，B = 0</text>
  <text x="250" y="320" font-size="12" fill="#334155" text-anchor="middle">训练开始时 &#8710;W = BA = 0</text>
  <text x="250" y="340" font-size="12" fill="#334155" text-anchor="middle">推理时可合并：W&#8242; = W&#8320; + BA</text>

  <!-- 右侧：二部图映射 -->
  <rect x="470" y="156" width="430" height="240" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="685" y="180" font-size="15" font-weight="bold" fill="#1e293b" text-anchor="middle">低秩映射示意（r = 2 示例）</text>

  <!-- 左列节点：输入维度 d -->
  <circle cx="520" cy="210" r="6" fill="#475569"/>
  <circle cx="520" cy="240" r="6" fill="#475569"/>
  <circle cx="520" cy="270" r="6" fill="#475569"/>
  <circle cx="520" cy="300" r="6" fill="#475569"/>
  <circle cx="520" cy="330" r="6" fill="#475569"/>
  <text x="520" y="360" font-size="11" fill="#64748b" text-anchor="middle">d 维</text>

  <!-- 中间节点：低秩 r -->
  <circle cx="685" cy="225" r="8" fill="#6366f1"/>
  <circle cx="685" cy="285" r="8" fill="#6366f1"/>
  <text x="685" y="360" font-size="11" fill="#64748b" text-anchor="middle">r 维（r &#8810; d,k）</text>

  <!-- 右列节点：输出维度 k -->
  <circle cx="850" cy="210" r="6" fill="#475569"/>
  <circle cx="850" cy="240" r="6" fill="#475569"/>
  <circle cx="850" cy="270" r="6" fill="#475569"/>
  <circle cx="850" cy="300" r="6" fill="#475569"/>
  <circle cx="850" cy="330" r="6" fill="#475569"/>
  <text x="850" y="360" font-size="11" fill="#64748b" text-anchor="middle">k 维</text>

  <!-- 连边：A 映射（d→r） -->
  <line x1="526" y1="210" x2="677" y2="225" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="526" y1="240" x2="677" y2="225" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="526" y1="270" x2="677" y2="285" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="526" y1="300" x2="677" y2="285" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="526" y1="330" x2="677" y2="285" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- 连边：B 映射（r→k） -->
  <line x1="693" y1="225" x2="844" y2="210" stroke="#6366f1" stroke-width="1.5"/>
  <line x1="693" y1="225" x2="844" y2="240" stroke="#6366f1" stroke-width="1.5"/>
  <line x1="693" y1="285" x2="844" y2="270" stroke="#6366f1" stroke-width="1.5"/>
  <line x1="693" y1="285" x2="844" y2="300" stroke="#6366f1" stroke-width="1.5"/>
  <line x1="693" y1="285" x2="844" y2="330" stroke="#6366f1" stroke-width="1.5"/>

  <!-- 标签 -->
  <text x="600" y="210" font-size="11" fill="#64748b" text-anchor="middle">A</text>
  <text x="770" y="240" font-size="11" fill="#6366f1" text-anchor="middle">B</text>

  <!-- 底部：参数量对比 -->
  <rect x="60" y="420" width="840" height="100" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="480" y="446" font-size="15" font-weight="bold" fill="#1e293b" text-anchor="middle">参数量对比（以 GPT-3 175B 为例）</text>

  <!-- 全微调 -->
  <rect x="100" y="462" width="220" height="40" rx="4" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="210" y="488" font-size="14" fill="#1e293b" text-anchor="middle">全微调：175B 参数</text>

  <!-- LoRA -->
  <rect x="370" y="462" width="220" height="40" rx="4" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="480" y="488" font-size="14" fill="#3730a3" text-anchor="middle">LoRA：~17M 参数（&#215;10,000）</text>

  <!-- 推理 -->
  <rect x="640" y="462" width="220" height="40" rx="4" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="750" y="488" font-size="14" fill="#1e293b" text-anchor="middle">推理延迟：零增加</text>

  <!-- 图例 -->
  <rect x="60" y="540" width="840" height="60" rx="4" fill="#fbfcfe" stroke="#e2e8f0" stroke-width="1"/>
  <text x="80" y="562" font-size="12" font-weight="bold" fill="#1e293b">图例：</text>
  <line x1="120" y1="558" x2="160" y2="558" stroke="#6366f1" stroke-width="2"/>
  <text x="165" y="562" font-size="11" fill="#334155">前向/数据流（实线）</text>
  <line x1="300" y1="558" x2="340" y2="558" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="345" y="562" font-size="11" fill="#334155">低秩映射 A（虚线）</text>
  <rect x="500" y="550" width="16" height="16" rx="2" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="522" y="562" font-size="11" fill="#334155">可训练组件</text>
  <rect x="640" y="550" width="16" height="16" rx="2" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="662" y="562" font-size="11" fill="#334155">冻结组件</text>
</svg>
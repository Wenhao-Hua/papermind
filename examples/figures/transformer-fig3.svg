<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" width="960" height="680">
  <rect x="0" y="0" width="960" height="680" fill="#ffffff"/>

  <!-- 标题 -->
  <text x="480" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">Learning Rate Schedule (Transformer)</text>
  <line x1="160" y1="48" x2="800" y2="48" stroke="#cbd5e1" stroke-width="1"/>

  <!-- 核心公式框（视觉焦点） -->
  <rect x="120" y="68" width="720" height="100" rx="6" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="480" y="96" text-anchor="middle" font-size="14" font-weight="bold" fill="#3730a3">Core Learning Rate Formula</text>
  <text x="480" y="130" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e293b">lrate = d</text>
  <tspan baseline-shift="super" font-size="75%">−0.5</tspan>
  <text x="480" y="130" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e293b"> · min( step_num</text>
  <tspan baseline-shift="super" font-size="75%">−0.5</tspan>
  <text x="480" y="130" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e293b">, step_num · warmup_steps</text>
  <tspan baseline-shift="super" font-size="75%">−1.5</tspan>
  <text x="480" y="130" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e293b"> )</text>
  <text x="480" y="156" text-anchor="middle" font-size="13" fill="#64748b">where d</text>
  <tspan baseline-shift="sub" font-size="75%">model</tspan>
  <text x="480" y="156" text-anchor="middle" font-size="13" fill="#64748b"> = 512, warmup_steps = 4000</text>

  <!-- 左侧：两阶段示意图 -->
  <rect x="60" y="190" width="420" height="220" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="270" y="216" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">Two-Phase Schedule</text>

  <!-- Phase 1: Warmup -->
  <rect x="80" y="234" width="380" height="70" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="270" y="258" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">Phase 1: Linear Warmup</text>
  <text x="270" y="278" text-anchor="middle" font-size="12" fill="#475569">step_num ≤ warmup_steps</text>
  <text x="270" y="296" text-anchor="middle" font-size="12" fill="#64748b">lrate ∝ step_num · warmup_steps</text>
  <tspan baseline-shift="super" font-size="75%">−1.5</tspan>

  <!-- Phase 2: Decay -->
  <rect x="80" y="318" width="380" height="70" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="270" y="342" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">Phase 2: Inverse Square Root Decay</text>
  <text x="270" y="362" text-anchor="middle" font-size="12" fill="#475569">step_num &gt; warmup_steps</text>
  <text x="270" y="380" text-anchor="middle" font-size="12" fill="#64748b">lrate ∝ step_num</text>
  <tspan baseline-shift="super" font-size="75%">−0.5</tspan>

  <!-- 右侧：参数表 -->
  <rect x="520" y="190" width="380" height="220" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="710" y="216" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">Key Parameters</text>

  <!-- 表头 -->
  <rect x="540" y="232" width="160" height="28" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
  <text x="620" y="250" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e293b">Parameter</text>
  <rect x="700" y="232" width="180" height="28" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
  <text x="790" y="250" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e293b">Value</text>

  <!-- 行1 -->
  <rect x="540" y="260" width="160" height="28" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="620" y="278" text-anchor="middle" font-size="12" fill="#334155">d</text>
  <tspan baseline-shift="sub" font-size="75%">model</tspan>
  <rect x="700" y="260" width="180" height="28" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="790" y="278" text-anchor="middle" font-size="12" fill="#334155">512</text>

  <!-- 行2 -->
  <rect x="540" y="288" width="160" height="28" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="620" y="306" text-anchor="middle" font-size="12" fill="#334155">warmup_steps</text>
  <rect x="700" y="288" width="180" height="28" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="790" y="306" text-anchor="middle" font-size="12" fill="#334155">4000</text>

  <!-- 行3 -->
  <rect x="540" y="316" width="160" height="28" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="620" y="334" text-anchor="middle" font-size="12" fill="#334155">Optimizer</text>
  <rect x="700" y="316" width="180" height="28" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="790" y="334" text-anchor="middle" font-size="12" fill="#334155">Adam (β</text>
  <tspan baseline-shift="sub" font-size="75%">1</tspan>
  <text x="790" y="334" text-anchor="middle" font-size="12" fill="#334155">=0.9, β</text>
  <tspan baseline-shift="sub" font-size="75%">2</tspan>
  <text x="790" y="334" text-anchor="middle" font-size="12" fill="#334155">=0.98, ε=10</text>
  <tspan baseline-shift="super" font-size="75%">−9</tspan>
  <text x="790" y="334" text-anchor="middle" font-size="12" fill="#334155">)</text>

  <!-- 行4 -->
  <rect x="540" y="344" width="160" height="28" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="620" y="362" text-anchor="middle" font-size="12" fill="#334155">Total steps</text>
  <rect x="700" y="344" width="180" height="28" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="790" y="362" text-anchor="middle" font-size="12" fill="#334155">100,000</text>

  <!-- 行5 -->
  <rect x="540" y="372" width="160" height="28" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="620" y="390" text-anchor="middle" font-size="12" fill="#334155">Initial lrate</text>
  <rect x="700" y="372" width="180" height="28" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="790" y="390" text-anchor="middle" font-size="12" fill="#334155">≈ 1.3 × 10</text>
  <tspan baseline-shift="super" font-size="75%">−7</tspan>

  <!-- 底部：lrate 随 step_num 变化曲线（示意图） -->
  <rect x="60" y="432" width="840" height="220" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="480" y="458" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">Learning Rate vs. Step Number (Schematic)</text>

  <!-- 坐标轴 -->
  <line x1="120" y1="620" x2="860" y2="620" stroke="#475569" stroke-width="1.5"/>
  <line x1="120" y1="480" x2="120" y2="620" stroke="#475569" stroke-width="1.5"/>

  <!-- 轴标签 -->
  <text x="490" y="648" text-anchor="middle" font-size="12" fill="#334155">Step Number</text>
  <text x="90" y="550" text-anchor="middle" font-size="12" fill="#334155" transform="rotate(-90,90,550)">Learning Rate</text>

  <!-- 刻度 -->
  <line x1="120" y1="620" x2="120" y2="625" stroke="#475569" stroke-width="1"/>
  <text x="120" y="638" text-anchor="middle" font-size="10" fill="#64748b">0</text>
  <line x1="400" y1="620" x2="400" y2="625" stroke="#475569" stroke-width="1"/>
  <text x="400" y="638" text-anchor="middle" font-size="10" fill="#64748b">warmup_steps</text>
  <line x1="860" y1="620" x2="860" y2="625" stroke="#475569" stroke-width="1"/>
  <text x="860" y="638" text-anchor="middle" font-size="10" fill="#64748b">100k</text>

  <!-- 曲线：线性上升 + 平方反比下降 -->
  <!-- 线性段：从 (120, 620) 到 (400, 500) -->
  <line x1="120" y1="620" x2="400" y2="500" stroke="#6366f1" stroke-width="2.5"/>
  <!-- 下降段：从 (400, 500) 到 (860, 560) 用平滑曲线 -->
  <path d="M 400 500 Q 550 510 700 540 Q 800 555 860 560" fill="none" stroke="#6366f1" stroke-width="2.5"/>

  <!-- 关键点标注 -->
  <circle cx="400" cy="500" r="4" fill="#6366f1"/>
  <text x="400" y="490" text-anchor="middle" font-size="11" fill="#3730a3" font-weight="bold">Peak lrate</text>
  <text x="400" y="476" text-anchor="middle" font-size="10" fill="#64748b">≈ 7.0 × 10</text>
  <tspan baseline-shift="super" font-size="75%">−4</tspan>

  <!-- 图例 -->
  <rect x="700" y="472" width="180" height="60" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="790" y="490" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e293b">Legend</text>
  <line x1="710" y1="508" x2="740" y2="508" stroke="#6366f1" stroke-width="2.5"/>
  <text x="750" y="512" font-size="11" fill="#334155">lrate schedule</text>
  <line x1="710" y1="522" x2="740" y2="522" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="750" y="526" font-size="11" fill="#334155">warmup boundary</text>

  <!-- 虚线标注 warmup_steps -->
  <line x1="400" y1="480" x2="400" y2="620" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3"/>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" width="960" height="680">
  <rect x="0" y="0" width="960" height="680" fill="#ffffff"/>

  <!-- 主标题 -->
  <text x="480" y="36" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">Transformer Learning Rate Schedule (Section 5.3)</text>

  <!-- 核心公式框（视觉焦点） -->
  <rect x="180" y="56" width="600" height="80" rx="4" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="480" y="82" font-size="16" fill="#3730a3" text-anchor="middle" font-weight="bold">Learning Rate Formula</text>
  <text x="480" y="112" font-size="18" fill="#1e293b" text-anchor="middle">
    lrate = d<tspan baseline-shift="super" font-size="75%">-0.5</tspan> &#183; min( step<tspan baseline-shift="super" font-size="75%">-0.5</tspan>, step &#183; warmup<tspan baseline-shift="super" font-size="75%">-1.5</tspan> )
  </text>
  <text x="480" y="130" font-size="13" fill="#64748b" text-anchor="middle">where d = 512, warmup_steps = 4000</text>

  <!-- 左侧：参数定义面板 -->
  <rect x="40" y="160" width="280" height="200" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="180" y="186" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">Parameters</text>
  
  <!-- 参数表格 -->
  <line x1="60" y1="198" x2="300" y2="198" stroke="#e2e8f0" stroke-width="1"/>
  <text x="100" y="218" font-size="13" fill="#334155" text-anchor="start">d</text>
  <text x="260" y="218" font-size="13" fill="#64748b" text-anchor="end">= 512</text>
  <line x1="60" y1="230" x2="300" y2="230" stroke="#e2e8f0" stroke-width="1"/>
  <text x="100" y="250" font-size="13" fill="#334155" text-anchor="start">warmup_steps</text>
  <text x="260" y="250" font-size="13" fill="#64748b" text-anchor="end">= 4000</text>
  <line x1="60" y1="262" x2="300" y2="262" stroke="#e2e8f0" stroke-width="1"/>
  <text x="100" y="282" font-size="13" fill="#334155" text-anchor="start">step</text>
  <text x="260" y="282" font-size="13" fill="#64748b" text-anchor="end">current training step</text>
  <line x1="60" y1="294" x2="300" y2="294" stroke="#e2e8f0" stroke-width="1"/>
  <text x="100" y="314" font-size="13" fill="#334155" text-anchor="start">lrate</text>
  <text x="260" y="314" font-size="13" fill="#64748b" text-anchor="end">learning rate</text>
  <line x1="60" y1="326" x2="300" y2="326" stroke="#e2e8f0" stroke-width="1"/>
  <text x="100" y="346" font-size="13" fill="#334155" text-anchor="start">optimizer</text>
  <text x="260" y="346" font-size="13" fill="#64748b" text-anchor="end">Adam (&#946;1=0.9, &#946;2=0.98)</text>

  <!-- 右侧：阶段说明面板 -->
  <rect x="360" y="160" width="560" height="200" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="640" y="186" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">Two-Phase Schedule</text>
  
  <!-- 阶段1 -->
  <rect x="380" y="200" width="240" height="70" rx="3" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="500" y="222" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="middle">Phase 1: Warmup (linear increase)</text>
  <text x="500" y="242" font-size="12" fill="#334155" text-anchor="middle">step &#8712; [1, warmup_steps]</text>
  <text x="500" y="260" font-size="12" fill="#64748b" text-anchor="middle">lrate = d<tspan baseline-shift="super" font-size="75%">-0.5</tspan> &#183; step &#183; warmup<tspan baseline-shift="super" font-size="75%">-1.5</tspan></text>

  <!-- 阶段2 -->
  <rect x="640" y="200" width="260" height="70" rx="3" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="770" y="222" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="middle">Phase 2: Decay (inverse sqrt)</text>
  <text x="770" y="242" font-size="12" fill="#334155" text-anchor="middle">step &gt; warmup_steps</text>
  <text x="770" y="260" font-size="12" fill="#64748b" text-anchor="middle">lrate = d<tspan baseline-shift="super" font-size="75%">-0.5</tspan> &#183; step<tspan baseline-shift="super" font-size="75%">-0.5</tspan></text>

  <!-- 箭头：阶段1 → 阶段2 -->
  <line x1="620" y1="235" x2="640" y2="235" stroke="#6366f1" stroke-width="2"/>
  <polygon points="640,230 650,235 640,240" fill="#6366f1"/>

  <!-- 下方：数值示例面板 -->
  <rect x="40" y="390" width="880" height="260" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="480" y="418" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">Numerical Example (d=512, warmup_steps=4000)</text>

  <!-- 示例表格 -->
  <line x1="60" y1="432" x2="900" y2="432" stroke="#e2e8f0" stroke-width="1"/>
  
  <!-- 表头 -->
  <text x="120" y="452" font-size="12" font-weight="bold" fill="#334155" text-anchor="middle">step</text>
  <text x="240" y="452" font-size="12" font-weight="bold" fill="#334155" text-anchor="middle">phase</text>
  <text x="380" y="452" font-size="12" font-weight="bold" fill="#334155" text-anchor="middle">computation</text>
  <text x="560" y="452" font-size="12" font-weight="bold" fill="#334155" text-anchor="middle">lrate (approx)</text>
  <text x="720" y="452" font-size="12" font-weight="bold" fill="#334155" text-anchor="middle">behavior</text>
  
  <line x1="60" y1="462" x2="900" y2="462" stroke="#cbd5e1" stroke-width="1"/>

  <!-- 行1 -->
  <text x="120" y="482" font-size="12" fill="#1e293b" text-anchor="middle">1</text>
  <text x="240" y="482" font-size="12" fill="#6366f1" text-anchor="middle">warmup</text>
  <text x="380" y="482" font-size="12" fill="#64748b" text-anchor="middle">512<tspan baseline-shift="super" font-size="75%">-0.5</tspan> &#183; 1 &#183; 4000<tspan baseline-shift="super" font-size="75%">-1.5</tspan></text>
  <text x="560" y="482" font-size="12" fill="#1e293b" text-anchor="middle">~1.3e-7</text>
  <text x="720" y="482" font-size="12" fill="#64748b" text-anchor="middle">very small, increasing</text>
  <line x1="60" y1="492" x2="900" y2="492" stroke="#e2e8f0" stroke-width="1"/>

  <!-- 行2 -->
  <text x="120" y="512" font-size="12" fill="#1e293b" text-anchor="middle">2000</text>
  <text x="240" y="512" font-size="12" fill="#6366f1" text-anchor="middle">warmup</text>
  <text x="380" y="512" font-size="12" fill="#64748b" text-anchor="middle">512<tspan baseline-shift="super" font-size="75%">-0.5</tspan> &#183; 2000 &#183; 4000<tspan baseline-shift="super" font-size="75%">-1.5</tspan></text>
  <text x="560" y="512" font-size="12" fill="#1e293b" text-anchor="middle">~2.6e-4</text>
  <text x="720" y="512" font-size="12" fill="#64748b" text-anchor="middle">linear increase</text>
  <line x1="60" y1="522" x2="900" y2="522" stroke="#e2e8f0" stroke-width="1"/>

  <!-- 行3 -->
  <text x="120" y="542" font-size="12" fill="#1e293b" text-anchor="middle">4000</text>
  <text x="240" y="542" font-size="12" fill="#6366f1" text-anchor="middle">peak</text>
  <text x="380" y="542" font-size="12" fill="#64748b" text-anchor="middle">512<tspan baseline-shift="super" font-size="75%">-0.5</tspan> &#183; 4000 &#183; 4000<tspan baseline-shift="super" font-size="75%">-1.5</tspan></text>
  <text x="560" y="542" font-size="12" fill="#1e293b" text-anchor="middle">~5.2e-4</text>
  <text x="720" y="542" font-size="12" fill="#64748b" text-anchor="middle">maximum lrate</text>
  <line x1="60" y1="552" x2="900" y2="552" stroke="#e2e8f0" stroke-width="1"/>

  <!-- 行4 -->
  <text x="120" y="572" font-size="12" fill="#1e293b" text-anchor="middle">8000</text>
  <text x="240" y="572" font-size="12" fill="#64748b" text-anchor="middle">decay</text>
  <text x="380" y="572" font-size="12" fill="#64748b" text-anchor="middle">512<tspan baseline-shift="super" font-size="75%">-0.5</tspan> &#183; 8000<tspan baseline-shift="super" font-size="75%">-0.5</tspan></text>
  <text x="560" y="572" font-size="12" fill="#1e293b" text-anchor="middle">~3.7e-4</text>
  <text x="720" y="572" font-size="12" fill="#64748b" text-anchor="middle">inverse sqrt decay</text>
  <line x1="60" y1="582" x2="900" y2="582" stroke="#e2e8f0" stroke-width="1"/>

  <!-- 行5 -->
  <text x="120" y="602" font-size="12" fill="#1e293b" text-anchor="middle">16000</text>
  <text x="240" y="602" font-size="12" fill="#64748b" text-anchor="middle">decay</text>
  <text x="380" y="602" font-size="12" fill="#64748b" text-anchor="middle">512<tspan baseline-shift="super" font-size="75%">-0.5</tspan> &#183; 16000<tspan baseline-shift="super" font-size="75%">-0.5</tspan></text>
  <text x="560" y="602" font-size="12" fill="#1e293b" text-anchor="middle">~2.6e-4</text>
  <text x="720" y="602" font-size="12" fill="#64748b" text-anchor="middle">half of peak</text>
  <line x1="60" y1="612" x2="900" y2="612" stroke="#e2e8f0" stroke-width="1"/>

  <!-- 行6 -->
  <text x="120" y="632" font-size="12" fill="#1e293b" text-anchor="middle">100000</text>
  <text x="240" y="632" font-size="12" fill="#64748b" text-anchor="middle">decay</text>
  <text x="380" y="632" font-size="12" fill="#64748b" text-anchor="middle">512<tspan baseline-shift="super" font-size="75%">-0.5</tspan> &#183; 100000<tspan baseline-shift="super" font-size="75%">-0.5</tspan></text>
  <text x="560" y="632" font-size="12" fill="#1e293b" text-anchor="middle">~1.0e-4</text>
  <text x="720" y="632" font-size="12" fill="#64748b" text-anchor="middle">~1/5 of peak</text>

  <!-- 图例 -->
  <rect x="40" y="660" width="880" height="16" fill="none"/>
  <line x1="40" y1="668" x2="70" y2="668" stroke="#6366f1" stroke-width="2"/>
  <polygon points="70,664 78,668 70,672" fill="#6366f1"/>
  <text x="82" y="672" font-size="11" fill="#64748b" text-anchor="start">transition between phases</text>
</svg>
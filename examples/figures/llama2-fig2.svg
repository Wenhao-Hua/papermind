<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" width="960" height="680">
  <rect x="0" y="0" width="960" height="680" fill="#ffffff"/>
  
  <!-- 标题 -->
  <text x="480" y="36" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">Safety RLHF: Reward Model Mixture &amp; False Refusal Analysis</text>
  
  <!-- 左侧主区域：核心公式 -->
  <rect x="40" y="60" width="580" height="130" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" rx="4"/>
  <text x="330" y="88" font-size="15" font-weight="bold" fill="#334155" text-anchor="middle">Reward Composition Formula</text>
  
  <!-- 公式主体 -->
  <text x="330" y="120" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="bold">R<text y="120" x="346" font-size="12" baseline-shift="sub">c</text>(g | p) =</text>
  
  <!-- 大括号 -->
  <text x="380" y="120" font-size="28" fill="#6366f1" text-anchor="middle">{</text>
  
  <!-- 第一行 -->
  <text x="400" y="112" font-size="14" fill="#6366f1" text-anchor="middle">R<text y="112" x="416" font-size="10.5" baseline-shift="sub">s</text>(g | p)</text>
  <text x="460" y="112" font-size="13" fill="#334155" text-anchor="middle">if is_safety(p) or R<text y="112" x="560" font-size="9.75" baseline-shift="sub">s</text>(g | p) &lt; 0.15</text>
  
  <!-- 第二行 -->
  <text x="400" y="140" font-size="14" fill="#64748b" text-anchor="middle">R<text y="140" x="416" font-size="10.5" baseline-shift="sub">h</text>(g | p)</text>
  <text x="460" y="140" font-size="13" fill="#334155" text-anchor="middle">otherwise</text>
  
  <!-- 阈值标注 -->
  <line x1="540" y1="112" x2="540" y2="140" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="548" y="128" font-size="11" fill="#64748b" text-anchor="start">threshold = 0.15</text>
  
  <!-- 右侧图例/说明面板 -->
  <rect x="640" y="60" width="280" height="130" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1" rx="4"/>
  <text x="780" y="86" font-size="13" font-weight="bold" fill="#334155" text-anchor="middle">Legend</text>
  
  <line x1="660" y1="104" x2="700" y2="104" stroke="#6366f1" stroke-width="2"/>
  <polygon points="700,100 710,104 700,108" fill="#6366f1"/>
  <text x="720" y="108" font-size="12" fill="#334155">Safety reward R<text y="108" x="810" font-size="9" baseline-shift="sub">s</text> (primary)</text>
  
  <line x1="660" y1="128" x2="700" y2="128" stroke="#64748b" stroke-width="2"/>
  <polygon points="700,124 710,128 700,132" fill="#64748b"/>
  <text x="720" y="132" font-size="12" fill="#334155">Helpfulness reward R<text y="132" x="810" font-size="9" baseline-shift="sub">h</text></text>
  
  <line x1="660" y1="152" x2="700" y2="152" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="720" y="156" font-size="12" fill="#334155">Threshold boundary</text>
  
  <!-- 第二部分：奖励模型训练流程 -->
  <rect x="40" y="210" width="580" height="200" fill="#fbfcfe" stroke="#cbd5e1" stroke-width="1.5" rx="4"/>
  <text x="330" y="238" font-size="15" font-weight="bold" fill="#334155" text-anchor="middle">Reward Model Training &amp; Mixture</text>
  
  <!-- 对抗性提示 -->
  <rect x="60" y="260" width="160" height="40" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5" rx="3"/>
  <text x="140" y="285" font-size="13" fill="#3730a3" text-anchor="middle">Adversarial Prompts</text>
  
  <!-- 人类偏好 -->
  <rect x="60" y="320" width="160" height="40" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5" rx="3"/>
  <text x="140" y="345" font-size="13" fill="#3730a3" text-anchor="middle">Human Preferences</text>
  
  <!-- 箭头 -->
  <line x1="140" y1="300" x2="140" y2="320" stroke="#6366f1" stroke-width="1.5"/>
  <polygon points="136,318 140,328 144,318" fill="#6366f1"/>
  
  <!-- 安全奖励模型 -->
  <rect x="260" y="280" width="140" height="50" fill="#eef2ff" stroke="#6366f1" stroke-width="2" rx="3"/>
  <text x="330" y="302" font-size="13" font-weight="bold" fill="#3730a3" text-anchor="middle">Safety RM</text>
  <text x="330" y="320" font-size="11" fill="#3730a3" text-anchor="middle">R<text y="320" x="360" font-size="8.25" baseline-shift="sub">s</text></text>
  
  <line x1="220" y1="280" x2="260" y2="300" stroke="#6366f1" stroke-width="1.5"/>
  <polygon points="256,296 264,302 254,304" fill="#6366f1"/>
  
  <!-- 帮助性奖励模型 -->
  <rect x="260" y="350" width="140" height="50" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5" rx="3"/>
  <text x="330" y="372" font-size="13" fill="#334155" text-anchor="middle">Helpfulness RM</text>
  <text x="330" y="390" font-size="11" fill="#334155" text-anchor="middle">R<text y="390" x="360" font-size="8.25" baseline-shift="sub">h</text></text>
  
  <line x1="220" y1="340" x2="260" y2="365" stroke="#64748b" stroke-width="1.5"/>
  <polygon points="256,361 264,367 254,369" fill="#64748b"/>
  
  <!-- 组合 -->
  <rect x="440" y="310" width="160" height="50" fill="#f8fafc" stroke="#6366f1" stroke-width="2" rx="3"/>
  <text x="520" y="332" font-size="13" font-weight="bold" fill="#3730a3" text-anchor="middle">Combined R<text y="332" x="560" font-size="9.75" baseline-shift="sub">c</text></text>
  <text x="520" y="350" font-size="11" fill="#334155" text-anchor="middle">mixture logic</text>
  
  <line x1="400" y1="305" x2="440" y2="325" stroke="#6366f1" stroke-width="1.5"/>
  <polygon points="436,321 444,327 434,329" fill="#6366f1"/>
  <line x1="400" y1="375" x2="440" y2="345" stroke="#64748b" stroke-width="1.5"/>
  <polygon points="436,349 444,343 434,341" fill="#64748b"/>
  
  <!-- 第三部分：阈值性能 -->
  <rect x="40" y="430" width="580" height="120" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" rx="4"/>
  <text x="330" y="458" font-size="15" font-weight="bold" fill="#334155" text-anchor="middle">Threshold 0.15 Performance (Meta Safety Test Set)</text>
  
  <!-- 表格 -->
  <line x1="80" y1="470" x2="580" y2="470" stroke="#cbd5e1" stroke-width="1"/>
  <text x="180" y="488" font-size="13" font-weight="bold" fill="#334155" text-anchor="middle">Metric</text>
  <line x1="280" y1="470" x2="280" y2="540" stroke="#cbd5e1" stroke-width="1"/>
  <text x="380" y="488" font-size="13" font-weight="bold" fill="#334155" text-anchor="middle">Value</text>
  <line x1="480" y1="470" x2="480" y2="540" stroke="#cbd5e1" stroke-width="1"/>
  <text x="530" y="488" font-size="13" font-weight="bold" fill="#334155" text-anchor="middle">Note</text>
  
  <line x1="80" y1="498" x2="580" y2="498" stroke="#e2e8f0" stroke-width="1"/>
  <text x="180" y="516" font-size="12" fill="#1e293b" text-anchor="middle">Precision</text>
  <text x="380" y="516" font-size="12" fill="#1e293b" text-anchor="middle">0.89</text>
  <text x="530" y="516" font-size="11" fill="#64748b" text-anchor="middle">high</text>
  
  <line x1="80" y1="526" x2="580" y2="526" stroke="#e2e8f0" stroke-width="1"/>
  <text x="180" y="544" font-size="12" fill="#1e293b" text-anchor="middle">Recall</text>
  <text x="380" y="544" font-size="12" fill="#1e293b" text-anchor="middle">0.55</text>
  <text x="530" y="544" font-size="11" fill="#64748b" text-anchor="middle">moderate</text>
  
  <!-- 右侧：误拒分析 -->
  <rect x="640" y="210" width="280" height="340" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1" rx="4"/>
  <text x="780" y="238" font-size="15" font-weight="bold" fill="#334155" text-anchor="middle">False Refusal Analysis</text>
  
  <!-- 拒绝分类器 -->
  <rect x="660" y="260" width="240" height="40" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5" rx="3"/>
  <text x="780" y="285" font-size="13" fill="#3730a3" text-anchor="middle">Rejection Classifier</text>
  
  <!-- 箭头 -->
  <line x1="780" y1="300" x2="780" y2="320" stroke="#6366f1" stroke-width="1.5"/>
  <polygon points="776,318 780,328 784,318" fill="#6366f1"/>
  
  <!-- 两个测试集 -->
  <rect x="660" y="330" width="240" height="35" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="3"/>
  <text x="780" y="352" font-size="12" fill="#334155" text-anchor="middle">Helpfulness Test Set</text>
  
  <rect x="660" y="380" width="240" height="35" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="3"/>
  <text x="780" y="402" font-size="12" fill="#334155" text-anchor="middle">Boundary Test Set (sensitive words)</text>
  
  <!-- 结果 -->
  <line x1="660" y1="430" x2="900" y2="430" stroke="#e2e8f0" stroke-width="1"/>
  <text x="780" y="450" font-size="12" fill="#1e293b" text-anchor="middle">False Refusal Rate</text>
  
  <rect x="660" y="465" width="110" height="30" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5" rx="3"/>
  <text x="715" y="485" font-size="12" fill="#3730a3" text-anchor="middle">~0.05%</text>
  
  <rect x="790" y="465" width="110" height="30" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5" rx="3"/>
  <text x="845" y="485" font-size="12" fill="#334155" text-anchor="middle">higher</text>
  
  <text x="715" y="510" font-size="10" fill="#64748b" text-anchor="middle">low</text>
  <text x="845" y="510" font-size="10" fill="#64748b" text-anchor="middle">elevated</text>
  
  <!-- 底部说明 -->
  <rect x="40" y="570" width="880" height="90" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="4"/>
  <text x="480" y="596" font-size="13" font-weight="bold" fill="#334155" text-anchor="middle">Key Observation</text>
  <text x="480" y="618" font-size="12" fill="#1e293b" text-anchor="middle">Safety performance improves with minimal helpfulness degradation, but leads to more conservative responses.</text>
  <text x="480" y="640" font-size="12" fill="#1e293b" text-anchor="middle">Rejection classifier quantifies false refusal rate: low on helpfulness set, elevated on boundary set.</text>
</svg>
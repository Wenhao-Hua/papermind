<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" width="960" height="680">
  <rect x="0" y="0" width="960" height="680" fill="#ffffff"/>

  <!-- 标题 -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1e293b" text-anchor="middle">Safety RLHF with Reward Model Mixture &amp; False Refusal Analysis</text>

  <!-- 左侧主面板：核心公式 -->
  <rect x="40" y="56" width="520" height="180" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" rx="4"/>
  <text x="300" y="80" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">Combined Reward Function R<tspan baseline-shift="sub" font-size="75%">c</tspan></text>

  <!-- 公式主体 -->
  <text x="300" y="116" font-size="16" fill="#3730a3" text-anchor="middle" font-weight="bold">
    R<tspan baseline-shift="sub" font-size="75%">c</tspan>(g | p) =
  </text>
  <text x="300" y="148" font-size="14" fill="#1e293b" text-anchor="middle">
    { R<tspan baseline-shift="sub" font-size="75%">s</tspan>(g | p)  if is_safety(p) or R<tspan baseline-shift="sub" font-size="75%">s</tspan>(g | p) &lt; 0.15
  </text>
  <text x="300" y="172" font-size="14" fill="#1e293b" text-anchor="middle">
    { R<tspan baseline-shift="sub" font-size="75%">h</tspan>(g | p)  otherwise
  </text>

  <!-- 阈值说明 -->
  <rect x="60" y="196" width="480" height="32" fill="#eef2ff" stroke="#6366f1" stroke-width="1" rx="3"/>
  <text x="300" y="216" font-size="12" fill="#3730a3" text-anchor="middle">
    Threshold 0.15: Precision=0.89, Recall=0.55 on Meta safety test set
  </text>

  <!-- 右侧图例/说明面板 -->
  <rect x="600" y="56" width="320" height="180" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" rx="4"/>
  <text x="760" y="80" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="middle">Legend</text>

  <!-- 箭头图例 -->
  <line x1="620" y1="104" x2="660" y2="104" stroke="#475569" stroke-width="1.5"/>
  <polygon points="660,99 670,104 660,109" fill="#475569"/>
  <text x="680" y="108" font-size="11" fill="#334155">Forward / data flow</text>

  <line x1="620" y1="128" x2="660" y2="128" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,4"/>
  <polygon points="660,123 670,128 660,133" fill="#94a3b8"/>
  <text x="680" y="132" font-size="11" fill="#334155">Reference / comparison</text>

  <line x1="620" y1="152" x2="660" y2="152" stroke="#6366f1" stroke-width="2.5"/>
  <polygon points="660,147 670,152 660,157" fill="#6366f1"/>
  <text x="680" y="156" font-size="11" fill="#334155">Selected assignment</text>

  <text x="760" y="184" font-size="11" fill="#64748b" text-anchor="middle">R<tspan baseline-shift="sub" font-size="75%">s</tspan>: safety reward model</text>
  <text x="760" y="202" font-size="11" fill="#64748b" text-anchor="middle">R<tspan baseline-shift="sub" font-size="75%">h</tspan>: helpfulness reward model</text>
  <text x="760" y="220" font-size="11" fill="#64748b" text-anchor="middle">is_safety(p): prompt p is safety category</text>

  <!-- 中间面板：二部图——奖励模型选择机制 -->
  <rect x="40" y="256" width="520" height="200" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" rx="4"/>
  <text x="300" y="280" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">Reward Model Selection Mechanism</text>

  <!-- 左列：条件 -->
  <text x="120" y="310" font-size="12" fill="#334155" text-anchor="middle">is_safety(p) = True</text>
  <text x="120" y="340" font-size="12" fill="#334155" text-anchor="middle">R<tspan baseline-shift="sub" font-size="75%">s</tspan> &lt; 0.15</text>
  <text x="120" y="370" font-size="12" fill="#334155" text-anchor="middle">otherwise</text>

  <!-- 右列：输出 -->
  <text x="480" y="310" font-size="12" fill="#3730a3" text-anchor="middle" font-weight="bold">R<tspan baseline-shift="sub" font-size="75%">s</tspan></text>
  <text x="480" y="340" font-size="12" fill="#3730a3" text-anchor="middle" font-weight="bold">R<tspan baseline-shift="sub" font-size="75%">s</tspan></text>
  <text x="480" y="370" font-size="12" fill="#3730a3" text-anchor="middle" font-weight="bold">R<tspan baseline-shift="sub" font-size="75%">h</tspan></text>

  <!-- 连线 -->
  <line x1="160" y1="306" x2="440" y2="306" stroke="#6366f1" stroke-width="2.5"/>
  <polygon points="440,301 450,306 440,311" fill="#6366f1"/>
  <line x1="160" y1="336" x2="440" y2="336" stroke="#6366f1" stroke-width="2.5"/>
  <polygon points="440,331 450,336 440,341" fill="#6366f1"/>
  <line x1="160" y1="366" x2="440" y2="366" stroke="#475569" stroke-width="1.5"/>
  <polygon points="440,361 450,366 440,371" fill="#475569"/>

  <!-- 右侧面板：False Refusal 分析 -->
  <rect x="600" y="256" width="320" height="200" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" rx="4"/>
  <text x="760" y="280" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="middle">False Refusal Analysis</text>

  <text x="760" y="310" font-size="11" fill="#334155" text-anchor="middle">Refusal classifier trained to</text>
  <text x="760" y="328" font-size="11" fill="#334155" text-anchor="middle">quantify false refusal rate</text>

  <rect x="620" y="344" width="280" height="28" fill="#eef2ff" stroke="#6366f1" stroke-width="1" rx="3"/>
  <text x="760" y="362" font-size="11" fill="#3730a3" text-anchor="middle">Helpfulness test set: ~0.05% false refusal</text>

  <rect x="620" y="380" width="280" height="28" fill="#fef2f2" stroke="#dc2626" stroke-width="1" rx="3"/>
  <text x="760" y="398" font-size="11" fill="#991b1b" text-anchor="middle">Boundary test set (sensitive words): higher</text>

  <text x="760" y="432" font-size="11" fill="#64748b" text-anchor="middle">More conservative responses observed</text>
  <text x="760" y="448" font-size="11" fill="#64748b" text-anchor="middle">when safety data proportion increased</text>

  <!-- 底部面板：实验数据表 -->
  <rect x="40" y="476" width="880" height="180" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" rx="4"/>
  <text x="480" y="500" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">Safety Data Proportion Experiment</text>

  <!-- 表头 -->
  <rect x="60" y="516" width="160" height="30" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
  <text x="140" y="536" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="bold">Safety Data %</text>
  <rect x="220" y="516" width="160" height="30" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
  <text x="300" y="536" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="bold">Safety Score</text>
  <rect x="380" y="516" width="160" height="30" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
  <text x="460" y="536" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="bold">Helpfulness Score</text>
  <rect x="540" y="516" width="160" height="30" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
  <text x="620" y="536" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="bold">False Refusal %</text>
  <rect x="700" y="516" width="200" height="30" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
  <text x="800" y="536" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="bold">Observation</text>

  <!-- 数据行1 -->
  <rect x="60" y="546" width="160" height="30" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="140" y="566" font-size="12" fill="#334155" text-anchor="middle">0% (baseline)</text>
  <rect x="220" y="546" width="160" height="30" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="300" y="566" font-size="12" fill="#334155" text-anchor="middle">Low</text>
  <rect x="380" y="546" width="160" height="30" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="460" y="566" font-size="12" fill="#334155" text-anchor="middle">High</text>
  <rect x="540" y="546" width="160" height="30" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="620" y="566" font-size="12" fill="#334155" text-anchor="middle">~0%</text>
  <rect x="700" y="546" width="200" height="30" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="800" y="566" font-size="11" fill="#64748b" text-anchor="middle">Standard helpfulness</text>

  <!-- 数据行2 -->
  <rect x="60" y="576" width="160" height="30" fill="#fafafa" stroke="#cbd5e1" stroke-width="1"/>
  <text x="140" y="596" font-size="12" fill="#334155" text-anchor="middle">5%</text>
  <rect x="220" y="576" width="160" height="30" fill="#fafafa" stroke="#cbd5e1" stroke-width="1"/>
  <text x="300" y="596" font-size="12" fill="#334155" text-anchor="middle">Medium</text>
  <rect x="380" y="576" width="160" height="30" fill="#fafafa" stroke="#cbd5e1" stroke-width="1"/>
  <text x="460" y="596" font-size="12" fill="#334155" text-anchor="middle">High</text>
  <rect x="540" y="576" width="160" height="30" fill="#fafafa" stroke="#cbd5e1" stroke-width="1"/>
  <text x="620" y="596" font-size="12" fill="#334155" text-anchor="middle">~0.05%</text>
  <rect x="700" y="576" width="200" height="30" fill="#fafafa" stroke="#cbd5e1" stroke-width="1"/>
  <text x="800" y="596" font-size="11" fill="#64748b" text-anchor="middle">Safety improved</text>

  <!-- 数据行3 -->
  <rect x="60" y="606" width="160" height="30" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="140" y="626" font-size="12" fill="#334155" text-anchor="middle">10%</text>
  <rect x="220" y="606" width="160" height="30" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="300" y="626" font-size="12" fill="#334155" text-anchor="middle">High</text>
  <rect x="380" y="606" width="160" height="30" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="460" y="626" font-size="12" fill="#334155" text-anchor="middle">High</text>
  <rect x="540" y="606" width="160" height="30" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="620" y="626" font-size="12" fill="#334155" text-anchor="middle">~0.05%</text>
  <rect x="700" y="606" width="200" height="30" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="800" y="626" font-size="11" fill="#64748b" text-anchor="middle">More conservative</text>

  <!-- 数据行4 -->
  <rect x="60" y="636" width="160" height="30" fill="#fafafa" stroke="#cbd5e1" stroke-width="1"/>
  <text x="140" y="656" font-size="12" fill="#334155" text-anchor="middle">20%</text>
  <rect x="220" y="636" width="160" height="30" fill="#fafafa" stroke="#cbd5e1" stroke-width="1"/>
  <text x="300" y="656" font-size="12" fill="#334155" text-anchor="middle">Very High</text>
  <rect x="380" y="636" width="160" height="30" fill="#fafafa" stroke="#cbd5e1" stroke-width="1"/>
  <text x="460" y="656" font-size="12" fill="#334155" text-anchor="middle">High</text>
  <rect x="540" y="636" width="160" height="30" fill="#fafafa" stroke="#cbd5e1" stroke-width="1"/>
  <text x="620" y="656" font-size="12" fill="#334155" text-anchor="middle">~0.05%</text>
  <rect x="700" y="636" width="200" height="30" fill="#fafafa" stroke="#cbd5e1" stroke-width="1"/>
  <text x="800" y="656" font-size="11" fill="#64748b" text-anchor="middle">Helpfulness unchanged</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#1e293b" width="960" height="680">
  <rect x="0" y="0" width="960" height="680" fill="#ffffff"/>

  <!-- 标题 -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e293b">Cross-Attention Conditioning Mechanism in Latent Diffusion Models</text>

  <!-- ===== 左侧主面板：条件注入流程（纵向） ===== -->
  <!-- 条件输入 y -->
  <rect x="60" y="60" width="200" height="44" rx="4" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="160" y="87" text-anchor="middle" font-size="14" fill="#1e293b">Condition Input y</text>
  <text x="160" y="105" text-anchor="middle" font-size="11" fill="#64748b">(text, bbox, etc.)</text>

  <!-- 箭头 y → τ_θ -->
  <line x1="260" y1="82" x2="310" y2="82" stroke="#6366f1" stroke-width="2"/>
  <polygon points="310,76 322,82 310,88" fill="#6366f1"/>

  <!-- τ_θ 编码器 -->
  <rect x="325" y="60" width="200" height="44" rx="4" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="425" y="87" text-anchor="middle" font-size="14" fill="#3730a3" font-weight="bold">Domain-Specific Encoder &#964;<tspan baseline-shift="sub" font-size="75%">&#952;</tspan></text>

  <!-- 箭头 τ_θ(y) → 中间表示 -->
  <line x1="525" y1="82" x2="575" y2="82" stroke="#6366f1" stroke-width="2"/>
  <polygon points="575,76 587,82 575,88" fill="#6366f1"/>

  <!-- 中间表示 τ_θ(y) -->
  <rect x="590" y="60" width="200" height="44" rx="4" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
  <text x="690" y="87" text-anchor="middle" font-size="13" fill="#1e293b">&#964;<tspan baseline-shift="sub" font-size="75%">&#952;</tspan>(y) &#8712; &#8477;<tspan baseline-shift="super" font-size="75%">M&#215;d<tspan baseline-shift="sub" font-size="75%">&#964;</tspan></tspan></text>

  <!-- 向下箭头：注入 UNet -->
  <line x1="690" y1="104" x2="690" y2="150" stroke="#6366f1" stroke-width="2"/>
  <polygon points="684,150 690,162 696,150" fill="#6366f1"/>

  <!-- UNet 特征 φ_i(z_t) -->
  <rect x="60" y="168" width="200" height="44" rx="4" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="160" y="195" text-anchor="middle" font-size="13" fill="#1e293b">UNet Feature &#966;<tspan baseline-shift="sub" font-size="75%">i</tspan>(z<tspan baseline-shift="sub" font-size="75%">t</tspan>)</text>

  <!-- 箭头：φ_i(z_t) → Q -->
  <line x1="260" y1="190" x2="310" y2="190" stroke="#6366f1" stroke-width="2"/>
  <polygon points="310,184 322,190 310,196" fill="#6366f1"/>

  <!-- Q 投影 -->
  <rect x="325" y="168" width="120" height="44" rx="4" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="385" y="195" text-anchor="middle" font-size="13" fill="#3730a3">Q = W<tspan baseline-shift="sub" font-size="75%">Q</tspan><tspan baseline-shift="super" font-size="75%">(i)</tspan> &#183; &#966;<tspan baseline-shift="sub" font-size="75%">i</tspan>(z<tspan baseline-shift="sub" font-size="75%">t</tspan>)</text>

  <!-- 箭头：τ_θ(y) → K, V -->
  <line x1="690" y1="150" x2="690" y2="168" stroke="#6366f1" stroke-width="2"/>
  <line x1="690" y1="168" x2="550" y2="190" stroke="#6366f1" stroke-width="2"/>
  <polygon points="550,184 538,190 550,196" fill="#6366f1"/>
  <line x1="690" y1="168" x2="690" y2="190" stroke="#6366f1" stroke-width="2"/>
  <polygon points="684,190 690,202 696,190" fill="#6366f1"/>

  <!-- K 投影 -->
  <rect x="460" y="168" width="120" height="44" rx="4" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="520" y="195" text-anchor="middle" font-size="13" fill="#3730a3">K = W<tspan baseline-shift="sub" font-size="75%">K</tspan><tspan baseline-shift="super" font-size="75%">(i)</tspan> &#183; &#964;<tspan baseline-shift="sub" font-size="75%">&#952;</tspan>(y)</text>

  <!-- V 投影 -->
  <rect x="620" y="168" width="120" height="44" rx="4" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="680" y="195" text-anchor="middle" font-size="13" fill="#3730a3">V = W<tspan baseline-shift="sub" font-size="75%">V</tspan><tspan baseline-shift="super" font-size="75%">(i)</tspan> &#183; &#964;<tspan baseline-shift="sub" font-size="75%">&#952;</tspan>(y)</text>

  <!-- 向下箭头：Q, K, V → Attention -->
  <line x1="385" y1="212" x2="385" y2="250" stroke="#6366f1" stroke-width="2"/>
  <polygon points="379,250 385,262 391,250" fill="#6366f1"/>
  <line x1="520" y1="212" x2="520" y2="250" stroke="#6366f1" stroke-width="2"/>
  <polygon points="514,250 520,262 526,250" fill="#6366f1"/>
  <line x1="680" y1="212" x2="680" y2="250" stroke="#6366f1" stroke-width="2"/>
  <polygon points="674,250 680,262 686,250" fill="#6366f1"/>

  <!-- Attention 计算框（核心公式） -->
  <rect x="60" y="268" width="680" height="80" rx="6" fill="#eef2ff" stroke="#6366f1" stroke-width="2.5"/>
  <text x="400" y="296" text-anchor="middle" font-size="15" font-weight="bold" fill="#3730a3">Cross-Attention: Attention(Q, K, V) = softmax( QK<tspan baseline-shift="super" font-size="75%">&#8868;</tspan> / &#8730;d ) V</text>
  <text x="400" y="326" text-anchor="middle" font-size="12" fill="#334155">where Q = W<tspan baseline-shift="sub" font-size="75%">Q</tspan><tspan baseline-shift="super" font-size="75%">(i)</tspan> &#183; &#966;<tspan baseline-shift="sub" font-size="75%">i</tspan>(z<tspan baseline-shift="sub" font-size="75%">t</tspan>), K = W<tspan baseline-shift="sub" font-size="75%">K</tspan><tspan baseline-shift="super" font-size="75%">(i)</tspan> &#183; &#964;<tspan baseline-shift="sub" font-size="75%">&#952;</tspan>(y), V = W<tspan baseline-shift="sub" font-size="75%">V</tspan><tspan baseline-shift="super" font-size="75%">(i)</tspan> &#183; &#964;<tspan baseline-shift="sub" font-size="75%">&#952;</tspan>(y)</text>

  <!-- 箭头：Attention → 输出特征 -->
  <line x1="400" y1="348" x2="400" y2="390" stroke="#6366f1" stroke-width="2"/>
  <polygon points="394,390 400,402 406,390" fill="#6366f1"/>

  <!-- 输出特征 -->
  <rect x="250" y="406" width="300" height="44" rx="4" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="400" y="433" text-anchor="middle" font-size="13" fill="#1e293b">Conditioned Feature (injected into UNet)</text>

  <!-- ===== 右侧面板：图例与机制拆解 ===== -->
  <rect x="770" y="60" width="170" height="390" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>

  <!-- 图例标题 -->
  <text x="855" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">Legend</text>

  <!-- 图例项 -->
  <line x1="785" y1="108" x2="825" y2="108" stroke="#6366f1" stroke-width="2"/>
  <polygon points="825,102 835,108 825,114" fill="#6366f1"/>
  <text x="845" y="112" font-size="11" fill="#334155">Data flow</text>

  <line x1="785" y1="132" x2="825" y2="132" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,4"/>
  <polygon points="825,126 835,132 825,138" fill="#94a3b8"/>
  <text x="845" y="136" font-size="11" fill="#334155">Reference</text>

  <rect x="785" y="150" width="50" height="16" rx="2" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="845" y="163" font-size="11" fill="#334155">Key module</text>

  <!-- 机制拆解 -->
  <text x="855" y="200" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e293b">Mechanism</text>

  <text x="785" y="222" font-size="11" fill="#334155">1. Encode y via &#964;<tspan baseline-shift="sub" font-size="75%">&#952;</tspan></text>
  <text x="785" y="240" font-size="11" fill="#334155">   &#8594; &#964;<tspan baseline-shift="sub" font-size="75%">&#952;</tspan>(y) &#8712; &#8477;<tspan baseline-shift="super" font-size="75%">M&#215;d<tspan baseline-shift="sub" font-size="75%">&#964;</tspan></tspan></text>

  <text x="785" y="262" font-size="11" fill="#334155">2. Project UNet feature &#966;<tspan baseline-shift="sub" font-size="75%">i</tspan></text>
  <text x="785" y="280" font-size="11" fill="#334155">   &#8594; Q = W<tspan baseline-shift="sub" font-size="75%">Q</tspan><tspan baseline-shift="super" font-size="75%">(i)</tspan> &#183; &#966;<tspan baseline-shift="sub" font-size="75%">i</tspan>(z<tspan baseline-shift="sub" font-size="75%">t</tspan>)</text>

  <text x="785" y="302" font-size="11" fill="#334155">3. Project &#964;<tspan baseline-shift="sub" font-size="75%">&#952;</tspan>(y) &#8594; K, V</text>
  <text x="785" y="320" font-size="11" fill="#334155">   K = W<tspan baseline-shift="sub" font-size="75%">K</tspan><tspan baseline-shift="super" font-size="75%">(i)</tspan> &#183; &#964;<tspan baseline-shift="sub" font-size="75%">&#952;</tspan>(y)</text>
  <text x="785" y="338" font-size="11" fill="#334155">   V = W<tspan baseline-shift="sub" font-size="75%">V</tspan><tspan baseline-shift="super" font-size="75%">(i)</tspan> &#183; &#964;<tspan baseline-shift="sub" font-size="75%">&#952;</tspan>(y)</text>

  <text x="785" y="360" font-size="11" fill="#334155">4. Compute attention:</text>
  <text x="785" y="378" font-size="11" fill="#334155">   softmax(QK<tspan baseline-shift="super" font-size="75%">&#8868;</tspan>/&#8730;d)V</text>

  <text x="785" y="400" font-size="11" fill="#334155">5. Inject into UNet</text>
  <text x="785" y="418" font-size="11" fill="#334155">   (no retraining needed)</text>

  <!-- ===== 底部说明 ===== -->
  <rect x="60" y="480" width="880" height="56" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="500" y="504" text-anchor="middle" font-size="12" fill="#334155">The cross-attention mechanism enables LDMs to handle diverse conditioning modalities (text, bounding boxes, etc.)</text>
  <text x="500" y="524" text-anchor="middle" font-size="12" fill="#334155">within a single framework by projecting all conditions into a shared latent space and injecting them via attention.</text>

  <!-- ===== 二部图示意（左下角小图） ===== -->
  <rect x="60" y="560" width="400" height="100" rx="4" fill="#fbfcfe" stroke="#cbd5e1" stroke-width="1"/>
  <text x="260" y="582" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e293b">Bipartite Matching: Q (UNet) vs K (Condition)</text>

  <!-- 左侧节点：Q 序列 -->
  <circle cx="120" cy="610" r="6" fill="#6366f1"/>
  <text x="120" y="632" text-anchor="middle" font-size="10" fill="#334155">q<tspan baseline-shift="sub" font-size="75%">1</tspan></text>
  <circle cx="120" cy="650" r="6" fill="#6366f1"/>
  <text x="120" y="672" text-anchor="middle" font-size="10" fill="#334155">q<tspan baseline-shift="sub" font-size="75%">2</tspan></text>

  <!-- 右侧节点：K 序列 -->
  <circle cx="380" cy="610" r="6" fill="#94a3b8"/>
  <text x="380" y="632" text-anchor="middle" font-size="10" fill="#334155">k<tspan baseline-shift="sub" font-size="75%">1</tspan></text>
  <circle cx="380" cy="650" r="6" fill="#94a3b8"/>
  <text x="380" y="672" text-anchor="middle" font-size="10" fill="#334155">k<tspan baseline-shift="sub" font-size="75%">2</tspan></text>

  <!-- 连边：选中的加粗 -->
  <line x1="126" y1="610" x2="374" y2="610" stroke="#6366f1" stroke-width="2.5"/>
  <line x1="126" y1="650" x2="374" y2="650" stroke="#6366f1" stroke-width="2.5"/>
  <line x1="126" y1="610" x2="374" y2="650" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="126" y1="650" x2="374" y2="610" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- 图注 -->
  <text x="260" y="700" text-anchor="middle" font-size="10" fill="#64748b">Solid = selected alignment; dashed = other possible matches</text>

</svg>
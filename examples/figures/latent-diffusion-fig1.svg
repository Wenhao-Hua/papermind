<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" width="960" height="680">
  <rect x="0" y="0" width="960" height="680" fill="#ffffff"/>

  <!-- 标题 -->
  <text x="480" y="36" font-size="18" font-weight="700" fill="#1e293b" text-anchor="middle">Cross-Attention Conditioning in Latent Diffusion Models</text>
  <line x1="200" y1="46" x2="760" y2="46" stroke="#cbd5e1" stroke-width="1"/>

  <!-- ===== 左侧主面板：核心机制 ===== -->
  <!-- 条件编码器框 -->
  <rect x="40" y="70" width="280" height="110" rx="4" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
  <text x="180" y="94" font-size="13" font-weight="600" fill="#1e293b" text-anchor="middle">Condition Encoder</text>
  <text x="180" y="114" font-size="11" fill="#334155" text-anchor="middle">Domain-specific encoder</text>
  <text x="180" y="132" font-size="11" fill="#334155" text-anchor="middle">y (text / bbox / class)</text>
  <text x="180" y="152" font-size="11" fill="#64748b" text-anchor="middle">&#8595;</text>
  <text x="180" y="170" font-size="12" font-weight="600" fill="#3730a3" text-anchor="middle">&#964;<tspan font-size="9" baseline-shift="sub">&#952;</tspan>(y) &#8712; &#8477;<tspan font-size="9" baseline-shift="super">M&#215;d<tspan font-size="9" baseline-shift="sub">&#964;</tspan></tspan></text>

  <!-- 箭头：条件编码器 → 交叉注意力 -->
  <line x1="320" y1="125" x2="370" y2="125" stroke="#6366f1" stroke-width="2"/>
  <polygon points="370,120 382,125 370,130" fill="#6366f1"/>

  <!-- 交叉注意力核心框（强调色） -->
  <rect x="385" y="60" width="280" height="130" rx="4" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="525" y="84" font-size="14" font-weight="700" fill="#3730a3" text-anchor="middle">Cross-Attention Layer</text>
  <text x="525" y="104" font-size="11" fill="#334155" text-anchor="middle">Attention(Q, K, V) = softmax</text>
  <text x="525" y="122" font-size="12" font-weight="600" fill="#3730a3" text-anchor="middle">( QK<tspan font-size="9" baseline-shift="super">&#8868;</tspan> / &#8730;d ) V</text>
  <line x1="410" y1="132" x2="640" y2="132" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="525" y="150" font-size="10" fill="#64748b" text-anchor="middle">Q = W<tspan font-size="7" baseline-shift="sub">Q</tspan><tspan font-size="7" baseline-shift="super">(i)</tspan> &#183; &#966;<tspan font-size="7" baseline-shift="sub">i</tspan>(z<tspan font-size="7" baseline-shift="sub">t</tspan>)</text>
  <text x="525" y="166" font-size="10" fill="#64748b" text-anchor="middle">K = W<tspan font-size="7" baseline-shift="sub">K</tspan><tspan font-size="7" baseline-shift="super">(i)</tspan> &#183; &#964;<tspan font-size="7" baseline-shift="sub">&#952;</tspan>(y)</text>
  <text x="525" y="182" font-size="10" fill="#64748b" text-anchor="middle">V = W<tspan font-size="7" baseline-shift="sub">V</tspan><tspan font-size="7" baseline-shift="super">(i)</tspan> &#183; &#964;<tspan font-size="7" baseline-shift="sub">&#952;</tspan>(y)</text>

  <!-- 箭头：交叉注意力 → UNet 特征 -->
  <line x1="665" y1="125" x2="715" y2="125" stroke="#6366f1" stroke-width="2"/>
  <polygon points="715,120 727,125 715,130" fill="#6366f1"/>

  <!-- UNet 特征框 -->
  <rect x="730" y="70" width="190" height="110" rx="4" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
  <text x="825" y="94" font-size="13" font-weight="600" fill="#1e293b" text-anchor="middle">UNet Feature</text>
  <text x="825" y="114" font-size="11" fill="#334155" text-anchor="middle">&#966;<tspan font-size="8" baseline-shift="sub">i</tspan>(z<tspan font-size="8" baseline-shift="sub">t</tspan>)</text>
  <text x="825" y="134" font-size="10" fill="#64748b" text-anchor="middle">Intermediate feature</text>
  <text x="825" y="152" font-size="10" fill="#64748b" text-anchor="middle">at layer i</text>
  <text x="825" y="170" font-size="10" fill="#64748b" text-anchor="middle">z<tspan font-size="7" baseline-shift="sub">t</tspan> : noisy latent</text>

  <!-- ===== 右侧面板：图例与机制拆解 ===== -->
  <rect x="40" y="210" width="880" height="450" rx="4" fill="#fbfcfe" stroke="#e2e8f0" stroke-width="1"/>

  <!-- 图例 -->
  <text x="60" y="240" font-size="13" font-weight="600" fill="#1e293b">Legend</text>
  <line x1="60" y1="256" x2="130" y2="256" stroke="#6366f1" stroke-width="2"/>
  <polygon points="130,251 140,256 130,261" fill="#6366f1"/>
  <text x="148" y="260" font-size="11" fill="#334155">Data flow / forward pass</text>

  <line x1="60" y1="278" x2="130" y2="278" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,4"/>
  <polygon points="130,273 140,278 130,283" fill="#94a3b8"/>
  <text x="148" y="282" font-size="11" fill="#334155">Reference / skip connection</text>

  <line x1="60" y1="300" x2="130" y2="300" stroke="#6366f1" stroke-width="3"/>
  <polygon points="130,294 142,300 130,306" fill="#6366f1"/>
  <text x="148" y="304" font-size="11" fill="#334155">Selected mapping (highlighted)</text>

  <!-- 机制拆解：二部图 -->
  <text x="60" y="340" font-size="13" font-weight="600" fill="#1e293b">Explicit Mapping: Condition &#8594; Latent Feature</text>

  <!-- 左列：条件表示 -->
  <text x="120" y="370" font-size="11" font-weight="600" fill="#3730a3" text-anchor="middle">&#964;<tspan font-size="8" baseline-shift="sub">&#952;</tspan>(y) &#8712; &#8477;<tspan font-size="8" baseline-shift="super">M&#215;d<tspan font-size="8" baseline-shift="sub">&#964;</tspan></tspan></text>
  <rect x="80" y="380" width="80" height="24" rx="3" fill="#eef2ff" stroke="#6366f1" stroke-width="1"/>
  <text x="120" y="396" font-size="10" fill="#3730a3" text-anchor="middle">token 1</text>
  <rect x="80" y="410" width="80" height="24" rx="3" fill="#eef2ff" stroke="#6366f1" stroke-width="1"/>
  <text x="120" y="426" font-size="10" fill="#3730a3" text-anchor="middle">token 2</text>
  <rect x="80" y="440" width="80" height="24" rx="3" fill="#eef2ff" stroke="#6366f1" stroke-width="1"/>
  <text x="120" y="456" font-size="10" fill="#3730a3" text-anchor="middle">token 3</text>
  <text x="120" y="478" font-size="10" fill="#64748b" text-anchor="middle">&#8942;</text>
  <rect x="80" y="486" width="80" height="24" rx="3" fill="#eef2ff" stroke="#6366f1" stroke-width="1"/>
  <text x="120" y="502" font-size="10" fill="#3730a3" text-anchor="middle">token M</text>

  <!-- 右列：UNet 特征 -->
  <text x="520" y="370" font-size="11" font-weight="600" fill="#1e293b" text-anchor="middle">&#966;<tspan font-size="8" baseline-shift="sub">i</tspan>(z<tspan font-size="8" baseline-shift="sub">t</tspan>) &#8712; &#8477;<tspan font-size="8" baseline-shift="super">N&#215;d<tspan font-size="8" baseline-shift="sub">i</tspan></tspan></text>
  <rect x="480" y="380" width="80" height="24" rx="3" fill="#f1f5f9" stroke="#475569" stroke-width="1"/>
  <text x="520" y="396" font-size="10" fill="#1e293b" text-anchor="middle">feat 1</text>
  <rect x="480" y="410" width="80" height="24" rx="3" fill="#f1f5f9" stroke="#475569" stroke-width="1"/>
  <text x="520" y="426" font-size="10" fill="#1e293b" text-anchor="middle">feat 2</text>
  <rect x="480" y="440" width="80" height="24" rx="3" fill="#f1f5f9" stroke="#475569" stroke-width="1"/>
  <text x="520" y="456" font-size="10" fill="#1e293b" text-anchor="middle">feat 3</text>
  <text x="520" y="478" font-size="10" fill="#64748b" text-anchor="middle">&#8942;</text>
  <rect x="480" y="486" width="80" height="24" rx="3" fill="#f1f5f9" stroke="#475569" stroke-width="1"/>
  <text x="520" y="502" font-size="10" fill="#1e293b" text-anchor="middle">feat N</text>

  <!-- 连边：二部图（选中加粗） -->
  <!-- 选中边（token 2 → feat 1）加粗强调色 -->
  <line x1="160" y1="422" x2="480" y2="392" stroke="#6366f1" stroke-width="3"/>
  <!-- 其他边灰色虚线 -->
  <line x1="160" y1="396" x2="480" y2="422" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="160" y1="396" x2="480" y2="456" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="160" y1="422" x2="480" y2="456" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="160" y1="456" x2="480" y2="392" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="160" y1="456" x2="480" y2="422" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="160" y1="502" x2="480" y2="392" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="160" y1="502" x2="480" y2="456" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- 标注：选中映射 -->
  <text x="320" y="380" font-size="10" fill="#6366f1" text-anchor="middle" font-weight="600">selected mapping</text>
  <text x="320" y="396" font-size="9" fill="#64748b" text-anchor="middle">(attention weight max)</text>

  <!-- 底部说明 -->
  <text x="60" y="540" font-size="11" font-weight="600" fill="#1e293b">Key Insight</text>
  <text x="60" y="560" font-size="10" fill="#334155">Cross-attention enables a single model to handle diverse conditioning modalities</text>
  <text x="60" y="578" font-size="10" fill="#334155">(text, bounding boxes, class labels) without retraining.</text>
  <text x="60" y="598" font-size="10" fill="#334155">The condition encoder projects each modality into a shared latent space,</text>
  <text x="60" y="616" font-size="10" fill="#334155">and attention layers learn to align condition tokens with image features.</text>

  <!-- 公式注脚 -->
  <text x="60" y="644" font-size="10" fill="#64748b">Notation: d = key dimension; W<tspan font-size="7" baseline-shift="sub">Q</tspan>, W<tspan font-size="7" baseline-shift="sub">K</tspan>, W<tspan font-size="7" baseline-shift="sub">V</tspan> = learned projection matrices per layer i.</text>
</svg>
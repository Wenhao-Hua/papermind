<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" width="960" height="680">
  <rect x="0" y="0" width="960" height="680" fill="#ffffff"/>

  <!-- 标题 -->
  <text x="480" y="36" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">Reweighted Variational Objective in Latent Diffusion Models</text>

  <!-- 核心定义框（视觉焦点） -->
  <rect x="60" y="56" width="840" height="100" rx="6" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="480" y="82" font-size="16" font-weight="bold" fill="#3730a3" text-anchor="middle">Core Definition: Reweighted Variational Objective</text>
  <text x="480" y="110" font-size="14" fill="#334155" text-anchor="middle">L<tspan baseline-shift="sub" font-size="75%">LDM</tspan> = E<tspan baseline-shift="sub" font-size="75%">t,x,ε</tspan> [ w(t) · || ε − ε<tspan baseline-shift="sub" font-size="75%">θ</tspan>(z<tspan baseline-shift="sub" font-size="75%">t</tspan>, t) ||<tspan baseline-shift="super" font-size="75%">2</tspan> ]</text>
  <text x="480" y="136" font-size="12" fill="#64748b" text-anchor="middle">where w(t) undersamples initial denoising steps (t → 0) to suppress imperceptible high-frequency details</text>

  <!-- 左侧：时间步权重示意图 -->
  <rect x="60" y="176" width="400" height="240" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="260" y="200" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="middle">Weight Schedule w(t) over Diffusion Steps</text>

  <!-- 坐标轴 -->
  <line x1="100" y1="380" x2="420" y2="380" stroke="#475569" stroke-width="1.5"/>
  <polygon points="420,380 414,376 414,384" fill="#475569"/>
  <line x1="100" y1="380" x2="100" y2="220" stroke="#475569" stroke-width="1.5"/>
  <polygon points="100,220 96,226 104,226" fill="#475569"/>

  <!-- 轴标签 -->
  <text x="430" y="384" font-size="11" fill="#334155" text-anchor="start">t (step)</text>
  <text x="90" y="214" font-size="11" fill="#334155" text-anchor="end">w(t)</text>

  <!-- 刻度 -->
  <text x="100" y="398" font-size="10" fill="#64748b" text-anchor="middle">0</text>
  <text x="260" y="398" font-size="10" fill="#64748b" text-anchor="middle">T/2</text>
  <text x="420" y="398" font-size="10" fill="#64748b" text-anchor="middle">T</text>

  <!-- 权重曲线：先低后高再略降（示意） -->
  <path d="M100,370 Q180,370 220,340 Q260,300 300,260 Q340,240 380,250 Q400,260 420,280" fill="none" stroke="#6366f1" stroke-width="2.5"/>

  <!-- 标注区域 -->
  <rect x="120" y="230" width="100" height="28" rx="3" fill="#eef2ff" stroke="#6366f1" stroke-width="1"/>
  <text x="170" y="248" font-size="10" fill="#3730a3" text-anchor="middle">Undersampled</text>
  <line x1="170" y1="258" x2="170" y2="340" stroke="#6366f1" stroke-width="1" stroke-dasharray="4,3"/>

  <rect x="310" y="222" width="80" height="24" rx="3" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="350" y="238" font-size="10" fill="#334155" text-anchor="middle">Focused</text>

  <!-- 右侧：损失分解面板 -->
  <rect x="500" y="176" width="400" height="240" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="700" y="200" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="middle">Loss Decomposition: Perceptual Compression</text>

  <!-- 二部图：左列=时间步，右列=损失权重 -->
  <text x="560" y="228" font-size="11" fill="#334155" text-anchor="middle">Diffusion Step t</text>
  <text x="840" y="228" font-size="11" fill="#334155" text-anchor="middle">Loss Weight w(t)</text>

  <!-- 左列节点 -->
  <circle cx="560" cy="260" r="16" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="560" y="264" font-size="10" fill="#3730a3" text-anchor="middle">t=0</text>
  <circle cx="560" cy="310" r="16" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="560" y="314" font-size="10" fill="#3730a3" text-anchor="middle">t=T/2</text>
  <circle cx="560" cy="360" r="16" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="560" y="364" font-size="10" fill="#3730a3" text-anchor="middle">t=T</text>

  <!-- 右列节点 -->
  <circle cx="840" cy="260" r="16" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="840" y="264" font-size="10" fill="#334155" text-anchor="middle">low</text>
  <circle cx="840" cy="310" r="16" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="840" y="264" font-size="10" fill="#334155" text-anchor="middle">high</text>
  <circle cx="840" cy="360" r="16" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="840" y="264" font-size="10" fill="#334155" text-anchor="middle">mid</text>

  <!-- 连边：t=0 → low（细虚线） -->
  <line x1="576" y1="260" x2="824" y2="260" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,4"/>
  <!-- t=T/2 → high（粗实线强调） -->
  <line x1="576" y1="310" x2="824" y2="310" stroke="#6366f1" stroke-width="3"/>
  <!-- t=T → mid（细实线） -->
  <line x1="576" y1="360" x2="824" y2="360" stroke="#475569" stroke-width="1.5"/>

  <!-- 右侧标签 -->
  <text x="700" y="400" font-size="10" fill="#64748b" text-anchor="middle">Model focuses on semantic content (mid-to-high t)</text>
  <text x="700" y="416" font-size="10" fill="#64748b" text-anchor="middle">while ignoring imperceptible noise (low t)</text>

  <!-- 底部：机制拆解面板 -->
  <rect x="60" y="436" width="840" height="120" rx="4" fill="#fbfcfe" stroke="#e2e8f0" stroke-width="1"/>
  <text x="480" y="460" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="middle">Mechanism: Diffusion Model as Lossy Compressor</text>

  <!-- 三列说明 -->
  <rect x="80" y="474" width="240" height="68" rx="3" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="200" y="494" font-size="11" font-weight="bold" fill="#334155" text-anchor="middle">Step-wise Weighting</text>
  <text x="200" y="512" font-size="10" fill="#64748b" text-anchor="middle">w(t) assigns lower weight to</text>
  <text x="200" y="526" font-size="10" fill="#64748b" text-anchor="middle">early steps (t→0) where noise</text>
  <text x="200" y="540" font-size="10" fill="#64748b" text-anchor="middle">dominates imperceptible details</text>

  <rect x="340" y="474" width="240" height="68" rx="3" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="460" y="494" font-size="11" font-weight="bold" fill="#334155" text-anchor="middle">Semantic Focus</text>
  <text x="460" y="512" font-size="10" fill="#64748b" text-anchor="middle">Model capacity is directed</text>
  <text x="460" y="526" font-size="10" fill="#64748b" text-anchor="middle">toward mid-to-high t steps</text>
  <text x="460" y="540" font-size="10" fill="#64748b" text-anchor="middle">that encode semantic content</text>

  <rect x="600" y="474" width="280" height="68" rx="3" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="740" y="494" font-size="11" font-weight="bold" fill="#334155" text-anchor="middle">Detail Suppression</text>
  <text x="740" y="512" font-size="10" fill="#64748b" text-anchor="middle">Imperceptible high-frequency</text>
  <text x="740" y="526" font-size="10" fill="#64748b" text-anchor="middle">details are automatically</text>
  <text x="740" y="540" font-size="10" fill="#64748b" text-anchor="middle">suppressed during training</text>

  <!-- 图例 -->
  <rect x="60" y="576" width="840" height="44" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="100" y="600" font-size="11" font-weight="bold" fill="#1e293b" text-anchor="start">Legend:</text>

  <line x1="180" y1="596" x2="220" y2="596" stroke="#6366f1" stroke-width="3"/>
  <text x="228" y="600" font-size="10" fill="#334155" text-anchor="start">High weight (focused)</text>

  <line x1="360" y1="596" x2="400" y2="596" stroke="#475569" stroke-width="1.5"/>
  <text x="408" y="600" font-size="10" fill="#334155" text-anchor="start">Medium weight</text>

  <line x1="540" y1="596" x2="580" y2="596" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="588" y="600" font-size="10" fill="#334155" text-anchor="start">Low weight (undersampled)</text>

  <rect x="740" y="586" width="16" height="16" rx="2" fill="#eef2ff" stroke="#6366f1" stroke-width="1"/>
  <text x="764" y="600" font-size="10" fill="#334155" text-anchor="start">Core definition</text>

  <!-- 底部引用 -->
  <text x="480" y="648" font-size="10" fill="#94a3b8" text-anchor="middle">Based on LDM formulation: L<tspan baseline-shift="sub" font-size="75%">LDM</tspan> = E<tspan baseline-shift="sub" font-size="75%">t,x,ε</tspan> [ w(t) · || ε − ε<tspan baseline-shift="sub" font-size="75%">θ</tspan>(z<tspan baseline-shift="sub" font-size="75%">t</tspan>, t) ||<tspan baseline-shift="super" font-size="75%">2</tspan> ]  (Rombach et al., 2022)</text>
</svg>
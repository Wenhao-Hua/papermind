<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#1e293b" width="960" height="680">
  <rect x="0" y="0" width="960" height="680" fill="#ffffff"/>

  <!-- 标题 -->
  <text x="480" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">PPO Clipped Surrogate Objective</text>
  <line x1="200" y1="48" x2="760" y2="48" stroke="#cbd5e1" stroke-width="1"/>

  <!-- ===== 主面板：核心公式 ===== -->
  <rect x="40" y="68" width="880" height="120" rx="6" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="480" y="96" text-anchor="middle" font-size="16" font-weight="700" fill="#3730a3">Core Objective: L&#8315;&#8314;&#8315;&#8315;&#8315;(θ)</text>
  <text x="480" y="132" text-anchor="middle" font-size="18" font-weight="600" fill="#1e293b">L&#8315;&#8314;&#8315;&#8315;&#8315;(θ) = &#296;̂&#8342;[ min( r&#8342;(θ) · Â&#8342; , clip(r&#8342;(θ), 1−ε, 1+ε) · Â&#8342; ) ]</text>
  <text x="480" y="162" text-anchor="middle" font-size="13" fill="#475569">where r&#8342;(θ) = π&#8342;(a&#8342;|s&#8342;) / π&#8342;ₒ&#8342;ₔ(a&#8342;|s&#8342;) &amp;nbsp; (probability ratio)</text>
  <text x="480" y="180" text-anchor="middle" font-size="12" fill="#64748b">The min with clipped term forms a pessimistic lower bound, preventing large policy updates.</text>

  <!-- ===== 左侧：r_t 定义与映射 ===== -->
  <rect x="40" y="208" width="420" height="200" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="250" y="234" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">Probability Ratio r&#8342;(θ)</text>

  <!-- 映射表 -->
  <text x="80" y="264" font-size="13" fill="#334155">r&#8342;(θ) = π&#8342;(a&#8342;|s&#8342;) / π&#8342;ₒ&#8342;ₔ(a&#8342;|s&#8342;)</text>
  <text x="80" y="286" font-size="12" fill="#475569">Measures how much the new policy deviates from the old one.</text>

  <!-- 二部图：旧策略 vs 新策略 -->
  <text x="130" y="316" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">Old Policy π&#8342;ₒ&#8342;ₔ</text>
  <text x="370" y="316" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">New Policy π&#8342;</text>

  <!-- 左列节点 -->
  <circle cx="130" cy="340" r="6" fill="#94a3b8"/>
  <circle cx="130" cy="364" r="6" fill="#94a3b8"/>
  <circle cx="130" cy="388" r="6" fill="#94a3b8"/>

  <!-- 右列节点 -->
  <circle cx="370" cy="340" r="6" fill="#6366f1"/>
  <circle cx="370" cy="364" r="6" fill="#6366f1"/>
  <circle cx="370" cy="388" r="6" fill="#6366f1"/>

  <!-- 连线 -->
  <line x1="136" y1="340" x2="364" y2="340" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="136" y1="364" x2="364" y2="364" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="136" y1="388" x2="364" y2="388" stroke="#cbd5e1" stroke-width="1"/>

  <text x="250" y="404" text-anchor="middle" font-size="11" fill="#64748b">Each action probability maps from old to new policy</text>

  <!-- ===== 右侧：clip 机制 ===== -->
  <rect x="500" y="208" width="420" height="200" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="710" y="234" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">Clipping Mechanism</text>

  <!-- 区间图 -->
  <text x="540" y="268" font-size="12" fill="#334155">clip(r, 1−ε, 1+ε) =</text>
  <text x="540" y="288" font-size="12" fill="#475569">1−ε &amp;nbsp; if r &lt; 1−ε</text>
  <text x="540" y="306" font-size="12" fill="#475569">r &amp;nbsp; if 1−ε ≤ r ≤ 1+ε</text>
  <text x="540" y="324" font-size="12" fill="#475569">1+ε &amp;nbsp; if r &gt; 1+ε</text>

  <!-- 数轴示意 -->
  <line x1="540" y1="350" x2="860" y2="350" stroke="#475569" stroke-width="1.5"/>
  <polygon points="860,350 854,346 854,354" fill="#475569"/>
  <text x="540" y="370" font-size="11" fill="#64748b">0</text>
  <text x="660" y="370" font-size="11" fill="#64748b">1−ε</text>
  <text x="760" y="370" font-size="11" fill="#64748b">1</text>
  <text x="840" y="370" font-size="11" fill="#64748b">1+ε</text>
  <line x1="660" y1="344" x2="660" y2="356" stroke="#6366f1" stroke-width="1.5"/>
  <line x1="760" y1="344" x2="760" y2="356" stroke="#6366f1" stroke-width="1.5"/>
  <line x1="840" y1="344" x2="840" y2="356" stroke="#6366f1" stroke-width="1.5"/>

  <text x="710" y="400" text-anchor="middle" font-size="11" fill="#64748b">ε is a hyperparameter (typically 0.2)</text>

  <!-- ===== 下方：min 操作与悲观下界 ===== -->
  <rect x="40" y="428" width="880" height="120" rx="4" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="480" y="456" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">Min Operation: Pessimistic Lower Bound</text>

  <!-- 两个项 -->
  <rect x="80" y="472" width="360" height="60" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="260" y="494" text-anchor="middle" font-size="13" fill="#334155">Term 1: r&#8342;(θ) · Â&#8342;</text>
  <text x="260" y="514" text-anchor="middle" font-size="11" fill="#64748b">Unclipped surrogate objective</text>

  <rect x="520" y="472" width="360" height="60" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="700" y="494" text-anchor="middle" font-size="13" fill="#334155">Term 2: clip(r&#8342;(θ), 1−ε, 1+ε) · Â&#8342;</text>
  <text x="700" y="514" text-anchor="middle" font-size="11" fill="#64748b">Clipped version (removes incentive to go outside [1−ε, 1+ε])</text>

  <!-- min 箭头 -->
  <line x1="260" y1="532" x2="260" y2="548" stroke="#6366f1" stroke-width="1.5"/>
  <line x1="700" y1="532" x2="700" y2="548" stroke="#6366f1" stroke-width="1.5"/>
  <line x1="260" y1="548" x2="700" y2="548" stroke="#6366f1" stroke-width="1.5"/>
  <polygon points="480,548 474,542 486,542" fill="#6366f1"/>
  <text x="480" y="564" text-anchor="middle" font-size="12" font-weight="600" fill="#3730a3">min(·, ·) → pessimistic estimate</text>

  <!-- ===== 底部图例 ===== -->
  <rect x="40" y="568" width="880" height="90" rx="4" fill="#fbfcfe" stroke="#e2e8f0" stroke-width="1"/>
  <text x="80" y="594" font-size="12" font-weight="600" fill="#334155">Legend</text>

  <!-- 箭头样式 -->
  <line x1="80" y1="616" x2="130" y2="616" stroke="#6366f1" stroke-width="1.5"/>
  <polygon points="130,616 124,612 124,620" fill="#6366f1"/>
  <text x="145" y="620" font-size="11" fill="#475569">Data flow / mapping</text>

  <line x1="280" y1="616" x2="330" y2="616" stroke="#94a3b8" stroke-width="1" stroke-dasharray="5,4"/>
  <polygon points="330,616 324,612 324,620" fill="#94a3b8"/>
  <text x="345" y="620" font-size="11" fill="#475569">Reference / baseline</text>

  <line x1="500" y1="616" x2="550" y2="616" stroke="#6366f1" stroke-width="2.5"/>
  <polygon points="550,616 544,612 544,620" fill="#6366f1"/>
  <text x="565" y="620" font-size="11" fill="#475569">Selected / emphasized</text>

  <text x="80" y="646" font-size="11" fill="#64748b">Notation: Â&#8342; = advantage estimate; ε = clip range (default 0.2); π&#8342; = policy parameterized by θ</text>
</svg>
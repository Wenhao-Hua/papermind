<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" width="960" height="680">
  <rect x="0" y="0" width="960" height="680" fill="#ffffff"/>

  <!-- 标题 -->
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e293b">PPO Clipped Surrogate Objective</text>
  <text x="480" y="60" text-anchor="middle" font-size="14" fill="#64748b">Proximal Policy Optimization — Core Definition</text>

  <!-- 主公式框（强调色） -->
  <rect x="80" y="84" width="800" height="100" rx="6" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="480" y="112" text-anchor="middle" font-size="16" font-weight="bold" fill="#3730a3">L<tspan baseline-shift="super" font-size="75%">CLIP</tspan>(θ) = &#8477;<tspan baseline-shift="sub" font-size="75%">t</tspan>[ min( r<tspan baseline-shift="sub" font-size="75%">t</tspan>(θ) · Â<tspan baseline-shift="sub" font-size="75%">t</tspan> , clip(r<tspan baseline-shift="sub" font-size="75%">t</tspan>(θ), 1−ε, 1+ε) · Â<tspan baseline-shift="sub" font-size="75%">t</tspan> ) ]</text>
  <text x="480" y="142" text-anchor="middle" font-size="13" fill="#475569">r<tspan baseline-shift="sub" font-size="75%">t</tspan>(θ) = π<tspan baseline-shift="sub" font-size="75%">θ</tspan>(a<tspan baseline-shift="sub" font-size="75%">t</tspan>|s<tspan baseline-shift="sub" font-size="75%">t</tspan>) / π<tspan baseline-shift="sub" font-size="75%">θ<tspan baseline-shift="sub" font-size="75%">old</tspan></tspan>(a<tspan baseline-shift="sub" font-size="75%">t</tspan>|s<tspan baseline-shift="sub" font-size="75%">t</tspan>)</text>
  <text x="480" y="168" text-anchor="middle" font-size="12" fill="#64748b">&#8477;<tspan baseline-shift="sub" font-size="75%">t</tspan> = empirical average over minibatch; Â<tspan baseline-shift="sub" font-size="75%">t</tspan> = advantage estimate</text>

  <!-- 左侧：概率比与截断机制 -->
  <rect x="80" y="208" width="380" height="220" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="270" y="234" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">Probability Ratio r<tspan baseline-shift="sub" font-size="75%">t</tspan>(θ)</text>

  <!-- 新旧策略映射 -->
  <text x="120" y="264" font-size="12" fill="#334155">π<tspan baseline-shift="sub" font-size="75%">θ<tspan baseline-shift="sub" font-size="75%">old</tspan></tspan> : S &#8594; Δ(A)</text>
  <text x="120" y="284" font-size="12" fill="#334155">π<tspan baseline-shift="sub" font-size="75%">θ</tspan> : S &#8594; Δ(A)</text>

  <!-- 二部图示意：状态→动作概率 -->
  <text x="120" y="312" font-size="11" fill="#64748b">State s<tspan baseline-shift="sub" font-size="75%">t</tspan></text>
  <circle cx="160" cy="330" r="4" fill="#6366f1"/>
  <circle cx="160" cy="360" r="4" fill="#94a3b8"/>
  <circle cx="160" cy="390" r="4" fill="#94a3b8"/>

  <text x="240" y="312" font-size="11" fill="#64748b">Action a<tspan baseline-shift="sub" font-size="75%">t</tspan></text>
  <circle cx="280" cy="330" r="4" fill="#6366f1"/>
  <circle cx="280" cy="360" r="4" fill="#94a3b8"/>
  <circle cx="280" cy="390" r="4" fill="#94a3b8"/>

  <!-- 选中连边（强调色） -->
  <line x1="164" y1="330" x2="276" y2="330" stroke="#6366f1" stroke-width="2"/>
  <line x1="164" y1="360" x2="276" y2="360" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="164" y1="390" x2="276" y2="390" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3"/>

  <text x="320" y="334" font-size="11" fill="#475569">r = π<tspan baseline-shift="sub" font-size="75%">θ</tspan>/π<tspan baseline-shift="sub" font-size="75%">θ<tspan baseline-shift="sub" font-size="75%">old</tspan></tspan></text>

  <!-- 截断区间示意 -->
  <rect x="100" y="408" width="340" height="16" rx="3" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="120" y="420" font-size="10" fill="#64748b">0</text>
  <text x="200" y="420" font-size="10" fill="#64748b">1−ε</text>
  <line x1="200" y1="408" x2="200" y2="424" stroke="#475569" stroke-width="1"/>
  <text x="270" y="420" font-size="10" fill="#64748b">1</text>
  <line x1="270" y1="408" x2="270" y2="424" stroke="#475569" stroke-width="1"/>
  <text x="340" y="420" font-size="10" fill="#64748b">1+ε</text>
  <line x1="340" y1="408" x2="340" y2="424" stroke="#475569" stroke-width="1"/>
  <text x="420" y="420" font-size="10" fill="#64748b">r</text>
  <rect x="200" y="408" width="140" height="16" fill="none" stroke="#6366f1" stroke-width="2" stroke-dasharray="4,2" rx="3"/>

  <!-- 右侧：min 与 clip 机制 -->
  <rect x="500" y="208" width="380" height="220" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="690" y="234" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">Clipping &amp; Lower-Bound</text>

  <!-- 小表格：三种情况 -->
  <text x="530" y="264" font-size="12" font-weight="bold" fill="#334155">Condition</text>
  <text x="650" y="264" font-size="12" font-weight="bold" fill="#334155">L<tspan baseline-shift="super" font-size="75%">CLIP</tspan> value</text>

  <line x1="520" y1="272" x2="860" y2="272" stroke="#cbd5e1" stroke-width="1"/>

  <text x="530" y="294" font-size="11" fill="#475569">Â &gt; 0, r &lt; 1−ε</text>
  <text x="650" y="294" font-size="11" fill="#6366f1">(1−ε)Â</text>

  <text x="530" y="318" font-size="11" fill="#475569">Â &gt; 0, r ∈ [1−ε, 1+ε]</text>
  <text x="650" y="318" font-size="11" fill="#6366f1">rÂ</text>

  <text x="530" y="342" font-size="11" fill="#475569">Â &lt; 0, r &gt; 1+ε</text>
  <text x="650" y="342" font-size="11" fill="#6366f1">(1+ε)Â</text>

  <text x="530" y="366" font-size="11" fill="#475569">Â &lt; 0, r ∈ [1−ε, 1+ε]</text>
  <text x="650" y="366" font-size="11" fill="#6366f1">rÂ</text>

  <text x="530" y="390" font-size="11" fill="#475569">Â &gt; 0, r &gt; 1+ε</text>
  <text x="650" y="390" font-size="11" fill="#6366f1">(1+ε)Â</text>

  <text x="530" y="414" font-size="11" fill="#475569">Â &lt; 0, r &lt; 1−ε</text>
  <text x="650" y="414" font-size="11" fill="#6366f1">(1−ε)Â</text>

  <!-- 底部：算法流程 -->
  <rect x="80" y="452" width="800" height="100" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="480" y="478" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">PPO Algorithm (Simplified)</text>

  <!-- 步骤 -->
  <rect x="110" y="496" width="160" height="36" rx="4" fill="#ffffff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="190" y="518" text-anchor="middle" font-size="12" fill="#3730a3">Collect trajectory</text>

  <polygon points="274,514 286,514 286,508 298,514 286,520 286,514" fill="#6366f1"/>

  <rect x="302" y="496" width="160" height="36" rx="4" fill="#ffffff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="382" y="518" text-anchor="middle" font-size="12" fill="#3730a3">Compute Â<tspan baseline-shift="sub" font-size="75%">t</tspan></text>

  <polygon points="466,514 478,514 478,508 490,514 478,520 478,514" fill="#6366f1"/>

  <rect x="494" y="496" width="160" height="36" rx="4" fill="#ffffff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="574" y="518" text-anchor="middle" font-size="12" fill="#3730a3">Optimize L<tspan baseline-shift="super" font-size="75%">CLIP</tspan></text>

  <polygon points="658,514 670,514 670,508 682,514 670,520 670,514" fill="#6366f1"/>

  <rect x="686" y="496" width="160" height="36" rx="4" fill="#ffffff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="766" y="518" text-anchor="middle" font-size="12" fill="#3730a3">Repeat K epochs</text>

  <!-- 图例 -->
  <rect x="80" y="576" width="800" height="40" rx="4" fill="#fbfcfe" stroke="#e2e8f0" stroke-width="1"/>
  <text x="120" y="600" font-size="11" fill="#64748b">&#8594; 实线 = 前向数据流</text>
  <text x="320" y="600" font-size="11" fill="#64748b">- - - 虚线 = 对照/参照</text>
  <text x="520" y="600" font-size="11" fill="#64748b">&#9632; 强调色 = 选中/核心</text>
  <text x="720" y="600" font-size="11" fill="#64748b">ε = 0.2 (default)</text>

  <!-- 底部说明 -->
  <text x="480" y="648" text-anchor="middle" font-size="11" fill="#94a3b8">L<tspan baseline-shift="super" font-size="75%">CLIP</tspan> forms a pessimistic lower bound: min(rÂ, clip(r)Â) removes incentive to move r outside [1−ε, 1+ε]</text>
</svg>
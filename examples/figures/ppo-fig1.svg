<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" width="960" height="680">
  <rect x="0" y="0" width="960" height="680" fill="#ffffff"/>

  <!-- 标题 -->
  <text x="480" y="38" font-size="20" font-weight="700" fill="#1e293b" text-anchor="middle">PPO Clipped Surrogate Objective</text>
  <line x1="280" y1="48" x2="680" y2="48" stroke="#cbd5e1" stroke-width="1"/>

  <!-- 核心公式框（视觉焦点） -->
  <rect x="120" y="68" width="720" height="100" rx="6" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="480" y="96" font-size="16" font-weight="700" fill="#3730a3" text-anchor="middle">Core Objective: L<text><tspan baseline-shift="super" font-size="75%">CLIP</tspan></text>(θ)</text>
  <text x="480" y="130" font-size="18" font-weight="600" fill="#1e293b" text-anchor="middle">L<text><tspan baseline-shift="super" font-size="75%">CLIP</tspan></text>(θ) = &#x1D0C;<text><tspan baseline-shift="sub" font-size="75%">t</tspan></text>[ min( r<text><tspan baseline-shift="sub" font-size="75%">t</tspan></text>(θ) · &#x1D0C;<text><tspan baseline-shift="sub" font-size="75%">t</tspan></text> , clip(r<text><tspan baseline-shift="sub" font-size="75%">t</tspan></text>(θ), 1−ε, 1+ε) · &#x1D0C;<text><tspan baseline-shift="sub" font-size="75%">t</tspan></text> ) ]</text>
  <text x="480" y="156" font-size="13" fill="#64748b" text-anchor="middle">where r<text><tspan baseline-shift="sub" font-size="75%">t</tspan></text>(θ) = π<text><tspan baseline-shift="sub" font-size="75%">θ</tspan></text>(a<text><tspan baseline-shift="sub" font-size="75%">t</tspan></text>|s<text><tspan baseline-shift="sub" font-size="75%">t</tspan></text>) / π<text><tspan baseline-shift="sub" font-size="75%">θ<text><tspan baseline-shift="sub" font-size="75%">old</tspan></text></tspan></text>(a<text><tspan baseline-shift="sub" font-size="75%">t</tspan></text>|s<text><tspan baseline-shift="sub" font-size="75%">t</tspan></text>) ,  ε = 0.2 (default)</text>

  <!-- 概率比率定义 -->
  <rect x="120" y="188" width="340" height="80" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="290" y="214" font-size="14" font-weight="600" fill="#1e293b" text-anchor="middle">Probability Ratio r<text><tspan baseline-shift="sub" font-size="75%">t</tspan></text>(θ)</text>
  <text x="290" y="244" font-size="15" fill="#334155" text-anchor="middle">r<text><tspan baseline-shift="sub" font-size="75%">t</tspan></text>(θ) = π<text><tspan baseline-shift="sub" font-size="75%">θ</tspan></text>(a<text><tspan baseline-shift="sub" font-size="75%">t</tspan></text>|s<text><tspan baseline-shift="sub" font-size="75%">t</tspan></text>) / π<text><tspan baseline-shift="sub" font-size="75%">θ<text><tspan baseline-shift="sub" font-size="75%">old</tspan></text></tspan></text>(a<text><tspan baseline-shift="sub" font-size="75%">t</tspan></text>|s<text><tspan baseline-shift="sub" font-size="75%">t</tspan></text>)</text>
  <text x="290" y="262" font-size="11" fill="#64748b" text-anchor="middle">measures how much new policy deviates from old</text>

  <!-- 截断机制说明 -->
  <rect x="500" y="188" width="340" height="80" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="670" y="214" font-size="14" font-weight="600" fill="#1e293b" text-anchor="middle">Clipping Mechanism</text>
  <text x="670" y="240" font-size="13" fill="#334155" text-anchor="middle">clip(r<text><tspan baseline-shift="sub" font-size="75%">t</tspan></text>, 1−ε, 1+ε) =</text>
  <text x="670" y="258" font-size="12" fill="#64748b" text-anchor="middle">1−ε  if r<text><tspan baseline-shift="sub" font-size="75%">t</tspan></text> &lt; 1−ε ; 1+ε  if r<text><tspan baseline-shift="sub" font-size="75%">t</tspan></text> &gt; 1+ε ; r<text><tspan baseline-shift="sub" font-size="75%">t</tspan></text> otherwise</text>

  <!-- 二部图：优势正负两种情况 -->
  <rect x="120" y="288" width="720" height="180" rx="4" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="480" y="314" font-size="15" font-weight="600" fill="#1e293b" text-anchor="middle">Two Cases of Advantage &#x1D0C;<text><tspan baseline-shift="sub" font-size="75%">t</tspan></text></text>

  <!-- 情况1：A>0 -->
  <rect x="150" y="330" width="320" height="120" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="310" y="354" font-size="14" font-weight="600" fill="#1e293b" text-anchor="middle">Case 1: &#x1D0C;<text><tspan baseline-shift="sub" font-size="75%">t</tspan></text> &gt; 0 (good action)</text>
  <line x1="170" y1="364" x2="450" y2="364" stroke="#e2e8f0" stroke-width="1"/>

  <!-- 左列：r_t 范围 -->
  <text x="210" y="390" font-size="12" fill="#334155" text-anchor="middle">r<text><tspan baseline-shift="sub" font-size="75%">t</tspan></text> &lt; 1−ε</text>
  <text x="310" y="390" font-size="12" fill="#334155" text-anchor="middle">1−ε ≤ r<text><tspan baseline-shift="sub" font-size="75%">t</tspan></text> ≤ 1+ε</text>
  <text x="410" y="390" font-size="12" fill="#334155" text-anchor="middle">r<text><tspan baseline-shift="sub" font-size="75%">t</tspan></text> &gt; 1+ε</text>

  <!-- 箭头与结果 -->
  <line x1="210" y1="400" x2="210" y2="420" stroke="#6366f1" stroke-width="1.5"/>
  <polygon points="210,424 206,416 214,416" fill="#6366f1"/>
  <line x1="310" y1="400" x2="310" y2="420" stroke="#6366f1" stroke-width="1.5"/>
  <polygon points="310,424 306,416 314,416" fill="#6366f1"/>
  <line x1="410" y1="400" x2="410" y2="420" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,3"/>
  <polygon points="410,424 406,416 414,416" fill="#94a3b8"/>

  <text x="210" y="440" font-size="11" fill="#6366f1" text-anchor="middle">increase r<text><tspan baseline-shift="sub" font-size="75%">t</tspan></text></text>
  <text x="310" y="440" font-size="11" fill="#6366f1" text-anchor="middle">increase r<text><tspan baseline-shift="sub" font-size="75%">t</tspan></text></text>
  <text x="410" y="440" font-size="11" fill="#94a3b8" text-anchor="middle">clipped (no gain)</text>

  <!-- 情况2：A<0 -->
  <rect x="490" y="330" width="320" height="120" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="650" y="354" font-size="14" font-weight="600" fill="#1e293b" text-anchor="middle">Case 2: &#x1D0C;<text><tspan baseline-shift="sub" font-size="75%">t</tspan></text> &lt; 0 (bad action)</text>
  <line x1="510" y1="364" x2="790" y2="364" stroke="#e2e8f0" stroke-width="1"/>

  <text x="550" y="390" font-size="12" fill="#334155" text-anchor="middle">r<text><tspan baseline-shift="sub" font-size="75%">t</tspan></text> &lt; 1−ε</text>
  <text x="650" y="390" font-size="12" fill="#334155" text-anchor="middle">1−ε ≤ r<text><tspan baseline-shift="sub" font-size="75%">t</tspan></text> ≤ 1+ε</text>
  <text x="750" y="390" font-size="12" fill="#334155" text-anchor="middle">r<text><tspan baseline-shift="sub" font-size="75%">t</tspan></text> &gt; 1+ε</text>

  <line x1="550" y1="400" x2="550" y2="420" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,3"/>
  <polygon points="550,424 546,416 554,416" fill="#94a3b8"/>
  <line x1="650" y1="400" x2="650" y2="420" stroke="#6366f1" stroke-width="1.5"/>
  <polygon points="650,424 646,416 654,416" fill="#6366f1"/>
  <line x1="750" y1="400" x2="750" y2="420" stroke="#6366f1" stroke-width="1.5"/>
  <polygon points="750,424 746,416 754,416" fill="#6366f1"/>

  <text x="550" y="440" font-size="11" fill="#94a3b8" text-anchor="middle">clipped (no decrease)</text>
  <text x="650" y="440" font-size="11" fill="#6366f1" text-anchor="middle">decrease r<text><tspan baseline-shift="sub" font-size="75%">t</tspan></text></text>
  <text x="750" y="440" font-size="11" fill="#6366f1" text-anchor="middle">decrease r<text><tspan baseline-shift="sub" font-size="75%">t</tspan></text></text>

  <!-- 图例 -->
  <rect x="120" y="488" width="720" height="44" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="160" y="516" font-size="12" font-weight="600" fill="#1e293b">Legend:</text>
  <line x1="220" y1="512" x2="260" y2="512" stroke="#6366f1" stroke-width="1.5"/>
  <polygon points="260,516 256,508 264,508" fill="#6366f1"/>
  <text x="270" y="516" font-size="11" fill="#334155">active update (gradient flows)</text>
  <line x1="420" y1="512" x2="460" y2="512" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,3"/>
  <polygon points="460,516 456,508 464,508" fill="#94a3b8"/>
  <text x="470" y="516" font-size="11" fill="#334155">clipped (no gradient)</text>
  <text x="600" y="516" font-size="11" fill="#64748b">ε = 0.2 (default clipping range)</text>

  <!-- 底部：算法流程 -->
  <rect x="120" y="552" width="720" height="110" rx="4" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="480" y="578" font-size="14" font-weight="600" fill="#1e293b" text-anchor="middle">PPO Algorithm (Simplified)</text>

  <!-- 三个步骤 -->
  <rect x="150" y="594" width="200" height="52" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="250" y="616" font-size="12" font-weight="600" fill="#1e293b" text-anchor="middle">1. Collect trajectory</text>
  <text x="250" y="636" font-size="11" fill="#64748b" text-anchor="middle">using policy π<text><tspan baseline-shift="sub" font-size="75%">θ<text><tspan baseline-shift="sub" font-size="75%">old</tspan></text></tspan></text></text>

  <line x1="350" y1="620" x2="380" y2="620" stroke="#6366f1" stroke-width="1.5"/>
  <polygon points="380,624 376,616 384,616" fill="#6366f1"/>

  <rect x="385" y="594" width="200" height="52" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="485" y="616" font-size="12" font-weight="600" fill="#1e293b" text-anchor="middle">2. Compute &#x1D0C;<text><tspan baseline-shift="sub" font-size="75%">t</tspan></text> &amp; r<text><tspan baseline-shift="sub" font-size="75%">t</tspan></text>(θ)</text>
  <text x="485" y="636" font-size="11" fill="#64748b" text-anchor="middle">advantage + ratio</text>

  <line x1="585" y1="620" x2="615" y2="620" stroke="#6366f1" stroke-width="1.5"/>
  <polygon points="615,624 611,616 619,616" fill="#6366f1"/>

  <rect x="620" y="594" width="200" height="52" rx="4" fill="#ffffff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="720" y="616" font-size="12" font-weight="600" fill="#1e293b" text-anchor="middle">3. Optimize L<text><tspan baseline-shift="super" font-size="75%">CLIP</tspan></text></text>
  <text x="720" y="636" font-size="11" fill="#64748b" text-anchor="middle">SGD for K epochs</text>
</svg>
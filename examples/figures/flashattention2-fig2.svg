<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" width="960" height="580">
  <rect x="0" y="0" width="960" height="580" fill="#ffffff"/>

  <!-- 标题 -->
  <text x="480" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">FlashAttention-2 Backward Pass: Logsumexp Simplification</text>

  <!-- 左侧主面板：核心公式与映射 -->
  <rect x="40" y="56" width="540" height="490" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" rx="4"/>
  <text x="310" y="82" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">Core Definition: Softmax via Logsumexp</text>

  <!-- 公式框（强调色） -->
  <rect x="80" y="100" width="460" height="64" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5" rx="4"/>
  <text x="310" y="126" text-anchor="middle" font-size="16" font-weight="bold" fill="#3730a3">P</text>
  <text x="340" y="126" text-anchor="start" font-size="16" fill="#3730a3">= exp( S − L )</text>
  <text x="310" y="150" text-anchor="middle" font-size="12" fill="#64748b">elementwise: P<tspan baseline-shift="sub" font-size="75%">i</tspan> = exp( S<tspan baseline-shift="sub" font-size="75%">i</tspan> − L<tspan baseline-shift="sub" font-size="75%">i</tspan> )</text>

  <!-- 集合与映射 -->
  <text x="310" y="192" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">Key Sets and Mapping</text>

  <!-- 集合 S -->
  <rect x="80" y="208" width="200" height="80" fill="#ffffff" stroke="#94a3b8" stroke-width="1" rx="3"/>
  <text x="180" y="228" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e293b">S = { S<tspan baseline-shift="sub" font-size="75%">1</tspan>, S<tspan baseline-shift="sub" font-size="75%">2</tspan>, …, S<tspan baseline-shift="sub" font-size="75%">N</tspan> }</text>
  <text x="180" y="250" text-anchor="middle" font-size="11" fill="#64748b">raw attention scores</text>
  <text x="180" y="270" text-anchor="middle" font-size="11" fill="#64748b">(pre-softmax)</text>

  <!-- 集合 L -->
  <rect x="320" y="208" width="200" height="80" fill="#ffffff" stroke="#94a3b8" stroke-width="1" rx="3"/>
  <text x="420" y="228" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e293b">L = { L<tspan baseline-shift="sub" font-size="75%">1</tspan>, L<tspan baseline-shift="sub" font-size="75%">2</tspan>, …, L<tspan baseline-shift="sub" font-size="75%">N</tspan> }</text>
  <text x="420" y="250" text-anchor="middle" font-size="11" fill="#64748b">logsumexp per row</text>
  <text x="420" y="270" text-anchor="middle" font-size="11" fill="#64748b">(stored from forward)</text>

  <!-- 映射箭头：S → P -->
  <line x1="280" y1="248" x2="318" y2="248" stroke="#6366f1" stroke-width="1.5"/>
  <polygon points="318,244 328,248 318,252" fill="#6366f1"/>

  <!-- 映射标签 -->
  <text x="300" y="240" text-anchor="middle" font-size="10" fill="#6366f1">exp(· − L)</text>

  <!-- 集合 P -->
  <rect x="200" y="304" width="220" height="80" fill="#eef2ff" stroke="#6366f1" stroke-width="1.2" rx="3"/>
  <text x="310" y="324" text-anchor="middle" font-size="12" font-weight="bold" fill="#3730a3">P = { P<tspan baseline-shift="sub" font-size="75%">1</tspan>, P<tspan baseline-shift="sub" font-size="75%">2</tspan>, …, P<tspan baseline-shift="sub" font-size="75%">N</tspan> }</text>
  <text x="310" y="346" text-anchor="middle" font-size="11" fill="#64748b">softmax probabilities</text>
  <text x="310" y="366" text-anchor="middle" font-size="11" fill="#64748b">P<tspan baseline-shift="sub" font-size="75%">i</tspan> = exp(S<tspan baseline-shift="sub" font-size="75%">i</tspan> − L<tspan baseline-shift="sub" font-size="75%">i</tspan>)</text>

  <!-- 从 S 和 L 到 P 的箭头 -->
  <line x1="180" y1="288" x2="260" y2="302" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="420" y1="288" x2="360" y2="302" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- 梯度计算说明 -->
  <text x="310" y="412" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">Gradient Computation</text>

  <rect x="80" y="424" width="460" height="52" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" rx="3"/>
  <text x="310" y="446" text-anchor="middle" font-size="12" fill="#1e293b">dS = P ⊙ (dP − rowsum(P ⊙ dP))</text>
  <text x="310" y="466" text-anchor="middle" font-size="11" fill="#64748b">where dP = dO V⊤ and P = exp(S − L) via logsumexp L</text>

  <!-- 右侧面板：图例与机制拆解 -->
  <rect x="610" y="56" width="310" height="490" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" rx="4"/>
  <text x="765" y="82" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">Legend &amp; Mechanism</text>

  <!-- 图例 -->
  <text x="630" y="110" font-size="12" font-weight="bold" fill="#334155">Arrow Types</text>

  <line x1="630" y1="130" x2="680" y2="130" stroke="#6366f1" stroke-width="1.5"/>
  <polygon points="680,126 690,130 680,134" fill="#6366f1"/>
  <text x="700" y="134" font-size="11" fill="#475569">Forward mapping (S → P)</text>

  <line x1="630" y1="158" x2="680" y2="158" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="700" y="162" font-size="11" fill="#475569">Data dependency (S, L → P)</text>

  <line x1="630" y1="186" x2="680" y2="186" stroke="#1e293b" stroke-width="1.2"/>
  <polygon points="680,182 690,186 680,190" fill="#1e293b"/>
  <text x="700" y="190" font-size="11" fill="#475569">Gradient flow (dO → dS)</text>

  <!-- 机制拆解 -->
  <text x="630" y="224" font-size="12" font-weight="bold" fill="#334155">Why Logsumexp Only?</text>

  <rect x="630" y="236" width="270" height="100" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" rx="3"/>
  <text x="765" y="256" text-anchor="middle" font-size="11" fill="#1e293b">FlashAttention stores L (logsumexp)</text>
  <text x="765" y="276" text-anchor="middle" font-size="11" fill="#1e293b">during forward pass.</text>
  <text x="765" y="300" text-anchor="middle" font-size="11" fill="#1e293b">Backward computes P = exp(S − L)</text>
  <text x="765" y="320" text-anchor="middle" font-size="11" fill="#1e293b">without needing row max or sum.</text>

  <text x="630" y="360" font-size="12" font-weight="bold" fill="#334155">Memory Saving</text>

  <rect x="630" y="372" width="270" height="80" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" rx="3"/>
  <text x="765" y="394" text-anchor="middle" font-size="11" fill="#1e293b">FlashAttention: stores L (N floats)</text>
  <text x="765" y="414" text-anchor="middle" font-size="11" fill="#64748b">vs. standard: stores P (N&#215;N floats)</text>
  <text x="765" y="438" text-anchor="middle" font-size="11" fill="#6366f1" font-weight="bold">O(N) vs. O(N&#178;) memory</text>

  <text x="630" y="476" font-size="12" font-weight="bold" fill="#334155">Key Benefit</text>

  <rect x="630" y="488" width="270" height="48" fill="#eef2ff" stroke="#6366f1" stroke-width="1.2" rx="3"/>
  <text x="765" y="510" text-anchor="middle" font-size="11" fill="#3730a3">Simpler code, fewer stored tensors,</text>
  <text x="765" y="528" text-anchor="middle" font-size="11" fill="#3730a3">same numerical stability.</text>

  <!-- 底部说明 -->
  <text x="480" y="566" text-anchor="middle" font-size="10" fill="#94a3b8">Figure: FlashAttention-2 backward pass uses only logsumexp L (stored from forward) to reconstruct softmax probabilities P, eliminating the need to store row max and sum.</text>
</svg>
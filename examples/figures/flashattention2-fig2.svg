<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" width="960" height="620">
  <rect x="0" y="0" width="960" height="620" fill="#ffffff"/>

  <!-- 标题 -->
  <text x="480" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e293b">FlashAttention-2 Backward Pass: Logsumexp Simplification</text>
  <line x1="160" y1="48" x2="800" y2="48" stroke="#cbd5e1" stroke-width="1"/>

  <!-- 左侧主面板：核心公式与映射 -->
  <rect x="40" y="68" width="560" height="520" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" rx="4"/>
  <text x="320" y="94" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">Core: Softmax Probability via Logsumexp</text>

  <!-- 公式框（强调色） -->
  <rect x="80" y="112" width="480" height="60" fill="#eef2ff" stroke="#6366f1" stroke-width="2" rx="4"/>
  <text x="320" y="138" text-anchor="middle" font-size="16" font-weight="bold" fill="#3730a3">P = exp(S − L)</text>
  <text x="320" y="160" text-anchor="middle" font-size="12" fill="#475569">element-wise: P&#8320;&#8321; = exp(S&#8320;&#8321; − L&#8320;)</text>

  <!-- 符号说明 -->
  <text x="100" y="200" font-size="12" fill="#1e293b" font-weight="bold">Notation:</text>
  <text x="100" y="222" font-size="12" fill="#334155">S : attention scores (QK&#8868;)</text>
  <text x="100" y="242" font-size="12" fill="#334155">L : logsumexp per row (stored from forward)</text>
  <text x="100" y="262" font-size="12" fill="#334155">P : softmax probabilities</text>

  <!-- 集合显式表示 -->
  <text x="100" y="296" font-size="12" fill="#1e293b" font-weight="bold">Explicit mapping (row i):</text>

  <!-- 左侧集合 S -->
  <rect x="100" y="310" width="140" height="80" fill="#ffffff" stroke="#94a3b8" stroke-width="1" rx="3"/>
  <text x="170" y="330" text-anchor="middle" font-size="11" fill="#475569" font-weight="bold">S&#8320; (scores)</text>
  <text x="170" y="350" text-anchor="middle" font-size="11" fill="#334155">{ s&#8320;&#8321;, s&#8320;&#8322;, …, s&#8320;&#8341; }</text>
  <text x="170" y="370" text-anchor="middle" font-size="10" fill="#64748b">each s&#8320;&#8341; = Q&#8320;·K&#8341;&#8868;</text>

  <!-- 中间操作 -->
  <text x="320" y="350" text-anchor="middle" font-size="14" fill="#6366f1" font-weight="bold">− L&#8320;</text>

  <!-- 右侧集合 P -->
  <rect x="400" y="310" width="140" height="80" fill="#ffffff" stroke="#94a3b8" stroke-width="1" rx="3"/>
  <text x="470" y="330" text-anchor="middle" font-size="11" fill="#475569" font-weight="bold">P&#8320; (probabilities)</text>
  <text x="470" y="350" text-anchor="middle" font-size="11" fill="#334155">{ p&#8320;&#8321;, p&#8320;&#8322;, …, p&#8320;&#8341; }</text>
  <text x="470" y="370" text-anchor="middle" font-size="10" fill="#64748b">p&#8320;&#8341; = exp(s&#8320;&#8341; − L&#8320;)</text>

  <!-- 箭头：S → P -->
  <polygon points="245,350 260,345 260,355" fill="#6366f1"/>
  <line x1="240" y1="350" x2="260" y2="350" stroke="#6366f1" stroke-width="1.5"/>

  <!-- 下方：前向存储说明 -->
  <rect x="80" y="420" width="480" height="50" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" rx="3"/>
  <text x="320" y="442" text-anchor="middle" font-size="12" fill="#334155">Forward pass stores only L (logsumexp), not row max + row sum</text>
  <text x="320" y="460" text-anchor="middle" font-size="11" fill="#64748b">Reduces memory footprint; simplifies backward code</text>

  <!-- 下方：梯度计算示意 -->
  <text x="100" y="498" font-size="12" fill="#1e293b" font-weight="bold">Gradient contribution (simplified):</text>
  <text x="100" y="520" font-size="12" fill="#334155">dS = dP · P − (dP · P) · 1 · P</text>
  <text x="100" y="540" font-size="11" fill="#64748b">where dP = dO · V&#8868; (from upstream)</text>
  <text x="100" y="558" font-size="11" fill="#64748b">No need to store P explicitly; recomputed from S and L</text>

  <!-- 右侧图例/说明面板 -->
  <rect x="630" y="68" width="290" height="520" fill="#fbfcfe" stroke="#e2e8f0" stroke-width="1" rx="4"/>
  <text x="775" y="94" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">Legend &amp; Mechanism</text>

  <!-- 图例 -->
  <text x="650" y="122" font-size="11" fill="#1e293b" font-weight="bold">Arrow types:</text>
  <line x1="650" y1="140" x2="690" y2="140" stroke="#6366f1" stroke-width="1.5"/>
  <polygon points="690,136 700,140 690,144" fill="#6366f1"/>
  <text x="705" y="144" font-size="11" fill="#475569">Data flow / mapping</text>

  <!-- 对比表格 -->
  <text x="650" y="180" font-size="11" fill="#1e293b" font-weight="bold">Comparison: FlashAttention vs FlashAttention-2</text>

  <!-- 表头 -->
  <rect x="650" y="192" width="250" height="24" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
  <text x="725" y="208" text-anchor="middle" font-size="10" fill="#1e293b" font-weight="bold">Aspect</text>
  <text x="840" y="208" text-anchor="middle" font-size="10" fill="#1e293b" font-weight="bold">FA1</text>
  <text x="890" y="208" text-anchor="middle" font-size="10" fill="#1e293b" font-weight="bold">FA2</text>

  <!-- 行1 -->
  <rect x="650" y="216" width="250" height="22" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.5"/>
  <text x="725" y="231" text-anchor="middle" font-size="10" fill="#334155">Stored stats</text>
  <text x="840" y="231" text-anchor="middle" font-size="10" fill="#334155">m, ℓ</text>
  <text x="890" y="231" text-anchor="middle" font-size="10" fill="#6366f1" font-weight="bold">L</text>

  <!-- 行2 -->
  <rect x="650" y="238" width="250" height="22" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.5"/>
  <text x="725" y="253" text-anchor="middle" font-size="10" fill="#334155">Rescale in backward</text>
  <text x="840" y="253" text-anchor="middle" font-size="10" fill="#334155">diag(ℓ)⁻¹</text>
  <text x="890" y="253" text-anchor="middle" font-size="10" fill="#64748b">none</text>

  <!-- 行3 -->
  <rect x="650" y="260" width="250" height="22" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.5"/>
  <text x="725" y="275" text-anchor="middle" font-size="10" fill="#334155">Non-matmul FLOPs</text>
  <text x="840" y="275" text-anchor="middle" font-size="10" fill="#334155">higher</text>
  <text x="890" y="275" text-anchor="middle" font-size="10" fill="#6366f1" font-weight="bold">lower</text>

  <!-- 机制拆解 -->
  <text x="650" y="310" font-size="11" fill="#1e293b" font-weight="bold">Why logsumpexp works:</text>
  <text x="650" y="330" font-size="10" fill="#475569">L&#8320; = log Σ&#8341; exp(s&#8320;&#8341;)</text>
  <text x="650" y="348" font-size="10" fill="#475569">exp(s&#8320;&#8341; − L&#8320;) = exp(s&#8320;&#8341;) / Σ&#8341; exp(s&#8320;&#8341;)</text>
  <text x="650" y="366" font-size="10" fill="#475569">= softmax probability p&#8320;&#8341;</text>

  <text x="650" y="396" font-size="11" fill="#1e293b" font-weight="bold">Backward pass steps (simplified):</text>
  <text x="650" y="416" font-size="10" fill="#334155">1. Load L from HBM (stored in forward)</text>
  <text x="650" y="434" font-size="10" fill="#334155">2. Recompute P = exp(S − L) on the fly</text>
  <text x="650" y="452" font-size="10" fill="#334155">3. Compute dS = (dP − (dP·P)·1) · P</text>
  <text x="650" y="470" font-size="10" fill="#334155">4. dQ = dS·K, dK = dS&#8868;·Q, dV = P&#8868;·dO</text>

  <text x="650" y="502" font-size="11" fill="#1e293b" font-weight="bold">Key benefit:</text>
  <text x="650" y="520" font-size="10" fill="#475569">No need to store m (row max) and ℓ (row sum)</text>
  <text x="650" y="538" font-size="10" fill="#475569">separately; single L suffices.</text>
  <text x="650" y="556" font-size="10" fill="#475569">Reduces HBM writes by ~33%.</text>

  <!-- 底部说明 -->
  <text x="480" y="606" text-anchor="middle" font-size="10" fill="#94a3b8">Figure: FlashAttention-2 backward pass simplification — softmax probability computed from logsumpexp L, eliminating redundant rescaling.</text>
</svg>
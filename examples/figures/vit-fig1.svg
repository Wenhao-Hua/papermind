<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" width="960" height="640">
  <rect x="0" y="0" width="960" height="640" fill="#ffffff"/>

  <!-- 标题 -->
  <text x="480" y="36" font-size="18" font-weight="bold" fill="#1e293b" text-anchor="middle">ViT 微调时位置嵌入的二维插值</text>

  <!-- 核心定义框（强调色） -->
  <rect x="40" y="56" width="880" height="72" rx="4" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="480" y="80" font-size="15" font-weight="bold" fill="#3730a3" text-anchor="middle">核心操作：对预训练 1D 位置嵌入进行 2D 插值</text>
  <text x="480" y="104" font-size="13" fill="#334155" text-anchor="middle">保持 patch 大小不变 → 高分辨率图像产生更长序列 → 预训练位置嵌入不再匹配</text>
  <text x="480" y="122" font-size="13" fill="#334155" text-anchor="middle">根据原始图像中的空间位置，将 1D 嵌入重新采样到新的 2D 网格上</text>

  <!-- 左侧主流程：纵向 -->
  <!-- 步骤1：预训练 -->
  <rect x="60" y="148" width="380" height="44" rx="3" fill="#f8fafc" stroke="#475569" stroke-width="1"/>
  <text x="250" y="168" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="middle">预训练阶段</text>
  <text x="250" y="184" font-size="11" fill="#475569" text-anchor="middle">固定 patch 大小 P&#215;P，图像 224&#215;224 → N = (224/P)² 个 patch</text>

  <!-- 箭头1 -->
  <line x1="250" y1="192" x2="250" y2="220" stroke="#6366f1" stroke-width="1.5"/>
  <polygon points="246,218 250,228 254,218" fill="#6366f1"/>

  <!-- 步骤2：微调 -->
  <rect x="60" y="230" width="380" height="44" rx="3" fill="#f8fafc" stroke="#475569" stroke-width="1"/>
  <text x="250" y="250" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="middle">微调阶段（更高分辨率）</text>
  <text x="250" y="266" font-size="11" fill="#475569" text-anchor="middle">图像 H&#215;W (H,W &gt; 224) → N' = (H/P)&#215;(W/P) &gt; N 个 patch</text>

  <!-- 箭头2 -->
  <line x1="250" y1="274" x2="250" y2="302" stroke="#6366f1" stroke-width="1.5"/>
  <polygon points="246,300 250,310 254,300" fill="#6366f1"/>

  <!-- 步骤3：插值 -->
  <rect x="60" y="312" width="380" height="52" rx="3" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="250" y="332" font-size="13" font-weight="bold" fill="#3730a3" text-anchor="middle">2D 插值</text>
  <text x="250" y="350" font-size="11" fill="#334155" text-anchor="middle">将预训练 1D 位置嵌入 E ∈ ℝ<tspan baseline-shift="super" font-size="75%">N&#215;D</tspan></text>
  <text x="250" y="364" font-size="11" fill="#334155" text-anchor="middle">重采样为 E' ∈ ℝ<tspan baseline-shift="super" font-size="75%">N'&#215;D</tspan>（双线性插值）</text>

  <!-- 右侧面板：集合/映射显式表示 -->
  <!-- 预训练位置嵌入集合 -->
  <rect x="480" y="148" width="200" height="120" rx="3" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="580" y="168" font-size="12" font-weight="bold" fill="#1e293b" text-anchor="middle">预训练位置嵌入</text>
  <text x="580" y="186" font-size="11" fill="#334155" text-anchor="middle">E = {e<tspan baseline-shift="sub" font-size="75%">1</tspan>, e<tspan baseline-shift="sub" font-size="75%">2</tspan>, …, e<tspan baseline-shift="sub" font-size="75%">N</tspan>}</text>
  <text x="580" y="204" font-size="11" fill="#475569" text-anchor="middle">对应 2D 网格坐标：</text>
  <text x="580" y="222" font-size="11" fill="#475569" text-anchor="middle">(1,1), (1,2), …, (√N,√N)</text>
  <text x="580" y="240" font-size="11" fill="#475569" text-anchor="middle">维度 D = 768 / 1024 / 1280</text>

  <!-- 映射箭头 -->
  <line x1="440" y1="338" x2="478" y2="338" stroke="#6366f1" stroke-width="1.5"/>
  <polygon points="476,334 486,338 476,342" fill="#6366f1"/>
  <text x="460" y="330" font-size="10" fill="#6366f1" text-anchor="middle">插值</text>

  <!-- 微调位置嵌入集合 -->
  <rect x="700" y="148" width="220" height="120" rx="3" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="810" y="168" font-size="12" font-weight="bold" fill="#1e293b" text-anchor="middle">微调位置嵌入</text>
  <text x="810" y="186" font-size="11" fill="#334155" text-anchor="middle">E' = {e'<tspan baseline-shift="sub" font-size="75%">1</tspan>, e'<tspan baseline-shift="sub" font-size="75%">2</tspan>, …, e'<tspan baseline-shift="sub" font-size="75%">N'</tspan>}</text>
  <text x="810" y="204" font-size="11" fill="#475569" text-anchor="middle">对应新 2D 网格坐标：</text>
  <text x="810" y="222" font-size="11" fill="#475569" text-anchor="middle">(1,1), (1,2), …, (H/P, W/P)</text>
  <text x="810" y="240" font-size="11" fill="#475569" text-anchor="middle">维度 D 保持不变</text>

  <!-- 二部图：映射关系 -->
  <rect x="480" y="286" width="440" height="130" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="700" y="306" font-size="12" font-weight="bold" fill="#1e293b" text-anchor="middle">映射：2D 坐标重采样</text>

  <!-- 左列节点（预训练坐标） -->
  <circle cx="530" cy="330" r="4" fill="#6366f1"/>
  <text x="540" y="334" font-size="10" fill="#334155">(1,1)</text>
  <circle cx="530" cy="354" r="4" fill="#6366f1"/>
  <text x="540" y="358" font-size="10" fill="#334155">(1,2)</text>
  <circle cx="530" cy="378" r="4" fill="#6366f1"/>
  <text x="540" y="382" font-size="10" fill="#334155">(2,1)</text>
  <circle cx="530" cy="402" r="4" fill="#cbd5e1"/>
  <text x="540" y="406" font-size="10" fill="#94a3b8">…</text>

  <!-- 右列节点（新坐标） -->
  <circle cx="870" cy="330" r="4" fill="#6366f1"/>
  <text x="855" y="334" font-size="10" fill="#334155" text-anchor="end">(1,1)</text>
  <circle cx="870" cy="354" r="4" fill="#6366f1"/>
  <text x="855" y="358" font-size="10" fill="#334155" text-anchor="end">(1,2)</text>
  <circle cx="870" cy="378" r="4" fill="#6366f1"/>
  <text x="855" y="382" font-size="10" fill="#334155" text-anchor="end">(1,3)</text>
  <circle cx="870" cy="402" r="4" fill="#cbd5e1"/>
  <text x="855" y="406" font-size="10" fill="#94a3b8" text-anchor="end">…</text>

  <!-- 连边（选中几条加粗） -->
  <line x1="534" y1="330" x2="866" y2="330" stroke="#6366f1" stroke-width="1.5"/>
  <line x1="534" y1="354" x2="866" y2="354" stroke="#6366f1" stroke-width="1"/>
  <line x1="534" y1="378" x2="866" y2="378" stroke="#6366f1" stroke-width="1"/>
  <line x1="534" y1="402" x2="866" y2="402" stroke="#cbd5e1" stroke-width="0.8"/>

  <!-- 图例 -->
  <rect x="480" y="432" width="440" height="60" rx="3" fill="#fbfcfe" stroke="#e2e8f0" stroke-width="1"/>
  <text x="700" y="452" font-size="11" font-weight="bold" fill="#1e293b" text-anchor="middle">图例</text>
  <line x1="510" y1="470" x2="540" y2="470" stroke="#6366f1" stroke-width="1.5"/>
  <text x="548" y="474" font-size="10" fill="#334155">前向映射（插值）</text>
  <line x1="660" y1="470" x2="690" y2="470" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="698" y="474" font-size="10" fill="#334155">未使用/占位</text>
  <circle cx="800" cy="470" r="4" fill="#6366f1"/>
  <text x="810" y="474" font-size="10" fill="#334155">选中映射</text>

  <!-- 底部说明 -->
  <rect x="40" y="508" width="880" height="52" rx="3" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="480" y="528" font-size="12" font-weight="bold" fill="#1e293b" text-anchor="middle">这是模型中唯一注入 2D 图像结构信息的点</text>
  <text x="480" y="548" font-size="11" fill="#475569" text-anchor="middle">ViT 本身没有卷积的平移不变性等归纳偏置，位置嵌入的 2D 插值是让模型适应不同分辨率的关键</text>

  <!-- 公式注脚 -->
  <text x="480" y="590" font-size="11" fill="#64748b" text-anchor="middle">双线性插值：f(x,y) ≈ (1−Δx)(1−Δy)·f(x₀,y₀) + Δx(1−Δy)·f(x₀+1,y₀) + (1−Δx)Δy·f(x₀,y₀+1) + ΔxΔy·f(x₀+1,y₀+1)</text>
</svg>
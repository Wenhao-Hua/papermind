<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#1e293b" width="960" height="680">
  <rect x="0" y="0" width="960" height="680" fill="#ffffff"/>

  <!-- 标题 -->
  <text x="480" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">2D Interpolation of Position Embeddings for Fine-Tuning at Higher Resolution</text>
  <text x="480" y="58" text-anchor="middle" font-size="13" fill="#64748b">ViT (Dosovitskiy et al., ICLR 2021) — Section 3.2</text>

  <!-- ===== 左侧主面板：流程 ===== -->
  <!-- 步骤1：预训练 -->
  <rect x="60" y="90" width="380" height="50" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="250" y="112" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">Pre-training (e.g., 224&#215;224 image)</text>
  <text x="250" y="130" text-anchor="middle" font-size="12" fill="#475569">Patch size P = 16 &#215; 16, grid N = 14 &#215; 14 = 196 patches</text>

  <!-- 箭头1 -->
  <line x1="250" y1="140" x2="250" y2="170" stroke="#6366f1" stroke-width="2"/>
  <polygon points="245,168 250,178 255,168" fill="#6366f1"/>

  <!-- 步骤2：预训练位置嵌入 -->
  <rect x="60" y="178" width="380" height="44" rx="6" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="250" y="198" text-anchor="middle" font-size="14" font-weight="600" fill="#3730a3">Pre-trained 1D position embeddings</text>
  <text x="250" y="214" text-anchor="middle" font-size="12" fill="#3730a3">E<tspan baseline-shift="sub" font-size="75%">pos</tspan> &#8712; &#8477;^(196 &#215; D)</text>

  <!-- 箭头2 -->
  <line x1="250" y1="222" x2="250" y2="252" stroke="#6366f1" stroke-width="2"/>
  <polygon points="245,250 250,260 255,250" fill="#6366f1"/>

  <!-- 步骤3：微调时更高分辨率 -->
  <rect x="60" y="260" width="380" height="50" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="250" y="282" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">Fine-tuning at higher resolution</text>
  <text x="250" y="300" text-anchor="middle" font-size="12" fill="#475569">e.g., 384&#215;384, same P = 16, grid N' = 24 &#215; 24 = 576 patches</text>

  <!-- 箭头3 -->
  <line x1="250" y1="310" x2="250" y2="340" stroke="#6366f1" stroke-width="2"/>
  <polygon points="245,338 250,348 255,338" fill="#6366f1"/>

  <!-- 步骤4：2D插值 -->
  <rect x="60" y="348" width="380" height="70" rx="6" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="250" y="370" text-anchor="middle" font-size="14" font-weight="600" fill="#3730a3">2D interpolation of position embeddings</text>
  <text x="250" y="390" text-anchor="middle" font-size="12" fill="#3730a3">Reshape E<tspan baseline-shift="sub" font-size="75%">pos</tspan> to 14&#215;14 grid, interpolate to 24&#215;24</text>
  <text x="250" y="408" text-anchor="middle" font-size="12" fill="#3730a3">Then flatten back to 576 &#215; D</text>

  <!-- 箭头4 -->
  <line x1="250" y1="418" x2="250" y2="448" stroke="#6366f1" stroke-width="2"/>
  <polygon points="245,446 250,456 255,446" fill="#6366f1"/>

  <!-- 步骤5：微调ViT -->
  <rect x="60" y="456" width="380" height="44" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="250" y="478" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">Fine-tuned ViT with interpolated embeddings</text>
  <text x="250" y="494" text-anchor="middle" font-size="12" fill="#475569">Only position embeddings are interpolated; rest unchanged</text>

  <!-- ===== 右侧面板：2D插值细节 ===== -->
  <rect x="500" y="90" width="420" height="410" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- 子标题 -->
  <text x="710" y="116" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">2D Interpolation Mechanism</text>

  <!-- 公式 -->
  <rect x="530" y="132" width="360" height="60" rx="4" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="710" y="154" text-anchor="middle" font-size="13" font-weight="600" fill="#3730a3">E<tspan baseline-shift="sub" font-size="75%">pos</tspan><tspan baseline-shift="super" font-size="75%">(new)</tspan> = Interp2D( E<tspan baseline-shift="sub" font-size="75%">pos</tspan><tspan baseline-shift="super" font-size="75%">(old)</tspan> , [H/P , W/P] )</text>
  <text x="710" y="178" text-anchor="middle" font-size="11" fill="#475569">bilinear interpolation on the 2D grid of patch positions</text>

  <!-- 网格示意图 -->
  <text x="590" y="216" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">Pre-trained grid (14&#215;14)</text>
  <text x="830" y="216" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">Fine-tuned grid (24&#215;24)</text>

  <!-- 14x14网格 -->
  <g transform="translate(530, 228)">
    <rect x="0" y="0" width="112" height="112" fill="none" stroke="#94a3b8" stroke-width="1"/>
    <line x1="8" y1="0" x2="8" y2="112" stroke="#cbd5e1" stroke-width="0.5"/>
    <line x1="16" y1="0" x2="16" y2="112" stroke="#cbd5e1" stroke-width="0.5"/>
    <line x1="24" y1="0" x2="24" y2="112" stroke="#cbd5e1" stroke-width="0.5"/>
    <line x1="32" y1="0" x2="32" y2="112" stroke="#cbd5e1" stroke-width="0.5"/>
    <line x1="40" y1="0" x2="40" y2="112" stroke="#cbd5e1" stroke-width="0.5"/>
    <line x1="48" y1="0" x2="48" y2="112" stroke="#cbd5e1" stroke-width="0.5"/>
    <line x1="56" y1="0" x2="56" y2="112" stroke="#cbd5e1" stroke-width="0.5"/>
    <line x1="64" y1="0" x2="64" y2="112" stroke="#cbd5e1" stroke-width="0.5"/>
    <line x1="72" y1="0" x2="72" y2="112" stroke="#cbd5e1" stroke-width="0.5"/>
    <line x1="80" y1="0" x2="80" y2="112" stroke="#cbd5e1" stroke-width="0.5"/>
    <line x1="88" y1="0" x2="88" y2="112" stroke="#cbd5e1" stroke-width="0.5"/>
    <line x1="96" y1="0" x2="96" y2="112" stroke="#cbd5e1" stroke-width="0.5"/>
    <line x1="104" y1="0" x2="104" y2="112" stroke="#cbd5e1" stroke-width="0.5"/>
    <line x1="0" y1="8" x2="112" y2="8" stroke="#cbd5e1" stroke-width="0.5"/>
    <line x1="0" y1="16" x2="112" y2="16" stroke="#cbd5e1" stroke-width="0.5"/>
    <line x1="0" y1="24" x2="112" y2="24" stroke="#cbd5e1" stroke-width="0.5"/>
    <line x1="0" y1="32" x2="112" y2="32" stroke="#cbd5e1" stroke-width="0.5"/>
    <line x1="0" y1="40" x2="112" y2="40" stroke="#cbd5e1" stroke-width="0.5"/>
    <line x1="0" y1="48" x2="112" y2="48" stroke="#cbd5e1" stroke-width="0.5"/>
    <line x1="0" y1="56" x2="112" y2="56" stroke="#cbd5e1" stroke-width="0.5"/>
    <line x1="0" y1="64" x2="112" y2="64" stroke="#cbd5e1" stroke-width="0.5"/>
    <line x1="0" y1="72" x2="112" y2="72" stroke="#cbd5e1" stroke-width="0.5"/>
    <line x1="0" y1="80" x2="112" y2="80" stroke="#cbd5e1" stroke-width="0.5"/>
    <line x1="0" y1="88" x2="112" y2="88" stroke="#cbd5e1" stroke-width="0.5"/>
    <line x1="0" y1="96" x2="112" y2="96" stroke="#cbd5e1" stroke-width="0.5"/>
    <line x1="0" y1="104" x2="112" y2="104" stroke="#cbd5e1" stroke-width="0.5"/>
    <!-- 高亮一个位置 -->
    <rect x="40" y="40" width="8" height="8" fill="#6366f1" opacity="0.4"/>
  </g>

  <!-- 箭头 -->
  <line x1="648" y1="284" x2="700" y2="284" stroke="#6366f1" stroke-width="2"/>
  <polygon points="698,279 708,284 698,289" fill="#6366f1"/>

  <!-- 24x24网格 -->
  <g transform="translate(720, 228)">
    <rect x="0" y="0" width="168" height="168" fill="none" stroke="#94a3b8" stroke-width="1"/>
    <line x1="7" y1="0" x2="7" y2="168" stroke="#e2e8f0" stroke-width="0.5"/>
    <line x1="14" y1="0" x2="14" y2="168" stroke="#e2e8f0" stroke-width="0.5"/>
    <line x1="21" y1="0" x2="21" y2="168" stroke="#e2e8f0" stroke-width="0.5"/>
    <line x1="28" y1="0" x2="28" y2="168" stroke="#e2e8f0" stroke-width="0.5"/>
    <line x1="35" y1="0" x2="35" y2="168" stroke="#e2e8f0" stroke-width="0.5"/>
    <line x1="42" y1="0" x2="42" y2="168" stroke="#e2e8f0" stroke-width="0.5"/>
    <line x1="49" y1="0" x2="49" y2="168" stroke="#e2e8f0" stroke-width="0.5"/>
    <line x1="56" y1="0" x2="56" y2="168" stroke="#e2e8f0" stroke-width="0.5"/>
    <line x1="63" y1="0" x2="63" y2="168" stroke="#e2e8f0" stroke-width="0.5"/>
    <line x1="70" y1="0" x2="70" y2="168" stroke="#e2e8f0" stroke-width="0.5"/>
    <line x1="77" y1="0" x2="77" y2="168" stroke="#e2e8f0" stroke-width="0.5"/>
    <line x1="84" y1="0" x2="84" y2="168" stroke="#e2e8f0" stroke-width="0.5"/>
    <line x1="91" y1="0" x2="91" y2="168" stroke="#e2e8f0" stroke-width="0.5"/>
    <line x1="98" y1="0" x2="98" y2="168" stroke="#e2e8f0" stroke-width="0.5"/>
    <line x1="105" y1="0" x2="105" y2="168" stroke="#e2e8f0" stroke-width="0.5"/>
    <line x1="112" y1="0" x2="112" y2="168" stroke="#e2e8f0" stroke-width="0.5"/>
    <line x1="119" y1="0" x2="119" y2="168" stroke="#e2e8f0" stroke-width="0.5"/>
    <line x1="126" y1="0" x2="126" y2="168" stroke="#e2e8f0" stroke-width="0.5"/>
    <line x1="133" y1="0" x2="133" y2="168" stroke="#e2e8f0" stroke-width="0.5"/>
    <line x1="140" y1="0" x2="140" y2="168" stroke="#e2e8f0" stroke-width="0.5"/>
    <line x1="147" y1="0" x2="147" y2="168" stroke="#e2e8f0" stroke-width="0.5"/>
    <line x1="154" y1="0" x2="154" y2="168" stroke="#e2e8f0" stroke-width="0.5"/>
    <line x1="161" y1="0" x2="161" y2="168" stroke="#e2e8f0" stroke-width="0.5"/>
    <line x1="0" y1="7" x2="168" y2="7" stroke="#e2e8f0" stroke-width="0.5"/>
    <line x1="0" y1="14" x2="168" y2="14" stroke="#e2e8f0" stroke-width="0.5"/>
    <line x1="0" y1="21" x2="168" y2="21" stroke="#e2e8f0" stroke-width="0.5"/>
    <line x1="0" y1="28" x2="168" y2="28" stroke="#e2e8f0" stroke-width="0.5"/>
    <line x1="0" y1="35" x2="168" y2="35" stroke="#e2e8f0" stroke-width="0.5"/>
    <line x1="0" y1="42" x2="168" y2="42" stroke="#e2e8f0" stroke-width="0.5"/>
    <line x1="0" y1="49" x2="168" y2="49" stroke="#e2e8f0" stroke-width="0.5"/>
    <line x1="0" y1="56" x2="168" y2="56" stroke="#e2e8f0" stroke-width="0.5"/>
    <line x1="0" y1="63" x2="168" y2="63" stroke="#e2e8f0" stroke-width="0.5"/>
    <line x1="0" y1="70" x2="168" y2="70" stroke="#e2e8f0" stroke-width="0.5"/>
    <line x1="0" y1="77" x2="168" y2="77" stroke="#e2e8f0" stroke-width="0.5"/>
    <line x1="0" y1="84" x2="168" y2="84" stroke="#e2e8f0" stroke-width="0.5"/>
    <line x1="0" y1="91" x2="168" y2="91" stroke="#e2e8f0" stroke-width="0.5"/>
    <line x1="0" y1="98" x2="168" y2="98" stroke="#e2e8f0" stroke-width="0.5"/>
    <line x1="0" y1="105" x2="168" y2="105" stroke="#e2e8f0" stroke-width="0.5"/>
    <line x1="0" y1="112" x2="168" y2="112" stroke="#e2e8f0" stroke-width="0.5"/>
    <line x1="0" y1="119" x2="168" y2="119" stroke="#e2e8f0" stroke-width="0.5"/>
    <line x1="0" y1="126" x2="168" y2="126" stroke="#e2e8f0" stroke-width="0.5"/>
    <line x1="0" y1="133" x2="168" y2="133" stroke="#e2e8f0" stroke-width="0.5"/>
    <line x1="0" y1="140" x2="168" y2="140" stroke="#e2e8f0" stroke-width="0.5"/>
    <line x1="0" y1="147" x2="168" y2="147" stroke="#e2e8f0" stroke-width="0.5"/>
    <line x1="0" y1="154" x2="168" y2="154" stroke="#e2e8f0" stroke-width="0.5"/>
    <line x1="0" y1="161" x2="168" y2="161" stroke="#e2e8f0" stroke-width="0.5"/>
    <!-- 高亮对应位置 -->
    <rect x="56" y="56" width="7" height="7" fill="#6366f1" opacity="0.4"/>
  </g>

  <!-- 说明文字 -->
  <text x="710" y="420" text-anchor="middle" font-size="12" fill="#475569">Reshape 1D embeddings to 2D grid positions</text>
  <text x="710" y="438" text-anchor="middle" font-size="12" fill="#475569">Apply bilinear interpolation to new grid size</text>
  <text x="710" y="456" text-anchor="middle" font-size="12" fill="#475569">Flatten back to 1D sequence for Transformer</text>

  <!-- ===== 底部图例 ===== -->
  <rect x="60" y="530" width="860" height="50" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="90" y="552" font-size="12" font-weight="600" fill="#1e293b">Legend:</text>

  <line x1="150" y1="548" x2="190" y2="548" stroke="#6366f1" stroke-width="2"/>
  <polygon points="188,544 195,548 188,552" fill="#6366f1"/>
  <text x="200" y="552" font-size="11" fill="#475569">Data flow / transformation</text>

  <rect x="380" y="538" width="16" height="16" rx="2" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="402" y="552" font-size="11" fill="#475569">Key component (position embedding interpolation)</text>

  <rect x="680" y="538" width="16" height="16" rx="2" fill="#f1f5f9" stroke="#475569" stroke-width="1"/>
  <text x="702" y="552" font-size="11" fill="#475569">Standard ViT operation</text>

  <!-- 底部说明 -->
  <text x="480" y="610" text-anchor="middle" font-size="11" fill="#64748b">Note: This is the only place where 2D image structure information is injected into the model.</text>
  <text x="480" y="628" text-anchor="middle" font-size="11" fill="#64748b">All other operations (attention, MLP) treat patches as a flat 1D sequence.</text>

  <!-- 引用 -->
  <text x="480" y="660" text-anchor="middle" font-size="10" fill="#94a3b8">Dosovitskiy et al. "An Image is Worth 16x16 Words: Transformers for Image Recognition at Scale" ICLR 2021</text>
</svg>
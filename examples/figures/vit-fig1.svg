<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" width="960" height="680">
  <rect x="0" y="0" width="960" height="680" fill="#ffffff"/>

  <!-- 标题 -->
  <text x="480" y="36" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">Masked Patch Prediction Self-Supervision (ViT)</text>

  <!-- 核心定义框：损坏策略 -->
  <rect x="40" y="56" width="880" height="100" fill="#f8fafc" stroke="#6366f1" stroke-width="2" rx="4"/>
  <text x="480" y="80" font-size="16" font-weight="bold" fill="#3730a3" text-anchor="middle">Corruption Strategy (per patch, independently)</text>

  <!-- 三种损坏类型 -->
  <rect x="60" y="94" width="260" height="48" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5" rx="3"/>
  <text x="190" y="114" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">80% &#8594; [mask] token</text>
  <text x="190" y="132" font-size="12" fill="#475569" text-anchor="middle">learnable mask embedding</text>

  <rect x="350" y="94" width="260" height="48" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" rx="3"/>
  <text x="480" y="114" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">10% &#8594; random patch</text>
  <text x="480" y="132" font-size="12" fill="#475569" text-anchor="middle">another patch&#8217;s embedding</text>

  <rect x="640" y="94" width="260" height="48" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" rx="3"/>
  <text x="770" y="114" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">10% &#8594; unchanged</text>
  <text x="770" y="132" font-size="12" fill="#475569" text-anchor="middle">keep original embedding</text>

  <!-- 箭头：损坏策略到序列 -->
  <line x1="480" y1="156" x2="480" y2="180" stroke="#6366f1" stroke-width="2"/>
  <polygon points="474,178 480,190 486,178" fill="#6366f1"/>

  <!-- 序列表示：输入 patch 序列 -->
  <rect x="40" y="190" width="880" height="120" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" rx="4"/>
  <text x="480" y="212" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">Input Sequence (N patches, after corruption)</text>

  <!-- 画 8 个小格子表示序列 -->
  <g>
    <rect x="60" y="224" width="90" height="36" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5" rx="2"/>
    <text x="105" y="246" font-size="12" fill="#3730a3" text-anchor="middle">[class]</text>
  </g>
  <g>
    <rect x="162" y="224" width="90" height="36" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" rx="2"/>
    <text x="207" y="246" font-size="12" fill="#475569" text-anchor="middle">[mask]</text>
  </g>
  <g>
    <rect x="264" y="224" width="90" height="36" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" rx="2"/>
    <text x="309" y="246" font-size="12" fill="#475569" text-anchor="middle">[mask]</text>
  </g>
  <g>
    <rect x="366" y="224" width="90" height="36" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" rx="2"/>
    <text x="411" y="246" font-size="12" fill="#475569" text-anchor="middle">[mask]</text>
  </g>
  <g>
    <rect x="468" y="224" width="90" height="36" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" rx="2"/>
    <text x="513" y="246" font-size="12" fill="#475569" text-anchor="middle">[mask]</text>
  </g>
  <g>
    <rect x="570" y="224" width="90" height="36" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" rx="2"/>
    <text x="615" y="246" font-size="12" fill="#475569" text-anchor="middle">[mask]</text>
  </g>
  <g>
    <rect x="672" y="224" width="90" height="36" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" rx="2"/>
    <text x="717" y="246" font-size="12" fill="#475569" text-anchor="middle">[mask]</text>
  </g>
  <g>
    <rect x="774" y="224" width="90" height="36" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" rx="2"/>
    <text x="819" y="246" font-size="12" fill="#475569" text-anchor="middle">[mask]</text>
  </g>

  <!-- 省略号 -->
  <text x="480" y="280" font-size="14" fill="#64748b" text-anchor="middle">&#8230; (N patches total, 50% corrupted)</text>

  <!-- 箭头：序列到 Transformer -->
  <line x1="480" y1="310" x2="480" y2="340" stroke="#6366f1" stroke-width="2"/>
  <polygon points="474,338 480,350 486,338" fill="#6366f1"/>

  <!-- Transformer 编码器 -->
  <rect x="240" y="350" width="480" height="80" fill="#f8fafc" stroke="#6366f1" stroke-width="2" rx="4"/>
  <text x="480" y="380" font-size="16" font-weight="bold" fill="#3730a3" text-anchor="middle">Transformer Encoder (L layers)</text>
  <text x="480" y="402" font-size="13" fill="#475569" text-anchor="middle">MSA + MLP + LN + Residual</text>
  <text x="480" y="420" font-size="12" fill="#64748b" text-anchor="middle">(Vaswani et al., 2017)</text>

  <!-- 箭头：Transformer 到输出 -->
  <line x1="480" y1="430" x2="480" y2="460" stroke="#6366f1" stroke-width="2"/>
  <polygon points="474,458 480,470 486,458" fill="#6366f1"/>

  <!-- 输出序列 -->
  <rect x="40" y="470" width="880" height="100" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" rx="4"/>
  <text x="480" y="492" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">Output Representations (per patch)</text>

  <!-- 输出小格子 -->
  <g>
    <rect x="60" y="504" width="90" height="36" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" rx="2"/>
    <text x="105" y="526" font-size="12" fill="#475569" text-anchor="middle">z&#8320;[class]</text>
  </g>
  <g>
    <rect x="162" y="504" width="90" height="36" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5" rx="2"/>
    <text x="207" y="526" font-size="12" fill="#3730a3" text-anchor="middle">z&#8320;[mask]</text>
  </g>
  <g>
    <rect x="264" y="504" width="90" height="36" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5" rx="2"/>
    <text x="309" y="526" font-size="12" fill="#3730a3" text-anchor="middle">z&#8320;[mask]</text>
  </g>
  <g>
    <rect x="366" y="504" width="90" height="36" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5" rx="2"/>
    <text x="411" y="526" font-size="12" fill="#3730a3" text-anchor="middle">z&#8320;[mask]</text>
  </g>
  <g>
    <rect x="468" y="504" width="90" height="36" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5" rx="2"/>
    <text x="513" y="526" font-size="12" fill="#3730a3" text-anchor="middle">z&#8320;[mask]</text>
  </g>
  <g>
    <rect x="570" y="504" width="90" height="36" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5" rx="2"/>
    <text x="615" y="526" font-size="12" fill="#3730a3" text-anchor="middle">z&#8320;[mask]</text>
  </g>
  <g>
    <rect x="672" y="504" width="90" height="36" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5" rx="2"/>
    <text x="717" y="526" font-size="12" fill="#3730a3" text-anchor="middle">z&#8320;[mask]</text>
  </g>
  <g>
    <rect x="774" y="504" width="90" height="36" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5" rx="2"/>
    <text x="819" y="526" font-size="12" fill="#3730a3" text-anchor="middle">z&#8320;[mask]</text>
  </g>
  <text x="480" y="560" font-size="12" fill="#64748b" text-anchor="middle">&#8230; (only corrupted patches used for prediction)</text>

  <!-- 箭头：输出到预测 -->
  <line x1="480" y1="570" x2="480" y2="596" stroke="#6366f1" stroke-width="2"/>
  <polygon points="474,594 480,606 486,594" fill="#6366f1"/>

  <!-- 预测目标 -->
  <rect x="200" y="606" width="560" height="56" fill="#eef2ff" stroke="#6366f1" stroke-width="2" rx="4"/>
  <text x="480" y="628" font-size="15" font-weight="bold" fill="#3730a3" text-anchor="middle">Predict 3-bit Mean Color (512 colors) per corrupted patch</text>
  <text x="480" y="648" font-size="12" fill="#475569" text-anchor="middle">target: average RGB quantized to 3 bits each (R&#8323;G&#8323;B&#8323;)</text>

  <!-- 右侧图例面板 -->
  <rect x="780" y="56" width="140" height="120" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="3"/>
  <text x="850" y="76" font-size="12" font-weight="bold" fill="#1e293b" text-anchor="middle">Legend</text>
  <line x1="792" y1="88" x2="828" y2="88" stroke="#6366f1" stroke-width="2"/>
  <polygon points="826,84 832,88 826,92" fill="#6366f1"/>
  <text x="836" y="92" font-size="11" fill="#475569">data flow</text>
  <rect x="792" y="102" width="16" height="12" fill="#eef2ff" stroke="#6366f1" stroke-width="1" rx="1"/>
  <text x="816" y="112" font-size="11" fill="#475569">corrupted</text>
  <rect x="792" y="120" width="16" height="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" rx="1"/>
  <text x="816" y="130" font-size="11" fill="#475569">unchanged</text>
  <rect x="792" y="138" width="16" height="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" rx="1"/>
  <text x="816" y="148" font-size="11" fill="#475569">[class]</text>
</svg>
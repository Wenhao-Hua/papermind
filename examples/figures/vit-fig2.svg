<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" width="960" height="680">
  <rect x="0" y="0" width="960" height="680" fill="#ffffff"/>

  <!-- 标题 -->
  <text x="480" y="36" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">Vision Transformer (ViT) Encoder Block — Pre-Normalization</text>

  <!-- 主面板：Transformer Encoder 结构（居中纵向） -->
  <!-- 输入 z_{ℓ-1} -->
  <rect x="380" y="60" width="200" height="40" rx="4" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="480" y="86" font-size="14" fill="#1e293b" text-anchor="middle">z<![CDATA[<tspan baseline-shift="sub" font-size="75%">ℓ-1</tspan>]]></text>

  <!-- 箭头：z_{ℓ-1} → LN -->
  <line x1="480" y1="100" x2="480" y2="128" stroke="#475569" stroke-width="1.5"/>
  <polygon points="480,132 476,124 484,124" fill="#475569"/>

  <!-- LN -->
  <rect x="380" y="132" width="200" height="36" rx="4" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="480" y="155" font-size="13" fill="#3730a3" text-anchor="middle">LayerNorm</text>

  <!-- 箭头：LN → MSA -->
  <line x1="480" y1="168" x2="480" y2="196" stroke="#475569" stroke-width="1.5"/>
  <polygon points="480,200 476,192 484,192" fill="#475569"/>

  <!-- MSA -->
  <rect x="380" y="200" width="200" height="36" rx="4" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="480" y="223" font-size="13" fill="#3730a3" text-anchor="middle">Multi-Head Self-Attention</text>

  <!-- 残差连接：从 z_{ℓ-1} 到 MSA 输出 -->
  <path d="M 585 80 L 620 80 L 620 218 L 585 218" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5,4"/>
  <text x="628" y="150" font-size="11" fill="#64748b" text-anchor="middle" transform="rotate(90,628,150)">residual</text>

  <!-- 加法节点 -->
  <circle cx="480" cy="240" r="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.2"/>
  <text x="480" y="244" font-size="10" fill="#1e293b" text-anchor="middle">+</text>

  <!-- 箭头：加法 → z'_ℓ -->
  <line x1="480" y1="248" x2="480" y2="270" stroke="#475569" stroke-width="1.5"/>
  <polygon points="480,274 476,266 484,266" fill="#475569"/>

  <!-- z'_ℓ -->
  <rect x="380" y="274" width="200" height="36" rx="4" fill="#f8fafc" stroke="#475569" stroke-width="1.2"/>
  <text x="480" y="297" font-size="13" fill="#1e293b" text-anchor="middle">z<![CDATA[<tspan baseline-shift="sub" font-size="75%">ℓ</tspan>]]><![CDATA[<tspan font-size="75%">'</tspan>]]></text>

  <!-- 箭头：z'_ℓ → LN -->
  <line x1="480" y1="310" x2="480" y2="338" stroke="#475569" stroke-width="1.5"/>
  <polygon points="480,342 476,334 484,334" fill="#475569"/>

  <!-- LN -->
  <rect x="380" y="342" width="200" height="36" rx="4" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="480" y="365" font-size="13" fill="#3730a3" text-anchor="middle">LayerNorm</text>

  <!-- 箭头：LN → MLP -->
  <line x1="480" y1="378" x2="480" y2="406" stroke="#475569" stroke-width="1.5"/>
  <polygon points="480,410 476,402 484,402" fill="#475569"/>

  <!-- MLP -->
  <rect x="380" y="410" width="200" height="36" rx="4" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="480" y="433" font-size="13" fill="#3730a3" text-anchor="middle">MLP (Linear&#8594;GELU&#8594;Linear)</text>

  <!-- 残差连接：从 z'_ℓ 到 MLP 输出 -->
  <path d="M 585 292 L 620 292 L 620 428 L 585 428" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5,4"/>
  <text x="628" y="362" font-size="11" fill="#64748b" text-anchor="middle" transform="rotate(90,628,362)">residual</text>

  <!-- 加法节点 -->
  <circle cx="480" cy="450" r="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.2"/>
  <text x="480" y="454" font-size="10" fill="#1e293b" text-anchor="middle">+</text>

  <!-- 箭头：加法 → z_ℓ -->
  <line x1="480" y1="458" x2="480" y2="480" stroke="#475569" stroke-width="1.5"/>
  <polygon points="480,484 476,476 484,476" fill="#475569"/>

  <!-- z_ℓ -->
  <rect x="380" y="484" width="200" height="36" rx="4" fill="#f8fafc" stroke="#475569" stroke-width="1.2"/>
  <text x="480" y="507" font-size="13" fill="#1e293b" text-anchor="middle">z<![CDATA[<tspan baseline-shift="sub" font-size="75%">ℓ</tspan>]]></text>

  <!-- 右侧图例/说明面板 -->
  <rect x="720" y="60" width="220" height="460" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>

  <!-- 图例标题 -->
  <text x="830" y="86" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">Figure Legend</text>

  <!-- 图例项 -->
  <line x1="740" y1="110" x2="780" y2="110" stroke="#475569" stroke-width="1.5"/>
  <polygon points="780,114 776,106 784,106" fill="#475569"/>
  <text x="790" y="115" font-size="12" fill="#334155">Data flow</text>

  <line x1="740" y1="140" x2="780" y2="140" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5,4"/>
  <text x="790" y="145" font-size="12" fill="#334155">Residual connection</text>

  <rect x="740" y="160" width="40" height="16" rx="3" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="790" y="173" font-size="12" fill="#334155">Pre-Norm block</text>

  <rect x="740" y="190" width="40" height="16" rx="3" fill="#f8fafc" stroke="#475569" stroke-width="1.2"/>
  <text x="790" y="203" font-size="12" fill="#334155">Intermediate state</text>

  <!-- 关键公式 -->
  <text x="830" y="240" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="middle">Core Equations</text>

  <text x="830" y="270" font-size="12" fill="#3730a3" text-anchor="middle">z<![CDATA[<tspan baseline-shift="sub" font-size="75%">ℓ</tspan>]]><![CDATA[<tspan font-size="75%">'</tspan>]]> = MSA(LN(z<![CDATA[<tspan baseline-shift="sub" font-size="75%">ℓ-1</tspan>]]>)) + z<![CDATA[<tspan baseline-shift="sub" font-size="75%">ℓ-1</tspan>]]></text>

  <text x="830" y="300" font-size="12" fill="#3730a3" text-anchor="middle">z<![CDATA[<tspan baseline-shift="sub" font-size="75%">ℓ</tspan>]]> = MLP(LN(z<![CDATA[<tspan baseline-shift="sub" font-size="75%">ℓ</tspan>]]><![CDATA[<tspan font-size="75%">'</tspan>]]>)) + z<![CDATA[<tspan baseline-shift="sub" font-size="75%">ℓ</tspan>]]><![CDATA[<tspan font-size="75%">'</tspan>]]></text>

  <!-- MLP 结构说明 -->
  <text x="830" y="340" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="middle">MLP Detail</text>

  <rect x="740" y="356" width="180" height="24" rx="3" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="830" y="373" font-size="11" fill="#334155" text-anchor="middle">Linear (D &#8594; 4D)</text>

  <rect x="740" y="384" width="180" height="24" rx="3" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="830" y="401" font-size="11" fill="#334155" text-anchor="middle">GELU activation</text>

  <rect x="740" y="412" width="180" height="24" rx="3" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="830" y="429" font-size="11" fill="#334155" text-anchor="middle">Linear (4D &#8594; D)</text>

  <!-- 记号说明 -->
  <text x="830" y="470" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="middle">Notation</text>
  <text x="830" y="492" font-size="11" fill="#334155" text-anchor="middle">z<![CDATA[<tspan baseline-shift="sub" font-size="75%">ℓ</tspan>]]>: output of block ℓ</text>
  <text x="830" y="510" font-size="11" fill="#334155" text-anchor="middle">D: latent dimension (e.g., 768)</text>

  <!-- 底部说明 -->
  <text x="480" y="560" font-size="12" fill="#64748b" text-anchor="middle">Pre-normalization: LayerNorm applied before each sub-layer (MSA/MLP), not after.</text>
  <text x="480" y="580" font-size="12" fill="#64748b" text-anchor="middle">Residual connections add the sub-layer input to its output, enabling gradient flow.</text>

  <!-- 底部引用 -->
  <text x="480" y="620" font-size="11" fill="#94a3b8" text-anchor="middle">Based on Vaswani et al. (2017) and ViT (Dosovitskiy et al., 2021)</text>
</svg>
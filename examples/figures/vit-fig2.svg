<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" width="960" height="680">
  <rect x="0" y="0" width="960" height="680" fill="#ffffff"/>

  <!-- 标题 -->
  <text x="480" y="32" font-size="18" font-weight="700" fill="#1e293b" text-anchor="middle">Masked Patch Prediction (Self-Supervised Pre-training)</text>

  <!-- ===== 左侧主流程：自上而下 ===== -->
  <!-- 步骤1：输入图像 -->
  <rect x="120" y="56" width="240" height="36" rx="4" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="240" y="79" font-size="14" fill="#1e293b" text-anchor="middle">Input Image (224&#215;224)</text>

  <!-- 箭头1 -->
  <line x1="240" y1="92" x2="240" y2="112" stroke="#475569" stroke-width="1.5"/>
  <polygon points="240,116 236,108 244,108" fill="#475569"/>

  <!-- 步骤2：切块 + 线性嵌入 -->
  <rect x="120" y="120" width="240" height="36" rx="4" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="240" y="143" font-size="14" fill="#1e293b" text-anchor="middle">Patchify + Linear Embedding (16&#215;16)</text>

  <!-- 箭头2 -->
  <line x1="240" y1="156" x2="240" y2="176" stroke="#475569" stroke-width="1.5"/>
  <polygon points="240,180 236,172 244,172" fill="#475569"/>

  <!-- 步骤3：随机遮挡50% -->
  <rect x="120" y="184" width="240" height="36" rx="4" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="240" y="207" font-size="14" fill="#3730a3" text-anchor="middle">Random Mask 50% of Patches</text>

  <!-- 箭头3 -->
  <line x1="240" y1="220" x2="240" y2="240" stroke="#475569" stroke-width="1.5"/>
  <polygon points="240,244 236,236 244,236" fill="#475569"/>

  <!-- 步骤4：Transformer Encoder -->
  <rect x="120" y="248" width="240" height="36" rx="4" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="240" y="271" font-size="14" fill="#1e293b" text-anchor="middle">Transformer Encoder (L layers)</text>

  <!-- 箭头4 -->
  <line x1="240" y1="284" x2="240" y2="304" stroke="#475569" stroke-width="1.5"/>
  <polygon points="240,308 236,300 244,300" fill="#475569"/>

  <!-- 步骤5：输出表示 -->
  <rect x="120" y="312" width="240" height="36" rx="4" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="240" y="335" font-size="14" fill="#1e293b" text-anchor="middle">Output Representations (per patch)</text>

  <!-- 箭头5 -->
  <line x1="240" y1="348" x2="240" y2="368" stroke="#475569" stroke-width="1.5"/>
  <polygon points="240,372 236,364 244,364" fill="#475569"/>

  <!-- 步骤6：分类头 -->
  <rect x="120" y="376" width="240" height="36" rx="4" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="240" y="399" font-size="14" fill="#1e293b" text-anchor="middle">Linear Head (512 classes)</text>

  <!-- 箭头6 -->
  <line x1="240" y1="412" x2="240" y2="432" stroke="#475569" stroke-width="1.5"/>
  <polygon points="240,436 236,428 244,428" fill="#475569"/>

  <!-- 步骤7：损失 -->
  <rect x="120" y="440" width="240" height="36" rx="4" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="240" y="463" font-size="14" fill="#3730a3" text-anchor="middle">Cross-Entropy Loss (3-bit avg color)</text>

  <!-- ===== 右侧：掩码策略图例 ===== -->
  <rect x="440" y="56" width="480" height="160" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="680" y="80" font-size="15" font-weight="700" fill="#1e293b" text-anchor="middle">Masking Strategy (per masked patch)</text>

  <!-- 80% [mask] -->
  <rect x="460" y="96" width="200" height="28" rx="3" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="560" y="115" font-size="13" fill="#3730a3" text-anchor="middle">80% &#8594; learnable [mask]</text>

  <!-- 10% random -->
  <rect x="460" y="132" width="200" height="28" rx="3" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="560" y="151" font-size="13" fill="#1e293b" text-anchor="middle">10% &#8594; random patch</text>

  <!-- 10% unchanged -->
  <rect x="460" y="168" width="200" height="28" rx="3" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="560" y="187" font-size="13" fill="#1e293b" text-anchor="middle">10% &#8594; unchanged</text>

  <!-- 右侧说明 -->
  <text x="700" y="115" font-size="12" fill="#64748b" text-anchor="start">Replace with special [mask] token</text>
  <text x="700" y="151" font-size="12" fill="#64748b" text-anchor="start">Replace with random patch embedding</text>
  <text x="700" y="187" font-size="12" fill="#64748b" text-anchor="start">Keep original patch embedding</text>

  <!-- ===== 右侧：目标定义 ===== -->
  <rect x="440" y="232" width="480" height="120" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="680" y="256" font-size="15" font-weight="700" fill="#1e293b" text-anchor="middle">Prediction Target: 3-bit Average Color</text>

  <text x="680" y="286" font-size="13" fill="#334155" text-anchor="middle">Each masked patch &#8594; quantize its mean RGB into 8&#215;8&#215;8 = 512 bins</text>
  <text x="680" y="310" font-size="13" fill="#334155" text-anchor="middle">(3 bits per channel &#8594; 512 classes)</text>
  <text x="680" y="334" font-size="13" fill="#64748b" text-anchor="middle">Cross-entropy loss between predicted and true bin</text>

  <!-- ===== 右侧：映射示意 ===== -->
  <rect x="440" y="368" width="480" height="160" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="680" y="392" font-size="15" font-weight="700" fill="#1e293b" text-anchor="middle">Patch &#8594; Color Bin Mapping (example)</text>

  <!-- 左侧：patch表示 -->
  <text x="500" y="420" font-size="13" fill="#334155" text-anchor="middle">Output rep. z_i</text>
  <rect x="460" y="428" width="80" height="28" rx="3" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="500" y="447" font-size="12" fill="#3730a3" text-anchor="middle">z_i</text>

  <!-- 箭头 -->
  <line x1="540" y1="442" x2="580" y2="442" stroke="#475569" stroke-width="1.5"/>
  <polygon points="584,442 576,438 576,446" fill="#475569"/>

  <!-- 右侧：线性头 + 512类 -->
  <text x="660" y="420" font-size="13" fill="#334155" text-anchor="middle">Linear Head</text>
  <rect x="590" y="428" width="140" height="28" rx="3" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="660" y="447" font-size="12" fill="#1e293b" text-anchor="middle">W &#8712; &#8477;^(512&#215;D)</text>

  <!-- 箭头 -->
  <line x1="730" y1="442" x2="770" y2="442" stroke="#475569" stroke-width="1.5"/>
  <polygon points="774,442 766,438 766,446" fill="#475569"/>

  <!-- 右侧：512类输出 -->
  <text x="840" y="420" font-size="13" fill="#334155" text-anchor="middle">512 logits</text>
  <rect x="780" y="428" width="120" height="28" rx="3" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="840" y="447" font-size="12" fill="#1e293b" text-anchor="middle">softmax</text>

  <!-- 示例：3-bit颜色 -->
  <text x="680" y="500" font-size="13" fill="#334155" text-anchor="middle">Example: patch with avg RGB = (120, 200, 50)</text>
  <text x="680" y="520" font-size="12" fill="#64748b" text-anchor="middle">Quantize: R=120/32=3, G=200/32=6, B=50/32=1 &#8594; bin index = 3&#215;64+6&#215;8+1 = 241</text>

  <!-- ===== 底部：图例 ===== -->
  <rect x="120" y="500" width="800" height="60" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="140" y="524" font-size="13" font-weight="600" fill="#1e293b">Legend</text>

  <!-- 实线箭头 -->
  <line x1="140" y1="544" x2="180" y2="544" stroke="#475569" stroke-width="1.5"/>
  <polygon points="184,544 176,540 176,548" fill="#475569"/>
  <text x="196" y="548" font-size="12" fill="#334155">Data flow</text>

  <!-- 强调框 -->
  <rect x="320" y="532" width="16" height="16" rx="2" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="344" y="546" font-size="12" fill="#334155">Key component / loss</text>

  <!-- 普通框 -->
  <rect x="520" y="532" width="16" height="16" rx="2" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="544" y="546" font-size="12" fill="#334155">Intermediate operation</text>

  <!-- 虚线框 -->
  <rect x="700" y="532" width="16" height="16" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="724" y="546" font-size="12" fill="#334155">Explanation panel</text>

  <!-- ===== 底部说明 ===== -->
  <text x="480" y="600" font-size="12" fill="#64748b" text-anchor="middle">Figure: Self-supervised pre-training via masked patch prediction. 50% of patches are randomly masked; the model predicts the 3-bit average color</text>
  <text x="480" y="618" font-size="12" fill="#64748b" text-anchor="middle">(quantized into 512 bins) for each masked patch. Masking strategy follows BERT (Devlin et al., 2019): 80% [mask], 10% random, 10% unchanged.</text>

  <!-- 论文引用 -->
  <text x="480" y="650" font-size="11" fill="#94a3b8" text-anchor="middle">Dosovitskiy et al., ICLR 2021 — An Image is Worth 16x16 Words: Transformers for Image Recognition at Scale</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" width="960" height="680">
  <rect x="0" y="0" width="960" height="680" fill="#ffffff"/>

  <!-- 标题 -->
  <text x="480" y="36" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">Masked Patch Prediction for Self-Supervised Pre-Training (ViT)</text>

  <!-- 左侧主流程：自上而下 -->
  <!-- 输入图像 -->
  <rect x="120" y="60" width="240" height="160" rx="4" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
  <text x="240" y="90" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">Input Image</text>
  <text x="240" y="112" font-size="12" fill="#334155" text-anchor="middle">H &#215; W &#215; 3</text>
  <!-- 画网格示意 patch -->
  <line x1="180" y1="130" x2="180" y2="200" stroke="#94a3b8" stroke-width="0.8"/>
  <line x1="240" y1="130" x2="240" y2="200" stroke="#94a3b8" stroke-width="0.8"/>
  <line x1="300" y1="130" x2="300" y2="200" stroke="#94a3b8" stroke-width="0.8"/>
  <line x1="140" y1="155" x2="340" y2="155" stroke="#94a3b8" stroke-width="0.8"/>
  <line x1="140" y1="180" x2="340" y2="180" stroke="#94a3b8" stroke-width="0.8"/>
  <text x="160" y="143" font-size="9" fill="#64748b" text-anchor="middle">P</text>
  <text x="220" y="143" font-size="9" fill="#64748b" text-anchor="middle">P</text>
  <text x="280" y="143" font-size="9" fill="#64748b" text-anchor="middle">P</text>
  <text x="340" y="143" font-size="9" fill="#64748b" text-anchor="middle">P</text>

  <!-- 箭头 1 -->
  <line x1="240" y1="220" x2="240" y2="260" stroke="#6366f1" stroke-width="2"/>
  <polygon points="240,264 234,254 246,254" fill="#6366f1"/>

  <!-- 分块 + 线性投影 -->
  <rect x="120" y="268" width="240" height="60" rx="4" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="240" y="294" font-size="13" font-weight="bold" fill="#3730a3" text-anchor="middle">Patch Embedding</text>
  <text x="240" y="314" font-size="11" fill="#334155" text-anchor="middle">x<tspan baseline-shift="sub" font-size="75%">i</tspan> = Linear(Flatten(Patch))</text>

  <!-- 箭头 2 -->
  <line x1="240" y1="328" x2="240" y2="368" stroke="#6366f1" stroke-width="2"/>
  <polygon points="240,372 234,362 246,362" fill="#6366f1"/>

  <!-- 随机遮挡 50% -->
  <rect x="120" y="376" width="240" height="80" rx="4" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
  <text x="240" y="400" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="middle">Random Masking (50%)</text>
  <text x="240" y="420" font-size="11" fill="#334155" text-anchor="middle">80% &#8594; [mask] token</text>
  <text x="240" y="436" font-size="11" fill="#334155" text-anchor="middle">10% &#8594; random patch</text>
  <text x="240" y="452" font-size="11" fill="#334155" text-anchor="middle">10% &#8594; unchanged</text>

  <!-- 箭头 3 -->
  <line x1="240" y1="456" x2="240" y2="496" stroke="#6366f1" stroke-width="2"/>
  <polygon points="240,500 234,490 246,490" fill="#6366f1"/>

  <!-- Transformer 编码器 -->
  <rect x="120" y="504" width="240" height="60" rx="4" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="240" y="530" font-size="13" font-weight="bold" fill="#3730a3" text-anchor="middle">Transformer Encoder</text>
  <text x="240" y="550" font-size="11" fill="#334155" text-anchor="middle">Output: h<tspan baseline-shift="sub" font-size="75%">i</tspan> for each patch</text>

  <!-- 箭头 4 -->
  <line x1="240" y1="564" x2="240" y2="604" stroke="#6366f1" stroke-width="2"/>
  <polygon points="240,608 234,598 246,598" fill="#6366f1"/>

  <!-- 预测头 -->
  <rect x="120" y="612" width="240" height="50" rx="4" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
  <text x="240" y="636" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="middle">Prediction Head (MLP)</text>
  <text x="240" y="654" font-size="11" fill="#334155" text-anchor="middle">512-way classification</text>

  <!-- ===== 右侧说明面板 ===== -->
  <rect x="420" y="60" width="500" height="600" rx="4" fill="#fbfcfe" stroke="#cbd5e1" stroke-width="1"/>

  <!-- 核心定义 -->
  <rect x="440" y="80" width="460" height="100" rx="4" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="670" y="106" font-size="15" font-weight="bold" fill="#3730a3" text-anchor="middle">Core Definition</text>
  <text x="670" y="132" font-size="13" fill="#1e293b" text-anchor="middle">Masked Patch Prediction</text>
  <text x="670" y="154" font-size="12" fill="#334155" text-anchor="middle">&#8467; = CrossEntropy( y<tspan baseline-shift="sub" font-size="75%">i</tspan> , f(h<tspan baseline-shift="sub" font-size="75%">i</tspan>) )</text>
  <text x="670" y="174" font-size="11" fill="#64748b" text-anchor="middle">y<tspan baseline-shift="sub" font-size="75%">i</tspan> : 3-bit mean color (512 classes)</text>

  <!-- 映射说明 -->
  <rect x="440" y="200" width="460" height="130" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="670" y="224" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="middle">Mapping: Patch &#8594; Color Class</text>
  <text x="460" y="252" font-size="12" fill="#334155">Set of patches: P = {p<tspan baseline-shift="sub" font-size="75%">1</tspan>, p<tspan baseline-shift="sub" font-size="75%">2</tspan>, …, p<tspan baseline-shift="sub" font-size="75%">N</tspan>}</text>
  <text x="460" y="274" font-size="12" fill="#334155">Masked set: M &#8834; P, |M| = 0.5N</text>
  <text x="460" y="296" font-size="12" fill="#334155">f: h<tspan baseline-shift="sub" font-size="75%">i</tspan> &#8594; {0, …, 511}</text>
  <text x="460" y="318" font-size="11" fill="#64748b">Each class = one 3-bit RGB mean (8&#215;8&#215;8 = 512)</text>

  <!-- 二部图示意 -->
  <rect x="440" y="350" width="460" height="140" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="670" y="374" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="middle">Assignment: Masked Patches &#8594; Color Classes</text>

  <!-- 左列节点 -->
  <circle cx="490" cy="410" r="14" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="490" y="414" font-size="10" fill="#3730a3" text-anchor="middle">p<tspan baseline-shift="sub" font-size="75%">1</tspan></text>
  <circle cx="490" cy="450" r="14" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="490" y="454" font-size="10" fill="#3730a3" text-anchor="middle">p<tspan baseline-shift="sub" font-size="75%">2</tspan></text>
  <circle cx="490" cy="478" r="14" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="490" y="482" font-size="10" fill="#3730a3" text-anchor="middle">p<tspan baseline-shift="sub" font-size="75%">3</tspan></text>

  <!-- 右列节点 -->
  <circle cx="850" cy="400" r="14" fill="#f1f5f9" stroke="#475569" stroke-width="1.2"/>
  <text x="850" y="404" font-size="9" fill="#1e293b" text-anchor="middle">c<tspan baseline-shift="sub" font-size="75%">42</tspan></text>
  <circle cx="850" cy="440" r="14" fill="#f1f5f9" stroke="#475569" stroke-width="1.2"/>
  <text x="850" y="444" font-size="9" fill="#1e293b" text-anchor="middle">c<tspan baseline-shift="sub" font-size="75%">137</tspan></text>
  <circle cx="850" cy="470" r="14" fill="#f1f5f9" stroke="#475569" stroke-width="1.2"/>
  <text x="850" y="474" font-size="9" fill="#1e293b" text-anchor="middle">c<tspan baseline-shift="sub" font-size="75%">255</tspan></text>

  <!-- 连边 -->
  <line x1="504" y1="410" x2="836" y2="400" stroke="#6366f1" stroke-width="2"/>
  <line x1="504" y1="450" x2="836" y2="440" stroke="#6366f1" stroke-width="1.2"/>
  <line x1="504" y1="478" x2="836" y2="470" stroke="#6366f1" stroke-width="1.2"/>

  <!-- 图例 -->
  <rect x="440" y="510" width="460" height="60" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="670" y="534" font-size="12" font-weight="bold" fill="#1e293b" text-anchor="middle">Legend</text>
  <line x1="470" y1="556" x2="510" y2="556" stroke="#6366f1" stroke-width="2"/>
  <polygon points="510,560 504,552 516,552" fill="#6366f1"/>
  <text x="520" y="560" font-size="11" fill="#334155">Forward / data flow</text>
  <line x1="650" y1="556" x2="690" y2="556" stroke="#6366f1" stroke-width="2"/>
  <text x="700" y="560" font-size="11" fill="#334155">Assignment (selected)</text>

  <!-- 底部说明 -->
  <rect x="440" y="590" width="460" height="50" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="670" y="612" font-size="11" fill="#475569" text-anchor="middle">Training objective: minimize cross-entropy loss</text>
  <text x="670" y="630" font-size="11" fill="#475569" text-anchor="middle">over masked patches only</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="960" height="680" fill="#ffffff"/>
  
  <!-- 标题 -->
  <text x="480" y="36" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">Rejection Sampling Fine-Tuning (Llama 2-Chat)</text>
  <line x1="200" y1="46" x2="760" y2="46" stroke="#cbd5e1" stroke-width="1"/>

  <!-- 左侧主面板：核心流程 -->
  <!-- 步骤 1: 采样 -->
  <rect x="60" y="70" width="480" height="110" rx="4" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
  <text x="300" y="96" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">Step 1: Sample K Outputs from Current Policy</text>
  <line x1="80" y1="106" x2="520" y2="106" stroke="#e2e8f0" stroke-width="1"/>
  
  <!-- 提示框 -->
  <rect x="80" y="118" width="100" height="28" rx="3" fill="#eef2ff" stroke="#6366f1" stroke-width="1"/>
  <text x="130" y="137" font-size="12" fill="#3730a3" text-anchor="middle">Prompt p</text>
  
  <!-- 箭头 -->
  <line x1="180" y1="132" x2="220" y2="132" stroke="#6366f1" stroke-width="1.5"/>
  <polygon points="220,127 232,132 220,137" fill="#6366f1"/>
  
  <!-- 模型框 -->
  <rect x="232" y="116" width="120" height="32" rx="3" fill="#f1f5f9" stroke="#475569" stroke-width="1"/>
  <text x="292" y="136" font-size="12" fill="#1e293b" text-anchor="middle">&#960;(&#183;|p)</text>
  
  <!-- 箭头 -->
  <line x1="352" y1="132" x2="392" y2="132" stroke="#6366f1" stroke-width="1.5"/>
  <polygon points="392,127 404,132 392,137" fill="#6366f1"/>
  
  <!-- K 个输出 -->
  <text x="420" y="128" font-size="12" fill="#334155" text-anchor="middle">y&#8321;, y&#8322;, …, y&#8345;</text>
  <text x="420" y="148" font-size="11" fill="#64748b" text-anchor="middle">(K outputs)</text>

  <!-- 步骤 2: 奖励评分 -->
  <rect x="60" y="200" width="480" height="110" rx="4" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
  <text x="300" y="226" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">Step 2: Score Each Output with Reward Model</text>
  <line x1="80" y1="236" x2="520" y2="236" stroke="#e2e8f0" stroke-width="1"/>
  
  <!-- 奖励模型 -->
  <rect x="120" y="250" width="140" height="32" rx="3" fill="#f1f5f9" stroke="#475569" stroke-width="1"/>
  <text x="190" y="270" font-size="12" fill="#1e293b" text-anchor="middle">R&#952;(y, p)</text>
  
  <!-- 箭头 -->
  <line x1="260" y1="266" x2="300" y2="266" stroke="#6366f1" stroke-width="1.5"/>
  <polygon points="300,261 312,266 300,271" fill="#6366f1"/>
  
  <!-- 分数列表 -->
  <text x="340" y="260" font-size="12" fill="#334155" text-anchor="middle">r&#8321;, r&#8322;, …, r&#8345;</text>
  <text x="340" y="280" font-size="11" fill="#64748b" text-anchor="middle">(scores)</text>

  <!-- 步骤 3: 选择最佳 -->
  <rect x="60" y="330" width="480" height="110" rx="4" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
  <text x="300" y="356" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">Step 3: Select Best Output (Pseudo-Gold)</text>
  <line x1="80" y1="366" x2="520" y2="366" stroke="#e2e8f0" stroke-width="1"/>
  
  <!-- 选择 -->
  <text x="160" y="396" font-size="13" fill="#334155" text-anchor="middle">y&#8314; = argmax</text>
  <text x="240" y="396" font-size="11" fill="#64748b" text-anchor="middle">y&#8345;</text>
  <text x="280" y="396" font-size="13" fill="#334155" text-anchor="middle">R&#952;(y&#8345;, p)</text>
  
  <!-- 强调框 -->
  <rect x="340" y="380" width="120" height="32" rx="3" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="400" y="400" font-size="13" font-weight="bold" fill="#3730a3" text-anchor="middle">y&#8314; (best)</text>

  <!-- 步骤 4: 监督微调 -->
  <rect x="60" y="460" width="480" height="110" rx="4" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
  <text x="300" y="486" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">Step 4: Supervised Fine-Tune on (p, y&#8314;)</text>
  <line x1="80" y1="496" x2="520" y2="496" stroke="#e2e8f0" stroke-width="1"/>
  
  <!-- 损失 -->
  <text x="300" y="530" font-size="13" fill="#334155" text-anchor="middle">L = &#8722;log &#960;&#952;(y&#8314;|p)</text>
  <text x="300" y="550" font-size="11" fill="#64748b" text-anchor="middle">(cross-entropy on best output)</text>

  <!-- 主流程箭头 -->
  <line x1="300" y1="180" x2="300" y2="200" stroke="#6366f1" stroke-width="2"/>
  <polygon points="295,200 300,210 305,200" fill="#6366f1"/>
  <line x1="300" y1="310" x2="300" y2="330" stroke="#6366f1" stroke-width="2"/>
  <polygon points="295,330 300,340 305,330" fill="#6366f1"/>
  <line x1="300" y1="440" x2="300" y2="460" stroke="#6366f1" stroke-width="2"/>
  <polygon points="295,460 300,470 305,460" fill="#6366f1"/>

  <!-- 右侧面板：关键定义与公式 -->
  <rect x="580" y="70" width="340" height="500" rx="4" fill="#fbfcfe" stroke="#cbd5e1" stroke-width="1"/>
  <text x="750" y="96" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">Key Definitions</text>
  <line x1="600" y1="106" x2="900" y2="106" stroke="#e2e8f0" stroke-width="1"/>

  <!-- 定义 1: 奖励模型 -->
  <text x="600" y="132" font-size="12" font-weight="bold" fill="#334155">Reward Model</text>
  <text x="600" y="152" font-size="11" fill="#64748b">R&#952;: (prompt, response) &#8594; scalar score</text>
  <text x="600" y="170" font-size="11" fill="#64748b">Trained on human preference data</text>

  <!-- 定义 2: 选择 -->
  <text x="600" y="200" font-size="12" font-weight="bold" fill="#334155">Selection Criterion</text>
  <text x="600" y="220" font-size="11" fill="#64748b">y&#8314; = argmax</text>
  <text x="660" y="220" font-size="10" fill="#64748b">i&#8712;[1,K]</text>
  <text x="690" y="220" font-size="11" fill="#64748b">R&#952;(y&#8345;, p)</text>

  <!-- 定义 3: 损失 -->
  <text x="600" y="250" font-size="12" font-weight="bold" fill="#334155">Fine-Tuning Objective</text>
  <text x="600" y="270" font-size="11" fill="#64748b">L = &#8722;log &#960;&#952;(y&#8314;|p)</text>
  <text x="600" y="288" font-size="10" fill="#64748b">(standard supervised cross-entropy)</text>

  <!-- 定义 4: 与 PPO 对比 -->
  <text x="600" y="318" font-size="12" font-weight="bold" fill="#334155">Comparison with PPO</text>
  <text x="600" y="338" font-size="11" fill="#64748b">Rejection Sampling:</text>
  <text x="615" y="356" font-size="10" fill="#64748b">&#8226; Fixed policy per iteration</text>
  <text x="615" y="374" font-size="10" fill="#64748b">&#8226; No online policy updates</text>
  <text x="615" y="392" font-size="10" fill="#64748b">&#8226; Simpler, stable</text>
  <text x="600" y="416" font-size="11" fill="#64748b">PPO:</text>
  <text x="615" y="434" font-size="10" fill="#64748b">&#8226; Online policy updates</text>
  <text x="615" y="452" font-size="10" fill="#64748b">&#8226; Requires value function</text>
  <text x="615" y="470" font-size="10" fill="#64748b">&#8226; More complex</text>

  <!-- 定义 5: 温度 -->
  <text x="600" y="500" font-size="12" font-weight="bold" fill="#334155">Temperature Schedule</text>
  <text x="600" y="520" font-size="11" fill="#64748b">After RLHF: optimal T &#8776; 1.2–1.3</text>
  <text x="600" y="538" font-size="10" fill="#64748b">(higher than initial T)</text>

  <!-- 图例 -->
  <rect x="580" y="580" width="340" height="80" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="750" y="602" font-size="12" font-weight="bold" fill="#1e293b" text-anchor="middle">Legend</text>
  
  <line x1="600" y1="624" x2="640" y2="624" stroke="#6366f1" stroke-width="1.5"/>
  <polygon points="640,619 650,624 640,629" fill="#6366f1"/>
  <text x="660" y="628" font-size="11" fill="#334155">Data flow / forward pass</text>
  
  <line x1="600" y1="648" x2="640" y2="648" stroke="#6366f1" stroke-width="2"/>
  <polygon points="640,643 650,648 640,653" fill="#6366f1"/>
  <text x="660" y="652" font-size="11" fill="#334155">Iteration boundary</text>
</svg>
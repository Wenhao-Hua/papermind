<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 688" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" width="960" height="688"><rect x="0" y="0" width="960" height="688" fill="#ffffff"/><text x="480.0" y="44" text-anchor="middle" font-size="25" font-weight="700" fill="#1e293b">Denoising Diffusion Probabilistic Models — 框架</text><line x1="80" y1="62" x2="880" y2="62" stroke="#e2e8f0" stroke-width="1.5"/><line x1="480.0" y1="136.5" x2="480.0" y2="189.0" stroke="#475569" stroke-width="2.0"/><polygon points="480.0,200.0 486.0,189.0 474.0,189.0" fill="#475569"/><line x1="480.0" y1="284.0" x2="480.0" y2="349.0" stroke="#475569" stroke-width="2.0"/><polygon points="480.0,360.0 486.0,349.0 474.0,349.0" fill="#475569"/><line x1="480.0" y1="444.0" x2="480.0" y2="509.0" stroke="#475569" stroke-width="2.0"/><polygon points="480.0,520.0 486.0,509.0 474.0,509.0" fill="#475569"/><line x1="660.0" y1="247.4" x2="699.0" y2="248.5" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="6,5"/><polygon points="710.0,248.9 699.2,242.5 698.8,254.5" fill="#94a3b8"/><rect x="340.0" y="90.0" width="280.0" height="46.5" rx="11" fill="#f1f5f9" stroke="#475569" stroke-width="1.8"/><text x="480.0" y="117.0" text-anchor="middle" font-size="15.0" font-weight="700" fill="#1e293b">输入 x₀ ~ q(x₀)</text><rect x="300.0" y="200.0" width="360.0" height="84.0" rx="11" fill="#eef2ff" stroke="#6366f1" stroke-width="1.8"/><text x="480.0" y="227.0" text-anchor="middle" font-size="15.0" font-weight="700" fill="#1e293b">前向加噪过程</text><text x="480.0" y="249.5" text-anchor="middle" font-size="12.5" fill="#334155">q(xₜ|xₜ₋₁) 逐步加高斯噪声</text><text x="480.0" y="268.2" text-anchor="middle" font-size="12.5" fill="#334155">xₜ = √āₜ·x₀ + √(1-āₜ)·ε</text><rect x="300.0" y="360.0" width="360.0" height="84.0" rx="11" fill="#eef2ff" stroke="#6366f1" stroke-width="1.8"/><text x="480.0" y="387.0" text-anchor="middle" font-size="15.0" font-weight="700" fill="#1e293b">反向去噪过程</text><text x="480.0" y="409.5" text-anchor="middle" font-size="12.5" fill="#334155">p_θ(xₜ₋₁|xₜ) = N(μ_θ, Σ_θ)</text><text x="480.0" y="428.2" text-anchor="middle" font-size="12.5" fill="#334155">采样 xₜ₋₁ = μ_θ(xₜ,t) + σₜ·z</text><rect x="340.0" y="520.0" width="280.0" height="46.5" rx="11" fill="#f1f5f9" stroke="#475569" stroke-width="1.8"/><text x="480.0" y="547.0" text-anchor="middle" font-size="15.0" font-weight="700" fill="#1e293b">输出 x₀ ~ p_θ(x₀)</text><rect x="710.0" y="210.0" width="210.0" height="84.0" rx="11" fill="#fbfcfe" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="7,5"/><text x="815.0" y="237.0" text-anchor="middle" font-size="15.0" font-weight="700" fill="#1e293b">训练目标（推断）</text><text x="815.0" y="259.5" text-anchor="middle" font-size="12.5" fill="#334155">L_simple =</text><text x="815.0" y="278.2" text-anchor="middle" font-size="12.5" fill="#334155">E[‖ε - ε_θ(xₜ,t)‖²]</text><line x1="60" y1="606" x2="94" y2="606" stroke="#475569" stroke-width="2.0"/><text x="102" y="610" font-size="12" fill="#334155">前向/数据流</text><line x1="199" y1="606" x2="233" y2="606" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="6,5"/><text x="241" y="610" font-size="12" fill="#334155">推断/参照</text><text x="60" y="648" font-size="12" fill="#334155">āₜ = 1-βₜ，āₜ = Πₛ αₛ（累乘）</text></svg>
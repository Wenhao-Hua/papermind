<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" width="960" height="680">
  <rect x="0" y="0" width="960" height="680" fill="#ffffff"/>
  
  <!-- 标题 -->
  <text x="480" y="36" font-size="18" font-weight="bold" fill="#1e293b" text-anchor="middle">Denoising Diffusion Probabilistic Models — 端到端框架</text>
  <line x1="200" y1="46" x2="760" y2="46" stroke="#cbd5e1" stroke-width="1"/>

  <!-- ===== 左侧主流程（纵向） ===== -->
  <!-- 1. 输入数据 -->
  <rect x="340" y="62" width="280" height="44" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="480" y="90" font-size="14" fill="#1e293b" text-anchor="middle">输入数据 x₀ ~ q(x₀)</text>

  <!-- 箭头：x₀ → 前向加噪 -->
  <line x1="480" y1="106" x2="480" y2="130" stroke="#475569" stroke-width="1.5"/>
  <polygon points="480,134 476,126 484,126" fill="#475569"/>

  <!-- 2. 前向加噪过程（固定马尔可夫链） -->
  <rect x="310" y="134" width="340" height="100" rx="6" fill="#f8fafc" stroke="#6366f1" stroke-width="1.5"/>
  <text x="480" y="158" font-size="13" font-weight="bold" fill="#3730a3" text-anchor="middle">前向加噪过程（固定）</text>
  <text x="480" y="178" font-size="11" fill="#334155" text-anchor="middle">q(x₁|x₀) ··· q(xₜ|xₜ₋₁) ··· q(x_T|x_{T-1})</text>
  <text x="480" y="196" font-size="11" fill="#334155" text-anchor="middle">方差调度 β₁, …, β_T</text>
  <text x="480" y="214" font-size="11" fill="#64748b" text-anchor="middle">x₀ → x₁ → … → xₜ → … → x_T ~ N(0, I)</text>
  <text x="480" y="230" font-size="10" fill="#64748b" text-anchor="middle">闭式采样：xₜ = √ᾱₜ x₀ + √(1−ᾱₜ) ε</text>

  <!-- 箭头：前向 → 反向 -->
  <line x1="480" y1="234" x2="480" y2="258" stroke="#475569" stroke-width="1.5"/>
  <polygon points="480,262 476,254 484,254" fill="#475569"/>

  <!-- 3. 反向去噪过程（可学习） -->
  <rect x="310" y="262" width="340" height="130" rx="6" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="480" y="286" font-size="13" font-weight="bold" fill="#3730a3" text-anchor="middle">反向去噪过程（可学习）</text>
  <text x="480" y="306" font-size="11" fill="#334155" text-anchor="middle">p_θ(x_{t-1}|x_t) = N(x_{t-1}; μ_θ(x_t,t), Σ_θ(x_t,t))</text>
  <text x="480" y="326" font-size="11" fill="#334155" text-anchor="middle">均值参数化：μ_θ(x_t,t) = 1/√αₜ (xₜ − βₜ/√(1−ᾱₜ) ε_θ(xₜ,t))</text>
  <text x="480" y="346" font-size="11" fill="#334155" text-anchor="middle">协方差：σ²ₜ = βₜ 或 σ²ₜ = β̃ₜ（未训练常数）</text>
  <text x="480" y="366" font-size="11" fill="#64748b" text-anchor="middle">采样循环：x_T → x_{T-1} → … → x₀</text>
  <text x="480" y="386" font-size="10" fill="#64748b" text-anchor="middle">逐步去噪：x_{t-1} = μ_θ(x_t,t) + σₜ z, z ~ N(0,I)</text>

  <!-- 箭头：反向 → 输出 -->
  <line x1="480" y1="392" x2="480" y2="416" stroke="#475569" stroke-width="1.5"/>
  <polygon points="480,420 476,412 484,412" fill="#475569"/>

  <!-- 4. 输出 -->
  <rect x="340" y="420" width="280" height="44" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="480" y="448" font-size="14" fill="#1e293b" text-anchor="middle">生成样本 x₀ ~ p_θ(x₀)</text>

  <!-- ===== 右侧：训练目标与损失 ===== -->
  <rect x="700" y="62" width="230" height="200" rx="6" fill="#fbfcfe" stroke="#94a3b8" stroke-width="1" stroke-dasharray="5,4"/>
  <text x="815" y="84" font-size="12" font-weight="bold" fill="#334155" text-anchor="middle">训练目标（推断）</text>
  <line x1="720" y1="92" x2="910" y2="92" stroke="#e2e8f0" stroke-width="1"/>
  
  <text x="815" y="112" font-size="11" fill="#1e293b" text-anchor="middle">变分下界 L_vlb</text>
  <text x="815" y="132" font-size="10" fill="#64748b" text-anchor="middle">L_vlb = E_q[−log p_θ(x₀|x₁) +</text>
  <text x="815" y="148" font-size="10" fill="#64748b" text-anchor="middle">Σ_{t&gt;1} D_KL(q(x_{t-1}|xₜ,x₀) || p_θ(x_{t-1}|xₜ))</text>
  <text x="815" y="168" font-size="10" fill="#64748b" text-anchor="middle">+ D_KL(q(x_T|x₀) || p(x_T))]</text>

  <text x="815" y="194" font-size="11" font-weight="bold" fill="#3730a3" text-anchor="middle">简化目标 L_simple</text>
  <text x="815" y="214" font-size="11" fill="#3730a3" text-anchor="middle">L_simple = E_{t,x₀,ε}[‖ε − ε_θ(xₜ,t)‖²]</text>
  <text x="815" y="234" font-size="10" fill="#64748b" text-anchor="middle">其中 xₜ = √ᾱₜ x₀ + √(1−ᾱₜ) ε</text>
  <text x="815" y="252" font-size="10" fill="#64748b" text-anchor="middle">忽略加权项，聚焦噪声预测</text>

  <!-- 连接线：前向 → 训练目标 -->
  <line x1="650" y1="200" x2="700" y2="200" stroke="#94a3b8" stroke-width="1" stroke-dasharray="5,4"/>
  <polygon points="700,204 694,196 702,196" fill="#94a3b8"/>

  <!-- ===== 右侧下方：与去噪得分匹配的联系 ===== -->
  <rect x="700" y="280" width="230" height="120" rx="6" fill="#fbfcfe" stroke="#94a3b8" stroke-width="1" stroke-dasharray="5,4"/>
  <text x="815" y="302" font-size="12" font-weight="bold" fill="#334155" text-anchor="middle">与去噪得分匹配的联系</text>
  <line x1="720" y1="310" x2="910" y2="310" stroke="#e2e8f0" stroke-width="1"/>
  <text x="815" y="332" font-size="10" fill="#334155" text-anchor="middle">噪声预测等价于得分函数：</text>
  <text x="815" y="352" font-size="10" fill="#334155" text-anchor="middle">ε_θ(xₜ,t) ≈ −√(1−ᾱₜ) ∇_{xₜ} log q(xₜ)</text>
  <text x="815" y="376" font-size="10" fill="#64748b" text-anchor="middle">反向过程 = 退火朗之万动力学采样</text>
  <text x="815" y="394" font-size="10" fill="#64748b" text-anchor="middle">多噪声水平得分匹配</text>

  <!-- ===== 底部：渐进式有损解压缩 ===== -->
  <rect x="60" y="490" width="840" height="80" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" stroke-dasharray="5,4"/>
  <text x="480" y="514" font-size="12" font-weight="bold" fill="#334155" text-anchor="middle">渐进式有损解压缩（推断）</text>
  <line x1="100" y1="522" x2="860" y2="522" stroke="#e2e8f0" stroke-width="1"/>
  <text x="480" y="542" font-size="11" fill="#334155" text-anchor="middle">从完全噪声 x_T 开始，反向过程逐步移除噪声，生成越来越清晰的样本</text>
  <text x="480" y="562" font-size="10" fill="#64748b" text-anchor="middle">早期步骤恢复低频结构（轮廓），后期步骤填充高频细节（纹理）</text>

  <!-- ===== 图例 ===== -->
  <rect x="60" y="590" width="840" height="70" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="80" y="614" font-size="11" font-weight="bold" fill="#1e293b">图例</text>
  
  <line x1="140" y1="610" x2="180" y2="610" stroke="#475569" stroke-width="1.5"/>
  <polygon points="180,614 176,606 184,606" fill="#475569"/>
  <text x="190" y="614" font-size="10" fill="#334155">数据流（前向/反向）</text>

  <line x1="340" y1="610" x2="380" y2="610" stroke="#6366f1" stroke-width="1.5"/>
  <text x="390" y="614" font-size="10" fill="#334155">核心组件（可学习/固定）</text>

  <line x1="540" y1="610" x2="580" y2="610" stroke="#94a3b8" stroke-width="1" stroke-dasharray="5,4"/>
  <text x="590" y="614" font-size="10" fill="#334155">推断/联系</text>

  <text x="80" y="644" font-size="10" fill="#64748b">记号：αₜ = 1−βₜ, ᾱₜ = Π_{s=1}^{t} αₛ, β̃ₜ = (1−ᾱ_{t-1})/(1−ᾱₜ) βₜ</text>
</svg>
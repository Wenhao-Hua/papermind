[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# PyPI distribution name (the import package stays `papermind`); "papermind"
# was taken on PyPI, so we publish as "papermind-ai".
name = "papermind-ai"
version = "0.1.4"
description = "Read arXiv papers for real: structured analysis, grounded RAG Q&A, and reproduction tutoring from the command line."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "PaperMind contributors" }]
keywords = [
    "arxiv", "llm", "rag", "research", "paper", "reproduction", "cli",
    "cross-encoder", "reranker", "grounded-qa", "citation", "reproducibility",
    "scientific-papers", "litellm", "paper-reading",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0,<3",
    "pymupdf>=1.23.0",
    "litellm>=1.40.0,<2.0",
    "faiss-cpu>=1.7.4",
    "numpy>=1.24.0",
    "httpx>=0.24.0",
    "json-repair>=0.25",
]

[project.optional-dependencies]
local-embeddings = ["sentence-transformers>=2.2.0"]
web = ["fastapi>=0.110.0", "uvicorn>=0.27.0", "python-multipart>=0.0.9"]
ui = ["papermind-ai[web]"]  # alias: the web UI ships the same server deps
# Research / training extras. torch is intentionally NOT pinned here — install the
# CUDA build for your machine (on AutoDL/Colab it's usually preinstalled).
# QASPER is downloaded as raw JSON via httpx (a core dep), so `datasets` isn't needed.
train = ["sentence-transformers>=2.7.0", "rank-bm25>=0.2.2"]
dev = [
    "pytest>=7.0.0",
    "pytest-mock>=3.10.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.6.0",
]

[project.urls]
Homepage = "https://github.com/Wenhao-Hua/papermind"
Repository = "https://github.com/Wenhao-Hua/papermind"
Issues = "https://github.com/Wenhao-Hua/papermind/issues"
Changelog = "https://github.com/Wenhao-Hua/papermind/blob/main/CHANGELOG.md"

[project.scripts]
papermind = "papermind.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["papermind"]
artifacts = ["papermind/assets/*.svg", "papermind/assets/fonts/*.woff2"]  # hero figure + self-hosted Geist fonts

[tool.hatch.build.targets.sdist]
# Keep the sdist lean. The gallery (examples/) is ~18 MB of original-paper images —
# repo showcase, not package content; the wheel already ships only the papermind
# package (+ assets/hero.svg). Tests + their helper packages stay in the sdist.
exclude = ["examples", "docs", "/data", "/report", ".github"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["F"]  # pyflakes only: unused imports/vars + undefined names (catch dead code, no style churn)

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

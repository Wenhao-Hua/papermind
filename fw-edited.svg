<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 747" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" width="960" height="747"><rect x="0" y="0" width="960" height="747" fill="#ffffff"/><text x="480.0" y="44" text-anchor="middle" font-size="25" font-weight="700" fill="#1e293b">Denoising Diffusion Probabilistic Models</text><line x1="80" y1="62" x2="880" y2="62" stroke="#e2e8f0" stroke-width="1.5"/><line x1="480.0" y1="151.2" x2="480.0" y2="184.2" stroke="#475569" stroke-width="2.0"/><polygon points="480.0,195.2 486.0,184.2 474.0,184.2" fill="#475569"/><line x1="480.0" y1="260.5" x2="480.0" y2="293.5" stroke="#475569" stroke-width="2.0"/><polygon points="480.0,304.5 486.0,293.5 474.0,293.5" fill="#475569"/><line x1="480.0" y1="388.5" x2="480.0" y2="421.5" stroke="#475569" stroke-width="2.0"/><polygon points="480.0,432.5 486.0,421.5 474.0,421.5" fill="#475569"/><line x1="480.0" y1="516.5" x2="480.0" y2="549.5" stroke="#475569" stroke-width="2.0"/><polygon points="480.0,560.5 486.0,549.5 474.0,549.5" fill="#475569"/><line x1="748.8" y1="290.0" x2="550.3" y2="426.3" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="6,5"/><polygon points="541.2,432.5 553.7,431.2 546.9,421.3" fill="#94a3b8"/><text x="645.0" y="357.2" text-anchor="middle" font-size="11" fill="#334155">优化</text><line x1="700.0" y1="408.8" x2="631.3" y2="429.4" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="6,5"/><polygon points="620.7,432.5 633.0,435.1 629.5,423.6" fill="#94a3b8"/><text x="660.4" y="416.7" text-anchor="middle" font-size="11" fill="#334155">设定</text><rect x="340.0" y="86.0" width="280.0" height="65.2" rx="11" fill="#f1f5f9" stroke="#475569" stroke-width="1.8"/><text x="480.0" y="113.0" text-anchor="middle" font-size="15.0" font-weight="700" fill="#1e293b">Data Preprocessing</text><text x="480.0" y="135.5" text-anchor="middle" font-size="12.5" fill="#334155">数据预处理</text><rect x="340.0" y="195.2" width="280.0" height="65.2" rx="11" fill="#f1f5f9" stroke="#475569" stroke-width="1.8"/><text x="480.0" y="222.2" text-anchor="middle" font-size="15.0" font-weight="700" fill="#1e293b">Data x₀</text><text x="480.0" y="244.8" text-anchor="middle" font-size="12.5" fill="#334155">原始数据样本</text><rect x="300.0" y="304.5" width="360.0" height="84.0" rx="11" fill="#eef2ff" stroke="#6366f1" stroke-width="1.8"/><text x="480.0" y="331.5" text-anchor="middle" font-size="15.0" font-weight="700" fill="#1e293b">Forward Process</text><text x="480.0" y="354.0" text-anchor="middle" font-size="12.5" fill="#334155">q(xₜ|xₜ₋₁)=N(√(1-βₜ)xₜ₋₁, βₜI)</text><text x="480.0" y="372.8" text-anchor="middle" font-size="12.5" fill="#334155">xₜ=√ᾱₜ x₀+√(1-ᾱₜ)ε</text><rect x="300.0" y="432.5" width="360.0" height="84.0" rx="11" fill="#eef2ff" stroke="#6366f1" stroke-width="1.8"/><text x="480.0" y="459.5" text-anchor="middle" font-size="15.0" font-weight="700" fill="#1e293b">Reverse Process</text><text x="480.0" y="482.0" text-anchor="middle" font-size="12.5" fill="#334155">p_θ(xₜ₋₁|xₜ)=N(μ_θ(xₜ,t), Σ_θ(xₜ,t))</text><text x="480.0" y="500.8" text-anchor="middle" font-size="12.5" fill="#334155">μ_θ=1/√αₜ(xₜ-βₜ/√(1-ᾱₜ)ε_θ)</text><rect x="340.0" y="560.5" width="280.0" height="65.2" rx="11" fill="#f1f5f9" stroke="#475569" stroke-width="1.8"/><text x="480.0" y="587.5" text-anchor="middle" font-size="15.0" font-weight="700" fill="#1e293b">Generated Sample x₀</text><text x="480.0" y="610.0" text-anchor="middle" font-size="12.5" fill="#334155">从x_T~N(0,I)开始采样</text><rect x="700.0" y="206.0" width="220.0" height="84.0" rx="11" fill="#fbfcfe" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="7,5"/><text x="810.0" y="233.0" text-anchor="middle" font-size="15.0" font-weight="700" fill="#1e293b">Training Objective</text><text x="810.0" y="255.5" text-anchor="middle" font-size="12.5" fill="#334155">L_simple=E[||ε-ε_θ(xₜ,t)||²]</text><text x="810.0" y="274.2" text-anchor="middle" font-size="12.5" fill="#334155">变分下界简化版</text><rect x="700.0" y="334.0" width="220.0" height="84.0" rx="11" fill="#fbfcfe" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="7,5"/><text x="810.0" y="361.0" text-anchor="middle" font-size="15.0" font-weight="700" fill="#1e293b">Covariance Choice</text><text x="810.0" y="383.5" text-anchor="middle" font-size="12.5" fill="#334155">Σ_θ=σₜ²I</text><text x="810.0" y="402.2" text-anchor="middle" font-size="12.5" fill="#334155">σₜ²=βₜ 或 β̃ₜ</text><line x1="60" y1="666" x2="94" y2="666" stroke="#475569" stroke-width="2.0"/><text x="102" y="670" font-size="12" fill="#334155">数据流</text><line x1="168" y1="666" x2="202" y2="666" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="6,5"/><text x="210" y="670" font-size="12" fill="#334155">隐含/参照</text><text x="60" y="708" font-size="12" fill="#334155">ε_θ: 噪声预测网络; αₜ=1-βₜ, ᾱₜ=∏ᵢ₌₁ᵗ αᵢ</text></svg>
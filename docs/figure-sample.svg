<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="-apple-system,Segoe UI,Roboto,PingFang SC,sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#9aa0b3"/>
    </marker>
  </defs>
  <rect width="960" height="620" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2333">
    解码器为什么能「一次前向传播预测所有输出」
  </text>
  <text x="480" y="55" text-anchor="middle" font-size="13" fill="#6b7280">
    训练时：teacher forcing（目标右移）+ 因果掩码 → 全部位置并行计算
  </text>

  <!-- Panel 1 -->
  <rect x="20" y="68" width="920" height="262" rx="12" fill="#f7f8fc" stroke="#e6e8f5"/>
  <text x="40" y="94" font-size="14" font-weight="700" fill="#4f46e5">① 训练：把右移后的目标序列一次喂入</text>
  <text x="40" y="118" font-size="12" fill="#6b7280">解码器输入 = 目标序列右移、前面补 &lt;BOS&gt;</text>

  <!-- input tokens -->
  <g font-size="14" fill="#1f2333" text-anchor="middle">
    <rect x="70"  y="126" width="86" height="38" rx="7" fill="#eef0ff" stroke="#4f46e5"/><text x="113" y="150">&lt;BOS&gt;</text>
    <rect x="172" y="126" width="86" height="38" rx="7" fill="#eef0ff" stroke="#4f46e5"/><text x="215" y="150">I</text>
    <rect x="274" y="126" width="86" height="38" rx="7" fill="#eef0ff" stroke="#4f46e5"/><text x="317" y="150">love</text>
    <rect x="376" y="126" width="86" height="38" rx="7" fill="#eef0ff" stroke="#4f46e5"/><text x="419" y="150">you</text>
  </g>

  <!-- arrows down to decoder -->
  <g stroke="#9aa0b3" stroke-width="1.5" marker-end="url(#arr)">
    <line x1="113" y1="164" x2="113" y2="186"/><line x1="215" y1="164" x2="215" y2="186"/>
    <line x1="317" y1="164" x2="317" y2="186"/><line x1="419" y1="164" x2="419" y2="186"/>
  </g>

  <!-- decoder block -->
  <rect x="70" y="188" width="392" height="40" rx="8" fill="#fff3e0" stroke="#e0a83a"/>
  <text x="266" y="213" text-anchor="middle" font-size="13" fill="#7a5310">解码器 · 一次前向传播（掩码自注意力 → 交叉注意力）</text>

  <!-- arrows down to outputs -->
  <g stroke="#9aa0b3" stroke-width="1.5" marker-end="url(#arr)">
    <line x1="113" y1="228" x2="113" y2="252"/><line x1="215" y1="228" x2="215" y2="252"/>
    <line x1="317" y1="228" x2="317" y2="252"/><line x1="419" y1="228" x2="419" y2="252"/>
  </g>

  <!-- output tokens -->
  <g font-size="14" fill="#1f2333" text-anchor="middle">
    <rect x="70"  y="254" width="86" height="38" rx="7" fill="#e6f4ea" stroke="#3f7d52"/><text x="113" y="278">I ✓</text>
    <rect x="172" y="254" width="86" height="38" rx="7" fill="#e6f4ea" stroke="#3f7d52"/><text x="215" y="278">love ✓</text>
    <rect x="274" y="254" width="86" height="38" rx="7" fill="#e6f4ea" stroke="#3f7d52"/><text x="317" y="278">you ✓</text>
    <rect x="376" y="254" width="86" height="38" rx="7" fill="#e6f4ea" stroke="#3f7d52"/><text x="419" y="278">&lt;EOS&gt; ✓</text>
  </g>
  <text x="40" y="314" font-size="12" fill="#6b7280">预测目标 = 同一序列（未右移）：4 个位置<tspan font-weight="700" fill="#3f7d52"> 一次性并行算出</tspan></text>

  <!-- why-note (right) -->
  <rect x="500" y="120" width="420" height="190" rx="8" fill="#ffffff" stroke="#e6e8f5"/>
  <text x="520" y="146" font-size="13" font-weight="700" fill="#1f2333">为什么能并行？</text>
  <g font-size="12.5" fill="#3a3f52">
    <text x="520" y="170">训练时整个目标序列<tspan font-weight="700">已知</tspan>，右移后一次喂进去。</text>
    <text x="520" y="192">因果掩码保证位置 i 只能注意 ≤ i，</text>
    <text x="520" y="210">看不到未来的答案，所以并行≠作弊。</text>
    <text x="520" y="240" fill="#a8443f">对比推理：目标未知，仍要逐个 token</text>
    <text x="520" y="258" fill="#a8443f">自回归生成（这张图说的是训练）。</text>
    <text x="520" y="288" font-size="12" fill="#6b7280">关键：并行只发生在训练，靠的是掩码而非顺序。</text>
  </g>

  <!-- Panel 2: causal mask -->
  <rect x="20" y="346" width="920" height="256" rx="12" fill="#f7f8fc" stroke="#e6e8f5"/>
  <text x="40" y="374" font-size="14" font-weight="700" fill="#4f46e5">② 因果掩码：位置 i（行）只能看键 ≤ i（列）</text>

  <!-- column headers -->
  <g font-size="12" fill="#6b7280" text-anchor="middle">
    <text x="171" y="404">键1</text><text x="219" y="404">键2</text><text x="267" y="404">键3</text><text x="315" y="404">键4</text>
  </g>
  <!-- rows -->
  <g font-size="13" text-anchor="middle">
    <!-- row1 query1: only key1 allowed -->
    <text x="118" y="432" fill="#6b7280" font-size="12">查询1</text>
    <rect x="150" y="414" width="42" height="36" fill="#e6f4ea" stroke="#cfe6d6"/><text x="171" y="438" fill="#2f6b43">✓</text>
    <rect x="198" y="414" width="42" height="36" fill="#efefef" stroke="#ddd"/><text x="219" y="438" fill="#aaa">−∞</text>
    <rect x="246" y="414" width="42" height="36" fill="#efefef" stroke="#ddd"/><text x="267" y="438" fill="#aaa">−∞</text>
    <rect x="294" y="414" width="42" height="36" fill="#efefef" stroke="#ddd"/><text x="315" y="438" fill="#aaa">−∞</text>
    <!-- row2 -->
    <text x="118" y="470" fill="#6b7280" font-size="12">查询2</text>
    <rect x="150" y="452" width="42" height="36" fill="#e6f4ea" stroke="#cfe6d6"/><text x="171" y="476" fill="#2f6b43">✓</text>
    <rect x="198" y="452" width="42" height="36" fill="#e6f4ea" stroke="#cfe6d6"/><text x="219" y="476" fill="#2f6b43">✓</text>
    <rect x="246" y="452" width="42" height="36" fill="#efefef" stroke="#ddd"/><text x="267" y="476" fill="#aaa">−∞</text>
    <rect x="294" y="452" width="42" height="36" fill="#efefef" stroke="#ddd"/><text x="315" y="476" fill="#aaa">−∞</text>
    <!-- row3 -->
    <text x="118" y="508" fill="#6b7280" font-size="12">查询3</text>
    <rect x="150" y="490" width="42" height="36" fill="#e6f4ea" stroke="#cfe6d6"/><text x="171" y="514" fill="#2f6b43">✓</text>
    <rect x="198" y="490" width="42" height="36" fill="#e6f4ea" stroke="#cfe6d6"/><text x="219" y="514" fill="#2f6b43">✓</text>
    <rect x="246" y="490" width="42" height="36" fill="#e6f4ea" stroke="#cfe6d6"/><text x="267" y="514" fill="#2f6b43">✓</text>
    <rect x="294" y="490" width="42" height="36" fill="#efefef" stroke="#ddd"/><text x="315" y="514" fill="#aaa">−∞</text>
    <!-- row4 -->
    <text x="118" y="546" fill="#6b7280" font-size="12">查询4</text>
    <rect x="150" y="528" width="42" height="36" fill="#e6f4ea" stroke="#cfe6d6"/><text x="171" y="552" fill="#2f6b43">✓</text>
    <rect x="198" y="528" width="42" height="36" fill="#e6f4ea" stroke="#cfe6d6"/><text x="219" y="552" fill="#2f6b43">✓</text>
    <rect x="246" y="528" width="42" height="36" fill="#e6f4ea" stroke="#cfe6d6"/><text x="267" y="552" fill="#2f6b43">✓</text>
    <rect x="294" y="528" width="42" height="36" fill="#e6f4ea" stroke="#cfe6d6"/><text x="315" y="552" fill="#2f6b43">✓</text>
  </g>

  <!-- mask explanation -->
  <g font-size="12.5" fill="#3a3f52">
    <rect x="380" y="414" width="16" height="16" fill="#e6f4ea" stroke="#cfe6d6"/><text x="404" y="427">可注意（当前及过去）</text>
    <rect x="380" y="440" width="16" height="16" fill="#efefef" stroke="#ddd"/><text x="404" y="453">屏蔽：未来位置，分数置 −∞</text>
    <text x="380" y="486">注意力分数 = Q·Kᵀ/√d_k <tspan font-weight="700">＋ 掩码</tspan></text>
    <text x="380" y="508">未来位置设 −∞ → softmax 后权重 ≈ 0，</text>
    <text x="380" y="528">于是每个位置的输出只依赖它自己和左边，</text>
    <text x="380" y="548" font-weight="700" fill="#3f7d52">所以 4 个位置可以同时算，互不"偷看"。</text>
  </g>

  <text x="940" y="614" text-anchor="end" font-size="10" fill="#c0c4d0">PaperMind · 教学式示意（SVG 样张）</text>
</svg>
